<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>plain shapes</title>
  <desc>Rectangles, a circle, a path and a polygon — the boring case that must pass.</desc>
  <g fill="none" stroke="#222" stroke-width="2">
    <rect x="2" y="2" width="96" height="96" rx="6"/>
    <circle cx="50" cy="38" r="22" fill="#e8d7b0"/>
    <ellipse cx="50" cy="76" rx="34" ry="12"/>
    <line x1="16" y1="38" x2="84" y2="38"/>
    <polyline points="10,90 30,70 50,86 70,66 90,90"/>
    <polygon points="50,10 62,32 38,32"/>
    <path d="M20 50 C 30 30, 70 30, 80 50" stroke-linecap="round"/>
  </g>
  <text x="50" y="97" font-size="4" text-anchor="middle" fill="#222">plain</text>
</svg>
