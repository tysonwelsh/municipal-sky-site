<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <title>SMIL animation</title>
  <defs>
    <path id="track" d="M20 100 C 60 30, 140 170, 180 100" fill="none"/>
  </defs>
  <path d="M20 100 C 60 30, 140 170, 180 100" fill="none" stroke="#8899aa" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="0" cy="0" r="9" fill="#cc7722">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#track"/>
    </animateMotion>
    <animate attributeName="r" values="9;14;9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(100 100)">
    <rect x="-16" y="-16" width="32" height="32" fill="none" stroke="#334455" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="8" y="184" width="184" height="8" rx="4" fill="#dddddd">
    <set attributeName="fill" to="#cc7722" begin="3s" dur="1s"/>
  </rect>
</svg>
