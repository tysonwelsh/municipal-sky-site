<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ulysses: Masculine vs Feminine Third-Person Pronouns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Jost:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        color: #2c2825;
        background-color: #fcfbf9; /* Bright watercolor paper */
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.01' numOctaves='5' opacity='0.5'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        -webkit-font-smoothing: antialiased;
      }

      .content-frame {
        background-color: transparent;
        max-width: 1080px;
        margin: 0 auto;
        padding: 60px clamp(2rem, 5vw, 4rem);
        min-height: 100vh;
      }

      .post-container {
        max-width: 860px;
        margin: 0 auto;
      }

      .section-label {
        font-family: "Jost", sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.4);
        margin-bottom: 12px;
      }

      h1 {
        font-family: "Jost", sans-serif;
        font-size: clamp(2.5rem, 8vw, 3.5rem);
        font-weight: 600;
        color: #1a1816;
        margin-bottom: 0px; /* Removed bottom margin outside the border */
        line-height: 1.1;
        border-bottom: 2px solid #1a1816;
        padding-bottom: 4px; /* Drastically reduced padding inside the border */
      }
      h1 em {
        font-style: italic;
        color: #8c4d54; /* Muted rose tone for emphasis */
      }

      .subtitle {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 18px;
        font-style: italic;
        line-height: 1.6;
        color: rgba(0, 0, 0, 0.6);
        margin-bottom: 12px;
        margin-top: 4px; /* Drastically reduced to pull right up to the dividing line */
      }

      .viz-section {
        margin-bottom: 64px;
      }

      .viz-title {
        font-family: "Jost", sans-serif;
        font-size: 26px;
        font-weight: 600;
        color: #1a1816;
        margin-bottom: 8px;
        margin-left: -24px; /* Pulls the title further left to create the desired gap */
      }

      .viz-desc {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 15px;
        color: rgba(0, 0, 0, 0.6);
        max-width: 860px;
        line-height: 1.6;
        margin-bottom: 24px;
        margin-left: -24px; /* Pulls the subtitle further left */
      }

      .viz-methodology {
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.45);
        margin-top: 20px; /* Increased from 8px to push text further away from % labels */
        line-height: 1.5;
        margin-left: -24px; /* Pulls the info text further left */
        max-width: 900px;
      }

      .viz-methodology strong {
        font-weight: 600;
        color: rgba(0, 0, 0, 0.6);
      }

      .download-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        margin-top: 24px;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 13px;
        color: #2c2825;
        background: #f0ede6;
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-left: -24px; /* Pulls the button further left */
      }

      .download-btn:hover {
        background: #e6e2d8;
      }

      .download-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      /* Make SVGs responsive so they center and scale inside the container */
      .viz-section > svg {
        display: block;
        margin: 0 auto;
        width: 100%;
        height: auto;
      }

      .viz-container {
        border: 1px solid rgba(0, 0, 0, 0.1);
        padding: 48px 64px 32px 64px; /* Reduced bottom padding from 48px to 32px */
        border-radius: 4px;
        margin-top: 40px;
      }

      .viz-rule {
        height: 1px;
        background: rgba(0, 0, 0, 0.1);
        margin: 48px 0;
      }

      .tooltip {
        position: absolute;
        font-family: "IBM Plex Sans", sans-serif;
        background: #fcfbf9;
        border: 1px solid rgba(0, 0, 0, 0.15);
        padding: 12px 16px;
        font-size: 13px;
        pointer-events: none;
        line-height: 1.6;
        color: #2c2825;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        max-width: 300px;
      }
      .tooltip .ep-name {
        font-family: "Jost", sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: #1a1816;
      }
      .tooltip .meta {
        color: rgba(0, 0, 0, 0.5);
        font-size: 12px;
        font-style: italic;
      }
      .tooltip strong {
        font-weight: 600;
      }

      .axis text {
        fill: rgba(0, 0, 0, 0.6);
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 12px;
      }
      .axis path,
      .axis line {
        stroke: rgba(0, 0, 0, 0.15);
      }

      .grid line {
        stroke: rgba(0, 0, 0, 0.15);
        stroke-dasharray: 2, 2;
      }
      .grid path {
        display: none;
      }

      .label-masc {
        fill: #385572;
        font-family: "Jost", sans-serif;
        font-weight: 600;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .label-fem {
        fill: #8c4651;
        font-family: "Jost", sans-serif;
        font-weight: 600;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .label-sub-masc {
        fill: #385572;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 12px;
        font-style: italic;
        opacity: 0.85;
      }
      .label-sub-fem {
        fill: #8c4651;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 12px;
        font-style: italic;
        opacity: 0.85;
      }

      svg {
        overflow: visible;
      }

      @media (max-width: 768px) {
        .content-frame {
          padding: 32px 20px;
        }
        .viz-container {
          padding: 24px 16px;
        }
        .viz-title,
        .viz-desc,
        .viz-methodology,
        .download-btn {
          margin-left: 0; /* Reset the overhang on small mobile screens */
        }
      }
    </style>
  </head>
  <body>
    <div class="content-frame">
      <div class="post-container">
        <div class="section-label">Information Graphics</div>
        <h1>Gendered Pronouns in <em>Ulysses</em></h1>
        <p class="subtitle">
          Third-person masculine (he/him/his) vs feminine (she/her/hers)
          pronouns across all 18 episodes
        </p>
      </div>

      <div class="viz-container">
        <div class="viz-section" id="viz2"></div>
        <div class="viz-rule"></div>
        <div class="viz-section" id="viz1"></div>
      </div>
    </div>

    <div class="tooltip" id="tip" style="display: none"></div>

    <script>
      const data = [
        {
          ch: 1,
          name: "Telemachus",
          part: "I",
          masc: 352,
          fem: 93,
          scene: "Tower",
          symbol: "Heir",
        },
        {
          ch: 2,
          name: "Nestor",
          part: "I",
          masc: 160,
          fem: 18,
          scene: "School",
          symbol: "Horse",
        },
        {
          ch: 3,
          name: "Proteus",
          part: "I",
          masc: 190,
          fem: 55,
          scene: "Strand",
          symbol: "Tide",
        },
        {
          ch: 4,
          name: "Calypso",
          part: "II",
          masc: 240,
          fem: 156,
          scene: "House",
          symbol: "Nymph",
        },
        {
          ch: 5,
          name: "Lotus Eaters",
          part: "II",
          masc: 229,
          fem: 65,
          scene: "Bath",
          symbol: "Eucharist",
        },
        {
          ch: 6,
          name: "Hades",
          part: "II",
          masc: 469,
          fem: 71,
          scene: "Graveyard",
          symbol: "Caretaker",
        },
        {
          ch: 7,
          name: "Aeolus",
          part: "II",
          masc: 411,
          fem: 12,
          scene: "Newspaper",
          symbol: "Editor",
        },
        {
          ch: 8,
          name: "Lestrygonians",
          part: "II",
          masc: 452,
          fem: 196,
          scene: "Lunch",
          symbol: "Constables",
        },
        {
          ch: 9,
          name: "Scylla and Charybdis",
          part: "II",
          masc: 546,
          fem: 86,
          scene: "Library",
          symbol: "Stratford / London",
        },
        {
          ch: 10,
          name: "Wandering Rocks",
          part: "II",
          masc: 531,
          fem: 127,
          scene: "Streets",
          symbol: "Citizens",
        },
        {
          ch: 11,
          name: "Sirens",
          part: "II",
          masc: 371,
          fem: 237,
          scene: "Concert Room",
          symbol: "Barmaids",
        },
        {
          ch: 12,
          name: "Cyclops",
          part: "II",
          masc: 771,
          fem: 85,
          scene: "Tavern",
          symbol: "Fenian",
        },
        {
          ch: 13,
          name: "Nausicaa",
          part: "II",
          masc: 419,
          fem: 684,
          scene: "Rocks",
          symbol: "Virgin",
        },
        {
          ch: 14,
          name: "Oxen of the Sun",
          part: "II",
          masc: 707,
          fem: 249,
          scene: "Hospital",
          symbol: "Mothers",
        },
        {
          ch: 15,
          name: "Circe",
          part: "II",
          masc: 1277,
          fem: 463,
          scene: "Brothel",
          symbol: "Whore",
        },
        {
          ch: 16,
          name: "Eumaeus",
          part: "III",
          masc: 904,
          fem: 94,
          scene: "Shelter",
          symbol: "Sailors",
        },
        {
          ch: 17,
          name: "Ithaca",
          part: "III",
          masc: 407,
          fem: 106,
          scene: "House",
          symbol: "Comets",
        },
        {
          ch: 18,
          name: "Penelope",
          part: "III",
          masc: 1043,
          fem: 284,
          scene: "Bed",
          symbol: "Earth",
        },
      ];

      data.forEach((d) => {
        d.total = d.masc + d.fem;
        d.mascPct = (d.masc / d.total) * 100;
        d.femPct = (d.fem / d.total) * 100;
        d.ratio = d.fem > 0 ? d.masc / d.fem : Infinity;
      });

      // Soft Watercolor Palette
      const mascColor = "#385572";
      const femColor = "#8c4651";
      const bgColor = "#fcfbf9"; // Must match body background to hide grid lines underneath
      const borderColor = "rgba(0,0,0,0.15)";
      const textLight = "rgba(0,0,0,0.5)";
      const tip = d3.select("#tip");

      function showTip(event, html) {
        tip
          .style("display", "block")
          .html(html)
          .style("left", event.pageX + 15 + "px")
          .style("top", event.pageY - 10 + "px");
      }
      function hideTip() {
        tip.style("display", "none");
      }

      function tipHtml(d) {
        return `<span class="ep-name">${d.ch ? d.ch + ". " : ""}${d.name}</span><br>
          <span class="meta">${d.scene ? d.scene + " · " + d.symbol : d.author + " · " + d.words.toLocaleString() + " words"}</span><br>
          Masculine: <strong>${d.masc}</strong> (${d.mascPct.toFixed(1)}%)<br>
          Feminine: <strong>${d.fem}</strong> (${d.femPct.toFixed(1)}%)<br>
          Ratio: <strong>${d.ratio === Infinity ? "n/a" : d.ratio.toFixed(1) + ":1"}</strong>`;
      }

      // Helper for PNG Download
      function downloadViz(selector, filename, btnElement) {
        const originalHtml = btnElement.innerHTML;
        btnElement.innerHTML = `Saving...`;
        btnElement.style.opacity = "0.7";
        btnElement.disabled = true;

        const element = document.querySelector(selector);

        html2canvas(element, {
          backgroundColor: "#fcfbf9",
          scale: 2, // Double resolution for crisp text
          useCORS: true,
          onclone: (clonedDoc) => {
            const clonedEl = clonedDoc.querySelector(selector);
            // Reduced top padding from 72px to 40px to eliminate excess vertical space above the title.
            // Left padding remains 96px to mathematically offset the -24px title margin.
            // Reduced bottom padding from 72px to 48px to tighten space below the info text.
            clonedEl.style.padding = "40px 72px 48px 96px";
            clonedEl.style.display = "inline-block";
            clonedEl.style.width = "auto";
            clonedEl.style.maxWidth = "none";

            const svg = clonedEl.querySelector("svg");
            if (svg) {
              const vb = svg.getAttribute("viewBox").split(" ").map(Number);
              const expandLeft = 50; // Extra room strictly for long labels like "Scylla and Charybdis"

              // Expand the mathematical boundaries of the SVG leftward so html2canvas doesn't crop the text
              svg.setAttribute(
                "viewBox",
                `${vb[0] - expandLeft} ${vb[1]} ${vb[2] + expandLeft} ${vb[3]}`,
              );

              // Apply the expanded dimensions physically
              svg.style.width = `${vb[2] + expandLeft}px`;
              svg.style.height = `${vb[3]}px`;

              // Shift the SVG back to the left so it stays perfectly aligned with the HTML title above it
              svg.style.marginLeft = `-${expandLeft}px`;
            }
          },
        })
          .then((canvas) => {
            const a = document.createElement("a");
            a.download = filename;
            a.href = canvas.toDataURL("image/png");
            a.click();

            // Restore button state
            btnElement.innerHTML = originalHtml;
            btnElement.style.opacity = "1";
            btnElement.disabled = false;
          })
          .catch((err) => {
            console.error("Error generating PNG:", err);
            btnElement.innerHTML = `Error`;
            setTimeout(() => {
              btnElement.innerHTML = originalHtml;
              btnElement.style.opacity = "1";
              btnElement.disabled = false;
            }, 2000);
          });
      }

      // Shared methodology HTML string to append to both visualisations
      const methodologyHtml = `Pronoun frequencies are determined via case-insensitive word-boundary matching, encompassing both straight and curly apostrophes.<br>Masculine forms counted: <em>he, him, his, himself, he's, he'd, he'll</em>. Feminine forms counted: <em>she, her, hers, herself, she's, she'd, she'll</em>.<br>www.municipalsky.com`;

      // =====================================================================
      // Diverging Bar Chart: Gender Balance by Episode
      // =====================================================================
      (function () {
        const sorted = [...data].sort((a, b) => b.mascPct - a.mascPct);

        const section = d3.select("#viz1");
        section
          .append("div")
          .attr("class", "viz-title")
          .html(
            "Distribution of Gendered Pronouns in James Joyce's <em>Ulysses</em>",
          );
        section
          .append("div")
          .attr("class", "viz-desc")
          .text(
            "Episodes are ranked by their proportion of masculine pronouns in descending order. Nausicaa is the only episode where feminine pronouns dominate.",
          );

        const rowHeight = 46; // Increased from 40px for slightly taller bars, but still shorter than Viz 2's 58px
        const sceneColW = 100;
        const symbolColW = 120;

        // Adjusted left margin to 150px for perfect edge alignment
        const margin = { top: 45, right: 240, bottom: 30, left: 150 };
        const totalWidth = 940;
        const width = totalWidth - margin.left - margin.right;
        const height = sorted.length * rowHeight;

        const svg = section
          .append("svg")
          .attr(
            "viewBox",
            `0 0 ${totalWidth} ${height + margin.top + margin.bottom}`,
          )
          .append("g")
          .attr("transform", `translate(${margin.left},${margin.top})`);

        const x = d3.scaleLinear().domain([0, 100]).range([0, width]);
        const y = d3
          .scaleBand()
          .domain(sorted.map((d) => d.name))
          .range([0, height])
          .padding(0.18);

        // 1. Draw Grid Lines (Background layer)
        svg
          .append("g")
          .attr("class", "grid")
          .call(
            d3.axisTop(x).tickSize(-height).tickValues([25, 75]).tickFormat(""),
          )
          .select(".domain")
          .remove();

        // Horizontal dividers between rows
        const names = sorted.map((d) => d.name);
        for (let i = 0; i < names.length - 1; i++) {
          const lineY =
            y(names[i]) + y.bandwidth() + (y.step() - y.bandwidth()) / 2;
          svg
            .append("line")
            .attr("x1", -16)
            .attr("x2", width + sceneColW + symbolColW + 16)
            .attr("y1", lineY)
            .attr("y2", lineY)
            .attr("stroke", borderColor)
            .attr("stroke-width", 0.5);
        }

        const gap = 1; // Reverted back to 1px

        // 2. Draw Solid Undercoats (Masks grid lines so multiply blend modes don't show them)
        svg
          .selectAll(".bar-bg-m")
          .data(sorted)
          .enter()
          .append("rect")
          .attr("x", 0)
          .attr("y", (d) => y(d.name))
          .attr("width", (d) => x(d.mascPct))
          .attr("height", y.bandwidth())
          .attr("fill", bgColor);

        svg
          .selectAll(".bar-bg-f")
          .data(sorted)
          .enter()
          .append("rect")
          .attr("x", (d) => x(d.mascPct) + gap)
          .attr("y", (d) => y(d.name))
          .attr("width", (d) => Math.max(0, x(d.femPct) - gap))
          .attr("height", y.bandwidth())
          .attr("fill", bgColor);

        // 3. Draw Colored Ink Layers (mix-blend-mode: multiply)
        svg
          .selectAll(".bar-m")
          .data(sorted)
          .enter()
          .append("rect")
          .attr("x", 0)
          .attr("y", (d) => y(d.name))
          .attr("width", (d) => x(d.mascPct))
          .attr("height", y.bandwidth())
          .attr("fill", mascColor)
          .style("mix-blend-mode", "multiply")
          .on("mousemove", (e, d) => showTip(e, tipHtml(d)))
          .on("mouseleave", hideTip);

        svg
          .selectAll(".bar-f")
          .data(sorted)
          .enter()
          .append("rect")
          .attr("x", (d) => x(d.mascPct) + gap)
          .attr("y", (d) => y(d.name))
          .attr("width", (d) => Math.max(0, x(d.femPct) - gap))
          .attr("height", y.bandwidth())
          .attr("fill", femColor)
          .style("mix-blend-mode", "multiply")
          .on("mousemove", (e, d) => showTip(e, tipHtml(d)))
          .on("mouseleave", hideTip);

        // 50% line (Central anchor - drawn over the bars)
        svg
          .append("line")
          .attr("x1", x(50))
          .attr("x2", x(50))
          .attr("y1", 0)
          .attr("y2", height)
          .attr("stroke", "rgba(0, 0, 0, 0.25)")
          .attr("stroke-width", 1.5) // Increased from 1px to 1.5px for a bit more weight
          .attr("stroke-dasharray", "4, 4")
          .style("pointer-events", "none");

        // 4. Draw Percentage Labels (Drawn on top of everything so they stay crisp)
        const pctMin = 6;
        svg
          .selectAll(".pct-masc")
          .data(sorted.filter((d) => d.mascPct >= pctMin))
          .enter()
          .append("text")
          .attr("x", (d) => x(d.mascPct) / 2)
          .attr("y", (d) => y(d.name) + y.bandwidth() / 2)
          .attr("dy", "0.35em")
          .attr("text-anchor", "middle")
          .attr("fill", bgColor)
          .attr("font-family", "'IBM Plex Sans', sans-serif")
          .attr("font-size", "12px")
          .style("pointer-events", "none") // Prevent text from blocking bar hover interactions
          .text((d) => d.mascPct.toFixed(1) + "%");

        svg
          .selectAll(".pct-fem")
          .data(sorted.filter((d) => d.femPct >= pctMin))
          .enter()
          .append("text")
          .attr("x", (d) => x(d.mascPct) + gap + (x(d.femPct) - gap) / 2)
          .attr("y", (d) => y(d.name) + y.bandwidth() / 2)
          .attr("dy", "0.35em")
          .attr("text-anchor", "middle")
          .attr("fill", bgColor)
          .attr("font-family", "'IBM Plex Sans', sans-serif")
          .attr("font-size", "12px")
          .style("pointer-events", "none")
          .text((d) => d.femPct.toFixed(1) + "%");

        // Y-axis labels (episode name)
        svg
          .selectAll(".y-label")
          .data(sorted)
          .enter()
          .append("text")
          .attr("x", -12)
          .attr("y", (d) => y(d.name) + y.bandwidth() / 2)
          .attr("dy", "0.35em")
          .attr("text-anchor", "end")
          .attr("fill", "#1a1816")
          .attr("font-family", "'Jost', sans-serif")
          .attr("font-size", "15px")
          .attr("font-weight", "600")
          .text((d) => d.name);

        // Right-side column headers (above braces)
        const sceneBraceX1 = width + 14;
        const sceneBraceX2 = width + 10 + sceneColW - 4;
        const symbolBraceX1 = width + 10 + sceneColW + 4;
        const symbolBraceX2 = width + 4 + sceneColW + symbolColW;
        const schemaCenterX = (sceneBraceX1 + symbolBraceX2) / 2;

        // "Gilbert Schema" header
        svg
          .append("text")
          .attr("x", schemaCenterX)
          .attr("y", -32)
          .attr("text-anchor", "middle")
          .attr("fill", "#1a1816")
          .attr("font-family", "'Jost', sans-serif")
          .attr("font-size", "13px")
          .attr("font-weight", "600")
          .attr("letter-spacing", "0.08em")
          .text("GILBERT SCHEMA");

        // Scene / Symbol subheaders
        svg
          .append("text")
          .attr("x", (sceneBraceX1 + sceneBraceX2) / 2)
          .attr("y", -10)
          .attr("text-anchor", "middle")

          .select(".domain")
          .remove();

        // Horizontal dividers between rows
        const bookNames = books.map((d) => d.name);
        for (let i = 0; i < bookNames.length - 1; i++) {

          .selectAll(".bar-m")
          .data(books)
          .enter()

          .attr("x", 0)

          .attr("width", (d) => Math.max(0, x(d.femPct) - gap))
          .attr("height", y.bandwidth())
          .attr("fill", femColor)
          .style("mix-blend-mode", "multiply")
          .on("mousemove", (e, d) => showTip(e, tipHtml(d)))
          .on("mouseleave", hideTip);

          .append("line")

          .append("text")
          .attr("x", (d) => x(d.mascPct) / 2)
          .attr("y", (d) => y(d.name) + y.bandwidth() / 2)
          .attr("dy", "0.35em")
          .attr("text-anchor", "middle")
          .attr("fill", bgColor)
          .attr("font-family", "'IBM Plex Sans', sans-serif")
          .attr("font-size", "12px")

          .selectAll(".pct-fem")
          .data(books.filter((d) => d.femPct >= pctMin2))
          .enter()
          .append("text")
          .attr("x", (d) => x(d.mascPct) + gap + (x(d.femPct) - gap) / 2)
          .attr("y", (d) => y(d.name) + y.bandwidth() / 2)
          .attr("dy", "0.35em")
          .attr("text-anchor", "middle")
          .attr("fill", bgColor)
          .attr("font-family", "'IBM Plex Sans', sans-serif")
          .attr("font-size", "12px")
          .style("pointer-events", "none")
          .text((d) => d.femPct.toFixed(1) + "%");

        // Labels
        const maxTitleWidth = 22; // Tuned to break exactly after "of" without affecting other titles
        function splitTitle(name) {
          if (name.length <= maxTitleWidth) return [name];
          const words = name.split(" ");
          const lines = [];
          let line = "";
          for (const w of words) {
            if (line && (line + " " + w).length > maxTitleWidth) {
              lines.push(line);
              line = w;
            } else {
              line = line ? line + " " + w : w;
            }
          }
          if (line) lines.push(line);
          return lines;
        }

        svg
          .selectAll(".y-label")
          .data(books)
          .enter()
          .append("text")
          .attr("x", -12)
          .attr("text-anchor", "end")
          .attr("fill", "#1a1816")
          .attr("font-family", "'Jost', sans-serif")
          .attr("font-weight", "600")
          .each(function (d) {
            const el = d3.select(this);
            const lines = splitTitle(d.name);
            const lineHeightPx = 18;
            const totalLines = lines.length + 1; // title lines + author line
            const barCenter = y(d.name) + y.bandwidth() / 2;
            const blockTop = barCenter - ((totalLines - 1) * lineHeightPx) / 2;

            // Title lines
            lines.forEach((line, i) => {
              el.append("tspan")

                .attr("y", blockTop + i * lineHeightPx)
                .attr("dominant-baseline", "central")

              .attr("y", blockTop + lines.length * lineHeightPx)
