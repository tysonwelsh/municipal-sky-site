<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labor in Rabelais&rsquo;s Underworld &mdash; QR Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+Great+Primer:ital@0;1&family=IM+Fell+Great+Primer+SC&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-bg-parchment: #ddd0b3;
        --color-border-medium: #5a3e28;
        --color-text-primary: #1a1408;
        --color-text-secondary: #2c2014;
        --color-rubrication: #b33a2b;
        --font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        --font-family-sc: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
        --font-family-display: "IM Fell Great Primer SC", "Cormorant SC", Georgia, serif;
        --font-family-display-body: "IM Fell Great Primer", "Cormorant Garamond", Georgia, serif;
      }

      html, body { height: 100%; }
      body {
        margin: 0;
        /* Same ground the deck sits on, so the card reads as one more slide. */
        background: #c8baa0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: var(--font-family);
        color: var(--color-text-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      /* ===== Slide-card chrome, lifted verbatim from the deck ===== */
      .slide-card {
        width: 800px;
        height: 700px;
        flex-shrink: 0;
        box-sizing: border-box;
        background:
          radial-gradient(ellipse at 25% 75%, rgba(120, 90, 50, 0.07) 0%, transparent 50%),
          radial-gradient(ellipse at 75% 25%, rgba(100, 75, 40, 0.05) 0%, transparent 50%),
          linear-gradient(175deg, #ddd0b3 0%, #d4c5a5 30%, #cdbf9e 60%, #d6c9ad 100%);
        border: 2px solid #5a3e28;
        box-shadow:
          0 4px 16px -4px rgba(26, 20, 8, 0.18),
          0 1px 4px -1px rgba(26, 20, 8, 0.1);
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 44px 56px;
        text-align: center;
        overflow: hidden;
        /* Scales the whole card down on smaller viewports without
           reflowing anything -- the QR keeps its exact proportions. */
        transform: scale(var(--card-scale, 1));
        transform-origin: center center;
      }

      /* Option-D bracket frame: four L-shaped sepia corners inset from
         the card edge, each with a rubric hedera tucked inside it. */
      .title-slide-frame {
        position: absolute;
        top: 16px; right: 16px; bottom: 16px; left: 16px;
        pointer-events: none;
        z-index: 0;
        background-image:
          linear-gradient(to right, var(--color-border-medium) 0, var(--color-border-medium) 40px, transparent 40px),
          linear-gradient(to bottom, var(--color-border-medium) 0, var(--color-border-medium) 40px, transparent 40px),
          linear-gradient(to left, var(--color-border-medium) 0, var(--color-border-medium) 40px, transparent 40px),
          linear-gradient(to bottom, var(--color-border-medium) 0, var(--color-border-medium) 40px, transparent 40px),
          linear-gradient(to right, var(--color-border-medium) 0, var(--color-border-medium) 40px, transparent 40px),
          linear-gradient(to top, var(--color-border-medium) 0, var(--color-border-medium) 40px, transparent 40px),
          linear-gradient(to left, var(--color-border-medium) 0, var(--color-border-medium) 40px, transparent 40px),
          linear-gradient(to top, var(--color-border-medium) 0, var(--color-border-medium) 40px, transparent 40px);
        background-repeat: no-repeat;
        background-size:
          40px 1.5px, 1.5px 40px, 40px 1.5px, 1.5px 40px,
          40px 1.5px, 1.5px 40px, 40px 1.5px, 1.5px 40px;
        background-position:
          top left, top left, top right, top right,
          bottom left, bottom left, bottom right, bottom right;
      }
      .title-slide-fleuron {
        position: absolute;
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 18px;
        color: var(--color-rubrication);
        line-height: 1;
        pointer-events: none;
      }
      .title-slide-fleuron--tl { top: 12px; left: 12px; }
      .title-slide-fleuron--tr { top: 12px; right: 12px; }
      .title-slide-fleuron--bl { bottom: 12px; left: 12px; }
      .title-slide-fleuron--br { bottom: 12px; right: 12px; }

      /* Card content sits above the bracket overlay. */
      .card-body { position: relative; z-index: 1; }

      .qr-eyebrow {
        font-family: var(--font-family-sc);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--color-rubrication);
        margin: 0 0 14px;
      }
      .title-slide-title {
        font-family: var(--font-family-display);
        font-size: 34px;
        font-weight: 600;
        color: var(--color-rubrication);
        letter-spacing: 0.04em;
        line-height: 1.2;
        margin: 0 0 10px;
      }
      .title-slide-subtitle {
        font-family: var(--font-family);
        font-style: italic;
        font-size: 20px;
        color: var(--color-text-secondary);
        line-height: 1.4;
        margin: 0;
      }

      /* The code itself. A hairline sepia rule around a slightly lighter
         parchment plate keeps the quiet zone honest for the scanner while
         still reading as a plate set into the page. */
      .qr-plate {
        display: inline-block;
        margin-top: 34px;
        background: #e8dfc8;
        border: 1px solid var(--color-border-medium);
        padding: 10px;
        line-height: 0;
        box-shadow: 0 2px 8px -3px rgba(26, 20, 8, 0.28);
      }
      .qr-plate svg { display: block; width: 300px; height: 300px; }

      .qr-url {
        margin-top: 24px;
        font-family: var(--font-family-sc);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--color-text-primary);
        margin-bottom: 0;
        word-break: break-word;
      }

      /* ===== Marginalia =====
         The two halves of Frank C. Papé's bell-ringers plate, split
         back apart (see angel-bell-ringer.svg / demon-bell-ringer.svg)
         and set in the left and right margins either side of the code.
         They sit in the dead space beside the 322px QR plate, so the
         title and URL keep the card's full content width and nothing
         reflows. Printed at reduced ink weight so they read as
         marginalia rather than competing with the code.

         No flip on either: the plate was drawn as a facing pair, so
         angel-left / demon-right restores Papé's own arrangement,
         each figure already turned inward toward the other. */
      .qr-marginalia {
        position: absolute;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        z-index: 1;
      }
      .qr-marginalia--left { left: 34px; width: 152px; }
      .qr-marginalia--right { right: 34px; width: 152px; }
      .qr-marginalia img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 344px;
        object-fit: contain;
        opacity: 0.68;
      }


      /* Print: one card, centered, no page furniture. */
      @media print {
        @page { size: landscape; margin: 0.4in; }
        body { background: none; padding: 0; }
        .slide-card { box-shadow: none; transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="slide-card" id="card">
      <div class="title-slide-frame" aria-hidden="true">
        <span class="title-slide-fleuron title-slide-fleuron--tl">&#10086;</span>
        <span class="title-slide-fleuron title-slide-fleuron--tr">&#10086;</span>
        <span class="title-slide-fleuron title-slide-fleuron--bl">&#10086;</span>
        <span class="title-slide-fleuron title-slide-fleuron--br">&#10086;</span>
      </div>

      <div class="qr-marginalia qr-marginalia--left" aria-hidden="true">
        <img src="../assets/rabelais-clips/svg_output/angel-bell-ringer.svg" alt="" />
      </div>
      <div class="qr-marginalia qr-marginalia--right" aria-hidden="true">
        <img src="../assets/rabelais-clips/svg_output/demon-bell-ringer.svg" alt="" />
      </div>
