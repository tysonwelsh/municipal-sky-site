<style>
:root{--ink:#1a1408;--rub:#b33a2b;--edge:#5a3e28}
body{margin:0;background:#c8baa0;color:var(--ink);

h1{font-family:"Cormorant SC",Georgia,serif;color:var(--rub);text-align:center;

.slot{width:150px;height:210px;margin:0 auto;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(175deg,#ddd0b3,#d4c5a5);
  border:1px solid rgba(90,62,40,.35)}
.slot img{max-width:100%;max-height:190px;object-fit:contain;opacity:.62}
figcaption{margin-top:7px;font-size:12px;line-height:1.35;word-break:break-word}
.ar{color:#5c5347;font-size:10.5px}
.used{display:inline-block;font-family:"Cormorant SC",Georgia,serif;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--rub);
  border:1px solid rgba(179,58,43,.45);padding:0 4px;margin-left:2px}
