name: Deploy to live site

# Runs on every push to main, and can also be triggered by hand from the
# Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS = FTP over TLS (encrypted). If the first run can't connect,
          # change this to "ftp" (Bluehost's plain FTP, port 21) — less secure,
          # but matches the VSCode setup.
          protocol: ftps
          port: 21
          # The site's web root on the server (from your VSCode sftp.json).
          server-dir: /public_html/website_879a81cf/
          # local-dir defaults to ./ — the checked-out repo, i.e. only files
          # Git tracks (so .gitignore'd secrets/dev files never get deployed).
          # These extra excludes keep repo-only housekeeping off the server:
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            **/*.md
            **/*.backup-*
