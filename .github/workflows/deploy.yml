# Deploys the site to Bluehost over FTPS whenever main changes.
#
# Credentials live in GitHub repo secrets (Settings → Secrets and variables →
# Actions): FTP_HOST, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR.
# Values come from .vscode/sftp.json (gitignored, local only).
#
# The FTP-Deploy-Action keeps a .ftp-deploy-sync-state.json on the server and
# uploads only files that changed since the last run. It never deletes server
# files it didn't upload itself, so server-side config (private_config/
# secrets.php) and user data are untouched. The exclude list mirrors
# scripts/publish.sh.
#
# After the upload, the Junk Drawer's database is brought level with the code
# (2026-09-27): api/setup-jd-tables.php (idempotent schema runner) and then
# api/jd-backfill-curated.php (idempotent, incremental filing of every curated
# entry). Both need the JD_SETUP_KEY secret — the jd_setup_key from the
# server's private_config/secrets.php. Without it the step only warns, so a
# missing secret never blocks a deploy; it does mean the schema is NOT being
# migrated (the 2026-09-10 → 09-27 gap is what this step exists to prevent).
name: Deploy to Bluehost

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button as a fallback

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The deploy action requires server-dir to end with "/"; normalize the
      # secret so a pasted path works with or without the trailing slash.
      - name: Normalize server dir
        env:
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          dir="${RAW_DIR%/}/"
          echo "::add-mask::$dir"
          echo "SERVER_DIR=$dir" >> "$GITHUB_ENV"

      - name: Sync files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ env.SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/*.md
            **/*.backup-*
            local-dev/**
            scripts/**

      # The runner and the backfill are both safe to re-run on every deploy
      # (db/junk-drawer-schema.md, Runbook); doing so unconditionally is what
      # makes "did this deploy touch the schema?" a question nobody has to ask.
      # The runner prints one line per table/migration; anything but its
      # closing "All tables present and migrated." fails the job. The backfill
      # prints one line per item it filed and closes with "done"; a refusal
      # (schema behind, "!! REFUSED" overflow) or an error fails the job.
      - name: Migrate the Junk Drawer schema and file the curated entries
        env:
          JD_SETUP_KEY: ${{ secrets.JD_SETUP_KEY }}
        run: |
          if [ -z "$JD_SETUP_KEY" ]; then
            echo "::warning::JD_SETUP_KEY secret is not set — api/setup-jd-tables.php and the curated backfill were NOT run. Add it (gh secret set JD_SETUP_KEY) or run them by hand: db/junk-drawer-schema.md, Runbook."
            exit 0
          fi
          echo "::add-mask::$JD_SETUP_KEY"
          base="https://municipalsky.com/api"
          echo "== setup-jd-tables.php =="
          out="$(curl -sS --max-time 180 --retry 2 "$base/setup-jd-tables.php?key=$JD_SETUP_KEY")" || { echo "$out"; echo "::error::setup-jd-tables.php could not be reached"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "All tables present and migrated" || { echo "::error::setup-jd-tables.php reported a failure"; exit 1; }
          echo "== jd-backfill-curated.php =="
          out="$(curl -sS --max-time 300 --retry 2 "$base/jd-backfill-curated.php?key=$JD_SETUP_KEY")" || { echo "$out"; echo "::error::jd-backfill-curated.php could not be reached"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "^done" || { echo "::error::jd-backfill-curated.php did not finish (refused or failed)"; exit 1; }
