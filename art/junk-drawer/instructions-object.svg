<text x="30" y="130" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">1.  Dig around. Drag the</text>
<text x="30" y="148" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    junk; twist it while</text>
<text x="30" y="166" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    held.</text>
<text x="30" y="194" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">2.  Tap an object for its</text>
<text x="30" y="212" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    specimen tag. REPORT</text>
<text x="30" y="230" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    CARD opens its full</text>
<text x="30" y="248" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    grades.</text>
<text x="30" y="276" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">3.  Press PUSH FOR JUNK and</text>
<text x="30" y="294" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    four AIs draw your idea.</text>
<text x="30" y="312" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    Grade them blind, rank</text>
<text x="30" y="330" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    them, see who drew what</text>
<text x="30" y="348" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    — your pick joins the</text>
<text x="30" y="366" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13.5" fill="#3a2a12" xml:space="preserve">    drawer.</text>
