<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 460">
  <defs>
    <radialGradient id="ins_stain1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a86a" stop-opacity="0.14"/>
      <stop offset="0.7" stop-color="#c9a86a" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#c9a86a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ins_paper" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f4ebcd"/>
      <stop offset="0.55" stop-color="#efe4c2"/>
      <stop offset="1" stop-color="#e9dcb4"/>
    </linearGradient>
  </defs>
  <!-- torn-edge outline: the original 300x400 hand-torn silhouette, scaled
       1.1x/1.15x (owner ask, 2026-09-14 — wider and a bit taller so the
       five-step rewrite reads at a comfortable size) rather than redrawn;
       the jaggedness scales with the sheet so its texture stays consistent. -->
