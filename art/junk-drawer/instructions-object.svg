  <ellipse cx="261.8" cy="80.5" rx="79.2" ry="59.8" fill="url(#ins_stain1)"/>
  <ellipse cx="79.2" cy="393.3" rx="96.8" ry="69.0" fill="url(#ins_stain1)"/>
  <text x="160.6" y="69.0" text-anchor="middle" font-family="'Courier Prime','Courier New',Courier,monospace"
    font-size="30" font-weight="700" letter-spacing="3"
    fill="#33240f">INSTRUCTIONS</text>
  <!-- the close mark (owner, 2026-09-10): a press here takes the sheet out
       of the drawer until the next load. The group is the hit target —
       jd-furniture.js listens on .ins-close and stops the pile's grip from
       seeing the press; the disc is filled so silhouette hit-testing
       (pointer-events: visiblePainted) catches the whole button, not just
       the two strokes. -->
  <g class="ins-close">
    <circle cx="298.1" cy="33.3" r="14.1" fill="#e6d8ad" stroke="#33240f" stroke-width="1.5"/>
    <path d="M292.1 27.0 L304.2 39.7 M304.2 27.0 L292.1 39.7" fill="none" stroke="#33240f" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <line x1="37.4" y1="89.7" x2="292.6" y2="89.7" stroke="#33240f" stroke-width="1.6"/>
  <line x1="37.4" y1="94.3" x2="292.6" y2="94.3" stroke="#33240f" stroke-width="0.7"/>
<text x="30" y="132" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">1.  feel free to dig around and</text>
<text x="30" y="151" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">    look at stuff. click an item</text>
<text x="30" y="170" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">    for a closer look.</text>
<text x="30" y="200" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">2.  if you want something new</text>
<text x="30" y="219" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">    just press the big blue</text>
<text x="30" y="238" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">    button. help yourself.</text>
<text x="30" y="268" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">3.  each prompt returns four</text>
<text x="30" y="287" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">    drawing from different large</text>
<text x="30" y="306" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">    language models.</text>
<text x="30" y="336" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">4.  you're not done until you</text>
<text x="30" y="355" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">    leave a grade and rank them!</text>
<text x="30" y="385" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">5.  and it's all free of charge</text>
<text x="30" y="404" font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14" fill="#3a2a12" xml:space="preserve">    (you are the product!)</text>
</svg>
