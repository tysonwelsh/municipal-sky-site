    <!-- Large Whimsical Crescent Head -->
    <path d="M400,180 C250,150 150,250 180,400 C150,300 200,120 420,100 C480,95 500,120 450,150 C430,165 415,175 400,180 Z" />
    <path d="M350,220 C320,250 300,300 320,350 C350,400 450,450 550,400 C620,360 650,280 600,220 C550,150 450,150 350,220 Z M420,280 C440,260 480,260 500,280 C480,300 440,300 420,280 Z" />
    
    <!-- Giant Expressive Eye -->
    <path d="M450,250 C460,230 480,230 490,250 C480,270 460,270 450,250 Z" fill="#fff" />
    <circle cx="470" cy="250" r="6" fill="#0d0d12" />

    <!-- Oversized Top Hat -->
    <path d="M480,180 C450,170 380,180 350,200 C340,160 360,50 420,30 C480,10 520,40 550,80 C540,120 520,170 480,180 Z" />
    <path d="M300,210 C400,170 500,160 600,200 C620,210 610,220 580,215 C480,185 400,195 320,225 C300,235 280,220 300,210 Z" />

    <!-- Curly Feather/Plume on Hat -->
    <path d="M520,100 C600,20 750,-20 850,50 C950,120 980,250 900,350 C880,380 850,380 870,340 C930,260 920,150 820,80 C740,20 620,60 550,130 C540,140 510,110 520,100 Z" />

    <!-- Flowing Umbrella / Parasol / Dandelion -->
    <path stroke="#0d0d12" stroke-width="8" stroke-linecap="round" fill="none" d="M380,480 C300,500 200,450 150,350" />
    
    <!-- Parasol Canopy made of intricate swirls -->
    <path d="M150,350 C100,380 40,300 20,250 C10,220 40,200 60,230 C80,260 120,320 150,350 Z" />
    <path d="M150,350 C120,280 100,150 130,100 C150,70 180,80 160,120 C140,160 140,280 150,350 Z" />
    <path d="M150,350 C180,290 250,200 320,180 C350,170 360,200 330,220 C280,250 200,320 150,350 Z" />
    <path d="M150,350 C180,310 280,300 380,340 C410,350 400,380 370,360 C290,320 200,340 150,350 Z" />

    <!-- Expressive Hatching / Crosshatching lines -->
    <g stroke="#0d0d12" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="380" y1="400" x2="420" y2="430" />
      <line x1="390" y1="420" x2="430" y2="450" />
      <line x1="400" y1="440" x2="440" y2="470" />
      
      <line x1="450" y1="500" x2="490" y2="530" />
      <line x1="460" y1="520" x2="500" y2="550" />
      <line x1="470" y1="540" x2="510" y2="570" />
      
      <line x1="390" y1="200" x2="370" y2="240" />
      <line x1="410" y1="205" x2="390" y2="245" />
      <line x1="430" y1="210" x2="410" y2="250" />
    </g>

    <!-- Additional Whimsical Curls and Flourishes -->
    <path fill="none" stroke="#0d0d12" stroke-width="6" stroke-linecap="round" d="M600,600 C700,750 850,700 950,850 C980,900 950,950 900,900 C800,750 650,850 600,600" />
    <path fill="none" stroke="#0d0d12" stroke-width="4" stroke-linecap="round" d="M550,450 C600,550 750,550 800,650" />
    
    <!-- Floating Musical/Magical Notes (abstract shapes) -->
    <path d="M220,650 C240,620 280,640 260,670 C240,700 200,680 220,650 Z M260,670 C280,630 320,620 340,660" fill="none" stroke="#0d0d12" stroke-width="4" />
    <path d="M120,750 C150,720 180,740 160,770 C140,800 90,780 120,750 Z M160,770 C190,730 220,720 240,760" fill="none" stroke="#0d0d12" stroke-width="3" />
