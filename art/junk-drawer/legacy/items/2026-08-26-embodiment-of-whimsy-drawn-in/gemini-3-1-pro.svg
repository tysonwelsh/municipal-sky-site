<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <g filter="url(#ink-bleed)" fill="#0d0d12">
    <!-- Main Body Swirls -->
    <path d="M450,550 C400,600 350,700 380,850 C390,900 370,950 350,980 C340,995 365,995 380,970 C410,910 420,800 480,700 C520,630 550,580 500,530 Z" />
    <path d="M520,580 C600,680 650,800 600,950 C590,980 615,990 625,960 C680,800 620,650 540,550 Z" />
    
    <!-- Dynamic Ink Splatters & Drops -->
    <circle cx="280" cy="850" r="8" />
    <circle cx="310" cy="880" r="4" />
    <circle cx="680" cy="750" r="6" />
    <circle cx="720" cy="720" r="3" />
    <circle cx="850" cy="350" r="12" />
    <circle cx="880" cy="380" r="5" />
    <circle cx="920" cy="320" r="8" />
    <path d="M780,250 C800,230 830,220 850,240 C840,260 810,260 780,250 Z" />
    <path d="M120,450 C140,430 150,460 130,480 C110,470 100,460 120,450 Z" />
    <circle cx="80" cy="400" r="4" />
    <circle cx="150" cy="200" r="7" />
    
