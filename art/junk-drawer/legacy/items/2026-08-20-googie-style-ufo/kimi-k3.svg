<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8f0e8"/>
      <stop offset="1" stop-color="#3fb8a8"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f0e6"/>
      <stop offset="0.5" stop-color="#d8d2c4"/>
      <stop offset="1" stop-color="#8f8a7d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- starbursts -->
  <g stroke-linecap="round">
    <g transform="translate(120,120)" stroke="#ff6b35">
      <line x1="0" y1="-46" x2="0" y2="46" stroke-width="6"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke-width="6"/>
      <line x1="-33" y1="-33" x2="33" y2="33" stroke-width="4"/>
      <line x1="-33" y1="33" x2="33" y2="-33" stroke-width="4"/>
      <circle r="9" fill="#ff6b35" stroke="none"/>
    </g>
    <g transform="translate(690,100) scale(0.8)" stroke="#3fb8a8">
      <line x1="0" y1="-46" x2="0" y2="46" stroke-width="6"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke-width="6"/>
      <line x1="-33" y1="-33" x2="33" y2="33" stroke-width="4"/>
      <line x1="-33" y1="33" x2="33" y2="-33" stroke-width="4"/>
      <circle r="9" fill="#3fb8a8" stroke="none"/>
    </g>
    <g transform="translate(650,480) scale(0.7)" stroke="#ff6b35">
      <line x1="0" y1="-46" x2="0" y2="46" stroke-width="6"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke-width="6"/>
      <line x1="-33" y1="-33" x2="33" y2="33" stroke-width="4"/>
      <line x1="-33" y1="33" x2="33" y2="-33" stroke-width="4"/>
      <circle r="9" fill="#ff6b35" stroke="none"/>
    </g>
    <g transform="translate(100,460) scale(0.6)" stroke="#ffd23f">
      <line x1="0" y1="-46" x2="0" y2="46" stroke-width="6"/>
      <line x1="-46" y1="0" x2="46" y2="0" stroke-width="6"/>
      <circle r="9" fill="#ffd23f" stroke="none"/>
    </g>
  </g>

  <!-- orbit rings -->
  <ellipse cx="400" cy="300" rx="360" ry="90" fill="none" stroke="#3fb8a8" stroke-width="5" stroke-dasharray="22 14" opacity="0.8"/>
  <ellipse cx="400" cy="300" rx="330" ry="70" fill="none" stroke="#ff6b35" stroke-width="4" stroke-dasharray="14 18" opacity="0.7"/>

  <!-- light beam -->
  <polygon points="340,330 460,330 560,600 240,600" fill="url(#beam)"/>

  <!-- UFO group -->
  <g transform="rotate(-6 400 300)">
    <!-- dome -->
    <path d="M 300 265 A 100 90 0 0 1 500 265 Z" fill="url(#dome)" stroke="#1e6b60" stroke-width="5"/>
    <ellipse cx="365" cy="225" rx="22" ry="12" fill="#e8fffb" opacity="0.9" transform="rotate(-20 365 225)"/>
    <!-- antenna -->
    <line x1="400" y1="176" x2="400" y2="120" stroke="#e0442a" stroke-width="6"/>
    <circle cx="400" cy="112" r="12" fill="#ffd23f" stroke="#e0442a" stroke-width="4"/>
    <!-- disc -->
    <ellipse cx="400" cy="280" rx="240" ry="62" fill="url(#disc)" stroke="#5c574c" stroke-width="5"/>
    <ellipse cx="400" cy="272" rx="240" ry="58" fill="none" stroke="#ff6b35" stroke-width="7"/>
    <!-- portholes -->
    <g fill="#ffd23f" stroke="#e0442a" stroke-width="4">
      <circle cx="240" cy="292" r="13"/>
      <circle cx="310" cy="306" r="13"/>
      <circle cx="400" cy="312" r="13"/>
      <circle cx="490" cy="306" r="13"/>
      <circle cx="560" cy="292" r="13"/>
    </g>
    <!-- underside -->
    <path d="M 250 305 A 150 55 0 0 0 550 305 Z" fill="#6b665b" stroke="#5c574c" stroke-width="4"/>
    <circle cx="400" cy="352" r="16" fill="#ffd23f" stroke="#e0442a" stroke-width="5"/>
  </g>

  <!-- boomerang accents -->
  <path d="M 180 540 Q 240 500 300 545 Q 240 522 180 540 Z" fill="#3fb8a8"/>
  <path d="M 540 40 Q 610 10 670 55 Q 605 30 540 40 Z" fill="#ff6b35"/>
</svg>