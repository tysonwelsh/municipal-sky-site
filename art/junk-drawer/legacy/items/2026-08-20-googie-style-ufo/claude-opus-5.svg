<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="domeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bff7ff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#4fd8f5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0d6d8f" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hullTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="35%" stop-color="#d7dfe6"/>
      <stop offset="100%" stop-color="#8e9aa6"/>
    </linearGradient>
    <linearGradient id="hullBot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d8794"/>
      <stop offset="55%" stop-color="#4a5460"/>
      <stop offset="100%" stop-color="#242b34"/>
    </linearGradient>
    <linearGradient id="rimG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5d6c"/>
      <stop offset="25%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#4ff0c4"/>
      <stop offset="75%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff5d6c"/>
    </linearGradient>
    <radialGradient id="beamG" cx="0.5" cy="0" r="1">
      <stop offset="0%" stop-color="#a8ffe8" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#5fe0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5fe0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7ff3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7ff3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampG" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ffe36a"/>
      <stop offset="100%" stop-color="#ff7b3d"/>
    </radialGradient>
  </defs>

  <!-- starburst / atomic sparkles -->
  <g stroke="#ffe9a8" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <path d="M92 108 v-46 M92 108 v46 M92 108 h-40 M92 108 h40 M68 84 l-22-22 M116 132 l22 22 M116 84 l22-22 M68 132 l-22 22"/>
    <path d="M706 176 v-34 M706 176 v34 M706 176 h-30 M706 176 h30" stroke-width="2.4"/>
    <path d="M640 62 v-24 M640 62 v24 M640 62 h-22 M640 62 h22" stroke-width="2"/>
    <path d="M156 246 v-18 M156 246 v18 M156 246 h-16 M156 246 h16" stroke-width="1.8"/>
  </g>
  <g fill="#fff6cf">
    <circle cx="736" cy="330" r="4"/><circle cx="60" cy="322" r="3.4"/>
    <circle cx="600" cy="120" r="3"/><circle cx="240" cy="86" r="3.6"/>
    <circle cx="470" cy="52" r="3"/>
  </g>

  <!-- boomerang googie shapes -->
  <path d="M40 470 C120 430 210 428 268 462 C206 462 132 480 40 470 Z" fill="#ff5d6c" opacity="0.9"/>
  <path d="M760 402 C690 366 610 366 556 398 C616 396 686 410 760 402 Z" fill="#4ff0c4" opacity="0.85"/>

  <!-- ambient glow -->
  <ellipse cx="400" cy="400" rx="390" ry="180" fill="url(#glowG)"/>

  <!-- tractor beam -->
  <path d="M300 470 L180 792 L620 792 L500 470 Z" fill="url(#beamG)"/>
  <g fill="#c9fff2" opacity="0.35">
    <path d="M334 520 L268 760 L296 760 L352 520 Z"/>
    <path d="M470 520 L534 760 L506 760 L452 520 Z"/>
  </g>

  <!-- lower hull -->
  <path d="M60 400 C60 400 210 508 400 508 C590 508 740 400 740 400 C740 456 600 556 400 556 C200 556 60 456 60 400 Z" fill="url(#hullBot)"/>
  <!-- fins -->
  <path d="M120 428 C90 470 96 520 130 552 C136 512 140 470 148 444 Z" fill="#ff5d6c"/>
  <path d="M680 428 C710 470 704 520 670 552 C664 512 660 470 652 444 Z" fill="#ff5d6c"/>

  <!-- main saucer disc -->
  <ellipse cx="400" cy="400" rx="342" ry="96" fill="url(#hullTop)"/>
  <!-- rim stripe -->
  <ellipse cx="400" cy="400" rx="342" ry="96" fill="none" stroke="url(#rimG)" stroke-width="10"/>
  <ellipse cx="400" cy="392" rx="300" ry="76" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

  <!-- rim lamps -->
  <g>
    <circle cx="98" cy="404" r="13" fill="url(#lampG)"/>
    <circle cx="200" cy="446" r="14" fill="url(#lampG)"/>
    <circle cx="330" cy="464" r="15" fill="url(#lampG)"/>
    <circle cx="470" cy="464" r="15" fill="url(#lampG)"/>
    <circle cx="600" cy="446" r="14" fill="url(#lampG)"/>
    <circle cx="702" cy="404" r="13" fill="url(#lampG)"/>
  </g>

  <!-- upper hull ring -->
  <ellipse cx="400" cy="372" rx="220" ry="62" fill="#eef3f7"/>
  <ellipse cx="400" cy="372" rx="220" ry="62" fill="none" stroke="#9aa7b4" stroke-width="3"/>
  <path d="M180 372 C180 340 280 316 400 316 C520 316 620 340 620 372 C620 344 520 318 400 318 C280 318 180 344 180 372 Z" fill="#c3ccd6"/>

  <!-- dome base ring -->
  <ellipse cx="400" cy="332" rx="150" ry="42" fill="#b9c4d0"/>
  <ellipse cx="400" cy="326" rx="150" ry="42" fill="#dde5ec"/>

  <!-- dome -->
  <path d="M254 326 C254 218 322 148 400 148 C478 148 546 218 546 326 Z" fill="url(#domeG)"/>
  <path d="M290 318 C288 236 336 176 396 172 C356 196 322 250 316 318 Z" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="400" cy="326" rx="146" ry="34" fill="#2ea7c7" opacity="0.35"/>

  <!-- alien silhouette -->
  <g fill="#0d3b4a" opacity="0.75">
    <ellipse cx="400" cy="252" rx="30" ry="34"/>
    <path d="M372 300 C372 282 428 282 428 300 L428 322 L372 322 Z"/>
    <circle cx="389" cy="248" r="6" fill="#c9fff2"/>
    <circle cx="411" cy="248" r="6" fill="#c9fff2"/>
  </g>

  <!-- dome antenna -->
  <line x1="400" y1="148" x2="400" y2="86" stroke="#8e9aa6" stroke-width="7"/>
  <circle cx="400" cy="78" r="16" fill="url(#lampG)"/>
  <circle cx="400" cy="78" r="28" fill="none" stroke="#ffd166" stroke-width="3" opacity="0.6"/>

  <!-- underbelly emitter -->
  <ellipse cx="400" cy="524" rx="72" ry="20" fill="#1b222b"/>
  <ellipse cx="400" cy="520" rx="56" ry="15" fill="#8ff5e2"/>
  <ellipse cx="400" cy="518" rx="30" ry="8" fill="#ffffff"/>

  <!-- highlight sweep -->
  <path d="M120 386 C220 344 300 330 400 330 C300 344 210 366 120 396 Z" fill="#ffffff" opacity="0.5"/>
</svg>