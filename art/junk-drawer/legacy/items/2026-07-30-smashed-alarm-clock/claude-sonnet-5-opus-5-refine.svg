    <path d="M 588,555 L 618,588 L 636,615 L 652,645" fill="none" stroke="#FF7A1A" stroke-width="13" stroke-linecap="round"/>
    <circle cx="666" cy="665" r="30" fill="#FF7A1A" stroke="#0a0a0a" stroke-width="9"/>
    <circle cx="666" cy="665" r="11" fill="#FFF3D6" stroke="#0a0a0a" stroke-width="6"/>

