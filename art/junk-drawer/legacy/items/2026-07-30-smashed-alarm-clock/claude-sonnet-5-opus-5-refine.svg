<svg xmlns="http://www.w3.org/2000/svg" viewBox="75 35 655 710">
  <g>
    <!-- ===================== IMPACT BURST RAYS (behind everything) =====================
         All three wedges spring from the single impact origin 474.6,363.5, which is
         also the deepest point of the crushed rim. -->
    <g>
      <path d="M 474.6,363.5 L 505,45 L 605,55 Z" fill="#FFDD22" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 474.6,363.5 L 700,262 L 718,345 Z" fill="#FFFFFF" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 474.6,363.5 L 648,425 L 702,478 Z" fill="#FFDD22" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
    </g>

    <!-- ===================== EXPOSED GEAR TRAIN =====================
         Drawn BEFORE the case so the crushed rim genuinely clips it: the gear only
         shows where the mallet opened the case, and its lower edge disappears behind
         the torn lip. Steel grey matches the sprung mainspring. -->
    <g>
      <path d="M 608.7,376.5 L 617.0,381.4 L 615.0,388.3 L 605.4,388.0 L 601.5,394.3 L 606.3,402.7 L 601.1,407.6 L 592.9,402.5 L 586.5,406.1 L 586.4,415.7 L 579.4,417.4 L 574.8,408.9 L 567.5,408.7 L 562.6,417.0 L 555.7,415.0 L 556.0,405.4 L 549.7,401.5 L 541.3,406.3 L 536.4,401.1 L 541.5,392.9 L 537.9,386.5 L 528.3,386.4 L 526.6,379.4 L 535.1,374.8 L 535.3,367.5 L 527.0,362.6 L 529.0,355.7 L 538.6,356.0 L 542.5,349.7 L 537.7,341.3 L 542.9,336.4 L 551.1,341.5 L 557.5,337.9 L 557.6,328.3 L 564.6,326.6 L 569.2,335.1 L 576.5,335.3 L 581.4,327.0 L 588.3,329.0 L 588.0,338.6 L 594.3,342.5 L 602.7,337.7 L 607.6,342.9 L 602.5,351.1 L 606.1,357.5 L 615.7,357.6 L 617.4,364.6 L 608.9,369.2 Z" fill="#CBD5DA" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="572" cy="372" r="17" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="6"/>
      <circle cx="572" cy="372" r="6" fill="#CBD5DA" stroke="#0a0a0a" stroke-width="4"/>
    </g>

    <!-- ===================== MAINSPRING (drawn before the case so the rim overlaps its base) ===================== -->
    <path d="M 226.9,378.0 L 216.9,350.0 L 187.7,355.3 L 181.6,326.2 L 151.9,327.4 L 150.0,297.7 L 120.4,294.7 L 122.6,265.1 L 93.7,258.0"
          fill="none" stroke="#0a0a0a" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 226.9,378.0 L 216.9,350.0 L 187.7,355.3 L 181.6,326.2 L 151.9,327.4 L 150.0,297.7 L 120.4,294.7 L 122.6,265.1 L 93.7,258.0"
          fill="none" stroke="#CBD5DA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="93.7" cy="258.0" r="9" fill="#CBD5DA" stroke="#0a0a0a" stroke-width="5"/>

    <!-- ===================== WIND KEY (behind the case, as a key-wound clock's is) ===================== -->
