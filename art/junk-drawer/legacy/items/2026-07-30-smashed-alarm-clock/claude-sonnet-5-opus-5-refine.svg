          fill="#FFC81A" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round"/>

    <!-- ===================== FACE / DIAL (crushed in with the case) ===================== -->
    <path d="M 567.9,470.0 L 568.3,481.0 L 565.7,491.8 L 565.3,502.9 L 561.4,513.2 L 559.3,524.1 L 555.2,534.3 L 550.2,544.1 L 545.8,554.2 L 539.7,563.3 L 533.5,572.4 L 526.9,581.3 L 518.4,588.4 L 510.1,595.6 L 502.0,603.0 L 493.5,610.0 L 483.7,615.0 L 474.0,620.1 L 464.6,626.0 L 454.1,629.4 L 443.5,632.2 L 432.9,635.5 L 421.9,636.2 L 411.0,638.0 L 400.0,637.4 L 389.0,637.5 L 378.0,637.2 L 367.1,635.6 L 356.3,633.0 L 346.1,628.9 L 335.6,625.4 L 325.9,620.3 L 316.4,614.9 L 306.7,609.7 L 297.3,603.8 L 288.8,596.8 L 280.9,589.1 L 273.0,581.4 L 267.1,572.0 L 260.9,563.0 L 254.6,554.0 L 249.7,544.1 L 245.3,534.1 L 241.1,523.9 L 237.5,513.5 L 235.2,502.8 L 233.8,491.9 L 231.7,481.0 L 231.0,470.0 L 232.5,459.0 L 234.3,448.2 L 236.1,437.4 L 237.0,426.3 L 241.8,416.3 L 244.4,405.5 L 249.2,395.6 L 254.8,386.2 L 259.8,376.3 L 267.5,368.3 L 274.2,359.7 L 281.3,351.3 L 289.9,344.4 L 297.3,336.2 L 307.0,330.7 L 316.4,325.1 L 326.1,320.1 L 335.6,314.5 L 337.8,316.1 L 364.8,328.7 L 383.7,314.5 L 404.3,347.1 L 423.2,338.3 L 431.0,374.5 L 446.5,374.7 L 449.8,398.9 L 464.4,395.9 L 479.9,398.1 L 475.2,415.4 L 507.6,407.8 L 502.0,424.6 L 538.0,425.2 L 529.6,442.5 L 549.3,446.3 L 565.1,452.6 L 568.1,459.1 Z"
          fill="#FFF3D6" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>

    <!-- ===================== HOUR TICKS (1 and 2 destroyed by the blow) ===================== -->
    <g stroke="#0a0a0a" stroke-width="9" stroke-linecap="square">
      <line x1="400.0" y1="328.0" x2="400.0" y2="346.0"/>
      <line x1="558.0" y1="470.0" x2="538.0" y2="470.0"/>
      <line x1="536.8" y1="549.0" x2="519.5" y2="539.0"/>
      <line x1="400.0" y1="628.0" x2="400.0" y2="608.0"/>
      <line x1="321.0" y1="606.8" x2="331.0" y2="589.5"/>
      <line x1="263.2" y1="549.0" x2="280.5" y2="539.0"/>
      <line x1="242.0" y1="470.0" x2="262.0" y2="470.0"/>
      <line x1="263.2" y1="391.0" x2="280.5" y2="401.0"/>
      <line x1="321.0" y1="333.2" x2="331.0" y2="350.5"/>
    </g>

    <!-- ===================== NUMERALS (12 pushed in with the caved dial) ===================== -->
    <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="46" fill="#0a0a0a" text-anchor="middle">
      <text x="400.0" y="382">12</text>
      <text x="522.0" y="486">3</text>
      <text x="400.0" y="608">6</text>
      <text x="278.0" y="486">9</text>
    </g>

    <!-- ===================== HANDS (both buckled by the strike; the hour hand,
         which lay across the impact quadrant, is folded right back) ===================== -->
    <g stroke="#0a0a0a" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 400,470 L 398,534 L 378,562 L 355,610" stroke-width="16"/>
      <path d="M 400,470 L 445,434 L 452,455 L 471,447" stroke-width="14"/>
    </g>
    <g stroke="#E23B2E" stroke-linecap="round" fill="none">
      <path d="M 400,470 L 398,532" stroke-width="5"/>
      <path d="M 400,470 L 442,436" stroke-width="5"/>
    </g>

    <!-- ===================== CENTER HUB ===================== -->
    <circle cx="400" cy="470" r="20" fill="#0a0a0a"/>
    <circle cx="400" cy="470" r="8" fill="#E23B2E"/>

    <!-- ===================== TORN BELL BRACKET =====================
         Hinged on two points of the crushed rim, so the right bell still hangs off
         the clock instead of floating. -->
    <path d="M 493.2,362.8 L 513.0,368.3 L 516.0,340.0 L 486.0,328.0 Z"
          fill="#3a3a3a" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>

    <!-- ===================== BELL BRIDGE + STRIKER =====================
         Ends land exactly on each bell's crown boss; the bosses are drawn after, so
         the bridge tucks under them. -->
    <path d="M 290,194 C 322,138 366,120 410,128 C 460,138 506,180 533.7,231.4"
          fill="none" stroke="#0a0a0a" stroke-width="11" stroke-linecap="round"/>
    <line x1="403" y1="118" x2="392" y2="102" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
    <line x1="427" y1="118" x2="438" y2="103" stroke="#0a0a0a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="415" cy="131" r="16" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="7"/>

    <!-- ===================== BELLS =====================
         Shallow wide caps on crimped flanges, each bolted down by a crown boss.
         Left bell still seated; right bell knocked askew on its torn bracket. -->
    <!-- left bell -->
    <path d="M 274,264 L 308,264 L 304,304 L 278,304 Z" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 216,250 L 364,250 L 372,272 L 208,272 Z" fill="#0D5BA6" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 214,250 C 214,208 244,192 290,192 C 336,192 366,208 366,250 Z" fill="#1C7ED6" stroke="#0a0a0a" stroke-width="10" stroke-linejoin="round"/>
    <path d="M 232,234 Q 248,208 278,203" fill="none" stroke="#69B3F0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="290" cy="194" r="13" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="6"/>

    <!-- right bell, knocked askew off its torn bracket -->
    <g transform="rotate(20 478 326)">
      <path d="M 482,288 L 516,288 L 512,328 L 486,328 Z" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="7" stroke-linejoin="round"/>
      <path d="M 424,274 L 572,274 L 580,296 L 416,296 Z" fill="#0D5BA6" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round"/>
      <path d="M 422,274 C 422,232 452,216 498,216 C 544,216 574,232 574,274 Z" fill="#1C7ED6" stroke="#0a0a0a" stroke-width="10" stroke-linejoin="round"/>
      <path d="M 440,258 Q 456,232 486,227" fill="none" stroke="#69B3F0" stroke-width="7" stroke-linecap="round"/>
      <circle cx="498" cy="218" r="13" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="6"/>
    </g>

    <!-- ===================== IMPACT CRACKS + CRUMPLE CREASES =====================
         Every line starts at the impact origin or runs back toward it, and every
         line lies on metal or dial - none of them cross the open tear. -->
    <g fill="none" stroke="#0a0a0a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 474.6,363.5 L 424.0,326.0 L 378.0,300.0"/>
      <path d="M 474.6,363.5 L 393.8,401.9 L 323.5,436.0"/>
      <path d="M 474.6,363.5 L 478.5,428.3 L 470.2,491.4"/>
      <path d="M 474.6,363.5 L 516.0,404.0 L 562.0,428.0"/>
    </g>
    <g fill="none" stroke="#0a0a0a" stroke-width="6" stroke-linecap="round">
      <path d="M 405.9,301.1 L 437.5,329.8"/>
      <path d="M 444.8,332.1 L 461.2,349.4"/>
      <path d="M 511.6,388.9 L 496.1,378.2"/>
    </g>

    <!-- ===================== GLASS SHARDS ===================== -->
    <g fill="#B9E8FB" stroke="#0a0a0a" stroke-width="5" stroke-linejoin="round">
      <path d="M 433.9,458.8 L 452.0,468.3 L 444.9,455.8 L 445.7,442.1 Z"/>
      <path d="M 270.9,451.4 L 251.9,431.9 L 256.4,447.2 L 247.8,465.8 Z"/>
      <path d="M 434.1,596.9 L 415.9,627.2 L 441.0,615.7 L 465.6,612.9 Z"/>
      <path d="M 299.4,468.0 L 292.3,453.0 L 290.3,466.9 L 287.6,479.6 Z"/>
      <path d="M 320.3,436.8 L 301.2,413.8 L 305.0,428.1 L 293.0,448.8 Z"/>
      <path d="M 452.0,442.9 L 477.4,444.0 L 465.0,438.2 L 460.7,418.9 Z"/>
      <path d="M 336.0,479.5 L 321.1,466.4 L 325.6,480.0 L 329.4,498.2 Z"/>
      <path d="M 448.8,477.0 L 458.8,494.9 L 460.0,479.1 L 466.6,466.9 Z"/>
      <path d="M 492.0,541.3 L 494.2,559.6 L 500.6,547.6 L 510.4,542.1 Z"/>
    </g>

    <!-- small flung nut/bolt debris -->
    <g fill="#FFC81A" stroke="#0a0a0a" stroke-width="5" stroke-linejoin="round">
      <path d="M 640,320 L 651,314 L 662,320 L 662,333 L 651,339 L 640,333 Z"/>
      <path d="M 700,395 L 709,390 L 718,395 L 718,405 L 709,410 L 700,405 Z"/>
    </g>
    <circle cx="150" cy="220" r="10" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="5"/>

    <!-- ===================== FEET ===================== -->
    <path d="M 350,684 L 386,684 L 382,724 L 354,724 Z" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 414,685 L 450,685 L 448,725 L 416,725 Z" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round"/>
    <!-- broken/knocked foot flung to the side -->
    <g transform="rotate(38 505 705)">
      <path d="M 487,690 L 523,690 L 520,730 L 490,730 Z" fill="#3a3a3a" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
