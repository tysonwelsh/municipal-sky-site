  <circle cx="88" cy="60" r="3.4" fill="#f7ffe9" opacity="0.9"/>
  <circle cx="130" cy="60" r="2.8" fill="#f7ffe9" opacity="0.85"/>
  <circle cx="118" cy="92" r="2.2" fill="#f7ffe9" opacity="0.8"/>
  <circle cx="100" cy="120" r="1.8" fill="#f7ffe9" opacity="0.8"/>
  <circle cx="84" cy="190" r="2.6" fill="#f7ffe9" opacity="0.85"/>
  <circle cx="126" cy="204" r="2.4" fill="#f7ffe9" opacity="0.85"/>

  <!-- Subtle dark specs -->
  <circle cx="112" cy="84" r="1.2" fill="#2c4a19" opacity="0.7"/>
  <circle cx="94" cy="104" r="1.1" fill="#2c4a19" opacity="0.7"/>
  <circle cx="122" cy="132" r="1.3" fill="#2c4a19" opacity="0.7"/>
  <circle cx="108" cy="210" r="1.3" fill="#2c4a19" opacity="0.7"/>
</svg>