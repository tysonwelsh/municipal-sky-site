  <!-- Side droplet highlight -->
  <path
    d="M60 138
       C56 140 54 145 55 150
       C56 154 59 158 63 160
       C67 162 71 161 74 158
       C77 154 78 150 77 146
       C75 142 72 139 68 138
       C65 137 62 137 60 138 Z"
