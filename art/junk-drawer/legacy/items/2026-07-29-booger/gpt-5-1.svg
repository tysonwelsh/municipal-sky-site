       C84 16 71 32 68 52
       C66 64 67 74 72 88
       C77 102 80 112 80 126
       C80 138 73 155 64 172
       C54 191 48 205 48 222
       C48 237 58 250 74 255
       C88 259 101 254 112 246
       C123 238 132 228 140 216
       C151 199 158 184 163 167
       C168 149 170 132 170 118
       C170 102 166 86 157 72
       C147 57 134 47 120 39
       C112 35 109 25 108 19
       C107 14 106 11 104 10 Z"
    fill="none"
    stroke="#315f1f"
    stroke-width="2.4"
    stroke-linejoin="round"
    stroke-linecap="round"
    opacity="0.9"
    filter="url(#softEdge)"/>

  <!-- Internal contour lines for gooey texture -->
  <path
    d="M92 64
       C88 72 88 82 90 90
       C92 98 96 105 101 110"
    fill="none"
    stroke="#3a6c24"
    stroke-width="1.4"
    stroke-linecap="round"
    opacity="0.55"/>

  <path
    d="M120 52
       C129 58 136 67 140 76
       C143 84 144 92 144 100"
    fill="none"
