       C88 217 93 222 100 223
       C108 224 115 221 121 216
       C127 211 132 203 135 196
       C137 190 137 183 133 179
       C129 175 123 175 118 176
       C109 178 100 178 94 184 Z"
    fill="url(#snotGloss)"
    opacity="0.85"/>

  <!-- Deep translucent core shadow -->
  <path
    d="M116 70
       C107 72 99 79 96 88
       C93 95 94 104 97 112
       C100 120 104 125 110 130
       C118 137 129 141 138 140
       C147 139 153 134 158 126
       C162 119 164 111 164 104
