  <path d="M 350 220 C 390 230 420 280 400 330 C 380 380 320 360 310 310 C 300 260 310 210 350 220 Z" fill="#88e026" opacity="0.6"/>

  <!-- Bubbles -->
  <circle cx="160" cy="180" r="18" fill="url(#bubbleGrad)" />
  <circle cx="152" cy="172" r="5" fill="#ffffff" opacity="0.7" />
  
  <circle cx="280" cy="380" r="28" fill="url(#bubbleGrad)" />
  <circle cx="270" cy="368" r="8" fill="#ffffff" opacity="0.7" />

  <circle cx="410" cy="240" r="12" fill="url(#bubbleGrad)" />
  <circle cx="405" cy="235" r="3" fill="#ffffff" opacity="0.7" />

  <!-- Glossy Highlights -->
  <path d="M 230 30 
           C 260 25 270 50 280 80 
           C 285 95 240 70 210 80
           C 170 90 140 140 125 180
           C 115 210 80 160 110 110
           C 130 75 180 40 230 30 Z" 
