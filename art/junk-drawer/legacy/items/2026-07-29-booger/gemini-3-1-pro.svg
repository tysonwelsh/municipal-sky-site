<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="baseGoo" cx="35%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#baff49"/>
      <stop offset="40%" stop-color="#73d115"/>
      <stop offset="85%" stop-color="#3d8704"/>
      <stop offset="100%" stop-color="#235201"/>
    </radialGradient>
    <radialGradient id="bubbleGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a3fa41" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3d8704" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Main Gooey Body -->
  <path d="M 230 10 
