  <path d="M 280 180 C 310 160 350 170 360 200 C 370 230 330 250 300 240 C 270 230 250 200 280 180 Z" fill="#2d6603" opacity="0.8"/>
  <path d="M 150 330 C 180 310 210 320 220 350 C 230 380 190 410 160 390 C 130 370 120 350 150 330 Z" fill="#2d6603" opacity="0.6"/>
  <path d="M 380 340 C 400 320 430 330 440 360 C 450 390 410 410 390 390 C 370 370 360 360 380 340 Z" fill="#224d02" opacity="0.9"/>

  <!-- Stretching Tendrils (Internal Detailing) -->
