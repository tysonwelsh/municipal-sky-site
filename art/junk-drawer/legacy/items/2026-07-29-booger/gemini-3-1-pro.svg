  <path d="M 450 160
           C 475 210 475 280 440 330
           C 430 345 420 300 435 260
           C 445 230 450 190 420 170
           C 400 155 425 120 450 160 Z"
        fill="url(#highlight)" />
        
  <path d="M 80 380
           C 110 420 170 460 230 470
           C 190 455 140 410 120 360
           C 110 335 60 335 80 380 Z"
        fill="url(#highlight)" opacity="0.7" />
        
  <path d="M 330 465
           C 370 450 410 400 420 360
           C 405 385 365 430 315 440
