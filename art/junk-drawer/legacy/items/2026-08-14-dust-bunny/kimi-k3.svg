<svg xmlns="http://www.w3.org/2000/svg" viewBox="33.0 18.5 332.2 355.8">
  <defs>
    <radialGradient id="fluff" cx="45%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#e8e4e0"/>
      <stop offset="55%" stop-color="#cfc9c4"/>
      <stop offset="100%" stop-color="#a89f99"/>
    </radialGradient>
    <radialGradient id="earIn" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d9b8b0"/>
      <stop offset="100%" stop-color="#b8948c"/>
    </radialGradient>
  </defs>

  <!-- floating dust motes -->
  <g fill="#b5aca5">
    <circle cx="58" cy="95" r="3.5" opacity="0.6"/>
    <circle cx="330" cy="80" r="4.5" opacity="0.5"/>
    <circle cx="352" cy="150" r="2.5" opacity="0.6"/>
    <circle cx="45" cy="180" r="3" opacity="0.55"/>
    <circle cx="90" cy="55" r="2.5" opacity="0.5"/>
    <circle cx="300" cy="45" r="3" opacity="0.55"/>
    <circle cx="360" cy="270" r="3.5" opacity="0.5"/>
    <circle cx="38" cy="290" r="3" opacity="0.5"/>
    <circle cx="140" cy="35" r="2" opacity="0.5"/>
    <circle cx="245" cy="30" r="2.5" opacity="0.45"/>
  </g>

  <!-- dust wisps -->
  <g stroke="#c4bbb4" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M55 230 q 12 -6 20 2 q 8 8 18 2"/>
    <path d="M315 320 q 12 -6 20 2 q 8 8 18 2"/>
    <path d="M70 330 q 10 -5 18 1"/>
  </g>

  <!-- ears -->
  <g>
    <path d="M150 150 Q 118 40 158 22 Q 196 36 182 142 Z" fill="url(#fluff)" stroke="#9c938c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M160 128 Q 140 55 160 42 Q 178 52 172 126 Z" fill="url(#earIn)" opacity="0.85"/>
    <path d="M250 150 Q 282 40 242 22 Q 204 36 218 142 Z" fill="url(#fluff)" stroke="#9c938c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M240 128 Q 260 55 240 42 Q 222 52 228 126 Z" fill="url(#earIn)" opacity="0.85"/>
  </g>

  <!-- fluffy body: layered scalloped blobs -->
  <g stroke="#9c938c" stroke-width="3" stroke-linejoin="round">
    <path fill="url(#fluff)" d="M200 118
      q 14 -12 26 -2 q 18 -16 34 -2 q 24 -8 32 12 q 26 -2 28 22
      q 24 4 18 26 q 22 10 10 30 q 16 16 0 32 q 10 20 -12 30
      q 2 24 -22 26 q -2 24 -26 22 q -8 20 -30 12 q -12 16 -32 6
      q -16 12 -34 0 q -20 8 -30 -10 q -24 2 -26 -22 q -24 -2 -22 -26
      q -22 -10 -12 -30 q -16 -16 0 -32 q -12 -20 10 -30 q -6 -22 18 -26
      q 2 -24 28 -22 q 8 -20 32 -12 q 16 -14 34 2 q 12 -10 26 2 Z"/>
  </g>

  <!-- extra fluff tufts on body -->
  <g stroke="#b3aaa3" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M118 200 q -14 -8 -22 -2"/>
    <path d="M112 260 q -14 4 -20 14"/>
    <path d="M282 200 q 14 -8 22 -2"/>
    <path d="M288 260 q 14 4 20 14"/>
    <path d="M160 330 q -8 12 -18 14"/>
    <path d="M240 330 q 8 12 18 14"/>
    <path d="M130 150 q -10 -12 -6 -22"/>
    <path d="M270 150 q 10 -12 6 -22"/>
  </g>

  <!-- lint strands -->
  <g stroke-linecap="round" fill="none">
    <path d="M100 300 q -16 10 -10 24" stroke="#8f857e" stroke-width="2.5"/>
    <path d="M305 115 q 16 -8 14 -22" stroke="#8f857e" stroke-width="2.5"/>
    <path d="M200 352 q 2 14 14 16" stroke="#a3968e" stroke-width="2"/>
  </g>
  <circle cx="322" cy="90" r="3" fill="#8f857e"/>
  <circle cx="88" cy="327" r="2.5" fill="#a3968e"/>
  <circle cx="216" cy="370" r="2.5" fill="#a3968e"/>

  <!-- face -->
  <g>
    <ellipse cx="162" cy="228" rx="11" ry="14" fill="#4a423d"/>
    <ellipse cx="238" cy="228" rx="11" ry="14" fill="#4a423d"/>
    <circle cx="165.5" cy="223" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="241.5" cy="223" r="4" fill="#fff" opacity="0.9"/>
    <ellipse cx="200" cy="252" rx="6.5" ry="5" fill="#c98f8a"/>
    <path d="M200 257 q -1 8 -9 9 M200 257 q 1 8 9 9" stroke="#7a6f68" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="140" cy="252" rx="12" ry="7" fill="#d9a8a2" opacity="0.55"/>
    <ellipse cx="260" cy="252" rx="12" ry="7" fill="#d9a8a2" opacity="0.55"/>
  </g>

  <!-- stray hairs -->
  <g stroke="#9c938c" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M186 118 q -4 -12 -12 -14"/>
    <path d="M200 114 q 0 -12 6 -18"/>
    <path d="M214 118 q 6 -10 14 -12"/>
  </g>
</svg>