<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050">
  <defs>
    <linearGradient id="cardPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f6ed"/>
      <stop offset="0.5" stop-color="#f4efe1"/>
      <stop offset="1" stop-color="#e9e1cf"/>
