      <g>
        <g stroke="#cfd6da" stroke-width="2.4">
          <path d="M236 496 L236 552"/><path d="M258 496 L258 560"/><path d="M280 496 L280 552"/>
          <path d="M302 496 L302 562"/><path d="M324 496 L324 552"/><path d="M346 496 L346 560"/>
          <path d="M368 496 L368 552"/><path d="M390 496 L390 564"/><path d="M412 496 L412 552"/>
          <path d="M434 496 L434 560"/><path d="M456 496 L456 552"/><path d="M478 496 L478 562"/>
          <path d="M500 496 L500 552"/><path d="M522 496 L522 560"/><path d="M544 496 L544 552"/>
          <path d="M566 496 L566 552"/>
        </g>
        <g stroke="#8e979d" stroke-width="1.6">
          <path d="M247 496 L247 534"/><path d="M269 496 L269 534"/><path d="M291 496 L291 534"/>
          <path d="M313 496 L313 534"/><path d="M335 496 L335 534"/><path d="M357 496 L357 534"/>
          <path d="M379 496 L379 534"/><path d="M401 496 L401 534"/><path d="M423 496 L423 534"/>
          <path d="M445 496 L445 534"/><path d="M467 496 L467 534"/><path d="M489 496 L489 534"/>
          <path d="M511 496 L511 534"/><path d="M533 496 L533 534"/><path d="M555 496 L555 534"/>
        </g>
