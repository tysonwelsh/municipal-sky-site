          <circle cx="286" cy="158" r="12"/>
        </g>
        <g stroke="#b9a05c" stroke-width="6">
          <path d="M286 106 L286 118"/><path d="M286 198 L286 210"/>
          <path d="M234 158 L246 158"/><path d="M326 158 L338 158"/>
          <path d="M249 121 L258 130"/><path d="M314 186 L323 195"/>
          <path d="M323 121 L314 130"/><path d="M258 186 L249 195"/>
        </g>

        <g fill="none" stroke="#9aa2a8" stroke-width="4">
          <circle cx="400" cy="176" r="30"/>
          <circle cx="400" cy="176" r="9"/>
        </g>
        <g stroke="#9aa2a8" stroke-width="5">
          <path d="M400 138 L400 148"/><path d="M400 204 L400 214"/>
          <path d="M362 176 L372 176"/><path d="M428 176 L438 176"/>
          <path d="M373 149 L380 156"/><path d="M420 196 L427 203"/>
          <path d="M427 149 L420 156"/><path d="M380 196 L373 203"/>
        </g>

        <g fill="none" stroke="#b9a05c" stroke-width="4">
          <circle cx="510" cy="150" r="38"/>
          <circle cx="510" cy="150" r="11"/>
        </g>
        <g stroke="#b9a05c" stroke-width="6">
          <path d="M510 104 L510 114"/><path d="M510 186 L510 196"/>
          <path d="M464 150 L474 150"/><path d="M546 150 L556 150"/>
          <path d="M477 117 L485 125"/><path d="M535 175 L543 183"/>
          <path d="M543 117 L535 125"/><path d="M485 175 L477 183"/>
        </g>
      </g>

      <!-- linkage rods over cogs -->
      <path d="M286 158 L400 176 L510 150" stroke="#5b6268" stroke-width="5" fill="none" opacity="0.9"/>

      <!-- side flanges & rivets -->
      <g fill="#8d959c">
        <circle cx="204" cy="90" r="5"/><circle cx="596" cy="90" r="5"/>
        <circle cx="196" cy="140" r="5"/><circle cx="604" cy="140" r="5"/>
        <circle cx="188" cy="196" r="5"/><circle cx="612" cy="196" r="5"/>
        <circle cx="240" cy="66" r="5"/><circle cx="400" cy="66" r="5"/><circle cx="560" cy="66" r="5"/>
      </g>

      <!-- drawer of drawings, half pulled out -->
      <rect x="286" y="238" width="228" height="34" rx="4" fill="#5a6167" stroke="#14181b" stroke-width="3"/>
      <rect x="296" y="246" width="208" height="18" rx="2" fill="#cec4a8" stroke="#6b6250" stroke-width="2"/>
      <g stroke="#4a4436" stroke-width="1.2" opacity="0.8">
        <path d="M306 252 L494 252"/><path d="M306 258 L494 258"/>
      </g>
      <circle cx="400" cy="255" r="7" fill="url(#knob)" stroke="#3b2d10" stroke-width="2"/>
    </g>

    <!-- ================= CRANK & DRIVE (left side) ================= -->
    <g>
      <path d="M148 400 L92 400" stroke="#5b6268" stroke-width="9" fill="none"/>
      <circle cx="84" cy="400" r="30" fill="none" stroke="url(#drumG)" stroke-width="9"/>
      <circle cx="84" cy="400" r="8" fill="url(#knob)" stroke="#3b2d10" stroke-width="2"/>
      <path d="M84 400 L60 442" stroke="#6b7278" stroke-width="8" fill="none"/>
      <circle cx="58" cy="448" r="10" fill="url(#knob)" stroke="#3b2d10" stroke-width="2"/>
      <!-- drive belt to right -->
      <path d="M148 356 C 330 330 470 330 652 356" stroke="#3a332a" stroke-width="5" fill="none" opacity="0.85"/>
    </g>

    <!-- ================= RIGHT-SIDE DRUM / REGULATOR ================= -->
    <g>
      <path d="M652 420 L716 420" stroke="#5b6268" stroke-width="9" fill="none"/>
      <ellipse cx="740" cy="420" rx="26" ry="46" fill="url(#drumG)" stroke="#14181b" stroke-width="3"/>
      <ellipse cx="740" cy="420" rx="10" ry="20" fill="#2a2f33" opacity="0.8"/>
      <g stroke="#1d2124" stroke-width="2" opacity="0.6">
        <path d="M726 380 L726 460"/><path d="M754 380 L754 460"/>
      </g>
      <!-- pressure gauge -->
      <circle cx="700" cy="512" r="30" fill="#3b4145" stroke="url(#brass)" stroke-width="6"/>
      <circle cx="700" cy="512" r="21" fill="#e6e0cc"/>
      <path d="M700 512 L714 496" stroke="#8e2a1c" stroke-width="3"/>
      <circle cx="700" cy="512" r="3.5" fill="#333"/>
      <g stroke="#5a5548" stroke-width="2">
        <path d="M700 494 L700 499"/><path d="M718 512 L713 512"/><path d="M682 512 L687 512"/>
      </g>
      <path d="M672 528 L652 552" stroke="#8a6a24" stroke-width="6" fill="none"/>
    </g>

    <!-- ================= WATER PIPE & BUCKET LINES ================= -->
    <g>
      <path d="M92 470 C 60 520 66 590 108 620" stroke="#8a6a24" stroke-width="7" fill="none"/>
      <path d="M92 470 L148 470" stroke="#8a6a24" stroke-width="7" fill="none"/>
      <circle cx="86" cy="470" r="10" fill="url(#knob)" stroke="#3b2d10" stroke-width="2"/>
      <path d="M108 620 L148 636" stroke="#8a6a24" stroke-width="7" fill="none"/>
    </g>

  </g>
</svg>