      <!-- dome / cogwheel housing on top -->
      <path d="M330 40 C336 4 464 4 470 40 Z" fill="#6d757c" stroke="#14181b" stroke-width="3"/>
      <circle cx="400" cy="24" r="12" fill="url(#knob)" stroke="#3b2d10" stroke-width="2"/>
      <path d="M400 6 L400 -2" stroke="#6d757c" stroke-width="6"/>

      <!-- panel inset -->
      <path d="M212 96 L588 96 L610 224 L190 224 Z" fill="#2b3033" stroke="#0f1214" stroke-width="3"/>

      <!-- cogwheels visible -->
      <g>
        <g fill="none" stroke="#b9a05c" stroke-width="4">
