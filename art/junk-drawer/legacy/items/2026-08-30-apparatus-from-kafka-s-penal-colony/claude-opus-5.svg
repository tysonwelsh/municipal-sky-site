      <path d="M148 232 L232 262 M652 232 L568 262" stroke="#5c6369" stroke-width="7" fill="none"/>

      <!-- box body -->
      <path d="M188 76 L612 76 L640 240 L160 240 Z" fill="url(#ironH)" stroke="#14181b" stroke-width="4"/>
      <!-- lid -->
      <path d="M176 52 L624 52 L636 82 L164 82 Z" fill="#79818a" stroke="#14181b" stroke-width="4"/>
