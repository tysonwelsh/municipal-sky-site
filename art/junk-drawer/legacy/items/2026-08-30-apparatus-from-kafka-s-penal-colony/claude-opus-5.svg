    <g>
      <!-- suspension cables -->
      <path d="M232 262 L268 372 M568 262 L532 372" stroke="#6e757a" stroke-width="4" fill="none"/>
      <path d="M330 258 L340 372 M470 258 L460 372" stroke="#6e757a" stroke-width="4" fill="none"/>
      <!-- glass plate -->
      <path d="M236 372 L564 372 L582 470 L218 470 Z" fill="url(#glassG)" stroke="#9fb8bb" stroke-width="3"/>
      <!-- glass highlights -->
      <path d="M262 380 L330 462" stroke="#e6f2f3" stroke-width="5" opacity="0.5" fill="none"/>
      <path d="M300 380 L368 462" stroke="#e6f2f3" stroke-width="3" opacity="0.35" fill="none"/>
      <path d="M470 462 L538 380" stroke="#e6f2f3" stroke-width="4" opacity="0.4" fill="none"/>
      <!-- needle assembly seen through glass: faint lines -->
      <g stroke="#5f7376" stroke-width="1.5" opacity="0.55">
        <path d="M260 380 L560 380"/><path d="M252 402 L568 402"/>
        <path d="M244 428 L576 428"/><path d="M236 452 L584 452"/>
      </g>
      <!-- frame ribs of harrow -->
      <path d="M236 372 L564 372" stroke="#7f868c" stroke-width="8" fill="none"/>
      <path d="M218 470 L582 470" stroke="#4d545a" stroke-width="10" fill="none"/>
      <path d="M236 372 L218 470 M564 372 L582 470" stroke="#5c6369" stroke-width="8" fill="none"/>

      <!-- needle bed -->
      <path d="M218 470 L582 470 L578 496 L222 496 Z" fill="#3a4045" stroke="#1c2023" stroke-width="2"/>
