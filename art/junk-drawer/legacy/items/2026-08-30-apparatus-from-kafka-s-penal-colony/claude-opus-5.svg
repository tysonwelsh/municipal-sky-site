<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a24a"/>
      <stop offset="0.45" stop-color="#8a6a24"/>
      <stop offset="0.7" stop-color="#d8b866"/>
      <stop offset="1" stop-color="#5c4416"/>
    </linearGradient>
    <linearGradient id="ironV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e3236"/>
      <stop offset="0.35" stop-color="#6e767c"/>
      <stop offset="0.6" stop-color="#464d52"/>
      <stop offset="1" stop-color="#22262a"/>
    </linearGradient>
    <linearGradient id="ironH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#767e84"/>
      <stop offset="0.5" stop-color="#3d4348"/>
      <stop offset="1" stop-color="#1d2124"/>
    </linearGradient>
    <linearGradient id="bedG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6d5c"/>
      <stop offset="0.5" stop-color="#4a4238"/>
      <stop offset="1" stop-color="#2a251f"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#cfe4e6" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#8fb0b4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#42585c" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="drumG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f43"/>
      <stop offset="0.3" stop-color="#8b9298"/>
      <stop offset="0.55" stop-color="#565d63"/>
      <stop offset="1" stop-color="#24282b"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e2c887"/>
      <stop offset="1" stop-color="#6b5220"/>
    </radialGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- ================= LEGS / FRAME ================= -->
    <g>
      <!-- back legs -->
      <path d="M188 690 L206 872" stroke="url(#ironV)" stroke-width="17" fill="none"/>
      <path d="M612 690 L594 872" stroke="url(#ironV)" stroke-width="17" fill="none"/>
      <!-- feet -->
      <rect x="176" y="866" width="62" height="16" rx="5" fill="#33383c"/>
      <rect x="562" y="866" width="62" height="16" rx="5" fill="#33383c"/>
      <!-- front legs -->
      <path d="M150 700 L136 878" stroke="url(#ironV)" stroke-width="22" fill="none"/>
      <path d="M650 700 L664 878" stroke="url(#ironV)" stroke-width="22" fill="none"/>
      <rect x="112" y="870" width="70" height="18" rx="5" fill="#3d4348"/>
      <rect x="618" y="870" width="70" height="18" rx="5" fill="#3d4348"/>
      <!-- cross brace -->
      <path d="M146 790 L654 790" stroke="url(#ironH)" stroke-width="11" fill="none"/>
      <path d="M150 762 L650 818 M650 762 L150 818" stroke="#4b5257" stroke-width="7" fill="none" opacity="0.85"/>
      <circle cx="400" cy="790" r="14" fill="url(#knob)" stroke="#3b2d10" stroke-width="2"/>
    </g>

    <!-- ================= THE BED ================= -->
    <g>
      <!-- bed slab -->
      <path d="M120 662 L680 662 L700 712 L100 712 Z" fill="url(#bedG)" stroke="#1b1814" stroke-width="3"/>
      <rect x="120" y="640" width="560" height="26" rx="6" fill="#5e5445" stroke="#231f19" stroke-width="3"/>
      <!-- cotton wool surface -->
      <path d="M132 640 L668 640 L668 652 L132 652 Z" fill="#cbbfa6" opacity="0.55"/>
      <g fill="#d8cdb6" opacity="0.6">
        <circle cx="170" cy="643" r="9"/><circle cx="215" cy="641" r="8"/><circle cx="262" cy="644" r="9"/>
        <circle cx="310" cy="641" r="8"/><circle cx="358" cy="644" r="9"/><circle cx="406" cy="641" r="8"/>
        <circle cx="452" cy="644" r="9"/><circle cx="500" cy="641" r="8"/><circle cx="548" cy="644" r="9"/>
        <circle cx="596" cy="641" r="8"/><circle cx="638" cy="643" r="9"/>
      </g>
      <!-- straps -->
      <g fill="#4a3a26" stroke="#241b11" stroke-width="2">
        <rect x="196" y="624" width="22" height="46" rx="4"/>
        <rect x="330" y="624" width="22" height="46" rx="4"/>
        <rect x="452" y="624" width="22" height="46" rx="4"/>
        <rect x="584" y="624" width="22" height="46" rx="4"/>
      </g>
      <g fill="#b99a4d" stroke="#4b3a12" stroke-width="1.5">
        <rect x="194" y="640" width="26" height="9" rx="2"/>
        <rect x="328" y="640" width="26" height="9" rx="2"/>
        <rect x="450" y="640" width="26" height="9" rx="2"/>
        <rect x="582" y="640" width="26" height="9" rx="2"/>
      </g>
      <!-- felt gag stump -->
      <circle cx="150" cy="626" r="14" fill="#6b5a3e" stroke="#2a2118" stroke-width="3"/>
      <circle cx="150" cy="626" r="6" fill="#3a3025"/>
      <!-- gutter for blood -->
      <path d="M100 712 L700 712 L694 728 L106 728 Z" fill="#2a2520" stroke="#151311" stroke-width="2"/>
      <!-- drain pipe -->
      <path d="M400 728 L400 762" stroke="#5b5248" stroke-width="12" fill="none"/>
      <!-- rivets along bed edge -->
      <g fill="#8f8474">
        <circle cx="150" cy="690" r="4"/><circle cx="230" cy="692" r="4"/><circle cx="310" cy="693" r="4"/>
        <circle cx="400" cy="694" r="4"/><circle cx="490" cy="693" r="4"/><circle cx="570" cy="692" r="4"/>
        <circle cx="650" cy="690" r="4"/>
      </g>
    </g>

    <!-- ================= SIDE COLUMNS (brass rods) ================= -->
    <g>
      <path d="M148 232 L148 646" stroke="url(#brass)" stroke-width="18" fill="none"/>
      <path d="M652 232 L652 646" stroke="url(#brass)" stroke-width="18" fill="none"/>
      <path d="M186 262 L186 632" stroke="url(#brass)" stroke-width="10" fill="none" opacity="0.85"/>
      <path d="M614 262 L614 632" stroke="url(#brass)" stroke-width="10" fill="none" opacity="0.85"/>
