  <circle cx="161.1" cy="367.5" r="6" fill="url(#goldRadial)" stroke="#6b4e10" stroke-width="1"/>
  <circle cx="161.1" cy="268.5" r="6" fill="url(#goldRadial)" stroke="#6b4e10" stroke-width="1"/>
  <circle cx="238.9" cy="268.5" r="6" fill="url(#goldRadial)" stroke="#6b4e10" stroke-width="1"/>

