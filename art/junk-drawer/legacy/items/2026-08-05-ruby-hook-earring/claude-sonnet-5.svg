  <line x1="222" y1="318" x2="252" y2="318" stroke="#ffffff" stroke-width="0.8" opacity="0.35"/>
  <line x1="215.6" y1="339.2" x2="236.76" y2="366.08" stroke="#ffffff" stroke-width="0.8" opacity="0.35"/>
