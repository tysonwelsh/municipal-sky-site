    <circle cx="200" cy="236" r="2"/><circle cx="220.4" cy="240" r="2"/><circle cx="238.8" cy="251.7" r="2"/>
    <circle cx="253.4" cy="269.8" r="2"/><circle cx="262.8" cy="292.7" r="2"/>
