  <use href="#diamond" xlink:href="#diamond" x="236.7" y="235.6" width="16" height="16"/>
  <use href="#diamond" xlink:href="#diamond" x="253.5" y="255.9" width="16" height="16"/>
  <use href="#diamond" xlink:href="#diamond" x="264.3" y="281.6" width="16" height="16"/>

  <!-- pendant drop -->
  <ellipse cx="200" cy="412" rx="9" ry="7" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <line x1="200" y1="418" x2="200" y2="435" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="200" cy="440" rx="8" ry="6" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>

  <path d="M183,470 C165,462 155,470 158,485" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
  <path d="M217,470 C235,462 245,470 242,485" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>

  <ellipse cx="200" cy="470" rx="17" ry="23" fill="url(#rubyGrad)" stroke="#4a0010" stroke-width="1.2"/>
  <ellipse cx="200" cy="470" rx="7" ry="10" fill="none" stroke="#ffb3c0" stroke-width="0.8" opacity="0.5"/>

