<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6d5"/>
      <stop offset="30%" stop-color="#f0d27a"/>
      <stop offset="60%" stop-color="#c8971f"/>
      <stop offset="100%" stop-color="#7a5a12"/>
    </linearGradient>
    <radialGradient id="goldRadial" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff9e0"/>
      <stop offset="45%" stop-color="#e8c766"/>
      <stop offset="100%" stop-color="#8a6914"/>
    </radialGradient>
    <radialGradient id="rubyGrad" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffd6d6"/>
      <stop offset="18%" stop-color="#ff5a72"/>
      <stop offset="55%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#530014"/>
    </radialGradient>
    <radialGradient id="diaGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#dcefff"/>
      <stop offset="100%" stop-color="#9fc3e0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <symbol id="diamond" viewBox="-10 -10 20 20">
      <circle r="9" fill="url(#diaGrad)" stroke="#ffffff" stroke-width="0.4"/>
      <polygon points="0,-9 2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5" fill="none" stroke="#cfe9ff" stroke-width="0.3" opacity="0.6"/>
      <circle r="3.2" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.8"/>
    </symbol>
  </defs>

  <!-- earwire -->
  <path d="M200,8 C165,8 148,32 152,56 C156,82 188,82 194,108 C200,132 182,148 191,168 L191,214" stroke="url(#goldGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="200" cy="8" r="4" fill="url(#goldRadial)"/>
  <ellipse cx="196" cy="222" rx="12" ry="9" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>

  <!-- filigree wings -->
  <path d="M100,300 C90,280 95,258 115,255" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M134,318 C95,298 75,255 45,268 C18,280 14,312 42,322 C58,328 68,308 52,298" stroke="url(#goldGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="298" r="4" fill="url(#goldRadial)"/>
  <use href="#diamond" xlink:href="#diamond" x="36" y="278" width="13" height="13"/>

