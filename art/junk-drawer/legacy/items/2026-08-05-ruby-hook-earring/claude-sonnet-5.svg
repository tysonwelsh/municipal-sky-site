    <circle cx="238.8" cy="384.3" r="2"/><circle cx="220.4" cy="396" r="2"/><circle cx="200" cy="400" r="2"/>
    <circle cx="179.6" cy="396" r="2"/><circle cx="161.2" cy="384.3" r="2"/><circle cx="146.6" cy="366.2" r="2"/>
    <circle cx="137.2" cy="343.3" r="2"/><circle cx="134" cy="318" r="2"/><circle cx="137.2" cy="292.7" r="2"/>
