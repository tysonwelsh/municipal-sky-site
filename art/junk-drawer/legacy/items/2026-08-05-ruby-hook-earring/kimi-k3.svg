<svg xmlns="http://www.w3.org/2000/svg" viewBox="115.5 21.5 195.0 440.0">
  <defs>
    <radialGradient id="gold" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#f9e7a1"/>
      <stop offset="45%" stop-color="#e0b84a"/>
      <stop offset="80%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8a5f10"/>
    </radialGradient>
    <linearGradient id="goldWire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8761a"/>
      <stop offset="50%" stop-color="#f3d878"/>
      <stop offset="100%" stop-color="#a8761a"/>
    </linearGradient>
    <radialGradient id="ruby" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#ff7a8f"/>
      <stop offset="30%" stop-color="#e01040"/>
      <stop offset="70%" stop-color="#9a0028"/>
      <stop offset="100%" stop-color="#5c0018"/>
    </radialGradient>
    <radialGradient id="diamond" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#dfeaf4"/>
      <stop offset="100%" stop-color="#9fb4c8"/>
    </radialGradient>
  </defs>

  <!-- hook -->
  <path d="M236 130 C236 62 206 30 172 30 C142 30 124 52 124 78 C124 100 138 114 156 114"
        fill="none" stroke="url(#goldWire)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="156" cy="116" r="8" fill="url(#gold)"/>
  <circle cx="234" cy="126" r="10" fill="url(#gold)"/>

  <!-- connector link -->
  <ellipse cx="236" cy="150" rx="10" ry="15" fill="none" stroke="url(#goldWire)" stroke-width="7"/>

  <!-- basket gallery (filigree) -->
  <path d="M176 210 Q236 168 296 210 L286 250 Q236 226 186 250 Z" fill="url(#gold)"/>
  <path d="M192 214 L208 240 M224 200 L232 234 M256 200 L250 234 M282 214 L264 240"
        stroke="#7a5a10" stroke-width="3" fill="none"/>
  <circle cx="236" cy="206" r="5" fill="#f3d878"/>

  <!-- diamond halo -->
  <g>
    <ellipse cx="236" cy="258" rx="9" ry="9" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="210" cy="264" rx="8.5" ry="8.5" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="262" cy="264" rx="8.5" ry="8.5" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="188" cy="278" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="284" cy="278" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="176" cy="300" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="296" cy="300" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="172" cy="325" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="300" cy="325" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="176" cy="350" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="296" cy="350" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="188" cy="372" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="284" cy="372" rx="8" ry="8" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="210" cy="386" rx="8.5" ry="8.5" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="262" cy="386" rx="8.5" ry="8.5" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
    <ellipse cx="236" cy="392" rx="9" ry="9" fill="url(#diamond)" stroke="#8a6a18" stroke-width="1.5"/>
  </g>
  <!-- diamond sparkles -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
    <path d="M188 274 v8 M184 278 h8"/>
    <path d="M296 346 v8 M292 350 h8"/>
    <path d="M262 260 v8 M258 264 h8"/>
  </g>

  <!-- gold bezel around ruby -->
  <ellipse cx="236" cy="325" rx="62" ry="82" fill="url(#gold)"/>
  <ellipse cx="236" cy="325" rx="56" ry="76" fill="none" stroke="#8a5f10" stroke-width="2.5"/>

  <!-- ruby -->
  <ellipse cx="236" cy="325" rx="52" ry="72" fill="url(#ruby)"/>
  <!-- facets -->
  <ellipse cx="236" cy="325" rx="30" ry="44" fill="#c40032" opacity="0.85"/>
  <path d="M236 253 L262 300 L236 397 L210 300 Z" fill="#ff5f7c" opacity="0.35"/>
  <path d="M186 300 L236 281 L286 300 L236 325 Z" fill="#ff8fa2" opacity="0.3"/>
  <path d="M186 350 L236 369 L286 350 L236 325 Z" fill="#7a001e" opacity="0.4"/>
  <ellipse cx="215" cy="292" rx="12" ry="18" fill="#ffffff" opacity="0.45" transform="rotate(-20 215 292)"/>
  <ellipse cx="236" cy="325" rx="52" ry="72" fill="none" stroke="#4d0013" stroke-width="2"/>

  <!-- bottom filigree drop -->
  <path d="M236 412 C228 424 228 434 236 442 C244 434 244 424 236 412 Z" fill="url(#gold)"/>
  <circle cx="236" cy="452" r="7" fill="url(#gold)" stroke="#8a5f10" stroke-width="1.5"/>
</svg>