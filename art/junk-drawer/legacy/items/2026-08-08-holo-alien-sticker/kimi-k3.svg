<svg xmlns="http://www.w3.org/2000/svg" viewBox="27.8 12.0 344.0 433.8">
  <defs>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9fb8d8"/>
      <stop offset="18%" stop-color="#c8e6e0"/>
      <stop offset="35%" stop-color="#a8d4c2"/>
      <stop offset="50%" stop-color="#d8e4f0"/>
      <stop offset="65%" stop-color="#b4ccc4"/>
      <stop offset="82%" stop-color="#c0d8e8"/>
      <stop offset="100%" stop-color="#94aecf"/>
    </linearGradient>
    <linearGradient id="holoSheen" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="30%" stop-color="#e8fff8" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="80%" stop-color="#dff0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="irid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7fe3c8" stop-opacity="0.0"/>
      <stop offset="25%" stop-color="#8fd8ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c8b8f0" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#a8f0d8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9fd0f0" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="eye" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3a3f4a"/>
      <stop offset="45%" stop-color="#15181f"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="50%" stop-color="#a8c4d4"/>
      <stop offset="100%" stop-color="#6f8ba3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- sticker border / die-cut edge -->
  <path d="M200 14
           C 96 14 30 92 30 176
           C 30 246 74 310 128 356
           C 162 385 184 414 200 444
           C 216 414 238 385 272 356
           C 326 310 370 246 370 176
           C 370 92 304 14 200 14 Z"
        fill="url(#rim)"/>

  <!-- head fill -->
  <path d="M200 26
           C 104 26 42 98 42 176
           C 42 240 83 301 134 345
           C 166 372 188 400 200 426
           C 212 400 234 372 266 345
           C 317 301 358 240 358 176
           C 358 98 296 26 200 26 Z"
        fill="url(#holo)"/>

  <!-- iridescent shimmer layers -->
  <path d="M200 26
           C 104 26 42 98 42 176
           C 42 240 83 301 134 345
           C 166 372 188 400 200 426
           C 212 400 234 372 266 345
           C 317 301 358 240 358 176
           C 358 98 296 26 200 26 Z"
        fill="url(#irid)"/>

  <!-- holofoil sparkle bands -->
  <g opacity="0.5" filter="url(#soft)">
    <path d="M55 130 Q 200 80 345 140 Q 200 118 55 130 Z" fill="#ffffff" opacity="0.55"/>
    <path d="M70 250 Q 200 300 330 240 Q 200 268 70 250 Z" fill="#b8ffe8" opacity="0.5"/>
    <path d="M120 340 Q 200 380 285 330 Q 200 356 120 340 Z" fill="#cfe0ff" opacity="0.5"/>
  </g>

  <!-- star sparkles -->
  <g fill="#ffffff">
    <path d="M110 90 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 Z" opacity="0.9"/>
    <path d="M300 120 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 Z" opacity="0.85"/>
    <path d="M265 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity="0.75"/>
    <path d="M95 210 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 Z" opacity="0.8"/>
    <path d="M200 60 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z" opacity="0.9"/>
    <path d="M150 370 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 Z" opacity="0.6"/>
  </g>

  <!-- tiny dots -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="140" cy="150" r="2.2"/>
    <circle cx="255" cy="95" r="1.8"/>
    <circle cx="318" cy="205" r="2"/>
    <circle cx="82" cy="290" r="1.8"/>
    <circle cx="230" cy="360" r="1.6"/>
    <circle cx="175" cy="255" r="1.5"/>
  </g>

  <!-- left eye -->
  <g transform="rotate(18 130 215)">
    <ellipse cx="130" cy="215" rx="52" ry="72" fill="url(#eye)"/>
    <ellipse cx="114" cy="188" rx="14" ry="20" fill="#ffffff" opacity="0.28"/>
    <ellipse cx="145" cy="245" rx="7" ry="10" fill="#9fd8e8" opacity="0.18"/>
  </g>
  <!-- right eye -->
  <g transform="rotate(-18 270 215)">
    <ellipse cx="270" cy="215" rx="52" ry="72" fill="url(#eye)"/>
    <ellipse cx="254" cy="188" rx="14" ry="20" fill="#ffffff" opacity="0.28"/>
    <ellipse cx="285" cy="245" rx="7" ry="10" fill="#9fd8e8" opacity="0.18"/>
  </g>

  <!-- nostrils -->
  <ellipse cx="188" cy="330" rx="4" ry="7" fill="#4a5a66" opacity="0.7" transform="rotate(-12 188 330)"/>
  <ellipse cx="212" cy="330" rx="4" ry="7" fill="#4a5a66" opacity="0.7" transform="rotate(12 212 330)"/>

  <!-- mouth hint -->
  <path d="M180 372 Q 200 380 220 372" stroke="#5a6e7a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- top sheen -->
  <path d="M200 26
           C 104 26 42 98 42 176
           C 42 240 83 301 134 345
           C 166 372 188 400 200 426
           C 212 400 234 372 266 345
           C 317 301 358 240 358 176
           C 358 98 296 26 200 26 Z"
        fill="url(#holoSheen)"/>
</svg>