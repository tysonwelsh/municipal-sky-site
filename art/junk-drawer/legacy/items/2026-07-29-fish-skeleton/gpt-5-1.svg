<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80">
  <defs>
    <linearGradient id="boneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfd"/>
      <stop offset="1" stop-color="#d0d4dc"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a0c9ff"/>
      <stop offset="1" stop-color="#4e7bcf"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89b5fb"/>
      <stop offset="1" stop-color="#32579e"/>
    </linearGradient>
  </defs>

  <!-- Spine: slightly curved -->
  <path d="M10 50
           C45 30, 85 25, 130 30
           S190 40, 210 25"
        fill="none"
        stroke="url(#boneGrad)"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- Ribs along the curve -->
  <g stroke="url(#boneGrad)" stroke-width="4" stroke-linecap="round">
    <!-- Use short rib lines angled off the spine -->
    <path d="M18 46 L10 36"/>
    <path d="M28 43 L19 32"/>
    <path d="M40 40 L30 28"/>
    <path d="M52 37 L40 25"/>
    <path d="M64 35 L50 22"/>
    <path d="M77 33 L61 20"/>
    <path d="M90 32 L72 19"/>
    <path d="M103 31 L84 18"/>
    <path d="M117 31 L96 18"/>
    <path d="M131 32 L109 20"/>
    <path d="M145 34 L121 23"/>
    <path d="M160 35 L135 25"/>
    <path d="M175 36 L148 27"/>
    <path d="M190 36 L162 28"/>
  </g>

  <!-- Tail bones -->
  <g stroke="url(#boneGrad)" stroke-width="5" stroke-linecap="round">
    <line x1="205" y1="26" x2="213" y2="16"/>
    <line x1="205" y1="26" x2="214" y2="34"/>
  </g>

  <!-- Head base -->
  <path d="M12 56
           Q5 44, 9 32
           Q17 14, 38 9
           Q60 4, 78 13
           Q94 21, 98 33
           Q102 45, 96 55
           Q86 71, 65 75
           Q40 80, 24 71
           Q16 67, 12 56Z"
        fill="url(#headGrad)"
        stroke="#24406f"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Mouth line -->
  <path d="M21 53
           Q32 59, 46 57"
        fill="none"
        stroke="#1a2c4a"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Top fin -->
  <path d="M42 9
           Q43 -2, 51 -2
           Q63 0, 69 9
           Q57 9, 42 9Z"
        fill="url(#finGrad)"
        stroke="#24406f"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Side gill line -->
  <path d="M38 38
           Q30 34, 24 36"
        fill="none"
        stroke="#1a2c4a"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- X eyes -->
  <g stroke="#1a1a1f" stroke-width="2.2" stroke-linecap="round">
    <line x1="33" y1="30" x2="41" y2="22"/>
    <line x1="33" y1="22" x2="41" y2="30"/>
  </g>

  <!-- Cheek line for cartoony feel -->
  <path d="M30 45
           Q27 43, 25 42"
        fill="none"
        stroke="#1a2c4a"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Head highlight -->
  <path d="M24 20
           Q39 11, 58 13
           Q46 16, 34 24
           Q28 27, 24 20Z"
        fill="white"
        opacity="0.25"/>

  <!-- Bone shine -->
  <path d="M13 48
           C44 29, 84 24, 130 29
           S188 38, 207 23"
        fill="none"
        stroke="white"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.45"/>
</svg>