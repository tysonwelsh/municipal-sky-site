<svg xmlns="http://www.w3.org/2000/svg" viewBox="26.0 20.0 773.8 691.8">
  <defs>
    <clipPath id="earthClip">
      <circle cx="330" cy="470" r="235"/>
    </clipPath>
    <clipPath id="rockClip">
      <path d="M560 130 L640 100 L710 140 L735 215 L700 285 L620 315 L545 285 L515 210 Z"/>
    </clipPath>
  </defs>

  <!-- confetti squiggles -->
  <g stroke="#ffb26b" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M60 120 q20 -25 40 0 q20 25 40 0"/>
    <path d="M640 640 q20 -25 40 0 q20 25 40 0"/>
  </g>
  <g fill="#8fd6c4">
    <circle cx="120" cy="600" r="13"/>
    <circle cx="60" cy="330" r="9"/>
    <circle cx="740" cy="430" r="11"/>
    <circle cx="470" cy="70" r="10"/>
  </g>
  <g fill="#ff7f7a">
    <rect x="30" y="470" width="22" height="22" rx="5" transform="rotate(25 41 481)"/>
    <rect x="720" y="560" width="20" height="20" rx="5" transform="rotate(-20 730 570)"/>
    <rect x="180" y="60" width="18" height="18" rx="5" transform="rotate(15 189 69)"/>
  </g>

  <!-- motion trail -->
  <g stroke="#ffd166" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M760 60 L690 130"/>
    <path d="M700 30 L648 82"/>
    <path d="M790 140 L730 195"/>
  </g>

  <!-- EARTH -->
  <g>
    <circle cx="330" cy="470" r="235" fill="#4f9dd9"/>
    <g clip-path="url(#earthClip)">
      <circle cx="330" cy="470" r="235" fill="none"/>
      <!-- continents -->
      <path d="M150 330 q70 -20 110 20 q40 40 10 80 q-30 40 -90 30 q-60 -10 -70 -60 q-8 -50 40 -70 Z" fill="#63c9a2"/>
      <path d="M300 300 q80 -30 130 10 q45 38 10 70 q-40 36 -100 20 q-55 -15 -40 -100 Z" fill="#63c9a2"/>
      <path d="M200 520 q90 -30 140 20 q45 48 0 100 q-50 55 -120 30 q-65 -25 -55 -85 q6 -45 35 -65 Z" fill="#63c9a2"/>
      <path d="M420 500 q70 -15 90 40 q18 55 -35 85 q-50 28 -80 -15 q-28 -42 25 -110 Z" fill="#63c9a2"/>
      <!-- highlight -->
      <path d="M95 470 a235 235 0 0 1 235 -235 a180 235 0 0 0 -180 235 a180 235 0 0 0 180 235 a235 235 0 0 1 -235 -235 Z" fill="#ffffff" opacity="0.18"/>
    </g>
    <circle cx="330" cy="470" r="235" fill="none" stroke="#2f3e5c" stroke-width="10"/>
  </g>

  <!-- IMPACT BURST behind rock -->
  <g transform="translate(560,275)">
    <g fill="#ffd166" stroke="#2f3e5c" stroke-width="8" stroke-linejoin="round">
      <path d="M0 0 L58 -18 L34 26 L92 34 L28 60 L60 104 L2 86 L-14 140 L-40 84 L-88 108 L-72 52 L-130 44 L-80 12 L-116 -34 L-56 -30 L-52 -84 L-14 -46 Z"/>
    </g>
    <g fill="#ff7f7a" stroke="#2f3e5c" stroke-width="7" stroke-linejoin="round">
      <path d="M0 6 L40 -6 L26 26 L64 40 L22 56 L36 86 L-2 72 L-16 104 L-36 68 L-70 82 L-58 44 L-96 34 L-60 14 L-82 -18 L-42 -18 L-38 -52 Z"/>
    </g>
  </g>

  <!-- ASTEROID -->
  <g>
    <path d="M560 130 L640 100 L710 140 L735 215 L700 285 L620 315 L545 285 L515 210 Z" fill="#8b7fa8"/>
    <g clip-path="url(#rockClip)">
      <path d="M515 210 L620 190 L735 215 L735 320 L515 320 Z" fill="#6d6190" opacity="0.65"/>
      <circle cx="600" cy="170" r="26" fill="#a99ac2"/>
      <circle cx="680" cy="230" r="18" fill="#a99ac2"/>
      <circle cx="580" cy="255" r="14" fill="#a99ac2"/>
      <circle cx="700" cy="160" r="11" fill="#a99ac2"/>
    </g>
    <path d="M560 130 L640 100 L710 140 L735 215 L700 285 L620 315 L545 285 L515 210 Z" fill="none" stroke="#2f3e5c" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- impact sparks over -->
  <g stroke="#2f3e5c" stroke-width="8" stroke-linecap="round">
    <path d="M470 340 L440 372"/>
    <path d="M690 350 L716 384"/>
    <path d="M600 400 L604 442"/>
  </g>
  <circle cx="428" cy="272" r="12" fill="#ff7f7a" stroke="#2f3e5c" stroke-width="7"/>
  <circle cx="742" cy="318" r="10" fill="#ffd166" stroke="#2f3e5c" stroke-width="7"/>
</svg>