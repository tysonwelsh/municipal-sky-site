<svg xmlns="http://www.w3.org/2000/svg" viewBox="20.8 -2.0 278.2 803.8">
  <defs>
    <linearGradient id="shaftGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b534f"/>
      <stop offset="0.5" stop-color="#145a7a"/>
      <stop offset="1" stop-color="#0e6655"/>
    </linearGradient>
    <linearGradient id="eyeOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ecc71"/>
      <stop offset="0.5" stop-color="#27ae60"/>
      <stop offset="1" stop-color="#1e8449"/>
    </linearGradient>
    <radialGradient id="eyeRing" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f1c40f"/>
      <stop offset="0.55" stop-color="#f39c12"/>
      <stop offset="1" stop-color="#d68910"/>
    </radialGradient>
    <radialGradient id="eyeBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3498db"/>
      <stop offset="0.6" stop-color="#21618c"/>
      <stop offset="1" stop-color="#154360"/>
    </radialGradient>
    <radialGradient id="eyeCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1c2833"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </radialGradient>
    <filter id="pencilSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="4" stitchTiles="noStitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.5
                0 0 0 0 0.55
                0 0 0 0.45 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply" result="textured"/>
    </filter>
    <filter id="pencilSoftLight" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="3" stitchTiles="noStitch" result="noise2"/>
      <feColorMatrix in="noise2" type="matrix"
        values="0 0 0 0 0.7
                0 0 0 0 0.7
                0 0 0 0 0.75
                0 0 0 0.3 0" result="grain2"/>
      <feBlend in="SourceGraphic" in2="grain2" mode="soft-light"/>
    </filter>
    <linearGradient id="shaftHighlight" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a9dfbf" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#76d7c4" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#1abc9c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Main shaft with subtle left curve -->
  <g filter="url(#pencilSoft)">
    <path d="M165 790
             C150 620 148 480 152 350
             C156 240 165 155 172 70
             C175 35 176 18 176 10"
          fill="none"
          stroke="url(#shaftGrad)"
          stroke-width="5"
          stroke-linecap="round"/>
    <path d="M166.5 790
             C153 620 151 485 155 355
             C160 245 169 158 176 72
             C179 40 180 20 180 10"
          fill="none"
          stroke="url(#shaftHighlight)"
          stroke-width="2.1"
          stroke-linecap="round"
          stroke-opacity="0.9"/>
  </g>

  <!-- Fine cross-hatching on shaft for pencil texture -->
  <g stroke="#0e6251" stroke-width="0.6" stroke-linecap="round" opacity="0.5">
    <path d="M160 720 C150 705 150 690 160 675"/>
    <path d="M170 685 C160 670 160 655 170 640"/>
    <path d="M162 645 C152 630 152 615 162 600"/>
    <path d="M172 610 C162 595 162 580 172 565"/>
