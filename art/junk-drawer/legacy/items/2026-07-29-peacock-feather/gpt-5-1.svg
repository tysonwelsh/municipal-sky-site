        <path d="M0 58 C-32 38 -58 13 -73 -19"/>
        <path d="M0 56 C-24 36 -46 16 -58 -12"/>
        <path d="M0 54 C-16 34 -34 19 -42 -6"/>
        <path d="M0 52 C-8 32 -22 21 -27 0"/>
        <path d="M0 50 C0 31 -10 22 -13 4"/>
        <path d="M0 52 C8 32 22 21 27 0"/>
        <path d="M0 54 C16 34 34 19 42 -6"/>
        <path d="M0 56 C24 36 46 16 58 -12"/>
        <path d="M0 58 C32 38 58 13 73 -19"/>
        <path d="M0 60 C40 40 70 10 88 -25"/>
