      <path d="M178 710 C205 695 222 673 228 651"/>
      <path d="M180 680 C208 665 224 645 230 625"/>
      <path d="M182 650 C211 636 228 617 234 598"/>
      <path d="M184 620 C213 607 231 589 238 571"/>
      <path d="M186 590 C215 578 233 561 241 543"/>
      <path d="M188 560 C217 549 236 533 244 517"/>
      <path d="M190 530 C219 520 238 505 247 491"/>
