      <ellipse cx="0" cy="-34" rx="21" ry="25" fill="url(#eyeRing)" stroke="#b9770e" stroke-width="1.2"/>
      <ellipse cx="0" cy="-34" rx="13" ry="16.5" fill="url(#eyeBlue)" stroke="#1b4f72" stroke-width="1.1"/>
      <ellipse cx="0" cy="-34" rx="6" ry="7.5" fill="url(#eyeCore)"/>
      <ellipse cx="3.5" cy="-36.8" rx="2.4" ry="3.2" fill="#fdfefe" opacity="0.85"/>
    </g>

    <!-- Right-mid eye -->
    <g transform="translate(30 -2) scale(0.93)">
      <path d="M0 -60
               C-30 -40 -42 -10 -27 15
               C-12 40 12 40 27 15
               C42 -10 30 -40 0 -60Z"
            fill="url(#eyeOuter)" stroke="#0e6251" stroke-width="1.4"/>
      <ellipse cx="0" cy="-30" rx="18.5" ry="22.5" fill="url(#eyeRing)" stroke="#b9770e" stroke-width="1"/>
      <ellipse cx="0" cy="-30" rx="11.2" ry="14.5" fill="url(#eyeBlue)" stroke="#1b4f72" stroke-width="0.95"/>
