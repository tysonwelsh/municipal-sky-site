        <path d="M0 60 C-37 41 -66 15 -83 -21"/>
        <path d="M0 58 C-29 39 -52 18 -68 -15"/>
        <path d="M0 56 C-21 37 -38 21 -52 -9"/>
        <path d="M0 54 C-13 35 -24 23 -36 -2"/>
        <path d="M0 54 C13 35 24 23 36 -2"/>
        <path d="M0 56 C21 37 38 21 52 -9"/>
        <path d="M0 58 C29 39 52 18 68 -15"/>
        <path d="M0 60 C37 41 66 15 83 -21"/>
        <path d="M0 62 C45 43 80 12 98 -27"/>
      </g>
    </g>

    <!-- Multiple eyes arranged in a slight arc -->
    <!-- Left outer eye -->
    <g transform="translate(-60 10) scale(0.9)">
      <path d="M0 -60
               C-30 -40 -40 -10 -25 15
               C-10 40 10 40 25 15
               C40 -10 30 -40 0 -60Z"
            fill="url(#eyeOuter)" stroke="#0e6251" stroke-width="1.4"/>
      <ellipse cx="0" cy="-30" rx="18" ry="22" fill="url(#eyeRing)" stroke="#b9770e" stroke-width="1"/>
      <ellipse cx="0" cy="-30" rx="11" ry="14" fill="url(#eyeBlue)" stroke="#1b4f72" stroke-width="0.9"/>
      <ellipse cx="0" cy="-30" rx="5" ry="6.5" fill="url(#eyeCore)"/>
      <ellipse cx="3" cy="-32.5" rx="2.2" ry="2.8" fill="#fdfefe" opacity="0.75"/>
    </g>

    <!-- Left-mid eye -->
