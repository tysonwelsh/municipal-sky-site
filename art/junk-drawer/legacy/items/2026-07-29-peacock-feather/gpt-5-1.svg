      <ellipse cx="0" cy="-32" rx="19" ry="23" fill="url(#eyeRing)" stroke="#b9770e" stroke-width="1.1"/>
      <ellipse cx="0" cy="-32" rx="12" ry="15" fill="url(#eyeBlue)" stroke="#1b4f72" stroke-width="1"/>
