      <path d="M214 170 C243 172 262 169 271 168"/>
      <path d="M216 140 C245 143 264 140 273 140"/>
    </g>

    <!-- Extra fine overlay strokes for colored-pencil feel -->
    <g stroke-width="0.6" opacity="0.7" stroke-linecap="round">
      <g stroke="#2e86c1">
        <path d="M155 705 C133 690 118 670 112 653"/>
        <path d="M153 675 C130 660 116 642 110 626"/>
        <path d="M151 645 C128 631 113 614 107 599"/>
