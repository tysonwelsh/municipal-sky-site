      <ellipse cx="2.4" cy="-26.7" rx="1.6" ry="2.1" fill="#fdfefe" opacity="0.8"/>
    </g>

    <!-- Subtle pencil-like directional hatching inside eyes -->
    <g stroke="#154360" stroke-width="0.6" stroke-linecap="round" opacity="0.5">
