<svg xmlns="http://www.w3.org/2000/svg" viewBox="50.0 58.0 308.8 123.5">
  <defs>
    <linearGradient id="truckBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="0.5" stop-color="#777"/>
      <stop offset="1" stop-color="#4d4d4d"/>
    </linearGradient>
    <linearGradient id="cabGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#707070"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b56b3a"/>
      <stop offset="0.5" stop-color="#804220"/>
      <stop offset="1" stop-color="#d18a4e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d0e4f2"/>
      <stop offset="0.4" stop-color="#9eb8cf"/>
      <stop offset="1" stop-color="#6c8091"/>
    </linearGradient>
    <linearGradient id="block" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f2f2"/>
      <stop offset="1" stop-color="#b3b3b3"/>
    </linearGradient>
    <linearGradient id="undercarriage" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f1f1f"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>

  <!-- Truck bed -->
  <g id="truck">
    <path d="M70 110h230c10 0 18 8 18 18v32H52v-32c0-10 8-18 18-18z" fill="url(#truckBody)"/>
    <!-- Bed side panel with rust -->
    <path d="M90 112h115v32H90z" fill="none" stroke="#2f2f2f" stroke-width="2"/>
    <path d="M90 112h115v7c-14 4-30 7-52 8-18 1-41 0-63-4z" fill="#6c6c6c" opacity="0.7"/>
    <path d="M96 120c10-4 18-5 24-3 5 2 4 6-1 9-7 4-16 6-25 6 0 0 3-9 2-12z" fill="url(#rust)" opacity="0.95"/>
    <path d="M140 135c8-4 15-5 20-3 4 2 4 5 0 9-5 4-12 7-20 8 0 0 1-10 0-14z" fill="url(#rust)" opacity="0.9"/>
    <path d="M188 121c7-3 11-2 13 1 2 3 0 6-4 8-5 3-11 4-18 4 0 0 5-9 9-13z" fill="url(#rust)" opacity="0.9"/>

    <!-- Rear panel -->
    <path d="M70 110c-6 0-10 4-10 10v40h12v-42c0-3 1-5 3-8z" fill="#515151"/>
    <circle cx="68" cy="143" r="3.2" fill="#d54a3a"/>

    <!-- Frame / undercarriage -->
    <path d="M65 160h265v9c0 3-2 5-5 5H70c-3 0-5-2-5-5z" fill="url(#undercarriage)"/>

    <!-- Exposed wheel wells (no wheels) -->
    <path d="M102 150c0-10 8-18 18-18s18 8 18 18" fill="none" stroke="#1e1e1e" stroke-width="5" stroke-linecap="round"/>
    <path d="M210 150c0-10 8-18 18-18s18 8 18 18" fill="none" stroke="#1e1e1e" stroke-width="5" stroke-linecap="round"/>

    <!-- Cinder blocks front -->
    <g>
      <path d="M108 152h25v26h-25z" fill="url(#block)" stroke="#999" stroke-width="1.2"/>
      <path d="M118 158h7v7h-7zM108 158h7v7h-7zM126 168h7v7h-7zM116 168h7v7h-7z" fill="#dcdcdc" stroke="#b5b5b5" stroke-width="0.6"/>
      <path d="M108 152h25v4h-25z" fill="#e8e8e8" opacity="0.8"/>
    </g>

    <!-- Cinder blocks rear -->
    <g>
      <path d="M218 152h25v26h-25z" fill="url(#block)" stroke="#999" stroke-width="1.2"/>
      <path d="M228 158h7v7h-7zM218 158h7v7h-7zM236 168h7v7h-7zM226 168h7v7h-7z" fill="#dcdcdc" stroke="#b5b5b5" stroke-width="0.6"/>
      <path d="M218 152h25v4h-25z" fill="#e8e8e8" opacity="0.8"/>
    </g>

    <!-- Cab -->
    <g>
      <path d="M210 60h80c6 0 11 2 15 6l16 18c5 6 7 10 7 20v56h-84V96c0-5-2-9-5-12l-18-19c-3-3-7-5-11-5z" fill="url(#cabGradient)"/>
      <!-- Windshield -->
      <path d="M230 62h44c5 0 9 2 12 5l18 19c3 3 5 7 5 11v13h-72c-3 0-5-2-5-5V69c0-3 2-7 3-7z" fill="url(#glass)"/>
      <path d="M233 64c0 0 14 3 26 3 15 0 29-3 29-3" fill="none" stroke="#f5fbff" stroke-width="2" opacity="0.8"/>

      <!-- Side window -->
      <path d="M276 78h22c3 0 6 1 8 3l9 9c2 2 3 4 3 7v14h-42c-2 0-4-2-4-4V82c0-2 2-4 4-4z" fill="#c1d7e7"/>

      <!-- Door outline -->
      <path d="M262 76h28c4 0 7 1 10 4l12 12c3 3 4 7 4 11v41h-54z" fill="none" stroke="#3b3b3b" stroke-width="2"/>

      <!-- Door handle -->
      <rect x="280" y="108" width="14" height="4" rx="1.5" fill="#d9d9d9"/>
      <rect x="281" y="109" width="9" height="2" rx="1" fill="#7b7b7b"/>

      <!-- Mirror -->
      <g>
        <rect x="305" y="84" width="10" height="16" rx="2" fill="#cfd7df" stroke="#555" stroke-width="1.2"/>
        <rect x="306" y="86" width="8" height="6" rx="1" fill="#e7f0f8"/>
        <path d="M305 92h10" stroke="#a6a6a6" stroke-width="0.8"/>
        <path d="M306 86c0 0 3 1 4 1 1 0 4-1 4-1" stroke="#f7fbff" stroke-width="0.7" opacity="0.9"/>
        <path d="M305 92l-12 7" stroke="#323232" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Headlight area -->
      <path d="M310 110h32c6 0 10 4 10 10v28h-42z" fill="#555"/>
      <rect x="315" y="117" width="13" height="10" rx="2" fill="#f8f3d2" stroke="#b9b089" stroke-width="1"/>
      <rect x="331" y="120" width="8" height="7" rx="1.5" fill="#f3a54a" stroke="#c27b32" stroke-width="0.8"/>

      <!-- Grille -->
      <g fill="#d4d4d4" stroke="#8a8a8a" stroke-width="0.8">
        <rect x="316" y="132" width="20" height="2.5" rx="1.2"/>
        <rect x="316" y="137" width="20" height="2.5" rx="1.2"/>
        <rect x="316" y="142" width="20" height="2.5" rx="1.2"/>
      </g>

      <!-- Front bumper damaged -->
      <path d="M292 152h56c5 0 9 3 9 8v4h-63c-5 0-9-4-9-9z" fill="#3b3b3b"/>
      <path d="M292 152c6 2 14 3 22 3 11 0 22-2 34-6 0 0-3 9-6 11-4 3-10 4-16 4h-34z" fill="#2a2a2a"/>
      <path d="M296 151c0 0 3 4 4 7" stroke="#868686" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Hood with rust -->
      <path d="M246 90h59c6 0 12 2 16 6l8 8c2 2 3 4 4 7h-81c-3 0-5-2-5-5v-11c0-3 1-4 3-5z" fill="#666"/>
      <path d="M248 92c8 4 22 8 37 8 17 0 30-4 38-8" fill="none" stroke="#7d7d7d" stroke-width="1.6" opacity="0.7"/>
      <path d="M256 101c9-4 15-4 20-1 4 2 3 7-2 10-7 4-15 6-24 7 0 0 5-11 6-16z" fill="url(#rust)" opacity="0.95"/>
      <path d="M292 98c6-3 11-3 14 0 3 3 2 6-2 9-6 4-13 6-22 7 0 0 7-11 10-16z" fill="url(#rust)" opacity="0.9"/>
    </g>

    <!-- Rust patches on bed lower edge -->
    <path d="M90 144c7-3 13-4 17-2 4 1 4 5 1 9-4 4-10 7-18 8 0 0 1-11 0-15z" fill="url(#rust)" opacity="0.9"/>
    <path d="M162 144c6-3 11-3 15-1 3 2 3 6-1 9-5 4-11 7-19 8 0 0 4-11 5-16z" fill="url(#rust)" opacity="0.9"/>

    <!-- Cracked side window on cab -->
    <path d="M278 80l13 10m-10-1l9 7m-6-11l-5 8" stroke="#eef6ff" stroke-width="0.9" stroke-linecap="round" opacity="0.9"/>

    <!-- Small dangling wire under frame -->
    <path d="M188 160c0 0 2 5 2 9 0 4-1 7-1 7" stroke="#5a5a5a" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="189" cy="178" r="1.6" fill="#444"/>

  </g>
</svg>