<svg xmlns="http://www.w3.org/2000/svg" viewBox="30.5 4.5 514.8 370.8">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb54d"/>
      <stop offset="0.45" stop-color="#f7913a"/>
      <stop offset="1" stop-color="#d96a1f"/>
    </linearGradient>
    <linearGradient id="cabG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd2ff"/>
      <stop offset="0.5" stop-color="#4bb4f0"/>
      <stop offset="1" stop-color="#2b86bf"/>
    </linearGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f8f"/>
      <stop offset="1" stop-color="#d94848"/>
    </linearGradient>
    <linearGradient id="stackG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="0.4" stop-color="#ffbe3d"/>
      <stop offset="1" stop-color="#e09612"/>
    </linearGradient>
    <radialGradient id="wheelG" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#8be07f"/>
      <stop offset="0.6" stop-color="#57bf51"/>
      <stop offset="1" stop-color="#2f8a35"/>
    </radialGradient>
    <radialGradient id="gloss" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="smokeG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- smoke puffs -->
  <g opacity="0.9">
    <circle cx="150" cy="86" r="26" fill="url(#smokeG)" stroke="#cfe6f2" stroke-width="3"/>
    <circle cx="196" cy="46" r="20" fill="url(#smokeG)" stroke="#cfe6f2" stroke-width="3"/>
    <circle cx="236" cy="22" r="14" fill="url(#smokeG)" stroke="#cfe6f2" stroke-width="3"/>
  </g>

  <!-- rear cab block -->
  <g>
    <path d="M330 118h150a26 26 0 0 1 26 26v122a26 26 0 0 1-26 26H330z" fill="url(#cabG)" stroke="#1f6b9c" stroke-width="7" stroke-linejoin="round"/>
    <!-- roof -->
    <path d="M312 118c0-16 14-28 32-28h140c20 0 34 12 34 28z" fill="url(#roofG)" stroke="#a83535" stroke-width="7" stroke-linejoin="round"/>
    <!-- window -->
    <rect x="360" y="146" width="112" height="76" rx="20" fill="#ffe9a8" stroke="#1f6b9c" stroke-width="7"/>
    <path d="M372 210c8-30 32-50 62-54" fill="none" stroke="#fff8dd" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- boiler body -->
  <g>
    <path d="M104 150a34 34 0 0 1 34-34h200v154H138a34 34 0 0 1-34-34z" fill="url(#bodyG)" stroke="#b4551a" stroke-width="7" stroke-linejoin="round"/>
    <!-- front face -->
    <ellipse cx="104" cy="193" rx="30" ry="77" fill="#ffcc78" stroke="#b4551a" stroke-width="7"/>
    <ellipse cx="104" cy="193" rx="17" ry="46" fill="#ffe0a5" stroke="#c9701f" stroke-width="5"/>
    <!-- bands -->
    <path d="M186 118v152M262 118v152" stroke="#d97e2c" stroke-width="8" opacity="0.7"/>
    <!-- gloss -->
    <ellipse cx="215" cy="146" rx="95" ry="16" fill="url(#gloss)"/>
  </g>

  <!-- chimney -->
  <g>
    <path d="M138 116l10-52h44l10 52z" fill="url(#stackG)" stroke="#b4551a" stroke-width="7" stroke-linejoin="round"/>
    <rect x="132" y="44" width="76" height="26" rx="13" fill="#ffd36b" stroke="#b4551a" stroke-width="7"/>
  </g>

  <!-- dome -->
  <path d="M240 116a34 34 0 0 1 68 0z" fill="#ffd36b" stroke="#b4551a" stroke-width="7" stroke-linejoin="round"/>

  <!-- lamp -->
  <circle cx="104" cy="180" r="0" fill="none"/>

  <!-- footplate -->
  <rect x="70" y="270" width="450" height="34" rx="17" fill="#f6b93b" stroke="#b4551a" stroke-width="7"/>

  <!-- cow catcher -->
  <path d="M74 276L36 336h56l16-60z" fill="#ff8f8f" stroke="#a83535" stroke-width="7" stroke-linejoin="round"/>

  <!-- wheels -->
  <g stroke="#25702c" stroke-width="7">
    <circle cx="150" cy="318" r="52" fill="url(#wheelG)"/>
    <circle cx="330" cy="326" r="44" fill="url(#wheelG)"/>
    <circle cx="465" cy="326" r="44" fill="url(#wheelG)"/>
  </g>
  <g fill="#e9ffe4" stroke="#25702c" stroke-width="5">
    <circle cx="150" cy="318" r="18"/>
    <circle cx="330" cy="326" r="15"/>
    <circle cx="465" cy="326" r="15"/>
  </g>
  <g stroke="#2f8a35" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M150 274v14M150 348v14M106 318h14M180 318h14M119 287l10 10M181 349l-10-10M119 349l10-10M181 287l-10 10"/>
  </g>

  <!-- coupling rod -->
  <rect x="140" y="310" width="335" height="14" rx="7" fill="#f6b93b" stroke="#b4551a" stroke-width="6"/>
  <circle cx="150" cy="317" r="8" fill="#b4551a"/>
  <circle cx="330" cy="317" r="8" fill="#b4551a"/>
  <circle cx="465" cy="317" r="8" fill="#b4551a"/>

  <!-- rear buffer -->
  <rect x="506" y="212" width="34" height="60" rx="16" fill="#ff8f8f" stroke="#a83535" stroke-width="7"/>

  <!-- candy gloss highlights -->
  <ellipse cx="392" cy="112" rx="52" ry="9" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="168" cy="60" rx="22" ry="7" fill="#ffffff" opacity="0.5"/>
</svg>