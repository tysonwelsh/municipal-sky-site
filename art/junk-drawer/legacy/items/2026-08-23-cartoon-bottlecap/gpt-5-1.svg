<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.2 18.5 244.5 222.8">
  <defs>
    <linearGradient id="capBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f6f8"/>
      <stop offset="0.45" stop-color="#e1e3e9"/>
      <stop offset="1" stop-color="#c2c6d1"/>
    </linearGradient>
    <linearGradient id="capRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6d9e2"/>
      <stop offset="1" stop-color="#a9aebc"/>
    </linearGradient>
    <linearGradient id="innerHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#eef1f7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d4d8e5" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sideShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#858ba0"/>
      <stop offset="0.5" stop-color="#c0c5d4"/>
      <stop offset="1" stop-color="#6b7083"/>
    </linearGradient>
    <radialGradient id="faceHighlight" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f3f5fb" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d5dae8" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Base cap ellipse -->
  <ellipse cx="130" cy="130" rx="110" ry="108" fill="url(#capBody)" stroke="#5a6070" stroke-width="3"/>

  <!-- Side crimped rim (cartoony 3D) -->
  <g transform="translate(130 130)">
    <path d="
      M 0 -108
      C 18 -106 33 -102 46 -95
      C 61 -88 76 -76 88 -62
      C 101 -47 108 -32 110 -15
      C 112 4 107 21 99 35
      C 91 50 79 62 65 72
      C 51 82 34 90 16 95
      C -4 101 -23 102 -42 99
      C -60 97 -76 90 -90 81
      C -103 72 -115 60 -121 46
      C -128 31 -130 17 -129 1
      C -128 -18 -123 -33 -114 -47
      C -106 -59 -95 -71 -82 -80
      C -68 -90 -53 -98 -36 -103
      C -22 -107 -11 -108 0 -108
      Z"
      fill="url(#sideShade)" opacity="0.92"/>

    <!-- Crimp teeth -->
    <g fill="url(#capRim)" stroke="#505666" stroke-width="1.6">
      <!-- 14 evenly spaced crimps -->
      <g id="crimp">
        <path d="M0 -104 C6 -104 10 -103 14 -98 C10 -88 6 -82 0 -80 C-6 -82 -10 -88 -14 -98 C-10 -103 -6 -104 0 -104 Z"/>
      </g>
      <use href="#crimp" transform="rotate(25)"/>
      <use href="#crimp" transform="rotate(50)"/>
      <use href="#crimp" transform="rotate(75)"/>
      <use href="#crimp" transform="rotate(100)"/>
      <use href="#crimp" transform="rotate(125)"/>
      <use href="#crimp" transform="rotate(150)"/>
      <use href="#crimp" transform="rotate(175)"/>
      <use href="#crimp" transform="rotate(200)"/>
      <use href="#crimp" transform="rotate(225)"/>
      <use href="#crimp" transform="rotate(250)"/>
      <use href="#crimp" transform="rotate(275)"/>
      <use href="#crimp" transform="rotate(300)"/>
      <use href="#crimp" transform="rotate(325)"/>
      <use href="#crimp" transform="rotate(350)"/>
    </g>
  </g>

  <!-- Top face -->
  <ellipse cx="130" cy="122" rx="88" ry="82" fill="url(#faceHighlight)" stroke="#757b8c" stroke-width="2.2"/>

  <!-- Inner rim shadow -->
  <ellipse cx="130" cy="126" rx="82" ry="77" fill="none" stroke="#a0a5b6" stroke-width="3" opacity="0.8"/>

  <!-- Cute face -->
  <!-- Eyes -->
  <g transform="translate(130 130)">
    <g transform="translate(-34 -4)">
      <ellipse cx="0" cy="0" rx="11" ry="14" fill="#222433"/>
      <ellipse cx="-3" cy="-4" rx="4" ry="5" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="3" cy="2" rx="2.3" ry="2.8" fill="#ffffff" opacity="0.6"/>
    </g>
    <g transform="translate(34 -4)">
      <ellipse cx="0" cy="0" rx="11" ry="14" fill="#222433"/>
      <ellipse cx="-3" cy="-4" rx="4" ry="5" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="3" cy="2" rx="2.3" ry="2.8" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Eyebrows -->
    <g stroke="#424758" stroke-width="3.5" stroke-linecap="round">
      <path d="M -50 -22 C -40 -30 -30 -32 -20 -28"/>
      <path d="M 50 -22 C 40 -30 30 -32 20 -28"/>
    </g>

    <!-- Mouth -->
    <path d="M -26 24 C -18 40  -4 48  0 48  4 48 18 40 26 24" fill="none" stroke="#2a2333" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M -17 24 C -10 33 -2 36 0 36 2 36 10 33 17 24" fill="#f26b7c"/>

    <!-- Cheeks -->
    <ellipse cx="-42" cy="18" rx="9" ry="6" fill="#ff9ab1" opacity="0.7"/>
    <ellipse cx="42" cy="18" rx="9" ry="6" fill="#ff9ab1" opacity="0.7"/>
  </g>

  <!-- Top-left highlight sheen -->
  <path d="M 52 78 C 78 47 111 34 150 38 C 134 44 121 52 108 63 C 94 74 81 87 69 102 C 63 94 57 86 52 78 Z" fill="#ffffff" opacity="0.7"/>

  <!-- Bottom-right subtle shadow band -->
  <path d="M 70 188 C 98 204 128 212 164 206 C 181 203 198 197 212 190 C 204 204 192 217 177 224 C 154 235 125 235 100 224 C 86 218 76 207 70 196 Z" fill="#8b91a3" opacity="0.35"/>

</svg>