<svg xmlns="http://www.w3.org/2000/svg" viewBox="27.2 -2.0 231.8 337.8">
  <defs>
    <radialGradient id="dandyHeadGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.4" stop-color="#f8fbff" />
      <stop offset="1" stop-color="#dde7f5" />
    </radialGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4da130" />
      <stop offset="1" stop-color="#2f6a1c" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68b23d" />
      <stop offset="1" stop-color="#316d23" />
    </linearGradient>
    <radialGradient id="seedTipGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="1" stop-color="#cfd8ea" stop-opacity="0.9" />
    </radialGradient>
  </defs>

  <!-- Stem -->
  <path d="M150 330
           C148 295 145 255 143 220
           C141 190 141 165 143 140
           C145 120 148 105 152 90"
        fill="none"
        stroke="url(#stemGrad)"
        stroke-width="8"
        stroke-linecap="round" />

  <!-- Leaves -->
  <g fill="url(#leafGrad)">
    <path d="M146 280
             C110 282 94 275 80 265
             C92 265 100 262 108 257
             C96 256 88 250 82 244
             C93 245 102 243 110 238
             C98 236 91 230 84 222
             C95 224 107 222 116 217
             C103 213 96 206 90 197
             C102 200 115 200 125 198
             C116 189 111 181 108 172
             C120 182 132 189 144 193
             C144 222 145 251 146 280Z"
          />
    <path d="M153 295
             C186 296 203 291 219 282
             C208 282 200 279 192 275
             C204 274 213 269 219 263
             C208 264 199 262 191 258
             C203 256 211 250 218 243
             C207 245 195 244 186 240
             C199 236 207 230 213 222
             C201 226 189 226 179 224
             C189 213 194 206 197 197
             C185 207 172 214 161 217
             C159 244 156 270 153 295Z"
          />
  </g>

  <!-- Seed head halo -->
  <circle cx="150" cy="80" r="70"
          fill="url(#dandyHeadGrad)"
          fill-opacity="0.7" />

  <!-- Central disk -->
  <circle cx="150" cy="80" r="9"
          fill="#f5e28b"
          stroke="#d1b85e"
          stroke-width="2" />

  <!-- Seed spokes -->
  <g stroke="#c6d3eb" stroke-width="1.6" stroke-linecap="round">
    <!-- Long spokes -->
    <line x1="150" y1="80" x2="150" y2="8" />
    <line x1="150" y1="80" x2="214" y2="22" />
    <line x1="150" y1="80" x2="242" y2="80" />
    <line x1="150" y1="80" x2="214" y2="138" />
    <line x1="150" y1="80" x2="150" y2="152" />
    <line x1="150" y1="80" x2="86" y2="138" />
    <line x1="150" y1="80" x2="58" y2="80" />
    <line x1="150" y1="80" x2="86" y2="22" />

    <!-- Secondary spokes -->
    <line x1="150" y1="80" x2="190" y2="16" />
    <line x1="150" y1="80" x2="224" y2="46" />
    <line x1="150" y1="80" x2="232" y2="114" />
    <line x1="150" y1="80" x2="190" y2="144" />
    <line x1="150" y1="80" x2="110" y2="144" />
    <line x1="150" y1="80" x2="68" y2="114" />
    <line x1="150" y1="80" x2="76" y2="46" />
    <line x1="150" y1="80" x2="110" y2="16" />

    <!-- Tertiary spokes -->
    <line x1="150" y1="80" x2="171" y2="10" />
    <line x1="150" y1="80" x2="205" y2="28" />
    <line x1="150" y1="80" x2="235" y2="61" />
    <line x1="150" y1="80" x2="240" y2="99" />
    <line x1="150" y1="80" x2="205" y2="132" />
    <line x1="150" y1="80" x2="171" y2="150" />
    <line x1="150" y1="80" x2="129" y2="150" />
    <line x1="150" y1="80" x2="95" y2="132" />
    <line x1="150" y1="80" x2="65" y2="99" />
    <line x1="150" y1="80" x2="60" y2="61" />
    <line x1="150" y1="80" x2="95" y2="28" />
    <line x1="150" y1="80" x2="129" y2="10" />
  </g>

  <!-- Seed fluff tips -->
  <g fill="url(#seedTipGrad)" stroke="#d2dbf0" stroke-width="0.8">
    <!-- Around main circle -->
    <ellipse cx="150" cy="8" rx="8" ry="3" />
    <ellipse cx="214" cy="22" rx="3" ry="7" transform="rotate(20 214 22)" />
    <ellipse cx="242" cy="80" rx="7" ry="3" />
    <ellipse cx="214" cy="138" rx="3" ry="7" transform="rotate(160 214 138)" />
    <ellipse cx="150" cy="152" rx="8" ry="3" />
    <ellipse cx="86" cy="138" rx="3" ry="7" transform="rotate(-160 86 138)" />
    <ellipse cx="58" cy="80" rx="7" ry="3" />
    <ellipse cx="86" cy="22" rx="3" ry="7" transform="rotate(-20 86 22)" />

    <!-- Secondary tips -->
    <ellipse cx="190" cy="16" rx="3" ry="7" transform="rotate(10 190 16)" />
    <ellipse cx="224" cy="46" rx="3" ry="7" transform="rotate(40 224 46)" />
    <ellipse cx="232" cy="114" rx="3" ry="7" transform="rotate(130 232 114)" />
    <ellipse cx="190" cy="144" rx="3" ry="7" transform="rotate(170 190 144)" />
    <ellipse cx="110" cy="144" rx="3" ry="7" transform="rotate(-170 110 144)" />
    <ellipse cx="68" cy="114" rx="3" ry="7" transform="rotate(-130 68 114)" />
    <ellipse cx="76" cy="46" rx="3" ry="7" transform="rotate(-40 76 46)" />
    <ellipse cx="110" cy="16" rx="3" ry="7" transform="rotate(-10 110 16)" />

    <!-- Tertiary tips -->
    <ellipse cx="171" cy="10" rx="2.8" ry="6.2" transform="rotate(6 171 10)" />
    <ellipse cx="205" cy="28" rx="2.8" ry="6.2" transform="rotate(25 205 28)" />
    <ellipse cx="235" cy="61" rx="2.8" ry="6.2" transform="rotate(55 235 61)" />
    <ellipse cx="240" cy="99" rx="2.8" ry="6.2" transform="rotate(110 240 99)" />
    <ellipse cx="205" cy="132" rx="2.8" ry="6.2" transform="rotate(155 205 132)" />
    <ellipse cx="171" cy="150" rx="2.8" ry="6.2" transform="rotate(174 171 150)" />
    <ellipse cx="129" cy="150" rx="2.8" ry="6.2" transform="rotate(-174 129 150)" />
    <ellipse cx="95" cy="132" rx="2.8" ry="6.2" transform="rotate(-155 95 132)" />
    <ellipse cx="65" cy="99" rx="2.8" ry="6.2" transform="rotate(-110 65 99)" />
    <ellipse cx="60" cy="61" rx="2.8" ry="6.2" transform="rotate(-55 60 61)" />
    <ellipse cx="95" cy="28" rx="2.8" ry="6.2" transform="rotate(-25 95 28)" />
    <ellipse cx="129" cy="10" rx="2.8" ry="6.2" transform="rotate(-6 129 10)" />
  </g>

  <!-- A few drifting seeds -->
  <g stroke="#cbd8f0" stroke-width="1.3" stroke-linecap="round" fill="none">
    <!-- Seed 1 -->
    <line x1="206" y1="40" x2="224" y2="12" />
    <line x1="224" y1="12" x2="217" y2="4" />
    <line x1="224" y1="12" x2="231" y2="4" />
    <line x1="224" y1="12" x2="224" y2="0" />
    <ellipse cx="224" cy="0" rx="5" ry="2.2" fill="url(#seedTipGrad)" stroke="#d2dbf0" stroke-width="0.7" />

    <!-- Seed 2 -->
    <line x1="60" y1="75" x2="38" y2="54" />
    <line x1="38" y1="54" x2="30" y2="47" />
    <line x1="38" y1="54" x2="37" y2="42" />
    <line x1="38" y1="54" x2="46" y2="44" />
    <ellipse cx="37" cy="42" rx="4.6" ry="2" fill="url(#seedTipGrad)" stroke="#d2dbf0" stroke-width="0.7" />

    <!-- Seed 3 -->
    <line x1="215" y1="126" x2="244" y2="142" />
    <line x1="244" y1="142" x2="253" y2="145" />
    <line x1="244" y1="142" x2="252" y2="136" />
    <line x1="244" y1="142" x2="245" y2="133" />
    <ellipse cx="252" cy="136" rx="4.8" ry="2" fill="url(#seedTipGrad)" stroke="#d2dbf0" stroke-width="0.7" />
  </g>
</svg>