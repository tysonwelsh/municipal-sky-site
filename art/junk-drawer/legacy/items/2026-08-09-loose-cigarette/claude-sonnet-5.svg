<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176">
  <defs>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#fbfaf6"/>
      <stop offset="45%" stop-color="#f1efe8"/>
      <stop offset="72%" stop-color="#ddd8cc"/>
      <stop offset="100%" stop-color="#b7b0a0"/>
    </linearGradient>
    <linearGradient id="filterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecceA0"/>
      <stop offset="16%" stop-color="#dcbb7c"/>
      <stop offset="50%" stop-color="#c19a56"/>
      <stop offset="80%" stop-color="#9c7640"/>
      <stop offset="100%" stop-color="#6f5027"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6dd97"/>
      <stop offset="30%" stop-color="#e0b654"/>
      <stop offset="65%" stop-color="#b98a2e"/>
      <stop offset="100%" stop-color="#7c5716"/>
    </linearGradient>
    <radialGradient id="tobaccoGrad" cx="38%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#cfa872"/>
      <stop offset="45%" stop-color="#a97b45"/>
      <stop offset="80%" stop-color="#7a5730"/>
      <stop offset="100%" stop-color="#4f3620"/>
    </radialGradient>
    <pattern id="cork" width="16" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(6)">
      <circle cx="3" cy="4" r="1.4" fill="#6b4423" opacity="0.55"/>
      <circle cx="10" cy="9" r="1.1" fill="#8a5a2e" opacity="0.5"/>
      <circle cx="6" cy="14" r="1.6" fill="#5a3a1c" opacity="0.6"/>
      <circle cx="13" cy="3" r="0.9" fill="#7a4f28" opacity="0.45"/>
      <circle cx="14" cy="15" r="1.2" fill="#6b4423" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- loose tobacco strands escaping the open end -->
  <g fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M16,25 C6,20 2,12 7,4" stroke="#8a6239" stroke-width="1.4"/>
    <path d="M18,150 C6,155 1,163 6,172" stroke="#6b4a28" stroke-width="1.5"/>
    <path d="M12,60 C2,58 -3,52 1,44" stroke="#b8905a" stroke-width="1.3"/>
    <path d="M14,110 C3,113 -2,120 3,128" stroke="#5a3f22" stroke-width="1.4"/>
    <path d="M20,85 C6,84 -1,88 4,96" stroke="#a97b45" stroke-width="1.3"/>
  </g>

  <!-- open tobacco end cap -->
  <ellipse cx="24" cy="88" rx="13" ry="85" fill="url(#tobaccoGrad)"/>
  <g stroke-width="1" opacity="0.55">
    <line x1="18" y1="10" x2="26" y2="14" stroke="#c9a06a"/>
    <line x1="16" y1="30" x2="25" y2="26" stroke="#5a3f22"/>
    <line x1="30" y1="45" x2="20" y2="48" stroke="#8a6239"/>
    <line x1="14" y1="60" x2="24" y2="63" stroke="#c9a06a"/>
    <line x1="28" y1="75" x2="18" y2="78" stroke="#5a3f22"/>
    <line x1="16" y1="100" x2="25" y2="97" stroke="#8a6239"/>
    <line x1="30" y1="120" x2="20" y2="124" stroke="#c9a06a"/>
    <line x1="14" y1="140" x2="24" y2="137" stroke="#5a3f22"/>
    <line x1="28" y1="160" x2="18" y2="163" stroke="#8a6239"/>
  </g>

  <!-- paper tube -->
  <rect x="34" y="3" width="711" height="170" fill="url(#paperGrad)"/>
  <line x1="400" y1="4" x2="400" y2="172" stroke="#8a8578" stroke-width="0.8" opacity="0.18"/>
  <line x1="60" y1="55" x2="740" y2="52" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="120" x2="740" y2="123" stroke="#00000022" stroke-width="1"/>

  <!-- gold cork band -->
  <rect x="745" y="3" width="23" height="170" fill="url(#goldGrad)"/>

  <!-- filter -->
  <path d="M768,3 L975,3 A10,85 0 0 1 975,173 L768,173 Z" fill="url(#filterGrad)"/>
  <path d="M768,3 L975,3 A10,85 0 0 1 975,173 L768,173 Z" fill="url(#cork)" opacity="0.5"/>
  <ellipse cx="980" cy="88" rx="8" ry="83" fill="#e6c68f" opacity="0.95"/>
  <g stroke-width="1" opacity="0.5">
    <line x1="972" y1="15" x2="980" y2="20" stroke="#8a6239"/>
    <line x1="988" y1="25" x2="980" y2="30" stroke="#5a3f22"/>
    <line x1="972" y1="50" x2="980" y2="55" stroke="#8a6239"/>
    <line x1="988" y1="60" x2="980" y2="65" stroke="#5a3f22"/>
    <line x1="972" y1="110" x2="980" y2="115" stroke="#8a6239"/>
    <line x1="988" y1="120" x2="980" y2="125" stroke="#5a3f22"/>
    <line x1="972" y1="150" x2="980" y2="155" stroke="#8a6239"/>
    <line x1="988" y1="160" x2="980" y2="165" stroke="#5a3f22"/>
  </g>

  <!-- unifying cylindrical light / shadow across whole body -->
  <path d="M30,20 Q500,13 986,20" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M30,156 Q500,164 986,156" fill="none" stroke="#000000" stroke-width="4" opacity="0.16" stroke-linecap="round"/>
</svg>