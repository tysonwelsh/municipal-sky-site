<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="fadeVignette" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#e8d3a0" stop-opacity="0.42"/>
      <stop offset="35%" stop-color="#d8bd85" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#a9885a" stop-opacity="0.15"/>
      <stop offset="85%" stop-color="#5c4630" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planetShade" cx="38%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#f3ddaa"/>
      <stop offset="35%" stop-color="#e0bd80"/>
      <stop offset="65%" stop-color="#b8895a"/>
      <stop offset="88%" stop-color="#7c5638"/>
      <stop offset="100%" stop-color="#4a3222"/>
    </radialGradient>

    <linearGradient id="ringGradBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2a1c" stop-opacity="0.55"/>
      <stop offset="20%" stop-color="#caa46b" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#7c5b39" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#e9cf98" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#7c5b39" stop-opacity="0.5"/>
      <stop offset="80%" stop-color="#caa46b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3a2a1c" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="ringGradFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b2015" stop-opacity="0.65"/>
      <stop offset="18%" stop-color="#e3c48c" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#8a6742" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#fbe6b0" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#8a6742" stop-opacity="0.6"/>
      <stop offset="82%" stop-color="#e3c48c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2b2015" stop-opacity="0.65"/>
    </linearGradient>

    <radialGradient id="lightLeak" cx="88%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#e8a24a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#c4703a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#c4703a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lightLeak2" cx="8%" cy="92%" r="40%">
      <stop offset="0%" stop-color="#6b4a2a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6b4a2a" stop-opacity="0"/>
    </radialGradient>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix"
        values="0 0 0 0 0.35
                0 0 0 0 0.27
                0 0 0 0 0.16
                0 0 0 0.55 0"/>
    </filter>

    <clipPath id="ringFrontClip">
      <path d="M 30 430 L 770 430 L 770 700 L 30 700 Z"/>
    </clipPath>

    <clipPath id="planetClip">
      <circle cx="400" cy="430" r="165"/>
    </clipPath>
  </defs>

  <!-- fading vintage vignette wash (not opaque, fades to transparent) -->
  <rect x="0" y="0" width="800" height="800" fill="url(#fadeVignette)"/>
  <rect x="0" y="0" width="800" height="800" fill="url(#lightLeak)"/>
  <rect x="0" y="0" width="800" height="800" fill="url(#lightLeak2)"/>

  <!-- distant stars -->
  <g fill="#f2e2bb">
    <circle cx="70" cy="90" r="1.6" opacity="0.55"/>
    <circle cx="130" cy="220" r="1.1" opacity="0.4"/>
    <circle cx="200" cy="60" r="1.3" opacity="0.5"/>
    <circle cx="640" cy="120" r="1.4" opacity="0.45"/>
    <circle cx="720" cy="230" r="1.7" opacity="0.5"/>
    <circle cx="760" cy="80" r="1.1" opacity="0.35"/>
    <circle cx="90" cy="600" r="1.5" opacity="0.4"/>
    <circle cx="60" cy="740" r="1.2" opacity="0.4"/>
    <circle cx="140" cy="700" r="1.6" opacity="0.5"/>
    <circle cx="690" cy="660" r="1.4" opacity="0.4"/>
    <circle cx="750" cy="740" r="1.7" opacity="0.45"/>
    <circle cx="620" cy="770" r="1.1" opacity="0.35"/>
    <circle cx="400" cy="45" r="1.3" opacity="0.4"/>
    <circle cx="450" cy="700" r="1.2" opacity="0.3"/>
    <circle cx="260" cy="140" r="1.0" opacity="0.35"/>
    <circle cx="520" cy="180" r="1.2" opacity="0.4"/>
    <circle cx="330" cy="90" r="1.0" opacity="0.3"/>
    <circle cx="180" cy="440" r="1.0" opacity="0.3"/>
    <circle cx="600" cy="450" r="1.0" opacity="0.3"/>
  </g>

  <!-- ring back half (behind planet) -->
  <g transform="translate(400,430) rotate(-16)">
    <ellipse cx="0" cy="0" rx="378" ry="112" fill="none" stroke="url(#ringGradBack)" stroke-width="34"/>
    <ellipse cx="0" cy="0" rx="330" ry="97" fill="none" stroke="url(#ringGradBack)" stroke-width="14" opacity="0.7"/>
  </g>

  <!-- planet body -->
  <g clip-path="url(#planetClip)">
    <circle cx="400" cy="430" r="165" fill="url(#planetShade)"/>
    <!-- banding -->
    <g opacity="0.5">
      <rect x="235" y="352" width="330" height="10" fill="#7c5638" opacity="0.4"/>
      <rect x="235" y="378" width="330" height="16" fill="#c99a5f" opacity="0.35"/>
      <rect x="235" y="406" width="330" height="9" fill="#8a5f3a" opacity="0.4"/>
      <rect x="235" y="430" width="330" height="20" fill="#3f2c1c" opacity="0.35"/>
      <rect x="235" y="462" width="330" height="12" fill="#c9a066" opacity="0.3"/>
      <rect x="235" y="486" width="330" height="8" fill="#7c5638" opacity="0.35"/>
      <rect x="235" y="508" width="330" height="14" fill="#5c4025" opacity="0.3"/>
    </g>
    <!-- shadow of rings across the globe -->
    <path d="M 240 415 Q 400 445 560 415 L 560 452 Q 400 482 240 452 Z" fill="#2a1c10" opacity="0.4"/>
    <!-- terminator shading -->
    <circle cx="400" cy="430" r="165" fill="#2a1a0f" opacity="0.28" transform="translate(60,40)"/>
  </g>
  <circle cx="400" cy="430" r="165" fill="none" stroke="#20140b" stroke-width="1.5" opacity="0.3"/>

  <!-- ring front half (in front of planet) -->
  <g clip-path="url(#ringFrontClip)">
    <g transform="translate(400,430) rotate(-16)">
      <ellipse cx="0" cy="0" rx="378" ry="112" fill="none" stroke="url(#ringGradFront)" stroke-width="34"/>
      <ellipse cx="0" cy="0" rx="330" ry="97" fill="none" stroke="url(#ringGradFront)" stroke-width="14" opacity="0.85"/>
    </g>
  </g>

  <!-- faint distant moon -->
  <circle cx="655" cy="600" r="9" fill="#e6cf9e" opacity="0.55"/>
  <circle cx="655" cy="600" r="9" fill="#3a2a1a" opacity="0.25" transform="translate(3,3)"/>

  <!-- old film scratches -->
  <g stroke="#f2e6cc" stroke-width="1" opacity="0.18">
    <line x1="120" y1="0" x2="108" y2="800"/>
    <line x1="500" y1="0" x2="512" y2="800"/>
    <line x1="690" y1="60" x2="682" y2="500"/>
  </g>
  <g stroke="#f2e6cc" stroke-width="0.6" opacity="0.12">
    <line x1="40" y1="0" x2="46" y2="800"/>
    <line x1="760" y1="200" x2="750" y2="800"/>
  </g>

  <!-- film grain overlay -->
  <rect x="0" y="0" width="800" height="800" filter="url(#grain)" opacity="0.16"/>

  <!-- edge fade to transparent, simulating a worn photo border -->
  <radialGradient id="edgeFade" cx="50%" cy="46%" r="58%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="78%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="92%" stop-color="#1a120a" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#0a0704" stop-opacity="0.6"/>
  </radialGradient>
  <rect x="0" y="0" width="800" height="800" fill="url(#edgeFade)"/>
</svg>