<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A faded sepia photograph of the planet Saturn seen from a distance, ringed and grainy, as from a bygone age">
  <title>A fadograph of a yestern scene</title>
  <defs>
    <radialGradient id="sky" cx="41%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#3a2e20" stop-opacity="0.66"/>
      <stop offset="38%" stop-color="#2a2015" stop-opacity="0.76"/>
      <stop offset="72%" stop-color="#191108" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#0d0904" stop-opacity="0.88"/>
    </radialGradient>

    <radialGradient id="milk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e7d3a8" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#b99a66" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8a6f42" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="globe" cx="34%" cy="29%" r="84%">
      <stop offset="0%" stop-color="#f5e3bd"/>
      <stop offset="18%" stop-color="#e9d09b"/>
      <stop offset="40%" stop-color="#d3b076"/>
      <stop offset="62%" stop-color="#b58c50"/>
      <stop offset="82%" stop-color="#7d5c31"/>
      <stop offset="100%" stop-color="#3b2a16"/>
    </radialGradient>

    <radialGradient id="shade" cx="32%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#1d1409" stop-opacity="0"/>
      <stop offset="55%" stop-color="#1d1409" stop-opacity="0.05"/>
      <stop offset="82%" stop-color="#1a1207" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#120c05" stop-opacity="0.86"/>
    </radialGradient>

    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7e8c6" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#e0c493" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c8a874" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ansae" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdf0d2" stop-opacity="0.42"/>
      <stop offset="16%" stop-color="#fdf0d2" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#fdf0d2" stop-opacity="0"/>
      <stop offset="84%" stop-color="#fdf0d2" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fdf0d2" stop-opacity="0.42"/>
    </linearGradient>

    <linearGradient id="wash" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#f2dcaf" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#c9a46b" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#6b4e2a" stop-opacity="0.13"/>
    </linearGradient>

    <radialGradient id="vig" cx="47%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="55%" stop-color="#0b0803" stop-opacity="0.06"/>
      <stop offset="80%" stop-color="#0b0803" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#080502" stop-opacity="0.62"/>
    </radialGradient>

    <radialGradient id="leak" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe6b0" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#e8b268" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c98a3e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bleach" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdf3dc" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#fdf3dc" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="blot" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.86  0 0 0 0 0.71  0.42 0.36 0.22 0 -0.22"/>
    </filter>
    <filter id="grain2" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.32" numOctaves="3" seed="29" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.07  0 0 0 0 0.04  0.4 0.34 0.2 0 -0.26"/>
    </filter>

    <clipPath id="globeClip">
      <circle cx="600" cy="430" r="190"/>
    </clipPath>
    <clipPath id="frontHalf">
      <rect x="60" y="430" width="1080" height="480"/>
    </clipPath>
    <clipPath id="backHalf">
      <rect x="60" y="-80" width="1080" height="510"/>
    </clipPath>

    <path id="ringC" fill-rule="evenodd" d="M311,430 a289,86.7 0 1 0 578,0 a289,86.7 0 1 0 -578,0 Z M363,430 a237,71.1 0 1 0 474,0 a237,71.1 0 1 0 -474,0 Z"/>
    <path id="ringB" fill-rule="evenodd" d="M230,430 a370,111 0 1 0 740,0 a370,111 0 1 0 -740,0 Z M311,430 a289,86.7 0 1 0 578,0 a289,86.7 0 1 0 -578,0 Z"/>
    <path id="ringD" fill-rule="evenodd" d="M216,430 a384,115.2 0 1 0 768,0 a384,115.2 0 1 0 -768,0 Z M230,430 a370,111 0 1 0 740,0 a370,111 0 1 0 -740,0 Z"/>
    <path id="ringA" fill-rule="evenodd" d="M169,430 a431,129.3 0 1 0 862,0 a431,129.3 0 1 0 -862,0 Z M216,430 a384,115.2 0 1 0 768,0 a384,115.2 0 1 0 -768,0 Z"/>
    <path id="ringE" fill-rule="evenodd" d="M186,430 a414,124.2 0 1 0 828,0 a414,124.2 0 1 0 -828,0 Z M192,430 a408,122.4 0 1 0 816,0 a408,122.4 0 1 0 -816,0 Z"/>
    <path id="ringF" fill-rule="evenodd" d="M156,430 a444,133.2 0 1 0 888,0 a444,133.2 0 1 0 -888,0 Z M160,430 a440,132 0 1 0 880,0 a440,132 0 1 0 -880,0 Z"/>

    <clipPath id="ringsClip">
      <use xlink:href="#ringC" href="#ringC"/>
      <use xlink:href="#ringB" href="#ringB"/>
      <use xlink:href="#ringD" href="#ringD"/>
      <use xlink:href="#ringA" href="#ringA"/>
      <use xlink:href="#ringF" href="#ringF"/>
    </clipPath>
  </defs>

  <!-- film base / night field (translucent, no opaque backdrop) -->
  <rect x="0" y="0" width="1200" height="900" fill="url(#sky)"/>
  <ellipse cx="330" cy="120" rx="620" ry="330" fill="url(#milk)"/>
  <ellipse cx="980" cy="760" rx="460" ry="260" fill="url(#milk)" opacity="0.7"/>

  <!-- stars, half-lost in the emulsion -->
  <g fill="#f6e9cc">
    <circle cx="58" cy="72" r="1.5" opacity="0.42"/><circle cx="146" cy="188" r="1" opacity="0.26"/>
    <circle cx="222" cy="56" r="1.9" opacity="0.5"/><circle cx="298" cy="146" r="0.9" opacity="0.22"/>
    <circle cx="76" cy="330" r="1.2" opacity="0.3"/><circle cx="164" cy="428" r="1.6" opacity="0.38"/>
    <circle cx="44" cy="536" r="1" opacity="0.24"/><circle cx="122" cy="640" r="1.7" opacity="0.4"/>
    <circle cx="238" cy="782" r="1.1" opacity="0.26"/><circle cx="332" cy="856" r="1.5" opacity="0.34"/>
    <circle cx="404" cy="88" r="1.3" opacity="0.3"/><circle cx="486" cy="196" r="0.8" opacity="0.2"/>
    <circle cx="560" cy="62" r="1.8" opacity="0.46"/><circle cx="642" cy="150" r="1" opacity="0.24"/>
    <circle cx="736" cy="74" r="1.4" opacity="0.33"/><circle cx="820" cy="168" r="1.1" opacity="0.27"/>
    <circle cx="902" cy="60" r="1.7" opacity="0.4"/><circle cx="1010" cy="132" r="1" opacity="0.23"/>
    <circle cx="1104" cy="66" r="1.5" opacity="0.36"/><circle cx="1156" cy="214" r="1.2" opacity="0.28"/>
    <circle cx="1064" cy="318" r="0.9" opacity="0.2"/><circle cx="1148" cy="452" r="1.6" opacity="0.37"/>
    <circle cx="1084" cy="586" r="1.1" opacity="0.25"/><circle cx="1160" cy="700" r="1.4" opacity="0.32"/>
    <circle cx="1028" cy="812" r="1" opacity="0.22"/><circle cx="912" cy="742" r="1.7" opacity="0.38"/>
    <circle cx="806" cy="846" r="1.2" opacity="0.27"/><circle cx="700" cy="778" r="0.9" opacity="0.2"/>
    <circle cx="596" cy="862" r="1.5" opacity="0.34"/><circle cx="470" cy="812" r="1" opacity="0.23"/>
    <circle cx="368" cy="694" r="1.3" opacity="0.29"/><circle cx="30" cy="820" r="1.6" opacity="0.35"/>
    <circle cx="192" cy="284" r="0.8" opacity="0.18"/><circle cx="954" cy="470" r="0.9" opacity="0.2"/>
    <circle cx="1042" cy="660" r="0.8" opacity="0.19"/><circle cx="268" cy="600" r="0.9" opacity="0.21"/>
    <circle cx="352" cy="360" r="0.8" opacity="0.17"/><circle cx="880" cy="300" r="1" opacity="0.22"/>
    <circle cx="646" cy="700" r="0.8" opacity="0.18"/><circle cx="500" cy="500" r="0.7" opacity="0.15"/>
  </g>

  <!-- the subject -->
  <g filter="url(#soft)">
    <g transform="rotate(-13 600 430)">

      <!-- rings, far side -->
      <g clip-path="url(#backHalf)">
        <use xlink:href="#ringC" href="#ringC" fill="#b49768" opacity="0.5"/>
        <use xlink:href="#ringB" href="#ringB" fill="#e2c housing" opacity="0"/>
        <use xlink:href="#ringB" href="#ringB" fill="#dbc characteristics" opacity="0"/>
        <use xlink:href="#ringB" href="#ringB" fill="#dbc294" opacity="0.86"/>
        <use xlink:href="#ringD" href="#ringD" fill="#4b3a22" opacity="0.7"/>
        <use xlink:href="#ringA" href="#ringA" fill="#c2a678" opacity="0.76"/>
        <use xlink:href="#ringE" href="#ringE" fill="#5a4526" opacity="0.5"/>
        <use xlink:href="#ringF" href="#ringF" fill="#e8d3a6" opacity="0.4"/>
        <rect x="169" y="290" width="862" height="140" fill="url(#ansae)"/>
      </g>

      <!-- shadow of the globe thrown across the far rings -->
      <g clip-path="url(#ringsClip)">
        <path d="M600,430 L1040,300 L1040,430 Z" fill="#150e05" opacity="0.42" filter="url(#softer)"/>
      </g>

      <!-- the globe -->
      <circle cx="600" cy="430" r="190" fill="url(#globe)"/>
      <g clip-path="url(#globeClip)">
        <g filter="url(#softer)" opacity="0.9">
          <g fill="none" stroke-linecap="round">
            <path d="M506,265 Q600,321 694,265" stroke="#6b4f2c" stroke-width="26" opacity="0.35"/>
            <path d="M462,300 Q600,383 738,300" stroke="#efdcb2" stroke-width="22" opacity="0.30"/>
            <path d="M436,335 Q600,433 764,335" stroke="#a8753f" stroke-width="26" opacity="0.40"/>
            <path d="M418,375 Q600,484 782,375" stroke="#f3e0b8" stroke-width="30" opacity="0.32"/>
            <path d="M410,422 Q600,536 790,422" stroke="#b07f45" stroke-width="34" opacity="0.36"/>
            <path d="M414,470 Q600,582 786,470" stroke="#eeddb0" stroke-width="26" opacity="0.30"/>
            <path d="M430,515 Q600,617 770,515" stroke="#9c6d3a" stroke-width="28" opacity="0.34"/>
            <path d="M462,560 Q600,643 738,560" stroke="#e3cda2" stroke-width="22" opacity="0.24"/>
            <path d="M506,595 Q600,651 694,595" stroke="#6b4f2c" stroke-width="24" opacity="0.32"/>
          </g>
        </g>
        <!-- ring shadow laid on the globe -->
        <g filter="url(#softer)">
          <path d="M400,452 Q600,540 800,452" fill="none" stroke="#38270f" stroke-width="30" opacity="0.42"/>
          <path d="M404,478 Q600,562 796,478" fill="none" stroke="#2c1e0b" stroke-width="14" opacity="0.28"/>
        </g>
        <circle cx="600" cy="430" r="190" fill="url(#shade)"/>
      </g>

      <!-- rings, near side -->
      <g clip-path="url(#frontHalf)">
        <use xlink:href="#ringC" href="#ringC" fill="#bda27a" opacity="0.46"/>
        <use xlink:href="#ringB" href="#ringB" fill="#e4cd9f" opacity="0.9"/>
        <use xlink:href="#ringD" href="#ringD" fill="#4b3a22" opacity="0.66"/>
        <use xlink:href="#ringA" href="#ringA" fill="#c9ae80" opacity="0.8"/>
        <use xlink:href="#ringE" href="#ringE" fill="#5a4526" opacity="0.5"/>
        <use xlink:href="#ringF" href="#ringF" fill="#eddaad" opacity="0.44"/>
        <rect x="169" y="430" width="862" height="140" fill="url(#ansae)"/>
      </g>

    </g>
  </g>

  <!-- halation around the lit limb -->
  <ellipse cx="592" cy="418" rx="300" ry="290" fill="url(#bloom)"/>
  <ellipse cx="600" cy="430" rx="520" ry="230" fill="url(#bloom)" opacity="0.35" transform="rotate(-13 600 430)"/>

  <!-- attendant moons -->
  <g>
    <circle cx="196" cy="712" r="16" fill="#e9d5aa" opacity="0.10" filter="url(#haze)"/>
    <circle cx="196" cy="712" r="4.6" fill="#f0dcb2" opacity="0.72"/>
    <circle cx="1016" cy="236" r="12" fill="#e9d5aa" opacity="0.09" filter="url(#haze)"/>
    <circle cx="1016" cy="236" r="3.1" fill="#eeddb4" opacity="0.6"/>
    <circle cx="1094" cy="618" r="2.2" fill="#e8d6ae" opacity="0.48"/>
  </g>

  <!-- age: stains, leak, bleach, wash -->
  <g filter="url(#blot)" opacity="0.5">
    <ellipse cx="150" cy="200" rx="130" ry="90" fill="#7a5a2c" opacity="0.16"/>
    <ellipse cx="1040" cy="820" rx="170" ry="110" fill="#6a4a22" opacity="0.14"/>
    <ellipse cx="760" cy="120" rx="150" ry="80" fill="#8a6a34" opacity="0.10"/>
  </g>
  <ellipse cx="1190" cy="-30" rx="430" ry="330" fill="url(#leak)"/>
  <ellipse cx="10" cy="900" rx="300" ry="230" fill="url(#leak)" opacity="0.5"/>
  <ellipse cx="60" cy="40" rx="260" ry="200" fill="url(#bleach)"/>
  <rect x="0" y="0" width="1200" height="900" fill="url(#wash)"/>
  <rect x="0" y="0" width="1200" height="900" fill="url(#vig)"/>

  <!-- emulsion grain and dust -->
  <rect x="0" y="0" width="1200" height="900" filter="url(#grain)" opacity="0.30"/>
  <rect x="0" y="0" width="1200" height="900" filter="url(#grain2)" opacity="0.22"/>

  <g stroke="#f5e8cc" fill="none" opacity="0.13">
    <path d="M287,0 L281,900" stroke-width="1.1"/>
    <path d="M842,0 L849,412" stroke-width="0.9" opacity="0.7"/>
    <path d="M1063,470 L1057,900" stroke-width="0.8" opacity="0.6"/>
    <path d="M120,646 L268,596" stroke-width="0.7" opacity="0.5"/>
  </g>
  <g fill="#f7ecd2" opacity="0.22">
    <circle cx="392" cy="238" r="1.6"/><circle cx="928" cy="546" r="1.2"/>
    <circle cx="214" cy="470" r="1"/><circle cx="694" cy="812" r="1.4"/>
    <circle cx="1122" cy="382" r="1.1"/>
  </g>
  <g fill="#1c1207" opacity="0.3">
    <circle cx="530" cy="176" r="1.8"/><circle cx="866" cy="676" r="1.3"/>
    <circle cx="316" cy="742" r="1.5"/><circle cx="1002" cy="106" r="1.1"/>
  </g>
</svg>