<svg xmlns="http://www.w3.org/2000/svg" viewBox="84.8 15.0 230.2 460.8">
  <defs>
    <linearGradient id="redBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a0f14"/>
      <stop offset="0.18" stop-color="#c91822"/>
      <stop offset="0.42" stop-color="#f03842"/>
      <stop offset="0.58" stop-color="#e02530"/>
      <stop offset="0.82" stop-color="#a8121a"/>
      <stop offset="1" stop-color="#6e0a10"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8894"/>
      <stop offset="0.25" stop-color="#d7dee5"/>
      <stop offset="0.5" stop-color="#f4f8fb"/>
      <stop offset="0.75" stop-color="#b3bec9"/>
      <stop offset="1" stop-color="#6b7580"/>
    </linearGradient>
    <linearGradient id="silverV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="0.5" stop-color="#c3ccd5"/>
      <stop offset="1" stop-color="#8a95a1"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.45" stop-color="#9fdcef"/>
      <stop offset="1" stop-color="#3e8fb0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.35" stop-color="#ffc93c"/>
      <stop offset="0.75" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#f43d00" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- exhaust flames -->
  <path d="M182 428 Q200 520 218 428 Z" fill="url(#flame)"/>
  <path d="M190 428 Q200 478 210 428 Z" fill="#fff3b0" opacity="0.85"/>
  <path d="M140 436 Q148 480 158 438 Z" fill="url(#flame)" opacity="0.9"/>
  <path d="M242 438 Q252 480 260 436 Z" fill="url(#flame)" opacity="0.9"/>

  <!-- fins -->
  <path d="M118 300 C96 340 84 390 90 440 C110 420 128 400 136 372 L140 300 Z" fill="url(#redBody)" stroke="#5e090d" stroke-width="3"/>
  <path d="M282 300 C304 340 316 390 310 440 C290 420 272 400 264 372 L260 300 Z" fill="url(#redBody)" stroke="#5e090d" stroke-width="3"/>
  <path d="M100 430 C110 414 122 400 130 382" fill="none" stroke="url(#silver)" stroke-width="7" stroke-linecap="round"/>
  <path d="M300 430 C290 414 278 400 270 382" fill="none" stroke="url(#silver)" stroke-width="7" stroke-linecap="round"/>

  <!-- main body -->
  <path d="M200 26 C240 70 262 140 262 230 L262 340 C262 380 236 404 200 404 C164 404 138 380 138 340 L138 230 C138 140 160 70 200 26 Z" fill="url(#redBody)" stroke="#5e090d" stroke-width="3"/>

  <!-- nose cone silver tip -->
  <path d="M200 26 C214 42 224 62 231 84 C214 74 186 74 169 84 C176 62 186 42 200 26 Z" fill="url(#silverV)" stroke="#6b7580" stroke-width="2"/>
  <circle cx="200" cy="24" r="6" fill="url(#silver)" stroke="#5b656f" stroke-width="2"/>

  <!-- body highlight -->
  <path d="M168 90 C156 140 152 220 152 320" fill="none" stroke="#ff8a90" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <path d="M164 96 C155 140 151 210 151 300" fill="none" stroke="#ffd9db" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- silver trim bands -->
  <path d="M138 300 L262 300 L262 322 L138 322 Z" fill="url(#silver)" stroke="#6b7580" stroke-width="2"/>
  <path d="M140 356 Q200 376 260 356 L260 372 Q200 394 140 372 Z" fill="url(#silver)" stroke="#6b7580" stroke-width="2"/>

  <!-- portholes -->
  <circle cx="200" cy="150" r="34" fill="url(#silver)" stroke="#5b656f" stroke-width="3"/>
  <circle cx="200" cy="150" r="25" fill="url(#glass)" stroke="#2d6a86" stroke-width="2"/>
  <ellipse cx="191" cy="140" rx="10" ry="6" fill="#ffffff" opacity="0.75" transform="rotate(-25 191 140)"/>

  <circle cx="200" cy="238" r="24" fill="url(#silver)" stroke="#5b656f" stroke-width="3"/>
  <circle cx="200" cy="238" r="17" fill="url(#glass)" stroke="#2d6a86" stroke-width="2"/>
  <ellipse cx="194" cy="232" rx="7" ry="4" fill="#ffffff" opacity="0.75" transform="rotate(-25 194 232)"/>

  <!-- googie starburst badge -->
  <g transform="translate(200 268)">
    <path d="M0 -12 L2.6 -2.6 L12 0 L2.6 2.6 L0 12 L-2.6 2.6 L-12 0 L-2.6 -2.6 Z" fill="#ffe28a" stroke="#c98f1b" stroke-width="1.5"/>
    <circle r="2.6" fill="#fff6d8"/>
  </g>

  <!-- engine nozzles -->
  <path d="M168 398 L232 398 L224 430 L176 430 Z" fill="url(#silver)" stroke="#5b656f" stroke-width="2.5"/>
  <path d="M138 396 L164 406 L158 438 L136 424 Z" fill="url(#silverV)" stroke="#5b656f" stroke-width="2.5"/>
  <path d="M262 396 L236 406 L242 438 L264 424 Z" fill="url(#silverV)" stroke="#5b656f" stroke-width="2.5"/>
  <ellipse cx="200" cy="429" rx="24" ry="6" fill="#3c454e"/>
  <ellipse cx="148" cy="436" rx="10" ry="4" fill="#3c454e"/>
  <ellipse cx="252" cy="436" rx="10" ry="4" fill="#3c454e"/>

  <!-- rivets on trim band -->
  <circle cx="158" cy="311" r="2.5" fill="#eef3f7"/>
  <circle cx="186" cy="311" r="2.5" fill="#eef3f7"/>
  <circle cx="214" cy="311" r="2.5" fill="#eef3f7"/>
  <circle cx="242" cy="311" r="2.5" fill="#eef3f7"/>
</svg>