<svg xmlns="http://www.w3.org/2000/svg" viewBox="115.8 36.0 568.0 687.8">
  <defs>
    <linearGradient id="iceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff5ff"/>
      <stop offset="0.45" stop-color="#b9e7ff"/>
      <stop offset="1" stop-color="#8bd0ff"/>
    </linearGradient>
    <linearGradient id="iceSideGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ed9ff"/>
      <stop offset="1" stop-color="#c8ecff"/>
    </linearGradient>
    <linearGradient id="iceTopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5fcff"/>
      <stop offset="1" stop-color="#c7e7ff"/>
    </linearGradient>
    <linearGradient id="mammothFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#925637"/>
      <stop offset="1" stop-color="#6d3b24"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a86a45"/>
      <stop offset="1" stop-color="#754026"/>
    </linearGradient>
    <linearGradient id="tuskGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfaf4"/>
      <stop offset="1" stop-color="#ddd3c4"/>
    </linearGradient>
    <linearGradient id="toeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e4d6"/>
      <stop offset="1" stop-color="#d0b39a"/>
    </linearGradient>
    <radialGradient id="eyeshadowGrad" cx="0.5" cy="0.6" r="0.7">
      <stop offset="0" stop-color="#b37ad8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7f4eb1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iceHighlight" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cubeClip">
      <path d="M120 80 L520 40 L680 120 L280 160 Z"/>
      <path d="M280 160 L680 120 L680 640 L280 720 Z"/>
      <path d="M120 80 L280 160 L280 720 L120 640 Z"/>
    </clipPath>
  </defs>

  <!-- Ice cube base shapes -->
