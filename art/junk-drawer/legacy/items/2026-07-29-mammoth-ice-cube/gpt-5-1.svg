  <!-- Ice cube front gloss/overlay after mammoth for depth -->
  <g>
    <path d="M120 80 L520 40 L680 120 L280 160 Z"
          fill="url(#iceTopGrad)"
          opacity="0.18"/>
    <path d="M280 160 L680 120 L680 640 L280 720 Z"
          fill="url(#iceSideGrad)"
          opacity="0.25"/>
    <path d="M120 80 L280 160 L280 720 L120 640 Z"
          fill="url(#iceGrad)"
          opacity="0.3"/>

    <!-- Strong front highlights -->
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M130 120 L260 180 L260 340"/>
      <path d="M300 185 L650 145"/>
      <path d="M290 210 L290 400"/>
      <path d="M290 480 L290 700"/>
      <path d="M310 700 L660 635"/>
      <path d="M140 600 L260 645"/>
    </g>

    <!-- Sparkle facets -->
    <g fill="#ffffff" opacity="0.9">
      <polygon points="200 150 210 170 190 170"/>
      <polygon points="420 90 430 110 410 110"/>
      <polygon points="610 160 622 180 600 182"/>
      <polygon points="310 650 322 668 302 672"/>
      <polygon points="540 630 552 648 532 652"/>
      <polygon points="170 590 182 608 162 612"/>
