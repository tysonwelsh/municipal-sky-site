      <path d="M330 210 Q380 190 440 205 Q410 235 390 230 Q365 225 350 245"/>
      <path d="M510 185 Q570 170 630 175 Q605 205 580 210 Q545 215 525 235"/>
      <path d="M200 260 Q220 300 250 320 Q220 345 200 330 Q180 315 175 295"/>
      <path d="M330 320 Q380 310 425 340 Q395 365 365 360 Q345 355 330 370"/>
      <path d="M520 320 Q560 300 620 310 Q600 340 575 345 Q545 345 525 360"/>
      <path d="M200 440 Q230 470 250 510 Q225 525 210 515 Q190 500 185 480"/>
      <path d="M340 470 Q380 455 430 470 Q400 500 375 500 Q350 495 335 510"/>
      <path d="M520 470 Q560 455 620 460 Q600 490 575 495 Q545 495 525 510"/>
    </g>

    <!-- Ice highlights -->
    <g opacity="0.85">
      <path d="M135 95 Q320 55 510 50 Q470 90 430 100 Q360 115 270 130 Q210 140 150 135 Z"
