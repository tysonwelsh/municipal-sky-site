                 C442 515 418 525 393 525
                 C370 525 350 517 337 503
                 C325 490 318 472 320 452
                 C322 435 334 420 348 415
                 C362 410 378 413 386 425
                 C394 437 393 455 383 465
                 C376 472 370 475 365 476"
