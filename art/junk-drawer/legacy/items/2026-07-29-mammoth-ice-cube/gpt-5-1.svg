          fill="url(#iceGrad)"
          stroke="#6fbbe9"
          stroke-width="4"
          stroke-linejoin="round"/>

    <!-- Inner refracted edges -->
    <g opacity="0.45" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
