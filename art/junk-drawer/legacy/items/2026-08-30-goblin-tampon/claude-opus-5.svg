<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 520">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dcb63"/>
      <stop offset="0.5" stop-color="#71a541"/>
      <stop offset="1" stop-color="#4a7429"/>
    </linearGradient>
    <linearGradient id="cotton" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#f6f6f2"/>
      <stop offset="0.7" stop-color="#e2e2da"/>
      <stop offset="1" stop-color="#c9c9c0"/>
    </linearGradient>
    <linearGradient id="applicator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="0.3" stop-color="#cfe2f3"/>
      <stop offset="0.75" stop-color="#9fbdd6"/>
      <stop offset="1" stop-color="#7897b3"/>
    </linearGradient>
    <linearGradient id="cordg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f0e6"/>
      <stop offset="1" stop-color="#cdc9b6"/>
    </linearGradient>
    <radialGradient id="eyeg" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#e8c53d"/>
    </radialGradient>
  </defs>

  <!-- ===== TAMPON BODY (the goblin's torso) ===== -->
  <g>
    <!-- cotton plug lower body -->
    <path d="M92 262 L92 452 q0 34 58 34 q58 0 58 -34 L208 262 Z" fill="url(#cotton)" stroke="#8f8f84" stroke-width="3"/>
    <!-- compression grooves -->
    <path d="M112 268 L108 452" stroke="#c4c4b8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M138 268 L136 462" stroke="#c4c4b8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M164 268 L166 462" stroke="#c4c4b8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M190 268 L194 452" stroke="#c4c4b8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- string -->
    <path d="M150 484 q4 22 -14 32 q-20 11 -14 30" fill="none" stroke="url(#cordg)" stroke-width="7" stroke-linecap="round"/>
    <path d="M150 484 q4 22 -14 32 q-20 11 -14 30" fill="none" stroke="#a9a48f" stroke-width="2" stroke-dasharray="5 7" stroke-linecap="round"/>

    <!-- applicator band / shoulders -->
    <path d="M84 262 q66 -22 132 0 l0 -46 q-66 -20 -132 0 Z" fill="url(#applicator)" stroke="#5d7f9b" stroke-width="3"/>
  </g>

  <!-- ===== ARMS ===== -->
  <path d="M92 292 q-42 12 -54 52 q-8 24 8 40 q10 10 20 2 q8 -8 0 -18 q-8 -12 -1 -25 q10 -18 33 -26 Z" fill="url(#skin)" stroke="#33551c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M208 292 q42 12 54 52 q8 24 -8 40 q-10 10 -20 2 q-8 -8 0 -18 q8 -12 1 -25 q-10 -18 -33 -26 Z" fill="url(#skin)" stroke="#33551c" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- claw fingers -->
  <g stroke="#33551c" stroke-width="3" fill="url(#skin)">
    <path d="M46 380 q-14 6 -16 18 q-1 8 7 8 q7 0 9 -8"/>
    <path d="M254 380 q14 6 16 18 q1 8 -7 8 q-7 0 -9 -8"/>
  </g>

  <!-- ===== FEET ===== -->
  <path d="M104 470 q-30 10 -34 24 q-3 12 14 12 l40 0 q10 0 8 -12 q-2 -14 -12 -22 Z" fill="url(#skin)" stroke="#33551c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M196 470 q30 10 34 24 q3 12 -14 12 l-40 0 q-10 0 -8 -12 q2 -14 12 -22 Z" fill="url(#skin)" stroke="#33551c" stroke-width="3.5" stroke-linejoin="round"/>
  <g stroke="#2c4718" stroke-width="2.5" fill="none">
    <path d="M84 494 l-8 8"/><path d="M104 498 l-4 10"/><path d="M124 498 l2 10"/>
    <path d="M216 494 l8 8"/><path d="M196 498 l4 10"/><path d="M176 498 l-2 10"/>
  </g>

  <!-- ===== EARS ===== -->
  <path d="M96 176 q-52 -48 -84 -46 q-6 1 -2 8 q22 34 30 62 q4 16 22 14 q22 -4 34 -22 Z" fill="url(#skin)" stroke="#33551c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M204 176 q52 -48 84 -46 q6 1 2 8 q-22 34 -30 62 q-4 16 -22 14 q-22 -4 -34 -22 Z" fill="url(#skin)" stroke="#33551c" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M84 172 q-32 -22 -52 -26 q16 22 24 44" fill="none" stroke="#4b7a2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M216 172 q32 -22 52 -26 q-16 22 -24 44" fill="none" stroke="#4b7a2b" stroke-width="3" stroke-linecap="round"/>

  <!-- ===== HEAD ===== -->
  <path d="M150 30 q68 0 78 66 q10 62 -22 100 q-24 28 -56 28 q-32 0 -56 -28 q-32 -38 -22 -100 q10 -66 78 -66 Z" fill="url(#skin)" stroke="#33551c" stroke-width="4" stroke-linejoin="round"/>

  <!-- brow ridge -->
  <path d="M78 106 q30 -20 54 -8" fill="none" stroke="#33551c" stroke-width="7" stroke-linecap="round"/>
  <path d="M222 106 q-30 -20 -54 -8" fill="none" stroke="#33551c" stroke-width="7" stroke-linecap="round"/>

  <!-- eyes -->
  <ellipse cx="112" cy="128" rx="24" ry="19" fill="url(#eyeg)" stroke="#33551c" stroke-width="3"/>
  <ellipse cx="188" cy="128" rx="24" ry="19" fill="url(#eyeg)" stroke="#33551c" stroke-width="3"/>
  <ellipse cx="116" cy="130" rx="8" ry="11" fill="#1d2410"/>
  <ellipse cx="184" cy="130" rx="8" ry="11" fill="#1d2410"/>
  <circle cx="112" cy="124" r="3.4" fill="#ffffff"/>
  <circle cx="180" cy="124" r="3.4" fill="#ffffff"/>

  <!-- nose -->
  <path d="M150 132 q16 24 12 38 q-3 10 -12 10 q-9 0 -12 -10 q-4 -14 12 -38 Z" fill="#6d9b3c" stroke="#33551c" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="143" cy="174" r="2.6" fill="#2c4718"/>
  <circle cx="157" cy="174" r="2.6" fill="#2c4718"/>

  <!-- grin -->
  <path d="M108 196 q42 34 84 0 q-14 30 -42 30 q-28 0 -42 -30 Z" fill="#3d2431" stroke="#33551c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M120 203 l7 13 l7 -11 Z" fill="#fffdf0"/>
  <path d="M143 210 l7 14 l7 -14 Z" fill="#fffdf0"/>
  <path d="M166 202 l7 12 l7 -13 Z" fill="#fffdf0"/>
  <path d="M150 224 q22 -2 34 -22" fill="none" stroke="#c46a86" stroke-width="0"/>

  <!-- warts / texture -->
  <circle cx="92" cy="80" r="5" fill="#8ab84f" stroke="#4b7a2b" stroke-width="2"/>
  <circle cx="204" cy="72" r="4" fill="#8ab84f" stroke="#4b7a2b" stroke-width="2"/>
  <circle cx="176" cy="52" r="3" fill="#8ab84f" stroke="#4b7a2b" stroke-width="2"/>
</svg>