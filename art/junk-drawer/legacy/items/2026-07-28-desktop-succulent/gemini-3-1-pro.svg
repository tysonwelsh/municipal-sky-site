<svg xmlns="http://www.w3.org/2000/svg" viewBox="18.0 28.0 363.8 423.8" width="363.8" height="423.8">
  <defs>
    <!-- Pot Gradients -->
    <linearGradient id="clayGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A996" />
      <stop offset="30%" stop-color="#D7937F" />
      <stop offset="85%" stop-color="#BD745E" />
      <stop offset="100%" stop-color="#9E5D49" />
    </linearGradient>
    <linearGradient id="lipGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2B7A5" />
      <stop offset="30%" stop-color="#E09F8C" />
      <stop offset="85%" stop-color="#C77D67" />
      <stop offset="100%" stop-color="#A86551" />
    </linearGradient>
    <linearGradient id="innerPot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A342E" />
      <stop offset="100%" stop-color="#2D1E19" />
    </linearGradient>

    <!-- Succulent Gradients -->
    <linearGradient id="leafDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3D5C4A" />
      <stop offset="100%" stop-color="#5E876E" />
    </linearGradient>
    <linearGradient id="leafMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#51755F" />
      <stop offset="100%" stop-color="#7DA88E" />
    </linearGradient>
    <linearGradient id="leafLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#698F78" />
      <stop offset="80%" stop-color="#9BC7AD" />
      <stop offset="100%" stop-color="#D9A8A8" /> <!-- Pinkish tips -->
    </linearGradient>
  </defs>

  <!-- Wooden Stand (Scandi style) -->
  <path d="M 110 390 L 125 450 L 145 450 L 130 390 Z" fill="#D4B48F" />
  <path d="M 290 390 L 275 450 L 255 450 L 270 390 Z" fill="#B39370" />
  <path d="M 115 410 L 285 410 L 285 425 L 115 425 Z" fill="#C4A47E" />
  <path d="M 175 390 L 175 450 L 195 450 L 195 390 Z" fill="#E3C4A0" />

  <!-- Back of Pot Rim / Soil -->
  <ellipse cx="200" cy="270" rx="130" ry="25" fill="url(#innerPot)" />

  <!-- Main Pot Body -->
  <path d="M 70 270 L 95 400 Q 100 415 120 415 L 280 415 Q 300 415 305 400 L 330 270 Z" fill="url(#clayGradient)" />
  
  <!-- Pot Lip -->
  <path d="M 60 270 Q 60 250 200 250 Q 340 250 340 270 Q 340 290 200 290 Q 60 290 60 270 Z" fill="url(#lipGradient)" />
  <ellipse cx="200" cy="270" rx="130" ry="20" fill="url(#innerPot)" />

  <!-- Soil Pebbles -->
  <circle cx="120" cy="275" r="5" fill="#888" />
  <circle cx="135" cy="282" r="6" fill="#777" />
  <circle cx="150" cy="278" r="4" fill="#666" />
  <circle cx="270" cy="275" r="7" fill="#888" />
  <circle cx="250" cy="282" r="5" fill="#999" />
  <circle cx="285" cy="270" r="4" fill="#666" />

  <!-- Succulent Plant -->
  <g transform="translate(200, 240)">
    <!-- Back Row Leaves -->
    <path d="M 0 0 C -60 -40 -120 -80 -140 -140 C -80 -120 -30 -60 0 0 Z" fill="url(#leafDark)" />
    <path d="M 0 0 C 60 -40 120 -80 140 -140 C 80 -120 30 -60 0 0 Z" fill="url(#leafDark)" />
    <path d="M 0 0 C -20 -70 -40 -150 0 -210 C 40 -150 20 -70 0 0 Z" fill="url(#leafDark)" />
    
    <!-- Mid-Back Row Leaves -->
    <path d="M 0 0 C -70 -20 -150 -40 -180 -80 C -120 -50 -50 -20 0 0 Z" fill="url(#leafMid)" />
    <path d="M 0 0 C 70 -20 150 -40 180 -80 C 120 -50 50 -20 0 0 Z" fill="url(#leafMid)" />
    <path d="M 0 0 C -50 -50 -100 -120 -80 -180 C -30 -120 -10 -50 0 0 Z" fill="url(#leafMid)" />
    <path d="M 0 0 C 50 -50 100 -120 80 -180 C 30 -120 10 -50 0 0 Z" fill="url(#leafMid)" />

    <!-- Mid Row Leaves -->
    <path d="M 0 0 C -40 -20 -130 -10 -150 -30 C -90 -10 -30 -10 0 0 Z" fill="url(#leafLight)" />
    <path d="M 0 0 C 40 -20 130 -10 150 -30 C 90 -10 30 -10 0 0 Z" fill="url(#leafLight)" />
    <path d="M 0 0 C -30 -40 -70 -100 -40 -140 C -10 -90 -5 -30 0 0 Z" fill="url(#leafLight)" />
    <path d="M 0 0 C 30 -40 70 -100 40 -140 C 10 -90 5 -30 0 0 Z" fill="url(#leafLight)" />

    <!-- Front Center Leaves -->
    <path d="M 0 0 C -20 -20 -60 -40 -80 -50 C -40 -30 -10 -10 0 0 Z" fill="url(#leafLight)" />
    <path d="M 0 0 C 20 -20 60 -40 80 -50 C 40 -30 10 -10 0 0 Z" fill="url(#leafLight)" />
    <path d="M 0 0 C -15 -25 -30 -70 0 -90 C 30 -70 15 -25 0 0 Z" fill="url(#leafLight)" />
    <path d="M 0 0 C -10 -15 -20 -40 0 -50 C 20 -40 10 -15 0 0 Z" fill="#BBE3C9" />
  </g>
</svg>