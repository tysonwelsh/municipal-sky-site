<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" role="img"
     aria-label="A closed manila file folder lying flat, its left-of-centre tab typed ANALYTICS, with the edges of chart papers peeking out the right side">
  <!-- THE ANALYTICS FOLDER (PLAN-ANALYTICS §2, 2026-08-28) — drawer furniture
       in the instructions-sheet / turn-object tradition: a static asset the
       page injects, never an entry. Tapping it opens the dashboard; the
       artwork's whole job is to say "closed file folder, charts inside"
       at pile size.

       Plan view of a real manila folder: the FOLD is the bottom long edge,
       the tab is cut from the BACK panel's top edge, and the front flap
       sits one step in front of it — so the folder reads closed from the
       12-unit strip of darker back panel showing above the flap's cut edge
       (a real folder's front is about 3/8" shorter than its back, which is
       what that strip is), and from the ridge along the bottom fold. Sits
       deliberately between its two siblings: warmer and more dimensional
       than the flat instructions sheet, far quieter than the turn button's
       backlit hardware.

       OWNER REVISION 2026-08-28 — tab moved off-centre to first position,
       rebuilt as a real trapezoid cut (45° side cuts, 2.5-unit corner
       radii only), and the FIELD RECORDS stamp plus the JD-A1 code struck
       so the face went back to quiet manila.

       PHOTO-CRITIC LOOP 2026-08-28 — the folder was then measured against
       two photographs of real manila folders (a 1/3-cut first-position
       letter folder close-shot, and a two-folder top-down). What survived
       photographic comparison and is now FROZEN: the 45° cuts, the tab's
       depth exaggeration, the 2.5-unit corner radii, the reveal strip, and
       the quiet face. What the photographs killed:
       1. THE FRAME. The flap had been inset from the back panel on three
          sides, leaving slivers that read as an icon in a tray at 150px.
          A real folder is ONE FOLDED SHEET with a single clean outer edge,
          so flap and back panel now share the same outline (x 6..326,
          bottom 254) and the two inner rim strokes — illustrator's chrome
          no photo shows — are gone.
       2. THE LEDGE. (Superseded by the owner round below — the critic's
          finding was that first position is flush left with one cut, since
          in both photographs three tabs tile the top edge.)
       3. TYPE TOO SMALL. ANALYTICS was sitting on the legibility floor at
          150px and wants every unit the cut will give it.
       Also from that pass: the chart sliver was reading as one closed
       white card, so it lost its rounding and its outlining stroke and
       gained a second sheet fanned behind it — it is PAPERS now; and the
       manila moved off golden tan toward the pale straw the photographs
       show, which matters because the drawer's own background sits at
       roughly the old hue and the folder was separating from it by
       saturation alone.

       OWNER ROUND ON THE TAB 2026-08-28 — the owner did not love the
       flush-left result and their taste governs, so the critic's
       first-position finding above is SUPERSEDED. Two changes:
       1. INSET FROM THE LEFT. The tab is left-of-centre, not against the
          corner: 30 units of plain folder top edge run to its left before
          the cut starts (x 6 to the base at x 36), which is enough run to
          read as the folder's top rather than as the sliver-ledge the
          earlier inset left. Not touching the corner, it honestly gets
          TWO cuts again, one either side.
       2. GENTLER CUTS. 45° from vertical read too sharp and too pointy.
          Both cuts now run 44 across in 28 down — 57.5° from vertical,
          which is also where the critic's own measurements of the
          reference photographs landed (55–57°); the 45° had been a
          mid-range compromise, not a measured value. Corner radii stay
          at 2.5.
       Shallow cuts are expensive in width — 88 units of the tab go to the
       two runs — so the top edge (x 80..172) is narrower than the label,
       and ANALYTICS is allowed to overhang it and sit over the diagonals,
       the way a real tab label runs close to its cut. It clears both cuts
       by ~4 units at its cap line. Letterspacing was trimmed before the
       font was, per the brief: 19/110 rather than shrinking below 18.

       The one proportion knowingly exaggerated against the photographs is
       tab depth, and the critic blessed it: a real letter folder's tab
       projects about 1/2" (13 units at this asset's scale of ~26.7 units
       to the inch); ours projects 28, roughly double, because this tab is
       the item's ENTIRE name in a pile drawn at ~150px wide and type small
       enough for a true-scale tab would be unreadable there.

       Ink runs x 5..338, y 3..254 — worst dead margin 2.1%, and the
       drawer's drag/size math trusts the viewBox rectangle, so it must
       stay that way if this is ever reframed.

       NO baked cast shadow: the pile's CSS drop-shadow grounds the item.
       The only darks here are the folder's own layers on each other (the
       flap's shadow on the back strip, the flap's shadow on the sheets
       sticking out) and both are clipped to paper they actually fall on.

       Self-contained: no script, no on* handlers, no foreignObject, no
       external refs, no SMIL, no raster. Every id is prefixed af_ so the
       pile's per-copy id namespacing (JD_svgInst) has a clean handle. -->
  <defs>
    <!-- back panel: lighter where the tab stands clear of the flap, falling
         off downward where the flap covers it anyway. Straw, and a step
         darker than the flap at every stop — that value gap is the whole
         reason the reveal strip reads as depth. -->
    <linearGradient id="af_backg" gradientUnits="userSpaceOnUse" x1="20" y1="4" x2="250" y2="252">
      <stop offset="0"    stop-color="#e1c794"/>
      <stop offset="0.45" stop-color="#d3ba87"/>
      <stop offset="1"    stop-color="#bda371"/>
    </linearGradient>
    <!-- front flap: pale straw manila, light off the top-left -->
    <linearGradient id="af_frontg" gradientUnits="userSpaceOnUse" x1="20" y1="48" x2="316" y2="252">
      <stop offset="0"    stop-color="#e8d3a6"/>
      <stop offset="0.5"  stop-color="#dcc694"/>
      <stop offset="1"    stop-color="#c9af7c"/>
    </linearGradient>
    <!-- age: soft handling blotches, the instructions sheet's stain idiom -->
    <radialGradient id="af_stain" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#a97c3c" stop-opacity="0.13"/>
      <stop offset="0.7" stop-color="#a97c3c" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="#a97c3c" stop-opacity="0"/>
    </radialGradient>
    <!-- the flap's shadow on the strip of back panel above its cut edge -->
    <linearGradient id="af_flapshadow" gradientUnits="userSpaceOnUse" x1="0" y1="33" x2="0" y2="44">
      <stop offset="0" stop-color="#6b4a1c" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b4a1c" stop-opacity="0.3"/>
    </linearGradient>
    <!-- the flap's shadow on the sheets emerging from under it -->
    <linearGradient id="af_papershade" gradientUnits="userSpaceOnUse" x1="317" y1="0" x2="337" y2="0">
      <stop offset="0"   stop-color="#5d431e" stop-opacity="0.36"/>
      <stop offset="0.5" stop-color="#5d431e" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#5d431e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ============ BACK PANEL + TRAPEZOID TAB =============================
       One continuous outline, because on a real folder the tab is not a
       part stuck on — it is the back panel, cut. LEFT OF CENTRE: 30 units
       of plain top edge run out from the folder's left corner, then the
       cut rises from the base at x 36 to the top edge (x 80..172 at y 4)
       and drops again to the base at x 216 — both cuts 44 across by 28
       down, i.e. 57.5° from vertical. -->
  <path d="M6,37 Q6,32 11,32 L33.5,32 Q36,32 38.11,30.66 L77.89,5.34
           Q80,4 82.5,4 L169.5,4 Q172,4 174.11,5.34 L213.89,30.66
           Q216,32 218.5,32 L321,32 Q326,32 326,37 L326,249
           Q326,254 321,254 L11,254 Q6,254 6,249 Z"
        fill="url(#af_backg)" stroke="#ab8850" stroke-width="1.1" stroke-opacity="0.85"/>
  <!-- fibre wear along the whole exposed cut: up one, across the top, down
       the other -->
  <path d="M40.8,29.8 L78.4,5.8 Q79.8,4.8 82.4,4.8 L169.6,4.8
           Q172.2,4.8 173.6,5.8 L211.2,29.8"
        fill="none" stroke="#f5e4bb" stroke-opacity="0.4" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- ============ THE PAPERS INSIDE ======================================
       Drawn on the back panel and then buried by the flap, so only the few
       millimetres past the folder's open right edge survive. TWO sheets,
       fanned at different angles (-4.8° and -1.4°), because one rounded
       white rectangle read as a closed card rather than as filing. The
       colour chips, not the white paper, are what carry "charts in here"
       at drawer size, so the bars got the room; the strokes stay a hair
       off the fill so nothing outlines. -->
  <!-- the sheet behind: greyer, deeper in the folder's shade, showing only
       as a thin edge above its neighbour -->
  <g transform="rotate(-6 300 122)">
    <rect x="250" y="82" width="84" height="72" rx="0.5" fill="#ece5d2"/>
  </g>
  <g transform="rotate(-1.4 300 122)">
    <rect x="252" y="84" width="85" height="72" rx="0.5"
          fill="#f6f1e4" stroke="#e2d8c2" stroke-width="0.8"/>
    <g>
      <rect x="288" y="94"  width="46.5" height="6" rx="1" fill="#c2652b"/>
      <rect x="288" y="109" width="42"   height="6" rx="1" fill="#2f7d70"/>
      <rect x="288" y="124" width="45"   height="6" rx="1" fill="#35538f"/>
      <rect x="288" y="139" width="43"   height="6" rx="1" fill="#7a3b63"/>
    </g>
    <!-- the flap's shade falling across the emerging sheet; clipped to the
         sheet by construction (it is a sub-rect of it), so nothing dark
         floats outside the folder silhouette -->
    <rect x="317" y="84" width="20" height="72" fill="url(#af_papershade)"/>
  </g>

  <!-- the flap's shadow on the back strip, laid before the flap itself -->
  <rect x="6" y="33" width="320" height="11" fill="url(#af_flapshadow)"/>

  <!-- ============ FRONT FLAP =============================================
       Same outline as the back panel from the shoulders down: one folded
       sheet, one outer edge. The only thing separating front from back is
       the 12-unit reveal at the top. -->
  <path d="M6,49 Q6,44 11,44 L321,44 Q326,44 326,49 L326,249
           Q326,254 321,254 L11,254 Q6,254 6,249 Z"
        fill="url(#af_frontg)" stroke="#b8935a" stroke-width="1.1" stroke-opacity="0.85"/>

  <!-- handling stains: the face's only texture -->
  <ellipse cx="252" cy="196" rx="72" ry="46" fill="url(#af_stain)"/>
  <ellipse cx="74"  cy="104" rx="58" ry="42" fill="url(#af_stain)"/>

  <!-- the cut edge of the flap catches light — the one highlight the
       photographs do show, because it is a real paper edge and not a rim -->
  <path d="M12,45.2 L320,45.2" fill="none" stroke="#f7e8c4" stroke-opacity="0.5" stroke-width="1.3"/>

  <!-- ============ THE FOLD ===============================================
       The closed edge: a shallow trough, then the ridge of the crease
       itself catching the drawer light. -->
  <path d="M16,244.6 L316,244.6" fill="none" stroke="#b58e55" stroke-opacity="0.34" stroke-width="1.3"/>
  <path d="M14,249.4 L318,249.4" fill="none" stroke="#f4e3ba" stroke-opacity="0.45" stroke-width="2.2"/>
  <!-- softened, slightly bruised corners of the fold -->
  <path d="M7.2,240 Q7.2,252.8 12.4,252.9" fill="none" stroke="#a87f47" stroke-opacity="0.35" stroke-width="1.4"/>
  <path d="M324.8,240 Q324.8,252.8 319.6,252.9" fill="none" stroke="#a87f47" stroke-opacity="0.4" stroke-width="1.4"/>

  <!-- ============ THE TAB LABEL ==========================================
       The item's entire name in the pile, so it is set as big as the cut
       will hold and locked to 110 units of advance: mono, bold,
       letterspaced, with a faint impression under the ink the way a struck
       key leaves one. Centred at x 126 on the tab's axis. It is WIDER than
       the tab's top edge (x 80..172) on purpose — the shallow cuts spend
       88 units on the two runs, and a real tab label runs close to its cut
       — but it sits below y 4, where the trapezoid has already opened out,
       and clears both diagonals by about 4 units at its cap line. -->
  <g text-anchor="middle" font-family="'Courier Prime','Courier New',Courier,monospace"
     font-size="19" font-weight="700">
    <text x="126.8" y="26.8" fill="#8a6a34" opacity="0.35" textLength="110" lengthAdjust="spacing">ANALYTICS</text>
    <text x="126"   y="26"   fill="#33240f" textLength="110" lengthAdjust="spacing">ANALYTICS</text>
  </g>
</svg>
