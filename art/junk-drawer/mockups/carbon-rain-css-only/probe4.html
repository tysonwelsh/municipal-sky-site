 ["dev",[[0x0904,0x0939],[0x0958,0x0961],[0x0972,0x097F]]],
 ["brh",[[0x11013,0x11037]]],

 ["tifi2",[[0x1E7E0,0x1E7E6]]]
];
var CAPS={cjk:600,yii:400,eth:400,cyr:400,arb:400,grk:400};
var LAT="ABCDEFGHIJKLMNOPQRSTUVWXYZ",SUP=4,N=44;
var c=document.createElement("canvas");c.width=c.height=N;
var x=c.getContext("2d",{willReadFrequently:true});
var m=document.createElement("canvas").getContext("2d");
function adv(ch,px){m.font=px+'px "Courier Prime","Courier New",Courier,monospace';
  return m.measureText(ch).width;}
function shape(ch,px){
  x.clearRect(0,0,N,N);
  x.font=(px*SUP)+'px "Courier Prime","Courier New",Courier,monospace';
  x.textBaseline="middle";x.textAlign="center";x.fillStyle="#000";x.fillText(ch,N/2,N/2);
  var d=x.getImageData(0,0,N,N).data;
  var minx=N,maxx=-1,miny=N,maxy=-1,n=0;
  for(var i=0;i<N*N;i++){ if(d[i*4+3]>60){n++;var X=i%N,Y=(i/N)|0;
    if(X<minx)minx=X;if(X>maxx)maxx=X;if(Y<miny)miny=Y;if(Y>maxy)maxy=Y;} }
  if(!n) return null;
  var border=0,inner=0,bt=0,it=0;
  for(var Y=miny;Y<=maxy;Y++)for(var X=minx;X<=maxx;X++){
    var on=d[(Y*N+X)*4+3]>60, edge=(X<=minx+1||X>=maxx-1||Y<=miny+1||Y>=maxy-1);
    if(edge){bt++;if(on)border++;}else{it++;if(on)inner++;}
  }
  return {n:n,w:maxx-minx+1,h:maxy-miny+1,bf:border/Math.max(1,bt),inf:inner/Math.max(1,it)};
}
var lo=1e9,hi=0,latw=0;
for(var i=0;i<LAT.length;i++){var s=shape(LAT[i],10);
  if(s.n<lo)lo=s.n; if(s.n>hi)hi=s.n; latw+=s.w;}
latw/=LAT.length;
var MIN=Math.round(lo*0.5), MAX=Math.round(hi*1.9), LATADV=adv("A",10);
var out={},stats=[],qi=0;
function step(){
  var t0=performance.now();
  while(qi<R.length && performance.now()-t0<400){
    var key=R[qi][0], cand=[];
    R[qi][1].forEach(function(r){for(var cp=r[0];cp<=r[1];cp++)cand.push(cp);});
    // 1. measured normalisation: what size puts this script on Latin's advance?
    var sum=0,cnt=0;
    for(var i=0;i<cand.length&&cnt<40;i+=Math.max(1,(cand.length/40)|0)){
      var a=adv(String.fromCodePoint(cand[i]),10); if(a>0){sum+=a;cnt++;}
    }
    var size=cnt?Math.max(5,Math.min(13,Math.round(LATADV/(sum/cnt)*10*10)/10)):10;
    var kept=[];
    cand.forEach(function(cp){
      var ch=String.fromCodePoint(cp);
      if(adv(ch,10)<=0) return;
      var s=shape(ch,size);
      if(!s) return;
      if(s.n<MIN||s.n>MAX) return;
      if(s.bf>0.72&&s.inf<0.10) return;          // tofu box
      if(s.w>latw*1.95) return;                   // too wide for the cell
      kept.push(ch);
    });
    var cap=CAPS[key]||99999, step2=Math.max(1,Math.ceil(kept.length/cap)), thin=[];
    for(var i=0;i<kept.length;i+=step2) thin.push(kept[i]);
    out[key]={size:size,chars:thin.join("")};
    stats.push(key+":"+thin.length+"@"+size);
    qi++;
  }
  document.getElementById("o").textContent =
    (qi<R.length ? ("… "+qi+"/"+R.length+"\n") : ("DONE band "+MIN+"-"+MAX+"\n"))
    + stats.join(" ") + (qi>=R.length ? "\n%%%"+JSON.stringify(out)+"%%%" : "");
  if(qi<R.length) setTimeout(step,0);
}
step();
