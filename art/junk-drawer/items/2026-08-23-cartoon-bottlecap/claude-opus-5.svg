<svg xmlns="http://www.w3.org/2000/svg" viewBox="35.0 34.5 441.8 440.5">
  <defs>
    <radialGradient id="capFace" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ff8a7a"/>
      <stop offset="45%" stop-color="#ef3f39"/>
      <stop offset="100%" stop-color="#a5181f"/>
    </radialGradient>
    <radialGradient id="innerDisc" cx="40%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#fff4e2"/>
      <stop offset="70%" stop-color="#ffd9a3"/>
      <stop offset="100%" stop-color="#e8ab63"/>
    </radialGradient>
    <linearGradient id="rimSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d9dde3"/>
      <stop offset="65%" stop-color="#8f97a3"/>
      <stop offset="100%" stop-color="#5c636f"/>
    </linearGradient>
    <clipPath id="faceClip">
      <circle cx="256" cy="256" r="176"/>
    </clipPath>
  </defs>

  <!-- crimped skirt: 21 teeth -->
  <g stroke="#3a2027" stroke-width="7" stroke-linejoin="round">
    <g fill="url(#rimSteel)">
      <g id="teeth">
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(0 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(17.14 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(34.29 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(51.43 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(68.57 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(85.71 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(102.86 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(120 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(137.14 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(154.29 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(171.43 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(188.57 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(205.71 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(222.86 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(240 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(257.14 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(274.29 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(291.43 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(308.57 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(325.71 256 256)"/>
        <path d="M256 40 l31 10 -4 46 -54 0 -4 -46 z" transform="rotate(342.86 256 256)"/>
      </g>
    </g>
  </g>

  <!-- main cap face -->
  <circle cx="256" cy="256" r="176" fill="url(#capFace)" stroke="#3a2027" stroke-width="8"/>

  <g clip-path="url(#faceClip)">
    <!-- glossy top sweep -->
    <path d="M100 190 q90 -95 240 -60 -40 40 -120 44 -80 4 -120 16z" fill="#ffffff" opacity="0.28"/>
    <!-- bottom shading -->
    <path d="M60 300 q120 130 300 100 90 -22 130 -80 l0 130 -430 0z" fill="#7a0e18" opacity="0.28"/>
  </g>

  <!-- ring detail -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#8c1119" stroke-width="6" opacity="0.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ff9c8e" stroke-width="3" opacity="0.5" stroke-dasharray="14 12"/>

  <!-- inner disc label -->
  <circle cx="256" cy="256" r="106" fill="url(#innerDisc)" stroke="#3a2027" stroke-width="8"/>
  <circle cx="256" cy="256" r="88" fill="none" stroke="#c0762e" stroke-width="5" stroke-dasharray="10 10" opacity="0.7"/>

  <!-- star motif -->
  <path d="M256 178 l22 47 51 7 -37 36 9 51 -45 -24 -45 24 9 -51 -37 -36 51 -7z"
        fill="#ef3f39" stroke="#3a2027" stroke-width="7" stroke-linejoin="round"/>
  <path d="M256 196 l14 30 -14 8 -14 -8z" fill="#ff9b8f" opacity="0.75"/>

  <!-- cap highlight blob -->
  <ellipse cx="168" cy="150" rx="52" ry="26" transform="rotate(-28 168 150)" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="126" cy="196" rx="20" ry="10" transform="rotate(-28 126 196)" fill="#ffffff" opacity="0.4"/>

  <!-- sparkles -->
  <path d="M372 128 l9 26 26 9 -26 9 -9 26 -9 -26 -26 -9 26 -9z" fill="#fff6d9" stroke="#3a2027" stroke-width="5" stroke-linejoin="round"/>
  <path d="M112 372 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z" fill="#fff6d9" stroke="#3a2027" stroke-width="4.5" stroke-linejoin="round"/>
</svg>