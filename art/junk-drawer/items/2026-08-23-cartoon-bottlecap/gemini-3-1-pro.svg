<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g transform="matrix(0.98 0 0 0.98 2 2)">
    <!-- Black Scallops Outline -->
    <circle cx="100" cy="100" r="85" stroke="#000000" stroke-width="32" stroke-linecap="round" stroke-dasharray="0.01 25.4219" fill="none" />
    <circle cx="100" cy="100" r="90" fill="#000000" />

    <!-- Red Scallops -->
    <circle cx="100" cy="100" r="85" stroke="#e02424" stroke-width="20" stroke-linecap="round" stroke-dasharray="0.01 25.4219" fill="none" />
    <circle cx="100" cy="100" r="82" fill="#e02424" />

    <!-- Cap Drop Shadow & Edge -->
    <circle cx="100" cy="100" r="72" fill="#c01c1c" stroke="#000000" stroke-width="5" />
    <circle cx="98" cy="96" r="72" fill="#ff4d4d" stroke="#000000" stroke-width="5" />

    <!-- Inner Flat Top Highlight -->
    <circle cx="98" cy="96" r="64" fill="#ff6b6b" />
    <circle cx="98" cy="96" r="56" fill="#ff4d4d" />

    <!-- Cartoon Star Logo -->
    <g transform="translate(-2, -2)">
      <polygon points="100,53 111,79 140,79 117,96 125,124 100,108 75,124 83,96 60,79 89,79" fill="#000000" />
      <polygon points="100,53 111,79 140,79 117,96 125,124 100,108 75,124 83,96 60,79 89,79" fill="#ffd700" stroke="#000000" stroke-width="5" stroke-linejoin="round" />
      <!-- Star Eyes -->
      <circle cx="92" cy="95" r="4" fill="#000000" />
      <circle cx="108" cy="95" r="4" fill="#000000" />
      <!-- Star Smile -->
      <path d="M 94 102 Q 100 110 106 102" stroke="#000000" stroke-width="4" fill="none" stroke-linecap="round" />
    </g>

    <!-- Glossy Highlights -->
    <path d="M 45 65 A 65 65 0 0 1 135 40 A 60 60 0 0 0 55 85 Z" fill="#ffffff" opacity="0.4" />
    <circle cx="145" cy="65" r="8" fill="#ffffff" opacity="0.6" />
    <circle cx="158" cy="80" r="4" fill="#ffffff" opacity="0.6" />
  </g>
</svg>