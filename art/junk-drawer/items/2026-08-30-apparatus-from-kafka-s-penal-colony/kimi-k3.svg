<svg xmlns="http://www.w3.org/2000/svg" viewBox="27.0 23.5 345.8 428.2">
  <defs>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="0.5" stop-color="#2e2e36"/>
      <stop offset="1" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a15a"/>
      <stop offset="1" stop-color="#6e5326"/>
    </linearGradient>
  </defs>

  <!-- rear legs -->
  <rect x="58" y="150" width="16" height="250" fill="url(#iron)"/>
  <rect x="326" y="150" width="16" height="250" fill="url(#iron)"/>

  <!-- bed / base frame -->
  <rect x="30" y="330" width="340" height="34" rx="6" fill="url(#iron)" stroke="#0d0d10" stroke-width="2"/>
  <rect x="42" y="364" width="20" height="86" fill="#26262e"/>
  <rect x="338" y="364" width="20" height="86" fill="#26262e"/>
  <rect x="120" y="364" width="16" height="70" fill="#20202a"/>
  <rect x="264" y="364" width="16" height="70" fill="#20202a"/>

  <!-- cotton wool padding lines on bed -->
  <g stroke="#8a8578" stroke-width="3" opacity="0.7">
    <line x1="48" y1="342" x2="352" y2="342"/>
    <line x1="48" y1="352" x2="352" y2="352"/>
  </g>

  <!-- vertical posts of upper frame -->
  <rect x="90" y="120" width="18" height="212" fill="url(#iron)" stroke="#0d0d10" stroke-width="1.5"/>
  <rect x="292" y="120" width="18" height="212" fill="url(#iron)" stroke="#0d0d10" stroke-width="1.5"/>

  <!-- the Harrow: needle carriage -->
  <rect x="108" y="170" width="184" height="52" rx="4" fill="url(#brass)" stroke="#3a2c10" stroke-width="2"/>
  <!-- needles -->
  <g fill="#d8d8de" stroke="#777" stroke-width="0.6">
    <polygon points="118,222 124,222 121,258"/>
    <polygon points="134,222 140,222 137,262"/>
    <polygon points="150,222 156,222 153,256"/>
    <polygon points="166,222 172,222 169,264"/>
    <polygon points="182,222 188,222 185,258"/>
    <polygon points="198,222 204,222 201,266"/>
    <polygon points="214,222 220,222 217,258"/>
    <polygon points="230,222 236,222 233,262"/>
    <polygon points="246,222 252,222 249,256"/>
    <polygon points="262,222 268,222 265,264"/>
    <polygon points="278,222 284,222 281,258"/>
  </g>
  <!-- long writing needle -->
  <polygon points="192,222 208,222 200,300" fill="#e8e8ee" stroke="#888" stroke-width="1"/>

  <!-- crossbeam -->
  <rect x="80" y="118" width="240" height="20" rx="4" fill="url(#iron)" stroke="#0d0d10" stroke-width="1.5"/>

  <!-- drive rods -->
  <rect x="146" y="86" width="8" height="84" fill="#3a3a44"/>
  <rect x="246" y="86" width="8" height="84" fill="#3a3a44"/>

  <!-- upper machinery housing -->
  <rect x="110" y="40" width="180" height="56" rx="8" fill="url(#iron)" stroke="#0d0d10" stroke-width="2"/>
  <rect x="126" y="52" width="60" height="32" rx="4" fill="#1c1c24" stroke="#0d0d10"/>
  <!-- gear -->
  <g transform="translate(240,68)" fill="url(#brass)" stroke="#3a2c10" stroke-width="1.5">
    <circle r="20"/>
    <rect x="-4" y="-28" width="8" height="56" rx="2"/>
    <rect x="-4" y="-28" width="8" height="56" rx="2" transform="rotate(45)"/>
    <rect x="-4" y="-28" width="8" height="56" rx="2" transform="rotate(90)"/>
    <rect x="-4" y="-28" width="8" height="56" rx="2" transform="rotate(135)"/>
    <circle r="7" fill="#2e2e36"/>
  </g>
  <!-- crank -->
  <g stroke="#6e5326" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M290,68 L326,68 L326,40"/>
  </g>
  <circle cx="326" cy="34" r="8" fill="#8a8a94" stroke="#333"/>

  <!-- inscription plate -->
  <rect x="126" y="240" width="148" height="46" rx="4" fill="#d8cfae" stroke="#6e5326" stroke-width="3"/>
  <g stroke="#5a4a22" stroke-width="2" opacity="0.85">
    <path d="M138,252 q10,-6 20,0 t20,0 t20,0 t20,0 t20,0 t20,0" fill="none"/>
    <path d="M138,264 q8,-5 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0" fill="none"/>
    <path d="M138,276 q12,-6 24,0 t24,0 t24,0 t24,0" fill="none"/>
  </g>

  <!-- straps on bed -->
  <g fill="#4a3524" stroke="#2a1d12" stroke-width="1">
    <rect x="70" y="326" width="14" height="42" rx="3"/>
    <rect x="186" y="326" width="14" height="42" rx="3"/>
    <rect x="306" y="326" width="14" height="42" rx="3"/>
  </g>
  <g fill="#c9a15a">
    <rect x="72" y="342" width="10" height="8"/>
    <rect x="188" y="342" width="10" height="8"/>
    <rect x="308" y="342" width="10" height="8"/>
  </g>

  <!-- rivets -->
  <g fill="#0d0d10">
    <circle cx="99" cy="132" r="2.5"/><circle cx="301" cy="132" r="2.5"/>
    <circle cx="99" cy="320" r="2.5"/><circle cx="301" cy="320" r="2.5"/>
    <circle cx="40" cy="347" r="2.5"/><circle cx="360" cy="347" r="2.5"/>
  </g>
</svg>