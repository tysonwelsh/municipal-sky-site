<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <!-- Materials -->
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a2f15"/>
      <stop offset="30%" stop-color="#b89947"/>
      <stop offset="50%" stop-color="#e8d58c"/>
      <stop offset="70%" stop-color="#8a6e2e"/>
      <stop offset="100%" stop-color="#2a220f"/>
    </linearGradient>
    
    <linearGradient id="iron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="30%" stop-color="#444"/>
      <stop offset="70%" stop-color="#222"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c3539"/>
      <stop offset="50%" stop-color="#8f9da3"/>
      <stop offset="100%" stop-color="#1b2023"/>
    </linearGradient>

    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8899aa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ddeeff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#445566" stop-opacity="0.8"/>
    </linearGradient>
    
    <linearGradient id="leather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2313"/>
      <stop offset="100%" stop-color="#1c0f06"/>
    </linearGradient>

    <!-- Gear Template -->
    <g id="gear">
      <circle cx="0" cy="0" r="40" fill="url(#brass)"/>
      <circle cx="0" cy="0" r="30" fill="#111"/>
      <circle cx="0" cy="0" r="10" fill="url(#iron)"/>
      <path d="M-8,-45 L8,-45 L4,-35 L-4,-35 Z" fill="url(#brass)"/>
      <path d="M-8,45 L8,45 L4,35 L-4,35 Z" fill="url(#brass)"/>
      <path d="M-45,-8 L-45,8 L-35,4 L-35,-4 Z" fill="url(#brass)"/>
      <path d="M45,-8 L45,8 L35,4 L35,-4 Z" fill="url(#brass)"/>
      <path d="M-30,-30 L-20,-20 L-10,-28 L-22,-38 Z" fill="url(#brass)"/>
      <path d="M30,30 L20,20 L10,28 L22,38 Z" fill="url(#brass)"/>
      <path d="M30,-30 L20,-20 L10,-28 L22,-38 Z" fill="url(#brass)"/>
      <path d="M-30,30 L-20,20 L-10,28 L-22,38 Z" fill="url(#brass)"/>
    </g>

    <!-- Needle Template -->
    <g id="needle-cluster">
      <polygon points="0,0 2,40 0,60 -2,40" fill="url(#steel)"/>
      <polygon points="10,0 11,35 10,50 9,35" fill="url(#glass)"/>
      <polygon points="-10,0 -9,35 -10,50 -11,35" fill="url(#glass)"/>
    </g>
  </defs>

  <!-- BACKGROUND ELEMENTS: Pillars -->
  <!-- Inner Brass Pillars -->
  <rect x="250" y="80" width="30" height="800" fill="url(#brass)"/>
  <rect x="520" y="80" width="30" height="800" fill="url(#brass)"/>
  
  <!-- Outer Brass Pillars -->
  <rect x="50" y="50" width="50" height="850" fill="url(#brass)"/>
  <rect x="700" y="50" width="50" height="850" fill="url(#brass)"/>
  
  <!-- Pillar Bases/Joints -->
  <rect x="35" y="860" width="80" height="40" fill="url(#iron)"/>
  <rect x="685" y="860" width="80" height="40" fill="url(#iron)"/>
  <rect x="35" y="40" width="80" height="40" fill="url(#iron)"/>
  <rect x="685" y="40" width="80" height="40" fill="url(#iron)"/>
  
  <!-- THE BED (Bottom Component) -->
  <g id="bed">
    <!-- Main Iron Base -->
    <rect x="40" y="900" width="720" height="80" rx="10" fill="url(#iron)"/>
    <rect x="60" y="880" width="680" height="20" fill="url(#brass)"/>
    
    <!-- Cotton Wool Cushion (Stylized) -->
    <path d="M 80,880 Q 100,850 130,880 Q 160,845 200,880 Q 230,850 270,880 Q 310,840 350,880 Q 380,850 420,880 Q 460,840 500,880 Q 540,845 580,880 Q 610,850 640,880 Q 680,850 720,880 Z" fill="#d4d0c9" stroke="#999" stroke-width="2"/>
    
    <!-- Blood Stains / Grime on Cotton -->
    <path d="M 320,880 Q 350,855 370,875 Q 390,860 410,880" fill="none" stroke="#631414" stroke-width="8" opacity="0.7"/>
    <path d="M 450,880 Q 470,865 490,880" fill="none" stroke="#631414" stroke-width="5" opacity="0.6"/>
    
    <!-- Leather Restraining Straps -->
    <!-- Head/Neck -->
    <path d="M 340,900 L 340,840 Q 400,820 460,840 L 460,900" fill="none" stroke="url(#leather)" stroke-width="15"/>
    <rect x="445" y="860" width="25" height="15" fill="url(#brass)"/> <!-- Buckle -->
    <!-- Torso -->
    <path d="M 280,900 L 280,820 Q 400,800 520,820 L 520,900" fill="none" stroke="url(#leather)" stroke-width="15"/>
    <rect x="505" y="850" width="25" height="15" fill="url(#brass)"/>
    <!-- Legs -->
    <path d="M 180,900 L 180,840 Q 220,820 260,840 L 260,900" fill="none" stroke="url(#leather)" stroke-width="12"/>
    <path d="M 540,900 L 540,840 Q 580,820 620,840 L 620,900" fill="none" stroke="url(#leather)" stroke-width="12"/>
  </g>

  <!-- THE DESIGNER (Top Component) -->
  <g id="designer">
    <!-- Main Casing -->
    <rect x="20" y="20" width="760" height="240" rx="15" fill="url(#iron)"/>
    
    <!-- Internal Compartment opening -->
    <rect x="60" y="50" width="680" height="180" rx="5" fill="#050505" stroke="url(#brass)" stroke-width="8"/>
    
    <!-- Complex Gear System -->
    <g transform="translate(140, 140)">
      <use href="#gear" />
      <circle cx="0" cy="0" r="15" fill="#8a6e2e"/>
    </g>
    <g transform="translate(210, 100) scale(0.8)">
      <use href="#gear" />
    </g>
    <g transform="translate(280, 160) scale(1.2)">
      <use href="#gear" />
    </g>
    <g transform="translate(380, 110) scale(0.9)">
      <use href="#gear" />
    </g>
    <g transform="translate(480, 150) scale(1.1)">
      <use href="#gear" />
    </g>
    <g transform="translate(570, 90) scale(0.7)">
      <use href="#gear" />
    </g>
    <g transform="translate(640, 160)">
      <use href="#gear" />
    </g>
    
    <!-- Chains/Belts connecting gears -->
    <path d="M 140,100 L 210,68 L 210,132 L 140,180 Z" fill="none" stroke="url(#steel)" stroke-width="6" stroke-dasharray="8 4"/>
    <path d="M 280,112 L 380,74 L 380,146 L 280,208 Z" fill="none" stroke="url(#steel)" stroke-width="6" stroke-dasharray="8 4"/>
    <path d="M 480,106 L 570,62 L 570,118 L 480,194 Z" fill="none" stroke="url(#steel)" stroke-width="6" stroke-dasharray="8 4"/>

    <!-- The Blueprint / Program Slot -->
    <rect x="330" y="10" width="140" height="40" fill="url(#brass)"/>
    <rect x="340" y="5" width="120" height="15" fill="#fff" opacity="0.8"/>
    <line x1="350" y1="12" x2="450" y2="12" stroke="#000" stroke-width="2" stroke-dasharray="4 2"/>
    
    <!-- Heavy Rivets -->
    <circle cx="40" cy="40" r="8" fill="url(#brass)"/>
    <circle cx="760" cy="40" r="8" fill="url(#brass)"/>
    <circle cx="40" cy="240" r="8" fill="url(#brass)"/>
    <circle cx="760" cy="240" r="8" fill="url(#brass)"/>
  </g>

  <!-- THE HARROW (Middle Component) -->
  <g id="harrow">
    <!-- Suspension cables / rods from Designer -->
    <line x1="150" y1="260" x2="150" y2="550" stroke="url(#steel)" stroke-width="8"/>
    <line x1="650" y1="260" x2="650" y2="550" stroke="url(#steel)" stroke-width="8"/>
    <line x1="300" y1="260" x2="300" y2="520" stroke="url(#steel)" stroke-width="12"/>
    <line x1="500" y1="260" x2="500" y2="520" stroke="url(#steel)" stroke-width="12"/>
    
    <!-- Main Harrow Structure (matches human form roughly) -->
    <path d="M 100,550 L 700,550 L 680,620 L 580,720 L 450,750 L 350,750 L 220,720 L 120,620 Z" fill="url(#iron)" stroke="url(#brass)" stroke-width="10"/>
    
    <!-- Internal Grid / Ribs of the Harrow -->
    <line x1="200" y1="550" x2="250" y2="700" stroke="url(#steel)" stroke-width="5"/>
    <line x1="300" y1="550" x2="320" y2="730" stroke="url(#steel)" stroke-width="5"/>
    <line x1="400" y1="550" x2="400" y2="745" stroke="url(#steel)" stroke-width="5"/>
    <line x1="500" y1="550" x2="480" y2="730" stroke="url(#steel)" stroke-width="5"/>
    <line x1="600" y1="550" x2="550" y2="700" stroke="url(#steel)" stroke-width="5"/>
    
    <!-- Horizontal Crossbars -->
    <line x1="125" y1="600" x2="675" y2="600" stroke="url(#steel)" stroke-width="6"/>
    <line x1="170" y1="650" x2="630" y2="650" stroke="url(#steel)" stroke-width="6"/>
    <line x1="250" y1="700" x2="550" y2="700" stroke="url(#steel)" stroke-width="6"/>
    
    <!-- The Needles (Long and Short - Steel and Glass) -->
    <!-- Row 1 (Bottom Edge) -->
    <use href="#needle-cluster" x="350" y="750" />
    <use href="#needle-cluster" x="400" y="750" />
    <use href="#needle-cluster" x="450" y="750" />
    
    <!-- Row 2 -->
    <use href="#needle-cluster" x="250" y="710" />
    <use href="#needle-cluster" x="300" y="730" />
    <use href="#needle-cluster" x="500" y="730" />
    <use href="#needle-cluster" x="550" y="710" />
    
    <!-- Row 3 -->
    <use href="#needle-cluster" x="180" y="650" />
    <use href="#needle-cluster" x="230" y="660" />
    <use href="#needle-cluster" x="280" y="670" />
    <use href="#needle-cluster" x="330" y="680" />
    <use href="#needle-cluster" x="380" y="685" />
    <use href="#needle-cluster" x="420" y="685" />
    <use href="#needle-cluster" x="470" y="680" />
    <use href="#needle-cluster" x="520" y="670" />
    <use href="#needle-cluster" x="570" y="660" />
    <use href="#needle-cluster" x="620" y="650" />

    <!-- Row 4 -->
    <use href="#needle-cluster" x="130" y="580" />
    <use href="#needle-cluster" x="170" y="590" />
    <use href="#needle-cluster" x="220" y="600" />
    <use href="#needle-cluster" x="270" y="610" />
    <use href="#needle-cluster" x="320" y="620" />
    <use href="#needle-cluster" x="370" y="630" />
    <use href="#needle-cluster" x="430" y="630" />
    <use href="#needle-cluster" x="480" y="620" />
    <use href="#needle-cluster" x="530" y="610" />
    <use href="#needle-cluster" x="580" y="600" />
    <use href="#needle-cluster" x="630" y="590" />
    <use href="#needle-cluster" x="670" y="580" />
    
    <!-- Blood drops on needles -->
    <circle cx="400" cy="805" r="3" fill="#800000"/>
    <circle cx="350" cy="800" r="2" fill="#800000"/>
    <circle cx="450" cy="795" r="2.5" fill="#800000"/>
    <circle cx="330" cy="735" r="2" fill="#800000"/>
    <circle cx="470" cy="735" r="2" fill="#800000"/>
  </g>
</svg>