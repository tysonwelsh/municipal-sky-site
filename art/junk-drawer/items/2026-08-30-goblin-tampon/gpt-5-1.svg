<svg xmlns="http://www.w3.org/2000/svg" viewBox="62.2 23.0 135.2 205.2">
  <defs>
    <linearGradient id="tamponBody" x1="0" y1="40" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8f8fb"/>
      <stop offset="0.5" stop-color="#ececf3"/>
      <stop offset="1" stop-color="#dedeea"/>
    </linearGradient>
    <linearGradient id="tamponTip" x1="0" y1="25" x2="0" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0f0fb"/>
      <stop offset="1" stop-color="#d3d3e2"/>
    </linearGradient>
    <linearGradient id="stringGrad" x1="0" y1="160" x2="0" y2="245" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7d8e6"/>
      <stop offset="1" stop-color="#82b5cd"/>
    </linearGradient>
    <linearGradient id="goblinSkin" x1="0" y1="40" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a1d941"/>
      <stop offset="1" stop-color="#6ca327"/>
    </linearGradient>
    <linearGradient id="earShade" x1="0" y1="60" x2="0" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ec737"/>
      <stop offset="1" stop-color="#5b8c1e"/>
    </linearGradient>
    <linearGradient id="metalClip" x1="0" y1="145" x2="0" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d5d8df"/>
      <stop offset="1" stop-color="#a9b0c0"/>
    </linearGradient>
  </defs>

  <!-- Tampon body -->
  <g>
    <rect x="90" y="40" width="80" height="170" rx="18" ry="18" fill="url(#tamponBody)"/>
    <path d="M108 40c0-8.5 6.8-15 15.5-15h24c8.7 0 15.5 6.5 15.5 15v8c0-8.5-6.8-15-15.5-15h-24C114.8 33 108 39.5 108 48z"
          fill="url(#tamponTip)"/>

    <!-- Subtle body ribs -->
    <path d="M105 60c4 4 4 12 0 16" fill="none" stroke="#c8c9d8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M130 55c6 6 6 18 0 24" fill="none" stroke="#c8c9d8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M155 58c5 5 5 15 0 20" fill="none" stroke="#c8c9d8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M115 90c7 7 7 21 0 28" fill="none" stroke="#c8c9d8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M142 94c7 7 7 21 0 28" fill="none" stroke="#c8c9d8" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Goblin head wrapping the top -->
  <g>
    <!-- Ears -->
    <path d="M72 86c-10-17-12-33 6-40 15-6 26 8 29 17-9-3-20 1-35 23z"
          fill="url(#earShade)"/>
    <path d="M188 86c10-17 12-33-6-40-15-6-26 8-29 17 9-3 20 1 35 23z"
          fill="url(#earShade)"/>

    <!-- Head main -->
    <path d="M82 120c0-28 19-52 48-52s48 24 48 52c0 26-9 40-48 40s-48-14-48-40z"
          fill="url(#goblinSkin)"/>

    <!-- Brow ridge -->
    <path d="M86 108c10-9 25-14 44-14s34 5 44 14c-3-16-20-30-44-30s-41 14-44 30z"
          fill="#6a9f28"/>

    <!-- Eyes -->
    <ellipse cx="112" cy="118" rx="9" ry="8" fill="#1e1e24"/>
    <ellipse cx="148" cy="118" rx="9" ry="8" fill="#1e1e24"/>
    <circle cx="113" cy="117" r="3" fill="#f9f9fb"/>
    <circle cx="147" cy="117" r="3" fill="#f9f9fb"/>

    <!-- Under-eye tint -->
    <path d="M101 124c5 4 10 6 17 6 3 0 5-0.2 7-0.6" fill="none" stroke="#547c1b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M159 124c-5 4-10 6-17 6-3 0-5-0.2-7-0.6" fill="none" stroke="#547c1b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Nose -->
    <path d="M128 118c-5 7-6 16-1 22 2 2 5 3 7 3s5-1 7-3c5-6 4-15-1-22-4-5-8-5-12 0z"
          fill="#7eb42e"/>
    <path d="M128 132c3 2 6 3 10 3" fill="none" stroke="#608c24" stroke-width="2" stroke-linecap="round"/>

    <!-- Mouth -->
    <path d="M106 142c4 7 12 12 24 12s20-5 24-12"
          fill="none" stroke="#1d1b21" stroke-width="3" stroke-linecap="round"/>
    <path d="M113 146c3 3 9 5 17 5s14-2 17-5"
          fill="none" stroke="#91252b" stroke-width="2" stroke-linecap="round"/>

    <!-- Fangs -->
    <path d="M124 144l-2 7c-0.4 1.4 0.6 2.6 2 2.6h2c1.4 0 2.4-1.2 2-2.6l-2-7z"
          fill="#f7f4ef"/>
    <path d="M138 144l-2 7c-0.4 1.4 0.6 2.6 2 2.6h2c1.4 0 2.4-1.2 2-2.6l-2-7z"
          fill="#f7f4ef"/>

    <!-- Forehead wrinkles -->
    <path d="M108 104c4-2 10-3 17-3" fill="none" stroke="#547c1b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M135 101c6 0 11 1 15 3" fill="none" stroke="#547c1b" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

    <!-- Ear inner lines -->
    <path d="M80 70c5 4 9 11 10 18" fill="none" stroke="#527a1d" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M180 70c-5 4-9 11-10 18" fill="none" stroke="#527a1d" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Goblin hands gripping tampon -->
  <g>
    <!-- Left hand -->
    <path d="M80 138c-7 3-11 12-9 20 2 7 7 11 14 11 7-1 12-6 14-13l3-13c-7-4-15-7-22-5z"
          fill="#8ec737"/>
    <path d="M84 148c2 5 2 10 1 14" fill="none" stroke="#5e8e23" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Right hand -->
    <path d="M180 138c7 3 11 12 9 20-2 7-7 11-14 11-7-1-12-6-14-13l-3-13c7-4 15-7 22-5z"
          fill="#8ec737"/>
    <path d="M176 148c-2 5-2 10-1 14" fill="none" stroke="#5e8e23" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Fingers over body -->
    <path d="M86 153c1 5 4 9 8 11 4 2 9 2 13 0" fill="none" stroke="#6fa928" stroke-width="3" stroke-linecap="round"/>
    <path d="M174 153c-1 5-4 9-8 11-4 2-9 2-13 0" fill="none" stroke="#6fa928" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Clip and string at bottom -->
  <g>
    <!-- Small metal clip/band -->
    <rect x="112" y="160" width="36" height="16" rx="4" ry="4" fill="url(#metalClip)"/>
    <rect x="117" y="163" width="26" height="4" rx="2" ry="2" fill="#c0c5d2"/>

    <!-- String -->
    <path d="M130 176
             c-3 6-3 12 2 16
             s8 7 8 12
             c0 4-3 7-7 7
             -5 0-9-3-11-7
             c-3-5-6-8-11-9
             c-5-1-9 1-11 4
             c-2 4-1 9 2 13
             c4 5 10 9 17 11
             c7 2 14 2 20-1
             c7-3 11-8 13-14
             c2-7 0-13-4-18
             c-3-4-7-7-9-11
             c-2-3-3-7-3-10"
          fill="none"
          stroke="url(#stringGrad)"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- String highlight -->
    <path d="M132 182
             c-1 5 1 9 4 12
             c3 3 6 6 7 10"
          fill="none"
          stroke="#d4eef7"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.8"/>
  </g>
</svg>