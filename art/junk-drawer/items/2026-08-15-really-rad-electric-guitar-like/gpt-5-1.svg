<svg xmlns="http://www.w3.org/2000/svg" viewBox="118.0 213.1 604.9 918.7">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2a6d"/>
      <stop offset="0.4" stop-color="#ff8a00"/>
      <stop offset="0.7" stop-color="#ffe600"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <linearGradient id="bodyEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.35" stop-color="#220014"/>
      <stop offset="0.7" stop-color="#440022"/>
      <stop offset="1" stop-color="#000000"/>
