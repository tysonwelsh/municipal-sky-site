    <linearGradient id="pickupGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="0.5" stop-color="#333333"/>
      <stop offset="1" stop-color="#777777"/>
