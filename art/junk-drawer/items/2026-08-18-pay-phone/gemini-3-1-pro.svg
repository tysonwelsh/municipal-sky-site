<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.8 3.0 77.0 198.8" width="77.0" height="198.8">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#889" />
      <stop offset="30%" stop-color="#ccd" />
      <stop offset="70%" stop-color="#99a" />
      <stop offset="100%" stop-color="#556" />
    </linearGradient>
    <linearGradient id="bodyBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#144d8c" />
      <stop offset="50%" stop-color="#2a75c7" />
      <stop offset="100%" stop-color="#0e3a6a" />
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#445" />
      <stop offset="100%" stop-color="#223" />
    </linearGradient>
    <linearGradient id="cordGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333" />
      <stop offset="50%" stop-color="#666" />
      <stop offset="100%" stop-color="#222" />
    </linearGradient>
  </defs>

  <!-- Main Body -->
  <rect x="25" y="10" width="50" height="180" rx="5" ry="5" fill="url(#bodyBlue)" />
  <rect x="20" y="5" width="60" height="20" rx="3" ry="3" fill="url(#metal)" />
  <rect x="20" y="185" width="60" height="15" rx="3" ry="3" fill="url(#metal)" />

  <!-- Top Sign / Logo Area -->
  <rect x="30" y="10" width="40" height="10" rx="1" ry="1" fill="#fff" />
  <text x="50" y="18" font-family="sans-serif" font-size="8" font-weight="bold" fill="#144d8c" text-anchor="middle">PHONE</text>

  <!-- Coin Slot -->
  <rect x="60" y="30" width="10" height="15" rx="1" ry="1" fill="url(#metal)" stroke="#333" stroke-width="1" />
  <line x1="65" y1="33" x2="65" y2="42" stroke="#111" stroke-width="2" />

  <!-- Instruction Panel -->
  <rect x="30" y="30" width="25" height="15" rx="1" ry="1" fill="#ddd" stroke="#333" stroke-width="1" />
  <line x1="32" y1="34" x2="53" y2="34" stroke="#888" stroke-width="1" />
  <line x1="32" y1="37" x2="48" y2="37" stroke="#888" stroke-width="1" />
  <line x1="32" y1="40" x2="50" y2="40" stroke="#888" stroke-width="1" />

  <!-- Keypad Section -->
  <rect x="35" y="55" width="30" height="40" rx="2" ry="2" fill="url(#metal)" stroke="#444" stroke-width="1" />
  <g fill="#222">
    <!-- Row 1 -->
    <rect x="38" y="58" width="6" height="6" rx="1" ry="1" />
    <rect x="47" y="58" width="6" height="6" rx="1" ry="1" />
    <rect x="56" y="58" width="6" height="6" rx="1" ry="1" />
    <!-- Row 2 -->
    <rect x="38" y="67" width="6" height="6" rx="1" ry="1" />
    <rect x="47" y="67" width="6" height="6" rx="1" ry="1" />
    <rect x="56" y="67" width="6" height="6" rx="1" ry="1" />
    <!-- Row 3 -->
    <rect x="38" y="76" width="6" height="6" rx="1" ry="1" />
    <rect x="47" y="76" width="6" height="6" rx="1" ry="1" />
    <rect x="56" y="76" width="6" height="6" rx="1" ry="1" />
    <!-- Row 4 -->
    <rect x="38" y="85" width="6" height="6" rx="1" ry="1" />
    <rect x="47" y="85" width="6" height="6" rx="1" ry="1" />
    <rect x="56" y="85" width="6" height="6" rx="1" ry="1" />
  </g>

  <!-- Coin Return -->
  <rect x="40" y="140" width="20" height="25" rx="2" ry="2" fill="url(#metal)" stroke="#222" stroke-width="1" />
  <rect x="43" y="145" width="14" height="15" rx="1" ry="1" fill="#111" />
  <rect x="43" y="143" width="14" height="6" rx="1" ry="1" fill="#444" />

  <!-- Handset Cord -->
  <path d="M 25 80 C 10 90, 10 100, 20 110 C 30 120, 0 130, 15 140 C 25 145, 5 155, 20 160 C 25 162, 25 150, 12 110" fill="none" stroke="url(#cordGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Handset Base/Cradle -->
  <path d="M 17 55 L 25 55 L 25 75 L 17 75 Z" fill="url(#darkMetal)" />
  <rect x="23" y="58" width="4" height="14" fill="#111" />

  <!-- Handset -->
  <g id="handset">
    <path d="M 12 40 C 5 40, 5 50, 12 55 L 16 55 C 18 55, 18 40, 16 40 Z" fill="url(#darkMetal)" />
    <path d="M 12 85 C 5 85, 5 75, 12 70 L 16 70 C 18 70, 18 85, 16 85 Z" fill="url(#darkMetal)" />
    <path d="M 14 55 Q 8 62.5 14 70" fill="none" stroke="url(#darkMetal)" stroke-width="6" stroke-linecap="round" />
  </g>

</svg>