<svg xmlns="http://www.w3.org/2000/svg" viewBox="17.5 79.5 775.5 226.5" width="775.5" height="226.5">
  <defs>
    <linearGradient id="troutBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5d23" />
      <stop offset="30%" stop-color="#8a9a5b" />
      <stop offset="60%" stop-color="#e2c2c6" />
      <stop offset="100%" stop-color="#f4f0ec" />
    </linearGradient>
    <linearGradient id="rainbowStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,100,100,0)" />
      <stop offset="20%" stop-color="rgba(255,150,150,0.8)" />
      <stop offset="50%" stop-color="rgba(255,100,150,0.9)" />
      <stop offset="80%" stop-color="rgba(200,100,150,0.6)" />
      <stop offset="100%" stop-color="rgba(200,100,150,0)" />
    </linearGradient>
    <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" />
      <stop offset="40%" stop-color="#000" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6b1c" />
    </radialGradient>
    <pattern id="spots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#1a1a1a" opacity="0.8" />
      <circle cx="15" cy="12" r="2" fill="#1a1a1a" opacity="0.7" />
      <circle cx="8" cy="18" r="1" fill="#1a1a1a" opacity="0.6" />
    </pattern>
    <pattern id="finSpots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#1a1a1a" opacity="0.8" />
      <circle cx="8" cy="7" r="1.5" fill="#1a1a1a" opacity="0.7" />
    </pattern>
  </defs>

  <!-- Tail Fin -->
  <path d="M 680 180 C 720 140, 770 100, 790 120 C 770 170, 760 200, 760 200 C 760 200, 770 240, 790 280 C 770 300, 710 260, 680 220 Z" fill="#8a9a5b" stroke="#4a5d23" stroke-width="2" />
  <path d="M 680 180 C 720 140, 770 100, 790 120 C 770 170, 760 200, 760 200 C 760 200, 770 240, 790 280 C 770 300, 710 260, 680 220 Z" fill="url(#finSpots)" />
  
  <!-- Dorsal Fin -->
  <path d="M 380 130 C 400 60, 460 70, 480 145 Z" fill="#8a9a5b" stroke="#4a5d23" stroke-width="2" />
  <path d="M 380 130 C 400 60, 460 70, 480 145 Z" fill="url(#finSpots)" />

  <!-- Adipose Fin -->
  <path d="M 580 150 C 590 130, 610 130, 620 160 Z" fill="#8a9a5b" stroke="#4a5d23" stroke-width="1" />
  <path d="M 580 150 C 590 130, 610 130, 620 160 Z" fill="url(#finSpots)" />

  <!-- Pelvic Fin -->
  <path d="M 420 270 C 440 310, 470 320, 480 265 Z" fill="#e2c2c6" stroke="#b08d92" stroke-width="2" />
  
  <!-- Anal Fin -->
  <path d="M 550 250 C 570 300, 610 310, 620 235 Z" fill="#e2c2c6" stroke="#b08d92" stroke-width="2" />
  <path d="M 550 250 C 570 300, 610 310, 620 235 Z" fill="url(#finSpots)" opacity="0.5" />

  <!-- Pectoral Fin -->
  <path d="M 220 250 C 250 290, 300 290, 280 240 Z" fill="#e2c2c6" stroke="#b08d92" stroke-width="2" />

  <!-- Main Body -->
  <path id="body" d="M 20 200 C 20 130, 150 90, 350 120 C 500 140, 630 160, 690 200 C 630 240, 500 260, 350 270 C 150 290, 20 260, 20 200 Z" fill="url(#troutBody)" />
  
  <!-- Spots on Body (top half mostly) -->
  <clipPath id="bodyClip">
    <use href="#body" />
  </clipPath>
  <rect x="0" y="80" width="800" height="150" fill="url(#spots)" clip-path="url(#bodyClip)" />
  
  <!-- Rainbow Stripe -->
  <path d="M 120 190 C 250 180, 450 190, 650 200 C 450 220, 250 220, 120 210 Z" fill="url(#rainbowStripe)" filter="blur(5px)" />

  <!-- Head/Gill details -->
  <path d="M 160 130 C 180 180, 170 230, 140 260" fill="none" stroke="#6b7c4a" stroke-width="3" opacity="0.6" />
  <path d="M 140 140 C 160 180, 150 220, 120 240" fill="none" stroke="#6b7c4a" stroke-width="2" opacity="0.4" />
  
  <!-- Mouth -->
  <path d="M 20 200 C 40 195, 60 200, 70 210" fill="none" stroke="#3a4a1c" stroke-width="3" />
  
  <!-- Eye -->
  <circle cx="80" cy="165" r="12" fill="url(#eyeGradient)" />
  <circle cx="77" cy="162" r="3" fill="#fff" opacity="0.8" />
  
  <!-- Highlights -->
  <path d="M 150 115 C 300 95, 450 125, 550 145" fill="none" stroke="#fff" stroke-width="8" opacity="0.2" filter="blur(3px)" />
</svg>