<svg xmlns="http://www.w3.org/2000/svg" viewBox="32.0 13.5 335.8 680.2">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d0a10"/>
      <stop offset="0.14" stop-color="#b2141c"/>
      <stop offset="0.32" stop-color="#f0343a"/>
      <stop offset="0.44" stop-color="#ff8f8c"/>
      <stop offset="0.52" stop-color="#ffd9d4"/>
      <stop offset="0.62" stop-color="#f4474b"/>
      <stop offset="0.8" stop-color="#c0161e"/>
      <stop offset="1" stop-color="#5c080e"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0d13"/>
      <stop offset="0.2" stop-color="#cf1a22"/>
      <stop offset="0.42" stop-color="#ff8b88"/>
      <stop offset="0.52" stop-color="#ffe4de"/>
      <stop offset="0.66" stop-color="#e83239"/>
      <stop offset="0.86" stop-color="#a5121a"/>
      <stop offset="1" stop-color="#5a070d"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7a85"/>
      <stop offset="0.16" stop-color="#c9d4dc"/>
      <stop offset="0.34" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#aab6c0"/>
      <stop offset="0.64" stop-color="#f2f6f9"/>
      <stop offset="0.84" stop-color="#8e99a3"/>
      <stop offset="1" stop-color="#5b656e"/>
    </linearGradient>
    <linearGradient id="chromeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c2ccd5"/>
      <stop offset="0.6" stop-color="#7d8892"/>
      <stop offset="1" stop-color="#d7e0e6"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset="0.35" stop-color="#7fd8ee"/>
      <stop offset="0.75" stop-color="#2a7fa8"/>
      <stop offset="1" stop-color="#123f5c"/>
    </radialGradient>
    <linearGradient id="finR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d0f16"/>
      <stop offset="0.4" stop-color="#e42d34"/>
      <stop offset="0.7" stop-color="#ff9d99"/>
      <stop offset="1" stop-color="#a3131b"/>
    </linearGradient>
    <linearGradient id="finL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8d0f16"/>
      <stop offset="0.4" stop-color="#e42d34"/>
      <stop offset="0.7" stop-color="#ff9d99"/>
      <stop offset="1" stop-color="#a3131b"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0.08" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#fff3a8"/>
      <stop offset="0.55" stop-color="#ffb42e"/>
      <stop offset="0.85" stop-color="#f2591d"/>
      <stop offset="1" stop-color="#f2591d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame2" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#7fd0ff" stop-opacity="0"/>
    </radialGradient>
