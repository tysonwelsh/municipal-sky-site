    <path d="M200 268 c-4 0 -7 3 -7 6 0 3 2 5 5 5 l0 14 c-3 1 -5 3 -5 6 0 4 3 7 7 7 4 0 7 -3 7 -7 0 -3 -2 -5 -5 -6 l0 -14 c3 0 5 -2 5 -5 0 -3 -3 -6 -7 -6 z"/>
