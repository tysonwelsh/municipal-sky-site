<svg xmlns="http://www.w3.org/2000/svg" viewBox="55.5 3.5 288.8 552.8">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9762f"/>
      <stop offset="0.35" stop-color="#e0a45e"/>
      <stop offset="0.62" stop-color="#d69447"/>
      <stop offset="1" stop-color="#9a5c22"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d99b6a"/>
      <stop offset="0.4" stop-color="#f2c79c"/>
      <stop offset="1" stop-color="#c98a58"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8823f"/>
      <stop offset="1" stop-color="#7b5b26"/>
    </linearGradient>
    <linearGradient id="hairg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e1c10"/>
      <stop offset="0.5" stop-color="#4a2c17"/>
      <stop offset="1" stop-color="#241408"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

