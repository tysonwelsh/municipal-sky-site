    <path d="M240 490 c8 -6 20 -6 26 0 l6 -5 2 6 8 -1 -6 6 c4 6 -2 12 -10 12 l-2 6 -3 -6 -8 0 -3 6 -2 -6 c-8 -1 -12 -8 -8 -18 z"/>
