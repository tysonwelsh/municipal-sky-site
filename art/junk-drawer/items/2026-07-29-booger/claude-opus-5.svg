<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A glistening green booger">
  <defs>
    <radialGradient id="body" cx="36%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#e2f28a"/>
      <stop offset="26%" stop-color="#b9dd54"/>
      <stop offset="55%" stop-color="#82ba33"/>
      <stop offset="80%" stop-color="#568c22"/>
      <stop offset="100%" stop-color="#37601a"/>
    </radialGradient>
    <radialGradient id="depth" cx="46%" cy="40%" r="64%">
      <stop offset="52%" stop-color="#1e3a0e" stop-opacity="0"/>
      <stop offset="82%" stop-color="#1e3a0e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#16290a" stop-opacity="0.62"/>
    </radialGradient>
    <radialGradient id="core" cx="44%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#f2ffb0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f2ffb0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gloss" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bounce" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#d8f57a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e6ff9a" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <path id="blob" d="M250 6
      C300 10 330 58 372 60
      C420 62 470 38 494 76
      C517 113 470 149 478 185
      C486 223 508 234 506 268
      C504 306 466 313 458 347
      C450 383 486 419 452 451
      C420 482 372 451 336 465
      C300 479 296 506 258 506
      C220 506 208 469 172 459
      C134 449 96 485 68 455
      C42 427 74 389 62 355
      C50 321 6 311 5 272
      C4 232 44 225 52 189
      C60 153 22 117 50 83
      C78 49 128 73 166 59
      C200 47 206 8 250 6 Z"/>
    <clipPath id="clipBlob"><use href="#blob"/></clipPath>
  </defs>

  <g clip-path="url(#clipBlob)">
    <use href="#blob" fill="url(#body)"/>
    <use href="#blob" fill="url(#core)"/>

    <!-- translucent mucus veining -->
    <g stroke="#c9e86a" stroke-opacity="0.35" fill="none" stroke-linecap="round" filter="url(#soft3)">
      <path d="M96 236c48-26 92 12 140-8s78-74 130-58" stroke-width="9"/>
      <path d="M120 340c56 8 84-30 138-22s84 56 140 34" stroke-width="7"/>
      <path d="M186 96c22 44 74 44 96 92" stroke-width="6"/>
    </g>

    <!-- deeper olive shading pooled at the edges -->
    <use href="#blob" fill="url(#depth)"/>

    <!-- reflected bounce light along the lower right -->
    <path d="M180 512h352V236c-40 44-24 92-70 126s-102 22-140 66-90 62-142 84z" fill="url(#bounce)"/>

    <!-- trapped air bubbles -->
    <g>
      <ellipse cx="172" cy="206" rx="25" ry="22" fill="#a8d24a" fill-opacity="0.55" stroke="#eaffa8" stroke-opacity="0.55" stroke-width="2"/>
      <ellipse cx="165" cy="196" rx="9" ry="6" fill="#ffffff" fill-opacity="0.65" transform="rotate(-28 165 196)"/>
      <ellipse cx="306" cy="152" rx="15" ry="13" fill="#b7dd58" fill-opacity="0.5" stroke="#eaffa8" stroke-opacity="0.5" stroke-width="1.6"/>
      <ellipse cx="301" cy="146" rx="5.5" ry="3.6" fill="#ffffff" fill-opacity="0.6" transform="rotate(-28 301 146)"/>
      <ellipse cx="221" cy="334" rx="19" ry="16" fill="#7fb135" fill-opacity="0.5" stroke="#dcf894" stroke-opacity="0.4" stroke-width="1.6"/>
      <ellipse cx="215" cy="326" rx="6.5" ry="4.2" fill="#ffffff" fill-opacity="0.45" transform="rotate(-28 215 326)"/>
      <ellipse cx="356" cy="300" rx="10" ry="9" fill="#78a933" fill-opacity="0.5" stroke="#dcf894" stroke-opacity="0.35" stroke-width="1.3"/>
      <ellipse cx="404" cy="196" rx="7" ry="6" fill="#9dc844" fill-opacity="0.5"/>
      <ellipse cx="118" cy="292" rx="8" ry="7" fill="#9dc844" fill-opacity="0.45"/>
    </g>

    <!-- specks of dust and grit -->
    <g fill="#3a2a14" fill-opacity="0.75">
      <ellipse cx="268" cy="238" rx="5.5" ry="3.6" transform="rotate(24 268 238)"/>
      <circle cx="330" cy="382" r="3.4"/>
      <circle cx="146" cy="404" r="2.6"/>
      <ellipse cx="392" cy="118" rx="3.6" ry="2.4" transform="rotate(-40 392 118)"/>
      <circle cx="98" cy="168" r="2.2"/>
    </g>

    <!-- a stray nose hair caught in it -->
    <path d="M356 44c-16 62-52 84-64 140s24 96 6 148-52 66-70 96" fill="none" stroke="#2c1d0d" stroke-opacity="0.8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M356 44c-16 62-52 84-64 140s24 96 6 148-52 66-70 96" fill="none" stroke="#7b5c33" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>

    <!-- broad wet gloss -->
    <ellipse cx="168" cy="152" rx="104" ry="74" fill="url(#gloss)" opacity="0.75" transform="rotate(-32 168 152)" filter="url(#soft)"/>
    <ellipse cx="384" cy="404" rx="62" ry="34" fill="url(#gloss)" opacity="0.4" transform="rotate(-24 384 404)" filter="url(#soft)"/>

    <!-- sharp speculars -->
    <ellipse cx="146" cy="124" rx="38" ry="21" fill="#ffffff" fill-opacity="0.85" transform="rotate(-32 146 124)" filter="url(#soft2)"/>
    <ellipse cx="206" cy="98" rx="12" ry="8" fill="#ffffff" fill-opacity="0.9" transform="rotate(-32 206 98)" filter="url(#soft3)"/>
    <ellipse cx="98" cy="196" rx="9" ry="16" fill="#ffffff" fill-opacity="0.5" transform="rotate(-20 98 196)" filter="url(#soft2)"/>
    <ellipse cx="440" cy="440" rx="20" ry="10" fill="#ffffff" fill-opacity="0.55" transform="rotate(-30 440 440)" filter="url(#soft2)"/>
    <ellipse cx="262" cy="486" rx="26" ry="9" fill="#ffffff" fill-opacity="0.35" filter="url(#soft2)"/>

    <!-- inner rim darkening -->
    <use href="#blob" fill="none" stroke="#2d4f14" stroke-opacity="0.55" stroke-width="14" filter="url(#soft2)"/>
  </g>

  <!-- crisp outline -->
  <use href="#blob" fill="none" stroke="#33591a" stroke-opacity="0.85" stroke-width="3"/>
</svg>
