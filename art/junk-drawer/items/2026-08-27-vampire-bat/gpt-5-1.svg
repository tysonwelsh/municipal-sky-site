<svg xmlns="http://www.w3.org/2000/svg" viewBox="8.0 -2.0 243.8 183.8">
  <defs>
    <radialGradient id="batBodyGrad" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#4b3a7a"/>
      <stop offset="45%" stop-color="#36285c"/>
      <stop offset="100%" stop-color="#221437"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2daff"/>
    </radialGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#2a193b"/>
      <stop offset="100%" stop-color="#140a20"/>
    </linearGradient>
    <linearGradient id="innerWingGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#45255e"/>
      <stop offset="100%" stop-color="#2b163a"/>
    </linearGradient>
    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b7e"/>
      <stop offset="100%" stop-color="#c31545"/>
    </linearGradient>
    <linearGradient id="fangGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0ff"/>
    </linearGradient>
    <radialGradient id="shineGrad" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="highlightGrad" cx="30%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#6a54b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6a54b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a3d90"/>
      <stop offset="100%" stop-color="#2e1844"/>
    </linearGradient>
    <linearGradient id="earInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7fa8"/>
      <stop offset="100%" stop-color="#d7346a"/>
    </linearGradient>
    <radialGradient id="pupilHighlight" cx="25%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6f4aa5"/>
      <stop offset="100%" stop-color="#3d2460"/>
    </linearGradient>
  </defs>

  <!-- Left wing -->
  <g transform="translate(10,35)">
    <!-- Wing base shape -->
    <path d="M105,42
             C70,10 30,5 0,10
             C10,40 15,65 25,88
             C35,112 50,132 70,145
             C88,132 99,116 107,98
             C112,86 115,74 115,62
             C115,54 111,48 105,42Z"
          fill="url(#wingGrad)" />

    <!-- Inner membrane scallops -->
    <path d="M105,42
             C74,20 42,18 13,23
             C19,38 24,55 30,71
             C36,89 43,104 52,118
             C61,102 69,87 79,73
             C87,62 96,52 105,42Z"
          fill="url(#innerWingGrad)"/>

    <!-- Wing ribs -->
    <g stroke="#7050b0" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
      <path d="M105,42 L60,120"/>
      <path d="M90,38 L42,100"/>
      <path d="M73,33 L28,78"/>
      <path d="M55,28 L18,55"/>
    </g>

    <!-- Wing edge highlights -->
    <path d="M5,13
             C12,38 18,59 26,79"
          fill="none"
          stroke="#8a6bff"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.6"/>
    <path d="M80,34
             C95,40 106,52 112,64"
          fill="none"
          stroke="#8a6bff"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.6"/>
  </g>

  <!-- Right wing -->
  <g transform="translate(250,35) scale(-1,1)">
    <!-- Wing base shape -->
    <path d="M105,42
             C70,10 30,5 0,10
             C10,40 15,65 25,88
             C35,112 50,132 70,145
             C88,132 99,116 107,98
             C112,86 115,74 115,62
             C115,54 111,48 105,42Z"
          fill="url(#wingGrad)" />

    <!-- Inner membrane scallops -->
    <path d="M105,42
             C74,20 42,18 13,23
             C19,38 24,55 30,71
             C36,89 43,104 52,118
             C61,102 69,87 79,73
             C87,62 96,52 105,42Z"
          fill="url(#innerWingGrad)"/>

    <!-- Wing ribs -->
    <g stroke="#7050b0" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
      <path d="M105,42 L60,120"/>
      <path d="M90,38 L42,100"/>
      <path d="M73,33 L28,78"/>
      <path d="M55,28 L18,55"/>
    </g>

    <!-- Wing edge highlights -->
    <path d="M5,13
             C12,38 18,59 26,79"
          fill="none"
          stroke="#8a6bff"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.6"/>
    <path d="M80,34
             C95,40 106,52 112,64"
          fill="none"
          stroke="#8a6bff"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.6"/>
  </g>

  <!-- Body group -->
  <g transform="translate(130,104)">
    <!-- Body circle -->
    <circle cx="0" cy="0" r="62" fill="url(#batBodyGrad)"/>
    <!-- Body highlight -->
    <ellipse cx="-18" cy="-20" rx="32" ry="26" fill="url(#highlightGrad)" opacity="0.65"/>

    <!-- Small top spikes for extra Halloween character -->
    <path d="M-25,-59
             C-22,-49 -13,-45 -8,-59
             C-3,-45 6,-48 9,-59"
          fill="url(#spikeGrad)"/>
    <path d="M15,-59
             C18,-49 27,-45 32,-59
             C37,-45 46,-48 49,-59"
          fill="url(#spikeGrad)"/>

    <!-- Ears -->
    <g>
      <!-- Left ear -->
      <path d="M-32,-52
               C-48,-80 -52,-99 -39,-106
               C-27,-113 -13,-103 -8,-87
               C-5,-78 -5,-66 -6,-57
               Z"
            fill="url(#earGrad)"/>
      <path d="M-30,-52
               C-42,-77 -44,-92 -35,-97
               C-26,-101 -17,-93 -13,-82
               C-11,-76 -10,-68 -11,-60
               Z"
            fill="url(#earInnerGrad)"/>
      <!-- Right ear -->
      <path d="M32,-52
               C48,-80 52,-99 39,-106
               C27,-113 13,-103 8,-87
               C5,-78 5,-66 6,-57
               Z"
            fill="url(#earGrad)"/>
      <path d="M30,-52
               C42,-77 44,-92 35,-97
               C26,-101 17,-93 13,-82
               C11,-76 10,-68 11,-60
               Z"
            fill="url(#earInnerGrad)"/>
    </g>

    <!-- Googly eye -->
    <g transform="translate(-10,-18)">
      <!-- Eye white -->
      <circle cx="0" cy="0" r="18" fill="url(#eyeGrad)"/>
      <!-- Slight outline -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#120c22" stroke-width="2"/>
      <!-- Pupil (off-center for googly look) -->
      <circle cx="4" cy="4" r="7.5" fill="#1c102f"/>
      <!-- Pupil shine -->
      <circle cx="1.5" cy="1.5" r="3" fill="url(#pupilHighlight)"/>
      <!-- Extra goofiness: small offset shadow shape -->
      <ellipse cx="2" cy="5.5" rx="10" ry="6" fill="#000000" opacity="0.18"/>
    </g>

    <!-- Mouth area -->
    <g transform="translate(0,18)">
      <!-- Mouth outline -->
      <path d="M-30,-4
               C-18,12 -5,18 0,18
               C5,18 18,12 30,-4
               C18,2 5,4 0,4
               C-5,4 -18,2 -30,-4Z"
            fill="#0b0512"/>
      <!-- Inner mouth -->
      <path d="M-24,-2
               C-13,10 -4,13 0,13
               C4,13 13,10 24,-2
               C13,2 4,3 0,3
               C-4,3 -13,2 -24,-2Z"
            fill="url(#mouthGrad)"/>
      <!-- Tongue -->
      <path d="M-9,4
               C-6,12 -3,16 0,16
               C3,16 6,12 9,4
               C6,6 3,7 0,7
               C-3,7 -6,6 -9,4Z"
            fill="#ff93b8"/>

      <!-- Fangs -->
      <g>
        <!-- Left fang -->
        <path d="M-12,6
                 L-18,24
                 Q-12,19 -6,24
                 Z"
              fill="url(#fangGrad)"/>
        <path d="M-15,14
                 Q-14,11 -11,9"
              fill="none"
              stroke="#d5cfff"
              stroke-width="1.3"
              stroke-linecap="round"
              opacity="0.8"/>
        <!-- Right fang -->
        <path d="M12,6
                 L18,24
                 Q12,19 6,24
                 Z"
              fill="url(#fangGrad)"/>
        <path d="M15,14
                 Q14,11 11,9"
              fill="none"
              stroke="#d5cfff"
              stroke-width="1.3"
              stroke-linecap="round"
              opacity="0.8"/>
      </g>

      <!-- Subtle lip highlight -->
      <path d="M-22,-1
               C-10,4 -5,5 0,5
               C5,5 10,4 22,-1"
            fill="none"
            stroke="#ffb3d0"
            stroke-width="1.3"
            stroke-linecap="round"
            opacity="0.6"/>
    </g>

    <!-- Body contour stroke -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#120816" stroke-width="3"/>

    <!-- Body shine -->
    <circle cx="-20" cy="-22" r="18" fill="url(#shineGrad)" opacity="0.7"/>
  </g>
</svg>