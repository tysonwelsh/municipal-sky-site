  <ellipse cx="180" cy="364" rx="97" ry="119" fill="url(#gold)" stroke="#7a5a12" stroke-width="2.5"/>
  <ellipse cx="180" cy="364" rx="90" ry="112" fill="none" stroke="#8a6410" stroke-width="3" stroke-dasharray="0.5 6" stroke-linecap="round"/>

  <!-- oval ruby -->
  <ellipse cx="180" cy="364" rx="86" ry="108" fill="url(#ruby)" stroke="#4a030f" stroke-width="2"/>
  <g stroke="#ff9aa5" stroke-width="1.4" opacity="0.5" fill="none">
    <path d="M222 364L266 364M209.7 403.6L240.8 440.4M180 420L180 472M150.3 403.6L119.2 440.4M138 364L94 364M150.3 324.4L119.2 287.6M180 308L180 256M209.7 324.4L240.8 287.6"/>
