  <ellipse cx="180" cy="364" rx="42" ry="56" fill="none" stroke="#ffb3bd" stroke-width="1.6" opacity="0.55"/>
  <ellipse cx="152" cy="316" rx="24" ry="38" fill="#ffffff" opacity="0.28" transform="rotate(-28 152 316)"/>

