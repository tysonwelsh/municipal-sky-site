      <circle cx="-7" cy="-8" r="4" fill="#ffffff" opacity="0.9"/>
    </g>
    <path id="spark" d="M0 -11L2.2 -2.2L11 0L2.2 2.2L0 11L-2.2 2.2L-11 0L-2.2 -2.2Z" fill="#ffffff"/>
  </defs>

  <!-- French hook wire -->
  <path d="M180 158 C184 126 181 96 171 66 C161 34 124 8 95 22 C74 32 66 57 75 78" fill="none" stroke="#8f6410" stroke-width="12.5" stroke-linecap="round"/>
  <path d="M180 158 C184 126 181 96 171 66 C161 34 124 8 95 22 C74 32 66 57 75 78" fill="none" stroke="url(#goldV)" stroke-width="9.5" stroke-linecap="round"/>
  <path d="M180 158 C184 126 181 96 171 66 C161 34 124 8 95 22 C74 32 66 57 75 78" fill="none" stroke="#ffe9a8" stroke-width="3.2" stroke-linecap="round" opacity="0.75"/>
