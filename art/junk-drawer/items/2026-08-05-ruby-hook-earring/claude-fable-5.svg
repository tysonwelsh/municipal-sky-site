      <stop offset="0" stop-color="#fbe8a6"/>
      <stop offset="0.45" stop-color="#e3b53e"/>
      <stop offset="0.8" stop-color="#b78a1e"/>
      <stop offset="1" stop-color="#8f6410"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
