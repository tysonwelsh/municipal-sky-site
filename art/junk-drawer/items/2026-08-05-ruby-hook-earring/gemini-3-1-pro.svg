<svg xmlns="http://www.w3.org/2000/svg" viewBox="20.5 8.2 62.8 159.0" width="62.8" height="159.0">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="25%" stop-color="#DAA520" />
      <stop offset="50%" stop-color="#FCE688" />
      <stop offset="75%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <!-- Ruby Gradient -->
    <radialGradient id="ruby" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="40%" stop-color="#D31A38" />
      <stop offset="80%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#4A0000" />
    </radialGradient>

    <!-- Diamond Gradient -->
    <radialGradient id="diamond" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#B2EBF2" />
    </radialGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Antique Hook -->
  <path d="M 50,15 C 65,5 80,25 70,50 L 50,85" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" />
  <path d="M 50,15 C 35,5 20,25 30,50 L 50,85" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.5" />
  <circle cx="50" cy="85" r="3" fill="url(#gold)" />
  <path d="M 49,85 L 49,95 M 51,85 L 51,95" stroke="url(#gold)" stroke-width="1.5" />

  <!-- Gold Basket / Setting base -->
  <g filter="url(#shadow)">
    <!-- Intricate basket details -->
    <path d="M 25,125 Q 50,175 75,125 Q 70,95 50,90 Q 30,95 25,125" fill="url(#gold)" stroke="#8B6508" stroke-width="1" />
    <path d="M 35,100 L 40,110 M 65,100 L 60,110 M 30,120 L 45,115 M 70,120 L 55,115" stroke="#B8860B" stroke-width="2" />
    
    <!-- Outer Ring of Diamonds -->
    <!-- Center Top -->
    <polygon points="50,92 54,98 50,104 46,98" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Center Bottom -->
    <polygon points="50,158 54,152 50,146 46,152" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Top Right -->
    <polygon points="62,97 66,104 60,108 56,101" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Top Left -->
    <polygon points="38,97 44,101 40,108 34,104" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Mid Right Top -->
    <polygon points="70,108 74,116 68,120 64,112" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Mid Left Top -->
    <polygon points="30,108 36,112 32,120 26,116" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Mid Right Bottom -->
    <polygon points="72,122 75,130 69,134 66,126" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Mid Left Bottom -->
    <polygon points="28,122 34,126 31,134 25,130" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Bottom Right -->
    <polygon points="65,138 68,145 62,148 59,141" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    <!-- Bottom Left -->
    <polygon points="35,138 41,141 38,148 32,145" fill="url(#diamond)" stroke="#A9A9A9" stroke-width="0.5" />
    
    <!-- Diamond prongs -->
    <circle cx="50" cy="91" r="1.5" fill="url(#gold)" />
    <circle cx="50" cy="159" r="1.5" fill="url(#gold)" />
    <circle cx="64" cy="95" r="1.5" fill="url(#gold)" />
    <circle cx="36" cy="95" r="1.5" fill="url(#gold)" />
    <circle cx="73" cy="107" r="1.5" fill="url(#gold)" />
    <circle cx="27" cy="107" r="1.5" fill="url(#gold)" />
    <circle cx="76" cy="123" r="1.5" fill="url(#gold)" />
    <circle cx="24" cy="123" r="1.5" fill="url(#gold)" />
    <circle cx="68" cy="140" r="1.5" fill="url(#gold)" />
    <circle cx="32" cy="140" r="1.5" fill="url(#gold)" />

    <!-- Center Oval Ruby -->
    <ellipse cx="50" cy="125" rx="14" ry="22" fill="url(#ruby)" />
    
    <!-- Ruby Facets -->
    <polygon points="50,103 64,125 50,147 36,125" fill="none" stroke="#FFA07A" stroke-width="0.8" opacity="0.6" />
    <polygon points="50,109 58,125 50,141 42,125" fill="none" stroke="#FFA07A" stroke-width="0.5" opacity="0.8" />
    <line x1="50" y1="103" x2="50" y2="109" stroke="#FFA07A" stroke-width="0.5" opacity="0.6" />
    <line x1="64" y1="125" x2="58" y2="125" stroke="#FFA07A" stroke-width="0.5" opacity="0.6" />
    <line x1="50" y1="147" x2="50" y2="141" stroke="#FFA07A" stroke-width="0.5" opacity="0.6" />
    <line x1="36" y1="125" x2="42" y2="125" stroke="#FFA07A" stroke-width="0.5" opacity="0.6" />
    
    <!-- Ruby Highlights -->
    <path d="M 42,110 Q 50,105 58,110" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4" stroke-linecap="round" />
    
    <!-- Ruby Prongs -->
    <circle cx="41" cy="108" r="2" fill="url(#gold)" />
    <circle cx="59" cy="108" r="2" fill="url(#gold)" />
    <circle cx="41" cy="142" r="2" fill="url(#gold)" />
    <circle cx="59" cy="142" r="2" fill="url(#gold)" />
  </g>
</svg>