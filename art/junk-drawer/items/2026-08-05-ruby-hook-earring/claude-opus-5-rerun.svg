<svg xmlns="http://www.w3.org/2000/svg" viewBox="93.5 14.5 212.8 664.8">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3a1"/>
      <stop offset="0.25" stop-color="#e0b64c"/>
      <stop offset="0.5" stop-color="#b8862a"/>
      <stop offset="0.75" stop-color="#e9c96a"/>
      <stop offset="1" stop-color="#8f6318"/>
    </linearGradient>
    <linearGradient id="goldWire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6318"/>
      <stop offset="0.35" stop-color="#f3dc95"/>
      <stop offset="0.6" stop-color="#cfa03c"/>
      <stop offset="1" stop-color="#7d5514"/>
    </linearGradient>
    <radialGradient id="rubyG" cx="0.36" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ff7d84"/>
      <stop offset="0.22" stop-color="#e02a3c"/>
      <stop offset="0.6" stop-color="#a10a20"/>
      <stop offset="1" stop-color="#570010"/>
    </radialGradient>
    <radialGradient id="diaG" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e2f0f7"/>
      <stop offset="1" stop-color="#9fb6c4"/>
    </radialGradient>
    <linearGradient id="basketG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c164"/>
      <stop offset="0.5" stop-color="#b07f22"/>
      <stop offset="1" stop-color="#7a5312"/>
    </linearGradient>
  </defs>

  <g id="earring">
    <!-- Hook wire -->
    <path d="M200 22 C130 22 96 78 104 128 C110 168 140 196 168 214"
          fill="none" stroke="url(#goldWire)" stroke-width="11" stroke-linecap="round"/>
    <path d="M200 22 C142 22 110 70 116 122 C122 160 148 186 172 204"
          fill="none" stroke="#fff3c9" stroke-width="2.6" stroke-linecap="round" opacity="0.65"/>
    <path d="M200 22 C224 22 240 34 244 52 C248 70 240 84 228 92"
          fill="none" stroke="url(#goldWire)" stroke-width="9" stroke-linecap="round"/>

    <!-- connector loop -->
    <circle cx="176" cy="224" r="17" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <circle cx="176" cy="224" r="17" fill="none" stroke="#fff0bd" stroke-width="1.6" opacity="0.5"/>

    <!-- bail -->
    <path d="M176 244 C176 262 190 268 200 274 C210 268 224 262 224 244"
          fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="200" cy="282" rx="26" ry="13" fill="url(#basketG)" stroke="#6d4a10" stroke-width="2"/>
    <ellipse cx="200" cy="279" rx="16" ry="6" fill="#f3d786" opacity="0.7"/>

    <!-- basket / gallery under the setting -->
    <g stroke="#6d4a10" stroke-width="2">
      <path d="M118 470 C118 560 160 640 200 676 C240 640 282 560 282 470 Z" fill="url(#basketG)"/>
    </g>
    <g fill="none" stroke="#5e3f0d" stroke-width="2.2" opacity="0.85">
      <path d="M200 486 L200 672"/>
      <path d="M158 484 C160 560 176 630 200 672"/>
      <path d="M242 484 C240 560 224 630 200 672"/>
      <path d="M126 505 C150 520 250 520 274 505"/>
      <path d="M136 556 C160 576 240 576 264 556"/>
      <path d="M154 610 C172 628 228 628 246 610"/>
    </g>
    <g fill="#f6e0a2" opacity="0.5">
      <path d="M132 500 C156 514 244 514 268 500 L268 507 C244 521 156 521 132 507 Z"/>
      <path d="M142 552 C164 570 236 570 258 552 L258 559 C236 577 164 577 142 559 Z"/>
    </g>
    <!-- milgrain beads on basket edges -->
    <g fill="#ffeeb8">
      <circle cx="150" cy="536" r="3"/><circle cx="250" cy="536" r="3"/>
      <circle cx="166" cy="592" r="2.8"/><circle cx="234" cy="592" r="2.8"/>
      <circle cx="200" cy="640" r="3"/>
    </g>

    <!-- outer gold halo frame -->
    <ellipse cx="200" cy="440" rx="96" ry="128" fill="url(#gold)" stroke="#6d4a10" stroke-width="2.5"/>
    <ellipse cx="200" cy="440" rx="88" ry="119" fill="none" stroke="#5e3f0d" stroke-width="2" opacity="0.6"/>

    <!-- milgrain outer beading -->
    <g fill="#ffe9ab">
      <circle cx="200" cy="313" r="3.2"/><circle cx="235" cy="318" r="3.2"/><circle cx="264" cy="335" r="3.2"/>
      <circle cx="283" cy="362" r="3.2"/><circle cx="293" cy="395" r="3.2"/><circle cx="296" cy="430" r="3.2"/>
      <circle cx="293" cy="466" r="3.2"/><circle cx="284" cy="500" r="3.2"/><circle cx="266" cy="532" r="3.2"/>
      <circle cx="240" cy="555" r="3.2"/><circle cx="200" cy="567" r="3.2"/><circle cx="160" cy="555" r="3.2"/>
      <circle cx="134" cy="532" r="3.2"/><circle cx="116" cy="500" r="3.2"/><circle cx="107" cy="466" r="3.2"/>
      <circle cx="104" cy="430" r="3.2"/><circle cx="107" cy="395" r="3.2"/><circle cx="117" cy="362" r="3.2"/>
      <circle cx="136" cy="335" r="3.2"/><circle cx="165" cy="318" r="3.2"/>
    </g>

    <!-- diamond halo ring -->
    <g>
      <!-- each diamond: round brilliant with facet lines -->
      <g id="dia">
        <g transform="translate(200,340)">
          <circle r="17" fill="url(#diaG)" stroke="#8fa7b5" stroke-width="1"/>
          <circle r="9" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.9"/>
          <path d="M-17 0 L-9 -6 M17 0 L9 -6 M0 -17 L0 -9 M0 17 L0 9 M-12 12 L-6 7 M12 12 L6 7 M-12 -12 L-6 -7 M12 -12 L6 -7" stroke="#ffffff" stroke-width="1" opacity="0.85" fill="none"/>
          <circle cx="-5" cy="-6" r="3.5" fill="#ffffff" opacity="0.9"/>
        </g>
      </g>
      <use href="#dia" transform="translate(37,10) rotate(0)"/>
      <use href="#dia" transform="translate(66,32)"/>
      <use href="#dia" transform="translate(82,66)"/>
      <use href="#dia" transform="translate(87,104)"/>
      <use href="#dia" transform="translate(82,142)"/>
      <use href="#dia" transform="translate(64,176)"/>
      <use href="#dia" transform="translate(36,197)"/>
      <use href="#dia" transform="translate(0,206)"/>
      <use href="#dia" transform="translate(-36,197)"/>
      <use href="#dia" transform="translate(-64,176)"/>
      <use href="#dia" transform="translate(-82,142)"/>
      <use href="#dia" transform="translate(-87,104)"/>
      <use href="#dia" transform="translate(-82,66)"/>
      <use href="#dia" transform="translate(-66,32)"/>
      <use href="#dia" transform="translate(-37,10)"/>
    </g>

    <!-- inner gold bezel -->
    <ellipse cx="200" cy="443" rx="62" ry="88" fill="url(#gold)" stroke="#6d4a10" stroke-width="2"/>
    <ellipse cx="200" cy="443" rx="55" ry="80" fill="#7a5312"/>

    <!-- ruby oval -->
    <ellipse cx="200" cy="443" rx="51" ry="76" fill="url(#rubyG)"/>
    <!-- ruby facets -->
    <g fill="none" stroke="#ff9aa4" stroke-width="1.5" opacity="0.55">
      <ellipse cx="200" cy="443" rx="30" ry="47"/>
      <path d="M200 367 L200 396 M200 519 L200 490 M149 443 L170 443 M251 443 L230 443"/>
      <path d="M166 389 L182 408 M234 389 L218 408 M166 497 L182 478 M234 497 L218 478"/>
      <path d="M170 443 L200 396 L230 443 L200 490 Z"/>
    </g>
    <g fill="#ffffff" opacity="0.5">
      <ellipse cx="183" cy="404" rx="13" ry="20" transform="rotate(-20 183 404)"/>
    </g>
    <ellipse cx="187" cy="410" rx="6" ry="10" fill="#ffffff" opacity="0.75" transform="rotate(-20 187 410)"/>
    <path d="M222 490 C236 474 240 452 238 436" stroke="#ff8f9a" stroke-width="3" fill="none" opacity="0.4"/>

    <!-- prongs holding ruby -->
    <g fill="url(#gold)" stroke="#6d4a10" stroke-width="1.5">
      <ellipse cx="200" cy="370" rx="10" ry="8"/>
      <ellipse cx="200" cy="516" rx="10" ry="8"/>
      <ellipse cx="155" cy="405" rx="9" ry="8" transform="rotate(-35 155 405)"/>
      <ellipse cx="245" cy="405" rx="9" ry="8" transform="rotate(35 245 405)"/>
      <ellipse cx="155" cy="481" rx="9" ry="8" transform="rotate(35 155 481)"/>
      <ellipse cx="245" cy="481" rx="9" ry="8" transform="rotate(-35 245 481)"/>
    </g>
  </g>
</svg>