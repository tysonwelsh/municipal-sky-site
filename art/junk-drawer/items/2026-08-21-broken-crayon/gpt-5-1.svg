<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.0 15.8 319.8 94.8">
  <defs>
    <linearGradient id="crayonBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#01796f"/>
      <stop offset="0.5" stop-color="#20b2aa"/>
      <stop offset="1" stop-color="#006d62"/>
    </linearGradient>
    <linearGradient id="crayonBodyRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007c71"/>
      <stop offset="0.5" stop-color="#24c2b8"/>
      <stop offset="1" stop-color="#00675e"/>
    </linearGradient>
    <linearGradient id="labelBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2f4ec"/>
      <stop offset="1" stop-color="#8fd9cc"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0.2" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft shadow beneath -->
  <ellipse cx="160" cy="100" rx="130" ry="12" fill="url(#shadowGrad)" />

  <!-- left broken crayon piece -->
  <!-- body -->
  <path d="M10 55
           L150 40
           Q160 39 166 44
           L188 62
           Q194 67 183 69
           L40 90
           Q32 91 26 86
           L6 69
           Q1 64 10 55Z"
        fill="url(#crayonBody)"/>

  <!-- left label band -->
