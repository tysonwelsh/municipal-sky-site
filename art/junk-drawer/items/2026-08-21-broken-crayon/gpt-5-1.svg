  <!-- accent line on body (right) -->
  <path d="M196 67
           Q238 63 280 57
           Q302 54 314 55"
        fill="none" stroke="#005a53" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- highlight on right body -->
  <path d="M190 38
           Q240 30 292 25
           Q300 24 306 28
           Q278 35 246 42
           Q214 49 196 53
           Q188 46 190 38Z"
        fill="url(#highlight)" opacity="0.6"/>

  <!-- small broken wax chips -->
  <circle cx="158" cy="71" r="3" fill="#007b71"/>
  <circle cx="166" cy="77" r="2.4" fill="#009085"/>
  <circle cx="175" cy="70" r="2.8" fill="#00655d"/>

  <!-- subtle crack details -->
  <path d="M154 52
           Q158 57 156 63
           Q154 69 151 73"
        fill="none" stroke="#012623" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <path d="M184 50
           Q189 54 192 60
           Q194 64 199 66"
        fill="none" stroke="#013c37" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
</svg>