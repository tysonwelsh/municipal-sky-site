           L140 47
           Q146 46 150 49
           L166 62
           Q171 66 163 67
           L72 80
           Q66 81 62 78
           L45 65
           Q40 60 48 57Z"
        fill="url(#labelBand)" opacity="0.95"/>

  <!-- left tip (flat) -->
  <path d="M6 69
           L26 86
           Q22 74 23 63
           Z"
        fill="#01564f"/>

  <!-- fracture edge on left piece -->
  <path d="M150 40
           Q154 52 152 64
           Q150 73 148 79
           L183 69
           L166 44Z"
        fill="#00443d"/>

  <!-- accent line on body (left) -->
  <path d="M30 70
           Q80 58 134 52
           Q147 51 154 57"
        fill="none" stroke="#004f48" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- highlight on left body -->
  <path d="M26 60
           Q80 49 132 44
           Q142 43 150 48
           Q124 52 88 61
           Q52 70 32 74
           Q22 67 26 60Z"
        fill="url(#highlight)" opacity="0.7"/>

  <!-- right broken crayon piece -->
  <!-- body -->
  <path d="M190 34
           L312 18
           Q318 17 320 25
           L320 95
           Q320 104 312 103
           L202 90
           Q194 89 188 82
           L170 61
           Q165 55 170 49
           Z"
        fill="url(#crayonBodyRight)"/>

  <!-- right label band -->
  <path d="M204 44
           L300 32
           Q310 31 314 37
           L314 81
           Q314 88 304 87
           L210 77
           Q203 76 198 70
           L186 56
           Q182 51 187 47
           Z"
        fill="url(#labelBand)" opacity="0.95"/>

  <!-- pointy tip cap -->
  <path d="M312 18
           Q305 30 300 41
           Q296 50 294 58
           Q292 63 294 69
           Q296 77 300 84
           Q307 93 312 103
           Q318 104 320 95
           L320 25
           Q318 17 312 18Z"
        fill="#01564f"/>

  <!-- fracture edge on right piece -->
  <path d="M170 49
           Q180 56 188 62
           Q194 66 202 68
           Q210 70 221 71
           Q233 72 244 73
           Q228 65 216 56
           Q206 49 198 42
           Z"
