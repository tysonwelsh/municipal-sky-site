<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.0 64.8 783.8 110.2">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#fdfcf8"/>
      <stop offset="0.5" stop-color="#f2eee3"/>
      <stop offset="0.82" stop-color="#ddd7c8"/>
      <stop offset="1" stop-color="#c8c1b1"/>
    </linearGradient>
    <linearGradient id="filter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d99a"/>
      <stop offset="0.18" stop-color="#eecb84"/>
      <stop offset="0.5" stop-color="#dcb266"/>
      <stop offset="0.82" stop-color="#c1934b"/>
      <stop offset="1" stop-color="#a87b3a"/>
    </linearGradient>
    <linearGradient id="tob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8813f"/>
      <stop offset="0.45" stop-color="#7e5c2a"/>
      <stop offset="1" stop-color="#4d3617"/>
    </linearGradient>
    <linearGradient id="bandg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#faf6ea"/>
      <stop offset="0.55" stop-color="#e8e0cd"/>
      <stop offset="1" stop-color="#bfb6a2"/>
    </linearGradient>
  </defs>

  <g transform="translate(0,8)">
    <!-- filter section -->
    <path d="M40 60 H300 V164 H40 A10 10 0 0 1 40 60 Z" fill="url(#filter)"/>
    <!-- filter speckle -->
    <g fill="#b9863c" opacity="0.45">
      <circle cx="70" cy="82" r="2"/><circle cx="96" cy="120" r="1.6"/>
      <circle cx="120" cy="95" r="2.2"/><circle cx="150" cy="140" r="1.7"/>
      <circle cx="178" cy="76" r="1.9"/><circle cx="205" cy="118" r="2.1"/>
      <circle cx="232" cy="93" r="1.6"/><circle cx="258" cy="145" r="2"/>
      <circle cx="282" cy="104" r="1.7"/><circle cx="60" cy="135" r="1.5"/>
      <circle cx="135" cy="66" r="1.5"/><circle cx="245" cy="66" r="1.4"/>
      <circle cx="190" cy="152" r="1.5"/><circle cx="108" cy="152" r="1.4"/>
      <circle cx="272" cy="72" r="1.5"/>
    </g>
    <!-- filter tip end shading -->
    <path d="M50 60 A10 10 0 0 0 50 164 L44 164 A10 10 0 0 1 44 60 Z" fill="#8f6529" opacity="0.5"/>

    <!-- white band over filter joint -->
    <rect x="292" y="60" width="40" height="104" fill="url(#bandg)"/>
    <rect x="292" y="60" width="3" height="104" fill="#c9b98f" opacity="0.7"/>
    <rect x="329" y="60" width="3" height="104" fill="#b8ab90" opacity="0.5"/>

    <!-- paper barrel -->
    <path d="M332 60 H740 V164 H332 Z" fill="url(#paper)"/>

    <!-- burning tip / tobacco end -->
    <path d="M740 60 H756 V164 H740 Z" fill="#cfc8b6"/>
    <path d="M756 60 H772 A8 52 0 0 1 772 164 H756 Z" fill="url(#tob)"/>
    <ellipse cx="756" cy="112" rx="7" ry="52" fill="#3f2c12" opacity="0.55"/>
    <g fill="#c99b4e" opacity="0.55">
      <rect x="748" y="74" width="22" height="4" rx="2" transform="rotate(-8 759 76)"/>
      <rect x="750" y="96" width="20" height="3.5" rx="1.7" transform="rotate(6 760 98)"/>
      <rect x="746" y="126" width="24" height="4" rx="2" transform="rotate(-5 758 128)"/>
      <rect x="752" y="146" width="18" height="3.5" rx="1.7" transform="rotate(9 761 148)"/>
    </g>

    <!-- subtle highlight along top -->
    <rect x="40" y="66" width="726" height="10" fill="#ffffff" opacity="0.28"/>
    <!-- soft bottom shade -->
    <rect x="40" y="150" width="726" height="14" fill="#8a8271" opacity="0.18"/>

    <!-- outline -->
    <path d="M50 60 H764 A8 52 0 0 1 764 164 H50 A52 52 0 0 1 50 60 Z"
          fill="none" stroke="#6b6353" stroke-width="2.2" opacity="0.55"/>
  </g>
</svg>