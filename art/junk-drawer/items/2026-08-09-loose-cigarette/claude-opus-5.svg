<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 200" width="1200" height="200">
  <title>A single loose cigarette</title>
  <defs>
    <path id="rod" d="M 26 135 C 260 131 430 119 640 107 C 850 95 1030 85 1188 75"/>
    <filter id="soft" x="-10%" y="-140%" width="120%" height="380%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="soft2" x="-8%" y="-100%" width="116%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="soft3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <pattern id="verge" width="13" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-3.3)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#8d8574" stroke-width="1.3" opacity="0.26"/>
    </pattern>
    <linearGradient id="tob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6431"/>
      <stop offset="0.35" stop-color="#6d4a21"/>
      <stop offset="0.75" stop-color="#422c13"/>
      <stop offset="1" stop-color="#59401f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead0"/>
      <stop offset="0.55" stop-color="#e4d0aa"/>
      <stop offset="1" stop-color="#c3a878"/>
    </linearGradient>
    <clipPath id="filterClip">
      <rect x="800" y="-140" width="460" height="480" transform="rotate(-3.3 800 98)"/>
    </clipPath>
    <clipPath id="tobClip">
      <ellipse cx="22" cy="136" rx="18" ry="69" transform="rotate(-3.3 22 136)"/>
    </clipPath>
    <clipPath id="faceClip">
      <ellipse cx="1191" cy="75" rx="9.5" ry="70" transform="rotate(-3.3 1191 75)"/>
    </clipPath>
  </defs>

  <!-- cast shadow -->
  <g filter="url(#soft)" opacity="0.32">
    <use href="#rod" xlink:href="#rod" transform="translate(16,34)" fill="none" stroke="#463b2b" stroke-width="150"/>
  </g>
  <g filter="url(#soft2)" opacity="0.2">
    <use href="#rod" xlink:href="#rod" transform="translate(6,17)" fill="none" stroke="#3a3126" stroke-width="138"/>
  </g>

  <!-- exposed tobacco at the open end -->
  <ellipse cx="22" cy="136" rx="18" ry="69" transform="rotate(-3.3 22 136)" fill="url(#tob)"/>
  <g clip-path="url(#tobClip)" fill="none" stroke-linecap="round">
    <path d="M 6 80 C 20 84 28 78 40 82" stroke="#9c743d" stroke-width="2.6" opacity="0.8"/>
    <path d="M 4 96 C 16 100 26 94 38 99" stroke="#3b2712" stroke-width="3" opacity="0.85"/>
    <path d="M 8 112 C 20 108 28 116 40 112" stroke="#8a6331" stroke-width="2.4" opacity="0.75"/>
    <path d="M 3 126 C 16 130 26 124 38 128" stroke="#33210f" stroke-width="3.2" opacity="0.8"/>
    <path d="M 6 142 C 18 138 28 145 40 141" stroke="#7a5527" stroke-width="2.2" opacity="0.7"/>
    <path d="M 4 158 C 16 162 26 156 38 160" stroke="#2c1c0c" stroke-width="3" opacity="0.85"/>
    <path d="M 8 174 C 20 170 28 177 40 173" stroke="#6b4a22" stroke-width="2.4" opacity="0.7"/>
    <path d="M 5 190 C 18 194 26 188 38 192" stroke="#241609" stroke-width="3" opacity="0.8"/>
    <path d="M 14 70 C 18 100 12 130 18 168" stroke="#a67c44" stroke-width="1.6" opacity="0.45"/>
    <path d="M 28 74 C 32 106 24 140 30 180" stroke="#2b1c0c" stroke-width="1.6" opacity="0.5"/>
  </g>

  <!-- paper rod: layered cylindrical shading -->
  <g fill="none">
    <use href="#rod" xlink:href="#rod" stroke="#b6ae9e" stroke-width="140"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-3)" stroke="#d2ccbe" stroke-width="132"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-8)" stroke="#e6e1d5" stroke-width="116"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-14)" stroke="#f2eee5" stroke-width="92"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-20)" stroke="#faf8f1" stroke-width="56"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-25)" stroke="#ffffff" stroke-width="24" opacity="0.9"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,58)" stroke="#cdc5b4" stroke-width="13" opacity="0.85"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,67)" stroke="#9c9382" stroke-width="4" opacity="0.7"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-68)" stroke="#cbc5b8" stroke-width="4" opacity="0.6"/>
    <!-- laid paper texture -->
    <use href="#rod" xlink:href="#rod" stroke="url(#verge)" stroke-width="140" opacity="0.55"/>
    <!-- glue seam running the length -->
    <use href="#rod" xlink:href="#rod" transform="translate(0,27)" stroke="#b5ac99" stroke-width="2.2" opacity="0.5"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,24)" stroke="#ffffff" stroke-width="1.4" opacity="0.5"/>
  </g>

  <!-- soft crease from a pocket -->
  <g fill="none" filter="url(#soft3)">
    <path d="M 552 44 Q 560 112 556 180" stroke="#9a9280" stroke-width="8" opacity="0.3"/>
    <path d="M 568 40 Q 575 110 571 178" stroke="#ffffff" stroke-width="5" opacity="0.42"/>
    <path d="M 300 128 Q 470 118 640 106" stroke="#a8a08e" stroke-width="3" opacity="0.22"/>
  </g>

  <!-- tipping paper / filter -->
  <g clip-path="url(#filterClip)" fill="none">
    <use href="#rod" xlink:href="#rod" stroke="#a3773a" stroke-width="140"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-3)" stroke="#c09a57" stroke-width="132"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-8)" stroke="#d4b073" stroke-width="116"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-14)" stroke="#e2c189" stroke-width="92"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-20)" stroke="#ecce9e" stroke-width="56"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-25)" stroke="#f7e2bd" stroke-width="24" opacity="0.85"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,58)" stroke="#b98c4a" stroke-width="13" opacity="0.9"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,67)" stroke="#7f5c2c" stroke-width="4" opacity="0.8"/>
    <use href="#rod" xlink:href="#rod" transform="translate(0,-68)" stroke="#b08e56" stroke-width="4" opacity="0.55"/>
    <use href="#rod" xlink:href="#rod" stroke="url(#verge)" stroke-width="140" opacity="0.28"/>
    <!-- perforation rows -->
    <g fill="#7a5528" stroke="none" opacity="0.55">
      <circle cx="884" cy="36" r="1.6"/><circle cx="884" cy="49" r="1.6"/><circle cx="884" cy="62" r="1.6"/>
      <circle cx="884" cy="75" r="1.6"/><circle cx="884" cy="88" r="1.6"/><circle cx="884" cy="101" r="1.6"/>
      <circle cx="884" cy="114" r="1.6"/><circle cx="884" cy="127" r="1.6"/><circle cx="884" cy="140" r="1.6"/>
      <circle cx="909" cy="34" r="1.6"/><circle cx="909" cy="47" r="1.6"/><circle cx="909" cy="60" r="1.6"/>
      <circle cx="909" cy="73" r="1.6"/><circle cx="909" cy="86" r="1.6"/><circle cx="909" cy="99" r="1.6"/>
      <circle cx="909" cy="112" r="1.6"/><circle cx="909" cy="125" r="1.6"/><circle cx="909" cy="138" r="1.6"/>
    </g>
  </g>

  <!-- seam between paper and tipping -->
  <g transform="rotate(-3.3 800 98)">
    <rect x="794" y="28" width="3" height="140" fill="#ffffff" opacity="0.55"/>
    <rect x="797" y="28" width="5" height="140" fill="#8a6430" opacity="0.45"/>
    <rect x="802" y="28" width="2" height="140" fill="#f4dcae" opacity="0.5"/>
  </g>

  <!-- filter end face -->
  <ellipse cx="1191" cy="75" rx="9.5" ry="70" transform="rotate(-3.3 1191 75)" fill="url(#face)"/>
  <g clip-path="url(#faceClip)" fill="#c8ac7c" opacity="0.6">
    <circle cx="1188" cy="18" r="1.3"/><circle cx="1193" cy="30" r="1"/><circle cx="1187" cy="42" r="1.4"/>
    <circle cx="1194" cy="54" r="1.1"/><circle cx="1189" cy="66" r="1.5"/><circle cx="1195" cy="78" r="1"/>
    <circle cx="1188" cy="90" r="1.3"/><circle cx="1194" cy="102" r="1.2"/><circle cx="1189" cy="114" r="1.4"/>
    <circle cx="1195" cy="126" r="1"/><circle cx="1188" cy="138" r="1.3"/>
  </g>
  <path d="M 1184 6 A 70 70 0 0 1 1184 144" fill="none" stroke="#8a6430" stroke-width="2" opacity="0.35"/>

  <!-- a few strands escaping the open tobacco end only -->
  <g fill="none" stroke-linecap="round">
    <path d="M 22 106 C 10 88 20 66 8 44" stroke="#7d5726" stroke-width="3"/>
    <path d="M 20 122 C 4 106 14 82 3 58" stroke="#5e401c" stroke-width="2.4"/>
    <path d="M 22 88 C 22 62 34 50 30 26" stroke="#93683a" stroke-width="2.4"/>
    <path d="M 22 150 C 10 140 16 120 4 102" stroke="#6b4a22" stroke-width="2.8"/>
    <path d="M 20 170 C 12 160 18 148 8 136" stroke="#4a3216" stroke-width="2.2"/>
    <path d="M 18 188 C 8 180 12 168 2 158" stroke="#5e401c" stroke-width="2.4"/>
    <path d="M 24 136 C 10 130 6 120 0 116" stroke="#3c2811" stroke-width="2.4"/>
  </g>

  <!-- loose tobacco crumbs and dust -->
  <g stroke="none">
    <ellipse cx="58" cy="52" rx="3.4" ry="1.6" transform="rotate(20 58 52)" fill="#6d4a22"/>
    <ellipse cx="96" cy="26" rx="2.2" ry="1.2" transform="rotate(-30 96 26)" fill="#8a6334"/>
    <ellipse cx="146" cy="56" rx="4" ry="1.8" transform="rotate(12 146 56)" fill="#5a3d1a"/>
    <ellipse cx="188" cy="18" rx="2.6" ry="1.3" transform="rotate(40 188 18)" fill="#7a5628"/>
    <ellipse cx="232" cy="44" rx="3" ry="1.4" transform="rotate(-12 232 44)" fill="#6b4a24"/>
    <ellipse cx="290" cy="10" rx="2" ry="1" transform="rotate(25 290 10)" fill="#8a6334"/>
    <ellipse cx="318" cy="52" rx="3.6" ry="1.7" transform="rotate(-25 318 52)" fill="#4a3418"/>
    <ellipse cx="372" cy="30" rx="2.4" ry="1.2" transform="rotate(60 372 30)" fill="#7a5628"/>
    <ellipse cx="430" cy="12" rx="3" ry="1.3" transform="rotate(5 430 12)" fill="#6d4a22"/>
    <ellipse cx="468" cy="44" rx="2.2" ry="1.1" transform="rotate(-40 468 44)" fill="#8a6334"/>
    <ellipse cx="520" cy="24" rx="3.4" ry="1.5" transform="rotate(18 520 24)" fill="#5a3d1a"/>
    <ellipse cx="566" cy="7" rx="2" ry="1" fill="#7a5628"/>
    <ellipse cx="612" cy="20" rx="2.8" ry="1.3" transform="rotate(-18 612 20)" fill="#6b4a24"/>
    <ellipse cx="676" cy="10" rx="3.2" ry="1.4" transform="rotate(30 676 10)" fill="#55391c"/>
    <ellipse cx="742" cy="6" rx="2.2" ry="1" transform="rotate(-10 742 6)" fill="#8a6334"/>
    <ellipse cx="836" cy="4" rx="2.4" ry="1.1" transform="rotate(22 836 4)" fill="#6d4a22"/>
    <ellipse cx="640" cy="196" rx="3" ry="1.4" transform="rotate(14 640 196)" fill="#5a3d1a"/>
    <ellipse cx="704" cy="192" rx="3.6" ry="1.6" transform="rotate(-16 704 192)" fill="#6b4a24"/>
    <ellipse cx="762" cy="181" rx="2.4" ry="1.1" transform="rotate(35 762 181)" fill="#7a5628"/>
    <ellipse cx="822" cy="188" rx="4.2" ry="1.9" transform="rotate(-8 822 188)" fill="#4a3418"/>
    <ellipse cx="880" cy="176" rx="2.6" ry="1.2" transform="rotate(24 880 176)" fill="#8a6334"/>
    <ellipse cx="938" cy="192" rx="3.2" ry="1.5" transform="rotate(-28 938 192)" fill="#6d4a22"/>
    <ellipse cx="1000" cy="172" rx="2.2" ry="1" transform="rotate(10 1000 172)" fill="#7a5628"/>
    <ellipse cx="1058" cy="186" rx="3.8" ry="1.7" transform="rotate(-14 1058 186)" fill="#55391c"/>
    <ellipse cx="1118" cy="166" rx="2.4" ry="1.2" transform="rotate(42 1118 166)" fill="#8a6334"/>
    <ellipse cx="1162" cy="190" rx="3.4" ry="1.5" transform="rotate(-20 1162 190)" fill="#5a3d1a"/>
    <ellipse cx="1188" cy="160" rx="2" ry="1" transform="rotate(16 1188 160)" fill="#6b4a24"/>
    <ellipse cx="972" cy="196" rx="2.2" ry="1" transform="rotate(-6 972 196)" fill="#7a5628"/>
    <g fill="#7a5628" opacity="0.4">
      <circle cx="120" cy="14" r="1.1"/><circle cx="212" cy="50" r="0.9"/><circle cx="264" cy="28" r="1.2"/>
      <circle cx="346" cy="8" r="1"/><circle cx="404" cy="44" r="1.2"/><circle cx="492" cy="14" r="0.9"/>
      <circle cx="548" cy="34" r="1.1"/><circle cx="596" cy="6" r="1"/><circle cx="660" cy="26" r="0.9"/>
      <circle cx="732" cy="18" r="1.1"/><circle cx="790" cy="14" r="0.9"/><circle cx="900" cy="8" r="1"/>
      <circle cx="1010" cy="4" r="1.1"/><circle cx="1096" cy="10" r="0.9"/><circle cx="676" cy="184" r="1.1"/>
      <circle cx="852" cy="196" r="1"/><circle cx="1004" cy="190" r="1.2"/><circle cx="1140" cy="182" r="0.9"/>
      <circle cx="86" cy="44" r="1"/><circle cx="44" cy="26" r="1.2"/><circle cx="164" cy="30" r="0.9"/>
    </g>
  </g>
</svg>