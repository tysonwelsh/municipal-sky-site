<svg xmlns="http://www.w3.org/2000/svg" viewBox="42.8 54.5 186.5 154.8">
  <g transform="rotate(-25 150 150)">
    <!-- cigarette body -->
    <rect x="40" y="140" width="190" height="22" rx="3" fill="#f7f4ee" stroke="#d8d2c6" stroke-width="1.5"/>
    <!-- paper shading -->
    <rect x="40" y="153" width="190" height="9" rx="3" fill="#e8e3d8"/>
    <!-- filter -->
    <rect x="200" y="140" width="30" height="22" rx="3" fill="#d9a05b" stroke="#b07f3e" stroke-width="1.5"/>
    <rect x="200" y="140" width="30" height="6" fill="#c78f4a"/>
    <line x1="206" y1="144" x2="206" y2="158" stroke="#b07f3e" stroke-width="1" opacity="0.5"/>
    <line x1="213" y1="144" x2="213" y2="158" stroke="#b07f3e" stroke-width="1" opacity="0.5"/>
    <line x1="220" y1="144" x2="220" y2="158" stroke="#b07f3e" stroke-width="1" opacity="0.5"/>
    <line x1="226" y1="144" x2="226" y2="158" stroke="#b07f3e" stroke-width="1" opacity="0.5"/>
    <!-- seam line near filter -->
    <line x1="198" y1="141" x2="198" y2="161" stroke="#c9c2b4" stroke-width="1.5"/>
    <!-- ash -->
    <path d="M40,140 L56,140 L56,162 L40,162 Q42,151 40,140 Z" fill="#9a9a9a"/>
    <path d="M42,142 L54,142 L54,160 L42,160 Z" fill="#7d7d7d"/>
    <circle cx="47" cy="147" r="1.6" fill="#b5b5b5"/>
    <circle cx="50" cy="155" r="1.3" fill="#b5b5b5"/>
    <!-- glowing ember -->
    <ellipse cx="40" cy="151" rx="4" ry="11" fill="#e8641c"/>
    <ellipse cx="39" cy="151" rx="2.2" ry="7" fill="#ffb347"/>
    <ellipse cx="38.5" cy="150" rx="1.1" ry="4" fill="#ffe08a"/>
  </g>
  <!-- smoke wisp -->
  <path d="M95,140 C90,120 108,112 100,94 C94,80 106,72 102,58" fill="none" stroke="#c9c9c9" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M104,138 C104,124 116,118 111,102 C107,90 116,84 113,72" fill="none" stroke="#d9d9d9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>