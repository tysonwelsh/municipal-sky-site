<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.0 25.5 734.5 576.2">
  <defs>
    <radialGradient id="tire" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="70%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="45%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7b2ff7"/>
      <stop offset="55%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#ff2fb3"/>
    </linearGradient>
    <linearGradient id="flame2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2fb3"/>
      <stop offset="100%" stop-color="#ff7ad9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe8ff"/>
      <stop offset="100%" stop-color="#4aa3e0"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="50%" stop-color="#9a9a9a"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
  </defs>

  <!-- suspension / axles -->
  <g stroke="#555" stroke-width="14" stroke-linecap="round">
    <line x1="185" y1="470" x2="300" y2="360"/>
    <line x1="300" y1="470" x2="300" y2="360"/>
    <line x1="505" y1="470" x2="505" y2="360"/>
    <line x1="620" y1="470" x2="505" y2="360"/>
  </g>
  <g stroke="#888" stroke-width="6" stroke-linecap="round">
    <line x1="215" y1="465" x2="310" y2="370"/>
    <line x1="590" y1="465" x2="500" y2="370"/>
  </g>
  <!-- shock absorbers -->
  <g>
    <rect x="262" y="380" width="18" height="80" rx="8" fill="#b026ff" stroke="#111" stroke-width="4" transform="rotate(18 271 420)"/>
    <rect x="520" y="380" width="18" height="80" rx="8" fill="#ff2fb3" stroke="#111" stroke-width="4" transform="rotate(-18 529 420)"/>
  </g>

  <!-- rear tire -->
  <g>
    <circle cx="190" cy="470" r="118" fill="url(#tire)" stroke="#000" stroke-width="6"/>
    <g fill="#000">
      <rect x="70" y="455" width="34" height="30" rx="6" transform="rotate(-25 87 470)"/>
      <rect x="276" y="455" width="34" height="30" rx="6" transform="rotate(25 293 470)"/>
      <rect x="175" y="338" width="30" height="34" rx="6"/>
      <rect x="175" y="568" width="30" height="34" rx="6"/>
      <rect x="95" y="380" width="32" height="28" rx="6" transform="rotate(-50 111 394)"/>
      <rect x="255" y="380" width="32" height="28" rx="6" transform="rotate(50 271 394)"/>
      <rect x="95" y="532" width="32" height="28" rx="6" transform="rotate(50 111 546)"/>
      <rect x="255" y="532" width="32" height="28" rx="6" transform="rotate(-50 271 546)"/>
    </g>
    <circle cx="190" cy="470" r="52" fill="url(#chrome)" stroke="#111" stroke-width="5"/>
    <circle cx="190" cy="470" r="18" fill="#7b2ff7" stroke="#111" stroke-width="4"/>
    <g fill="#333">
      <circle cx="190" cy="438" r="7"/><circle cx="222" cy="470" r="7"/>
      <circle cx="190" cy="502" r="7"/><circle cx="158" cy="470" r="7"/>
    </g>
  </g>

  <!-- front tire -->
  <g>
    <circle cx="610" cy="470" r="118" fill="url(#tire)" stroke="#000" stroke-width="6"/>
    <g fill="#000">
      <rect x="490" y="455" width="34" height="30" rx="6" transform="rotate(-25 507 470)"/>
      <rect x="696" y="455" width="34" height="30" rx="6" transform="rotate(25 713 470)"/>
      <rect x="595" y="338" width="30" height="34" rx="6"/>
      <rect x="595" y="568" width="30" height="34" rx="6"/>
      <rect x="515" y="380" width="32" height="28" rx="6" transform="rotate(-50 531 394)"/>
      <rect x="675" y="380" width="32" height="28" rx="6" transform="rotate(50 691 394)"/>
      <rect x="515" y="532" width="32" height="28" rx="6" transform="rotate(50 531 546)"/>
      <rect x="675" y="532" width="32" height="28" rx="6" transform="rotate(-50 691 546)"/>
    </g>
    <circle cx="610" cy="470" r="52" fill="url(#chrome)" stroke="#111" stroke-width="5"/>
    <circle cx="610" cy="470" r="18" fill="#ff2fb3" stroke="#111" stroke-width="4"/>
    <g fill="#333">
      <circle cx="610" cy="438" r="7"/><circle cx="642" cy="470" r="7"/>
      <circle cx="610" cy="502" r="7"/><circle cx="578" cy="470" r="7"/>
    </g>
  </g>

  <!-- truck body -->
  <g stroke="#000" stroke-width="7" stroke-linejoin="round">
    <path d="M 90 355
             L 90 300
             Q 90 280 110 278
             L 210 272
             L 250 190
             Q 256 175 275 175
             L 460 175
             Q 478 175 486 190
             L 520 268
             L 660 276
             Q 690 278 692 305
             L 696 355
             Q 698 380 670 382
             L 120 382
             Q 92 380 90 355 Z" fill="url(#body)"/>
  </g>

  <!-- hood scoop -->
  <path d="M 540 268 L 560 225 Q 563 216 573 216 L 615 216 Q 625 216 625 227 L 625 272 Z" fill="#1c1c1c" stroke="#000" stroke-width="6"/>
  <rect x="575" y="228" width="42" height="10" rx="4" fill="#b026ff"/>

  <!-- windows -->
  <path d="M 262 262 L 296 192 L 455 192 L 488 262 Z" fill="url(#glass)" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <line x1="370" y1="192" x2="370" y2="262" stroke="#000" stroke-width="6"/>
  <path d="M 300 250 L 325 200 L 345 200 L 318 250 Z" fill="#ffffff" opacity="0.55"/>
  <path d="M 392 250 L 420 200 L 435 200 L 410 250 Z" fill="#ffffff" opacity="0.4"/>

  <!-- purple/pink flames on side -->
  <g stroke-linejoin="round">
    <path d="M 120 360
             Q 170 300 210 330 Q 225 290 268 318 Q 285 280 330 312
             Q 350 275 398 308 Q 420 278 462 306 Q 500 285 530 312
             Q 560 295 580 320 Q 620 300 660 330
             L 660 372 L 120 372 Z"
          fill="url(#flame)" stroke="#4a00a0" stroke-width="4"/>
    <path d="M 150 366
             Q 195 325 230 344 Q 245 312 282 336 Q 300 306 340 332
             Q 362 304 402 330 Q 428 306 466 330 Q 505 312 540 336
             Q 575 318 640 348 L 640 372 L 150 372 Z"
          fill="url(#flame2)" stroke="#c2137a" stroke-width="3"/>
    <path d="M 185 370 Q 225 344 255 358 Q 268 334 300 352 Q 318 330 352 350 Q 375 332 410 350 Q 445 334 480 352 Q 520 338 560 358 L 560 372 L 185 372 Z"
          fill="#ffd6f2" opacity="0.9"/>
  </g>

  <!-- flame licks over hood -->
  <path d="M 530 268 Q 560 240 590 258 Q 600 235 628 254 Q 645 240 664 260 L 664 274 L 530 274 Z" fill="url(#flame)" stroke="#4a00a0" stroke-width="4"/>

  <!-- panel highlight -->
  <path d="M 110 292 L 505 284 L 660 292" fill="none" stroke="#666" stroke-width="4" opacity="0.6"/>

  <!-- headlight & grille -->
  <rect x="664" y="296" width="28" height="34" rx="6" fill="#ffe95e" stroke="#000" stroke-width="5"/>
  <rect x="676" y="336" width="18" height="30" rx="4" fill="url(#chrome)" stroke="#000" stroke-width="4"/>

  <!-- taillight -->
  <rect x="94" y="300" width="20" height="30" rx="5" fill="#ff3b3b" stroke="#000" stroke-width="5"/>

  <!-- exhaust pipes -->
  <g stroke="#000" stroke-width="5">
    <rect x="128" y="150" width="16" height="130" rx="7" fill="url(#chrome)"/>
    <rect x="152" y="140" width="16" height="140" rx="7" fill="url(#chrome)"/>
  </g>
  <ellipse cx="136" cy="148" rx="10" ry="5" fill="#333"/>
  <ellipse cx="160" cy="138" rx="10" ry="5" fill="#333"/>

  <!-- smoke puffs -->
  <g fill="#d9c8ff" opacity="0.85" stroke="#7b2ff7" stroke-width="3">
    <circle cx="160" cy="112" r="14"/>
    <circle cx="148" cy="84" r="18"/>
    <circle cx="162" cy="52" r="23"/>
  </g>

  <!-- door line & handle -->
  <path d="M 380 268 L 384 366" stroke="#000" stroke-width="4"/>
  <rect x="352" y="288" width="34" height="10" rx="5" fill="url(#chrome)" stroke="#000" stroke-width="3"/>

  <!-- speed lines -->
  <g stroke="#b026ff" stroke-width="8" stroke-linecap="round" opacity="0.85">
    <line x1="14" y1="250" x2="66" y2="250"/>
    <line x1="6" y1="300" x2="70" y2="300"/>
    <line x1="20" y1="345" x2="60" y2="345"/>
  </g>
  <g stroke="#ff2fb3" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="28" y1="275" x2="58" y2="275"/>
    <line x1="34" y1="322" x2="62" y2="322"/>
  </g>
</svg>