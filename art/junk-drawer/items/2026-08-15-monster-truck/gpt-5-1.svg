<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050308"/>
      <stop offset="0.4" stop-color="#0a0910"/>
      <stop offset="1" stop-color="#151221"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee4ff"/>
      <stop offset="0.5" stop-color="#3aa6e0"/>
      <stop offset="1" stop-color="#0b4a7a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="0.4" stop-color="#c1c4ce"/>
      <stop offset="1" stop-color="#787c8a"/>
    </linearGradient>
    <linearGradient id="tireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c34"/>
      <stop offset="0.5" stop-color="#111117"/>
      <stop offset="1" stop-color="#050509"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f9ff"/>
      <stop offset="0.5" stop-color="#b9c0d0"/>
      <stop offset="1" stop-color="#727c90"/>
    </linearGradient>
    <linearGradient id="flamePink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6ad9"/>
      <stop offset="0.45" stop-color="#ff2fbf"/>
      <stop offset="1" stop-color="#ff8ae5"/>
    </linearGradient>
    <linearGradient id="flamePurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b54cff"/>
      <stop offset="0.5" stop-color="#7a23ff"/>
      <stop offset="1" stop-color="#e58bff"/>
    </linearGradient>
    <linearGradient id="skyStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0c33"/>
      <stop offset="0.5" stop-color="#302a7a"/>
      <stop offset="1" stop-color="#431551"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23110a"/>
      <stop offset="0.7" stop-color="#120804"/>
      <stop offset="1" stop-color="#050203"/>
    </linearGradient>

    <!-- Reusable shapes -->
    <g id="tire">
      <ellipse cx="0" cy="0" rx="86" ry="86" fill="url(#tireGrad)" stroke="#000000" stroke-width="8"/>
      <ellipse cx="0" cy="0" rx="56" ry="56" fill="url(#rimGrad)" stroke="#4b5363" stroke-width="6"/>
      <circle cx="0" cy="0" r="10" fill="#22252e" stroke="#05060a" stroke-width="4"/>
      <!-- lug nuts -->
      <g fill="#ccd2e0" stroke="#4c5567" stroke-width="2">
        <circle cx="0" cy="-26" r="4"/>
        <circle cx="24" cy="-13" r="4"/>
        <circle cx="24" cy="13" r="4"/>
        <circle cx="0" cy="26" r="4"/>
        <circle cx="-24" cy="13" r="4"/>
        <circle cx="-24" cy="-13" r="4"/>
      </g>
      <!-- chunky treads -->
      <g fill="#050509">
        <rect x="-12" y="-94" width="24" height="20" rx="4"/>
        <rect x="-12" y="74" width="24" height="20" rx="4"/>
        <rect x="-94" y="-12" width="20" height="24" rx="4"/>
        <rect x="74" y="-12" width="20" height="24" rx="4"/>
        <rect x="-70" y="-70" width="18" height="18" rx="4" transform="rotate(45 -61 -61)"/>
        <rect x="52" y="-70" width="18" height="18" rx="4" transform="rotate(45 61 -61)"/>
        <rect x="-70" y="52" width="18" height="18" rx="4" transform="rotate(45 -61 61)"/>
        <rect x="52" y="52" width="18" height="18" rx="4" transform="rotate(45 61 61)"/>
      </g>
    </g>

    <!-- Side flame motif -->
    <g id="sideFlames">
      <!-- Back purple base flame -->
      <path d="M30 80
               C80 40, 150 40, 210 70
               C250 90, 280 90, 320 70
               C300 90, 300 115, 330 130
               C300 120, 270 120, 240 130
               C190 150, 120 155, 60 150
               C20 145, 10 120, 30 80Z"
            fill="url(#flamePurple)" stroke="#2b003f" stroke-width="4" stroke-linejoin="round"/>
      <!-- Front pink highlights -->
      <path d="M70 90
               C120 65, 180 65, 230 85
               C260 98, 290 96, 310 86
               C295 103, 292 120, 305 132
               C280 123, 250 125, 225 135
               C185 150, 135 152, 90 145
               C60 140, 50 120, 70 90Z"
            fill="url(#flamePink)" stroke="#5a0040" stroke-width="3" stroke-linejoin="round"/>
      <!-- Sharp cartoon spikes -->
      <path d="M120 70
               C145 40, 160 30, 175 35
               C162 45, 160 55, 165 68
               C150 60, 135 62, 120 70Z"
            fill="#ffb3f2" fill-opacity="0.85"/>
      <path d="M190 72
               C210 45, 230 35, 245 38
               C230 48, 225 60, 228 72
               C215 70, 203 71, 190 72Z"
            fill="#f6c0ff" fill-opacity="0.8"/>
    </g>

    <!-- Cartoon star -->
    <g id="sparkStar">
      <polygon points="0,-9 2.5,-2.5 9,0 2.5,2.5 0,9 -2.5,2.5 -9,0 -2.5,-2.5"
               fill="#ffe8a0" stroke="#f4c34c" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- Background: 80s neon sky band + ground -->
  <rect x="0" y="0" width="900" height="260" fill="url(#skyStrip)"/>
  <g opacity="0.35">
    <rect x="0" y="0" width="900" height="70" fill="#ff4bb5"/>
    <rect x="0" y="70" width="900" height="70" fill="#ffcf4b"/>
    <rect x="0" y="140" width="900" height="60" fill="#64ffda"/>
  </g>
  <!-- Scanline effect -->
  <g opacity="0.22">
    <rect x="0" y="0" width="900" height="260" fill="url(#skyStrip)"/>
    <g stroke="#000000" stroke-width="1">
      <line x1="0" y1="6" x2="900" y2="6"/>
      <line x1="0" y1="18" x2="900" y2="18"/>
      <line x1="0" y1="30" x2="900" y2="30"/>
      <line x1="0" y1="42" x2="900" y2="42"/>
      <line x1="0" y1="54" x2="900" y2="54"/>
      <line x1="0" y1="66" x2="900" y2="66"/>
      <line x1="0" y1="78" x2="900" y2="78"/>
      <line x1="0" y1="90" x2="900" y2="90"/>
      <line x1="0" y1="102" x2="900" y2="102"/>
      <line x1="0" y1="114" x2="900" y2="114"/>
      <line x1="0" y1="126" x2="900" y2="126"/>
      <line x1="0" y1="138" x2="900" y2="138"/>
      <line x1="0" y1="150" x2="900" y2="150"/>
      <line x1="0" y1="162" x2="900" y2="162"/>
      <line x1="0" y1="174" x2="900" y2="174"/>
      <line x1="0" y1="186" x2="900" y2="186"/>
      <line x1="0" y1="198" x2="900" y2="198"/>
      <line x1="0" y1="210" x2="900" y2="210"/>
      <line x1="0" y1="222" x2="900" y2="222"/>
      <line x1="0" y1="234" x2="900" y2="234"/>
      <line x1="0" y1="246" x2="900" y2="246"/>
      <line x1="0" y1="258" x2="900" y2="258"/>
    </g>
  </g>

  <!-- Ground / dirt -->
  <path d="M0 340
           C120 320, 220 315, 360 318
           C520 322, 620 335, 760 332
           C830 331, 870 328, 900 324
           L900 600 L0 600Z"
        fill="url(#groundGrad)"/>

  <!-- Hills silhouette -->
  <path d="M0 305
           C90 285, 180 275, 260 280
           C340 285, 410 300, 480 292
           C560 283, 640 270, 720 278
           C800 286, 860 298, 900 295
           L900 340 L0 340Z"
        fill="#07040a" opacity="0.9"/>

  <!-- Dust clouds -->
  <g opacity="0.4" fill="#e0c7a0">
    <ellipse cx="240" cy="360" rx="45" ry="18"/>
    <ellipse cx="275" cy="352" rx="35" ry="14"/>
    <ellipse cx="210" cy="352" rx="32" ry="14"/>
  </g>
  <g opacity="0.35" fill="#e0c7a0">
    <ellipse cx="660" cy="368" rx="58" ry="20"/>
    <ellipse cx="700" cy="360" rx="42" ry="16"/>
    <ellipse cx="630" cy="356" rx="36" ry="14"/>
  </g>

  <!-- Monster truck group -->
  <g transform="translate(120,160)">
    <!-- Suspension / chassis frame -->
    <g>
      <!-- Main ladder frame -->
      <path d="M140 190 L370 190 L395 225 L365 230 L340 205 L170 205 L145 230 L115 225Z"
            fill="#1b1c24" stroke="#05060a" stroke-width="6" stroke-linejoin="round"/>
      <!-- Cross bars -->
      <path d="M170 205 L220 245 L245 245 L205 205Z"
            fill="#272a35" stroke="#05060a" stroke-width="5" stroke-linejoin="round"/>
      <path d="M305 205 L265 245 L290 245 L340 205Z"
            fill="#272a35" stroke="#05060a" stroke-width="5" stroke-linejoin="round"/>
      <!-- Diagonal braces -->
      <path d="M155 200 L215 260" stroke="#555d70" stroke-width="5" stroke-linecap="round"/>
      <path d="M350 200 L290 260" stroke="#555d70" stroke-width="5" stroke-linecap="round"/>
      <!-- Axles -->
      <rect x="95" y="250" width="140" height="16" rx="6" fill="#1c2029" stroke="#05060a" stroke-width="5"/>
      <rect x="285" y="250" width="140" height="16" rx="6" fill="#1c2029" stroke="#05060a" stroke-width="5"/>
      <!-- Shocks -->
      <g stroke-linecap="round">
        <g>
          <line x1="135" y1="210" x2="120" y2="260" stroke="#05060a" stroke-width="7"/>
          <line x1="145" y1="210" x2="130" y2="260" stroke="#d7d9e4" stroke-width="4"/>
        </g>
        <g>
          <line x1="195" y1="210" x2="205" y2="260" stroke="#05060a" stroke-width="7"/>
          <line x1="205" y1="210" x2="215" y2="260" stroke="#d7d9e4" stroke-width="4"/>
        </g>
        <g>
          <line x1="315" y1="210" x2="305" y2="260" stroke="#05060a" stroke-width="7"/>
          <line x1="325" y1="210" x2="315" y2="260" stroke="#d7d9e4" stroke-width="4"/>
        </g>
        <g>
          <line x1="375" y1="210" x2="390" y2="260" stroke="#05060a" stroke-width="7"/>
          <line x1="385" y1="210" x2="400" y2="260" stroke="#d7d9e4" stroke-width="4"/>
        </g>
      </g>
    </g>

    <!-- Truck body -->
    <g>
      <!-- Main black body -->
      <path d="M120 60
               L270 60
               C295 60, 325 75, 340 95
               L380 145
               C390 155, 395 165, 395 180
               L395 210
               C395 220, 388 228, 378 230
               L120 230
               C110 228, 103 220, 103 210
               L103 115
               C103 90, 108 80, 120 60Z"
            fill="url(#bodyGrad)" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>

      <!-- Cab roof -->
      <path d="M160 40
               L260 40
               C278 40, 292 47, 305 60
               L325 80
               L160 80Z"
            fill="#0c0b12" stroke="#000000" stroke-width="8" stroke-linejoin="round"/>

      <!-- Windshield -->
      <path d="M168 44
               L252 44
               C270 44, 285 50, 296 61
               L310 75
               L168 75Z"
            fill="url(#glassGrad)" stroke="#0b1824" stroke-width="4"/>
      <!-- Windshield reflection stripes -->
      <path d="M178 50 L230 50 L248 70 L196 70Z" fill="#ffffff" opacity="0.28"/>
      <path d="M238 50 L262 50 L284 70 L260 70Z" fill="#ffffff" opacity="0.18"/>

      <!-- Side window -->
      <path d="M178 82
               L248 82
               C262 82, 274 88, 284 98
               L297 112
               L178 112Z"
            fill="url(#glassGrad)" stroke="#0b1824" stroke-width="4"/>
      <path d="M185 86 L230 86 L248 108 L203 108Z" fill="#ffffff" opacity="0.25"/>

      <!-- Window divider -->
      <rect x="170" y="44" width="6" height="68" fill="#111319"/>

      <!-- Bumper -->
      <path d="M395 190
               L430 188
               C440 188, 448 192, 452 200
               L460 215
               C462 220, 460 225, 454 228
               L408 235
               C400 237, 395 232, 395 225Z"
            fill="url(#metalGrad)" stroke="#05060a" stroke-width="6" stroke-linejoin="round"/>

      <!-- Grill lines -->
      <g stroke="#5f6474" stroke-width="3">
        <line x1="408" y1="195" x2="440" y2="192"/>
        <line x1="412" y1="205" x2="446" y2="202"/>
        <line x1="416" y1="215" x2="450" y2="212"/>
      </g>

      <!-- Headlights -->
      <circle cx="448" cy="188" r="8" fill="#ffe889" stroke="#f4c34c" stroke-width="3"/>
      <circle cx="458" cy="204" r="6" fill="#fffdcf" stroke="#f4c34c" stroke-width="2"/>

      <!-- Door outline -->
      <path d="M176 88
               L260 88
               C270 88, 278 92, 285 99
               L295 110
               L295 210
               L176 210Z"
            fill="none" stroke="#22242f" stroke-width="3"/>
      <!-- Door handle -->
      <rect x="250" y="135" width="24" height="5" rx="2.5" fill="#cdd4e5" stroke="#52596b" stroke-width="2"/>

      <!-- Hood line -->
      <path d="M270 60
               C305 64, 332 83, 345 100
               L367 130"
            fill="none" stroke="#272a35" stroke-width="4" stroke-linecap="round"/>

      <!-- Side panel trim -->
      <path d="M115 170
               L380 170
               C388 170, 394 176, 394 184
               L394 190
               C394 198, 388 204, 380 204
               L115 204
               C107 204, 101 198, 101 190
               L101 184
               C101 176, 107 170, 115 170Z"
            fill="#101119" stroke="#000000" stroke-width="4"/>

      <!-- Tail light / rear fender -->
      <path d="M110 150
               L100 145
               C96 143, 94 140, 94 135
               L94 125
               C94 120, 98 118, 102 118
               L112 120Z"
            fill="#ff4478" stroke="#350010" stroke-width="4"/>

      <!-- Purple & pink flames on side -->
      <g transform="translate(110,98) scale(0.9)">
        <use href="#sideFlames"/>
      </g>

      <!-- Extra small flame lick near front -->
      <path d="M345 142
               C365 132, 380 130, 392 132
               C382 138, 382 146, 388 154
               C375 148, 360 147, 345 152Z"
            fill="url(#flamePink)" stroke="#5a0040" stroke-width="3"/>

      <!-- Cartoon outline boost -->
      <path d="M120 60
               L270 60
               C295 60, 325 75, 340 95
               L380 145
               C390 155, 395 165, 395 180
               L395 210
               C395 220, 388 228, 378 230
               L120 230
               C110 228, 103 220, 103 210
               L103 115
               C103 90, 108 80, 120 60Z"
            fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
    </g>

    <!-- Wheels -->
    <g>
      <!-- Rear wheel -->
      <g transform="translate(150,280)">
        <use href="#tire"/>
      </g>
      <!-- Front wheel -->
      <g transform="translate(350,280)">
        <use href="#tire"/>
      </g>

      <!-- Cartoon motion arcs on wheels -->
      <g stroke="#f5f5ff" stroke-width="4" stroke-linecap="round" opacity="0.75">
        <path d="M60 270
                 C40 258, 28 240, 24 222"/>
        <path d="M260 272
                 C240 260, 228 244, 224 228"/>
      </g>
    </g>

    <!-- Underglow neon -->
    <ellipse cx="250" cy="242" rx="170" ry="20" fill="#ff3ccf" opacity="0.35"/>

    <!-- Cartoon spark stars near flames / lights -->
    <g opacity="0.9">
      <g transform="translate(315,120)">
        <use href="#sparkStar"/>
      </g>
      <g transform="translate(430,178) scale(1.2)">
        <use href="#sparkStar"/>
      </g>
      <g transform="translate(140,122) scale(0.9)">
        <use href="#sparkStar"/>
      </g>
    </g>
  </g>

  <!-- Foreground dirt clumps overlapping wheels -->
  <g fill="#1b0f07" opacity="0.9">
    <ellipse cx="230" cy="420" rx="70" ry="26"/>
    <ellipse cx="670" cy="430" rx="80" ry="30"/>
  </g>
  <g fill="#3a2412" opacity="0.9">
    <ellipse cx="250" cy="410" rx="40" ry="16"/>
    <ellipse cx="650" cy="420" rx="50" ry="18"/>
  </g>
</svg>