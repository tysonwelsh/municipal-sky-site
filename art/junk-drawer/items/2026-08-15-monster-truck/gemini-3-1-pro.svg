<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.5 48.0 801.2 501.2" width="801.2" height="501.2">
  <!-- Definition for cartoon outline and glow filters -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1493" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#FF00FF" />
    </linearGradient>
    <linearGradient id="tireGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333" />
      <stop offset="100%" stop-color="#111" />
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF" />
      <stop offset="30%" stop-color="#DDD" />
      <stop offset="50%" stop-color="#888" />
      <stop offset="70%" stop-color="#CCC" />
      <stop offset="100%" stop-color="#444" />
    </linearGradient>
  </defs>

  <!-- Giant Rear Tire -->
  <g transform="translate(150, 400)">
    <!-- Tire shadow/back -->
    <circle cx="0" cy="0" r="140" fill="#000" stroke="#222" stroke-width="15"/>
    <!-- Tire tread pattern -->
    <path d="M-130,-50 Q-100,-80 -50,-130 M-130,50 Q-100,80 -50,130 M-80,-100 Q-50,-120 0,-140 M-80,100 Q-50,120 0,140 M130,-50 Q100,-80 50,-130 M130,50 Q100,80 50,130 M80,-100 Q50,-120 0,-140 M80,100 Q50,120 0,140" stroke="#111" stroke-width="12" fill="none"/>
    <circle cx="0" cy="0" r="120" fill="url(#tireGradient)" stroke="#000" stroke-width="5"/>
    <!-- Rim -->
    <circle cx="0" cy="0" r="60" fill="url(#chrome)" stroke="#000" stroke-width="6"/>
    <!-- Hubcaps/spokes -->
    <path d="M-60,0 L60,0 M0,-60 L0,60 M-42,-42 L42,42 M-42,42 L42,-42" stroke="#000" stroke-width="8"/>
    <circle cx="0" cy="0" r="20" fill="#555" stroke="#000" stroke-width="4"/>
  </g>

  <!-- Giant Front Tire -->
  <g transform="translate(650, 400)">
    <circle cx="0" cy="0" r="140" fill="#000" stroke="#222" stroke-width="15"/>
    <path d="M-130,-50 Q-100,-80 -50,-130 M-130,50 Q-100,80 -50,130 M-80,-100 Q-50,-120 0,-140 M-80,100 Q-50,120 0,140 M130,-50 Q100,-80 50,-130 M130,50 Q100,80 50,130 M80,-100 Q50,-120 0,-140 M80,100 Q50,120 0,140" stroke="#111" stroke-width="12" fill="none"/>
    <circle cx="0" cy="0" r="120" fill="url(#tireGradient)" stroke="#000" stroke-width="5"/>
    <!-- Rim -->
    <circle cx="0" cy="0" r="60" fill="url(#chrome)" stroke="#000" stroke-width="6"/>
    <!-- Hubcaps/spokes -->
    <path d="M-60,0 L60,0 M0,-60 L0,60 M-42,-42 L42,42 M-42,42 L42,-42" stroke="#000" stroke-width="8"/>
    <circle cx="0" cy="0" r="20" fill="#555" stroke="#000" stroke-width="4"/>
  </g>

  <!-- Suspension System -->
  <!-- Rear suspension -->
  <path d="M150,400 L250,280 L320,280 L150,400 Z" fill="#666" stroke="#000" stroke-width="5"/>
  <path d="M130,380 L230,260" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round"/>
  <path d="M110,360 L210,240" stroke="#FF1493" stroke-width="15" stroke-dasharray="8,8"/>
  
  <!-- Front suspension -->
  <path d="M650,400 L550,280 L480,280 L650,400 Z" fill="#666" stroke="#000" stroke-width="5"/>
  <path d="M670,380 L570,260" stroke="url(#chrome)" stroke-width="12" stroke-linecap="round"/>
  <path d="M690,360 L590,240" stroke="#8A2BE2" stroke-width="15" stroke-dasharray="8,8"/>
  
  <path d="M250,280 L550,280" stroke="#333" stroke-width="20" stroke-linecap="round"/>

  <!-- Truck Body -->
  <g transform="translate(0, -20)">
    <!-- Main Body Base -->
    <path d="M 50 280 L 120 180 L 280 180 L 320 80 L 520 80 L 580 180 L 750 180 L 770 230 L 770 280 Z" fill="#111" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Chrome Bumpers -->
    <path d="M 30 260 L 80 260 L 80 290 L 30 290 Z" fill="url(#chrome)" stroke="#000" stroke-width="5"/>
    <path d="M 740 260 L 790 260 L 790 290 L 740 290 Z" fill="url(#chrome)" stroke="#000" stroke-width="5"/>
    
    <!-- Chrome grill -->
    <rect x="750" y="190" width="15" height="50" fill="url(#chrome)" stroke="#000" stroke-width="3"/>
    
    <!-- Window -->
    <path d="M 310 170 L 330 95 L 450 95 L 450 170 Z" fill="#4B0082" stroke="#000" stroke-width="6"/>
    <path d="M 470 170 L 470 95 L 510 95 L 560 170 Z" fill="#4B0082" stroke="#000" stroke-width="6"/>
    <!-- Window reflection -->
    <path d="M 340 100 L 440 100 L 330 160 Z" fill="#FFF" opacity="0.3"/>
    
    <!-- Flame Decals (Purple and Pink) -->
    <!-- Rear Flame -->
    <path d="M 80 250 Q 150 240 200 200 Q 180 230 250 210 Q 200 250 300 240 Q 250 270 150 280 Z" fill="url(#flameGradient)" stroke="#000" stroke-width="4"/>
    <!-- Side/Main Flame -->
    <path d="M 280 260 Q 400 250 480 190 Q 430 230 520 220 Q 470 240 580 230 Q 520 260 620 250 Q 550 270 400 280 Z" fill="url(#flameGradient)" stroke="#000" stroke-width="4"/>
    <!-- Front Flame -->
    <path d="M 580 260 Q 650 250 720 200 Q 670 240 730 230 Q 680 260 740 250 Q 700 270 650 280 Z" fill="url(#flameGradient)" stroke="#000" stroke-width="4"/>
    
    <!-- Engine/Exhaust Pipes -->
    <path d="M 580 180 L 620 130 L 635 140 L 600 180 Z" fill="url(#chrome)" stroke="#000" stroke-width="4"/>
    <path d="M 610 180 L 650 130 L 665 140 L 630 180 Z" fill="url(#chrome)" stroke="#000" stroke-width="4"/>
    <path d="M 640 180 L 680 130 L 695 140 L 660 180 Z" fill="url(#chrome)" stroke="#000" stroke-width="4"/>
    
    <!-- Cartoon Highlight on Body -->
    <path d="M 125 185 L 275 185" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <path d="M 585 185 L 740 185" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    <path d="M 330 85 L 510 85" stroke="#555" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Headlights -->
    <circle cx="760" cy="200" r="10" fill="#FFFF00" stroke="#000" stroke-width="3" filter="url(#glow)"/>
    <circle cx="760" cy="230" r="10" fill="#FFFF00" stroke="#000" stroke-width="3" filter="url(#glow)"/>
  </g>
  
  <!-- Exhaust fumes -->
  <path d="M 700 130 Q 730 80 780 100 Q 750 140 700 130" fill="#AAA" opacity="0.6"/>
  <path d="M 720 90 Q 760 30 820 60 Q 780 110 720 90" fill="#888" opacity="0.4"/>
</svg>