<svg xmlns="http://www.w3.org/2000/svg" viewBox="3.0 89.5 793.8 390.2">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3550"/>
      <stop offset="0.45" stop-color="#191826"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4262"/>
      <stop offset="0.5" stop-color="#20202f"/>
      <stop offset="1" stop-color="#0c0c14"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3fb0"/>
      <stop offset="0.45" stop-color="#ff5ec8"/>
      <stop offset="0.75" stop-color="#a44bff"/>
      <stop offset="1" stop-color="#6a1fd0"/>
    </linearGradient>
    <linearGradient id="flame2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7ad4"/>
      <stop offset="1" stop-color="#b45cff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#bff3ff"/>
      <stop offset="0.5" stop-color="#57c8f0"/>
      <stop offset="1" stop-color="#1d5f9c"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.5" stop-color="#e0b13a"/>
      <stop offset="1" stop-color="#8a6410"/>
    </radialGradient>
    <linearGradient id="tirefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a58"/>
      <stop offset="0.5" stop-color="#22222c"/>
      <stop offset="1" stop-color="#101016"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="400" cy="452" rx="360" ry="26" fill="#2a1740" opacity="0.35"/>

  <!-- speed lines -->
  <g stroke="#b06cff" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <line x1="10" y1="130" x2="105" y2="130"/>
    <line x1="30" y1="180" x2="95" y2="180"/>
    <line x1="8" y1="235" x2="80" y2="235"/>
    <line x1="700" y1="110" x2="792" y2="110"/>
    <line x1="720" y1="160" x2="790" y2="160"/>
  </g>

  <!-- AXLES / SUSPENSION -->
  <g>
    <rect x="150" y="330" width="500" height="20" rx="9" fill="#2c2c3a" stroke="#000" stroke-width="4"/>
    <rect x="175" y="300" width="26" height="60" rx="8" fill="#5a5a70" stroke="#000" stroke-width="4"/>
    <rect x="600" y="300" width="26" height="60" rx="8" fill="#5a5a70" stroke="#000" stroke-width="4"/>
    <!-- coil springs -->
    <g stroke="#ff5ec8" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M212 300 l30 12 -30 12 30 12 -30 12"/>
      <path d="M560 300 l30 12 -30 12 30 12 -30 12"/>
    </g>
  </g>

  <!-- CHASSIS / BODY -->
  <g>
    <!-- bed / main body -->
    <path d="M120 300 L120 210 Q120 196 136 196 L300 196 L340 120 Q346 108 362 108 L540 108 Q556 108 562 120 L600 196 L672 196 Q690 196 690 214 L690 300 Q690 316 672 316 L138 316 Q120 316 120 300 Z"
          fill="url(#body)" stroke="#000" stroke-width="7" stroke-linejoin="round"/>

    <!-- cab roof highlight -->
    <path d="M348 128 L560 128 L590 196 L318 196 Z" fill="url(#cab)" stroke="#000" stroke-width="5"/>

    <!-- windshield -->
    <path d="M366 132 L546 132 L570 186 L344 186 Z" fill="url(#glass)" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
    <path d="M372 138 L430 138 L392 182 L352 182 Z" fill="#ffffff" opacity="0.45"/>
    <!-- window divider -->
    <line x1="456" y1="132" x2="456" y2="186" stroke="#0b0b12" stroke-width="6"/>

    <!-- roof light bar -->
    <rect x="392" y="94" width="130" height="20" rx="7" fill="#2a2a3a" stroke="#000" stroke-width="5"/>
    <circle cx="416" cy="104" r="6" fill="#ffe98a" stroke="#000" stroke-width="2.5"/>
    <circle cx="444" cy="104" r="6" fill="#ff6fd0" stroke="#000" stroke-width="2.5"/>
    <circle cx="472" cy="104" r="6" fill="#ffe98a" stroke="#000" stroke-width="2.5"/>
    <circle cx="500" cy="104" r="6" fill="#b96bff" stroke="#000" stroke-width="2.5"/>

    <!-- exhaust stacks -->
    <path d="M300 196 L300 150 q0 -12 14 -12 h6 q14 0 14 12 v46" fill="#6b6b80" stroke="#000" stroke-width="5"/>
    <path d="M566 196 L566 150 q0 -12 14 -12 h6 q14 0 14 12 v46" fill="#6b6b80" stroke="#000" stroke-width="5"/>

    <!-- FLAME DECAL on side panel -->
    <g>
      <path d="M132 296 Q170 276 200 292 Q214 258 246 268 Q252 236 288 250 Q296 220 330 240 Q346 214 372 240 Q392 216 412 244 Q440 222 452 252 Q486 238 490 268 Q524 258 528 288 Q566 278 574 300 L132 300 Z"
            fill="url(#flame)" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
      <path d="M150 298 Q182 288 202 300 Q216 274 244 284 Q252 262 282 274 Q292 254 318 268 Q336 250 356 268 Q378 250 396 272 Q422 258 434 280 Q464 272 470 294 L150 300 Z"
            fill="url(#flame2)" opacity="0.9"/>
      <path d="M170 300 Q196 292 212 300 Q226 284 246 292 Q258 276 278 288 Q296 274 312 290 L170 300 Z" fill="#ffd0f2" opacity="0.75"/>
    </g>

    <!-- extra small flame on rear panel -->
    <g>
      <path d="M600 300 Q612 276 634 288 Q640 262 664 274 Q672 254 688 268 L688 300 Z" fill="url(#flame)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- fender line -->
    <path d="M120 258 L690 258" stroke="#000" stroke-width="4" opacity="0.35"/>

    <!-- headlight -->
    <rect x="640" y="212" width="46" height="26" rx="8" fill="#ffe98a" stroke="#000" stroke-width="5"/>
    <path d="M648 218 h16 l-10 14 h-14 z" fill="#fffbe0"/>

    <!-- body highlight streak -->
    <path d="M136 208 L296 208 L326 214 L134 214 Z" fill="#8f86b8" opacity="0.4"/>
  </g>

  <!-- BUMPER -->
  <rect x="676" y="252" width="30" height="60" rx="10" fill="#7a7a92" stroke="#000" stroke-width="5"/>
  <rect x="100" y="252" width="30" height="60" rx="10" fill="#7a7a92" stroke="#000" stroke-width="5"/>

  <!-- WHEELS -->
  <g>
    <!-- rear wheel -->
    <g>
      <circle cx="188" cy="342" r="108" fill="url(#tirefade)" stroke="#000" stroke-width="8"/>
      <circle cx="188" cy="342" r="98" fill="none" stroke="#000" stroke-width="4" opacity="0.6"/>
      <g stroke="#0c0c12" stroke-width="12" stroke-linecap="round">
        <line x1="188" y1="248" x2="188" y2="284"/>
        <line x1="254" y1="276" x2="228" y2="302"/>
        <line x1="282" y1="342" x2="246" y2="342"/>
        <line x1="254" y1="408" x2="228" y2="382"/>
        <line x1="188" y1="436" x2="188" y2="400"/>
        <line x1="122" y1="408" x2="148" y2="382"/>
        <line x1="94" y1="342" x2="130" y2="342"/>
        <line x1="122" y1="276" x2="148" y2="302"/>
      </g>
      <circle cx="188" cy="342" r="56" fill="url(#hub)" stroke="#000" stroke-width="7"/>
      <circle cx="188" cy="342" r="22" fill="#2a2a38" stroke="#000" stroke-width="5"/>
      <g fill="#5c4308">
        <circle cx="188" cy="304" r="6"/><circle cx="224" cy="330" r="6"/>
        <circle cx="210" cy="372" r="6"/><circle cx="166" cy="372" r="6"/>
        <circle cx="152" cy="330" r="6"/>
      </g>
      <path d="M148 296 a56 56 0 0 1 42 -14" stroke="#fff5c0" stroke-width="7" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M118 288 a100 100 0 0 1 62 -46" stroke="#8a8aa0" stroke-width="9" fill="none" opacity="0.5" stroke-linecap="round"/>
    </g>

    <!-- front wheel -->
    <g>
      <circle cx="612" cy="342" r="108" fill="url(#tirefade)" stroke="#000" stroke-width="8"/>
      <circle cx="612" cy="342" r="98" fill="none" stroke="#000" stroke-width="4" opacity="0.6"/>
      <g stroke="#0c0c12" stroke-width="12" stroke-linecap="round">
        <line x1="612" y1="248" x2="612" y2="284"/>
        <line x1="678" y1="276" x2="652" y2="302"/>
        <line x1="706" y1="342" x2="670" y2="342"/>
        <line x1="678" y1="408" x2="652" y2="382"/>
        <line x1="612" y1="436" x2="612" y2="400"/>
        <line x1="546" y1="408" x2="572" y2="382"/>
        <line x1="518" y1="342" x2="554" y2="342"/>
        <line x1="546" y1="276" x2="572" y2="302"/>
      </g>
      <circle cx="612" cy="342" r="56" fill="url(#hub)" stroke="#000" stroke-width="7"/>
      <circle cx="612" cy="342" r="22" fill="#2a2a38" stroke="#000" stroke-width="5"/>
      <g fill="#5c4308">
        <circle cx="612" cy="304" r="6"/><circle cx="648" cy="330" r="6"/>
        <circle cx="634" cy="372" r="6"/><circle cx="590" cy="372" r="6"/>
        <circle cx="576" cy="330" r="6"/>
      </g>
      <path d="M572 296 a56 56 0 0 1 42 -14" stroke="#fff5c0" stroke-width="7" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M542 288 a100 100 0 0 1 62 -46" stroke="#8a8aa0" stroke-width="9" fill="none" opacity="0.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- dust puffs -->
  <g fill="#c9a6ff" opacity="0.5">
    <circle cx="76" cy="430" r="20"/>
    <circle cx="110" cy="444" r="13"/>
    <circle cx="716" cy="432" r="18"/>
    <circle cx="688" cy="446" r="11"/>
  </g>
</svg>