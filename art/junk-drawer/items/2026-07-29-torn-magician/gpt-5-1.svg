<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <clipPath id="tornEdge">
      <path d="M0,0 H800 V470 
               C740,460 720,455 700,458
               C670,462 650,452 630,455
               C610,460 595,450 580,452
               C565,455 545,448 530,450
               C515,452 495,445 480,448
               C465,452 450,446 435,449
               C420,452 405,446 390,448
               C375,451 360,445 345,447
               C330,450 315,444 300,447
               C285,451 265,444 250,446
               C235,449 220,443 205,446
               C190,450 170,443 155,445
               C140,448 120,441 105,443
               C90,446 75,440 60,442
               C45,445 25,438 10,440
               L0,442 Z"/>
    </clipPath>
  </defs>

  <!-- Outer card border -->
  <rect x="40" y="20" width="720" height="440" fill="none" stroke="#000" stroke-width="6" clip-path="url(#tornEdge)"/>
  <rect x="60" y="40" width="680" height="400" fill="none" stroke="#000" stroke-width="3" clip-path="url(#tornEdge)"/>

  <!-- Title text "THE MAGICIAN" in simple block letters -->
  <g clip-path="url(#tornEdge)">
    <text x="400" y="80" text-anchor="middle" font-family="Courier, monospace" font-size="32" stroke="#000" stroke-width="1" fill="none">
      THE MAGICIAN
    </text>

    <!-- Infinity symbol above head -->
    <path d="M400,120
             C380,110 370,130 390,140
             C410,150 420,130 400,120 Z
             M400,120
             C420,110 430,130 410,140
             C390,150 380,130 400,120 Z"
          fill="none" stroke="#000" stroke-width="4"/>

    <!-- Magician's head (simple cartoon style) -->
    <circle cx="400" cy="170" r="40" fill="none" stroke="#000" stroke-width="4"/>
    <!-- Eyes -->
    <circle cx="385" cy="165" r="5" fill="none" stroke="#000" stroke-width="3"/>
    <circle cx="415" cy="165" r="5" fill="none" stroke="#000" stroke-width="3"/>
    <!-- Smile -->
    <path d="M385,185 Q400,195 415,185" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round"/>

    <!-- Simple hair -->
    <path d="M360,160
             Q380,135 400,135
             Q420,135 440,160" fill="none" stroke="#000" stroke-width="4"/>

    <!-- Torso with robe/jacket -->
    <path d="M360,210
             L440,210
             L470,320
             Q400,340 330,320 Z"
          fill="none" stroke="#000" stroke-width="4"/>

    <!-- Upraised right arm holding wand (to viewer's left) -->
    <path d="M360,220
             L300,170
             L290,175
             L345,230 Z"
          fill="none" stroke="#000" stroke-width="4"/>
    <!-- Wand -->
    <line x1="295" y1="165" x2="260" y2="130" stroke="#000" stroke-width="5" stroke-linecap="round"/>

    <!-- Left arm lowered (to viewer's right) -->
    <path d="M440,220
             L500,270
             L495,280
             L435,230 Z"
          fill="none" stroke="#000" stroke-width="4"/>

    <!-- Belt / sash -->
    <path d="M340,270 Q400,285 460,270" fill="none" stroke="#000" stroke-width="3"/>

    <!-- Table (top edge only, since this is top half of card) -->
    <line x1="180" y1="320" x2="620" y2="320" stroke="#000" stroke-width="5"/>

    <!-- Suit symbols on table: wand, cup, sword, pentacle -->

    <!-- Wand on table (horizontal) -->
    <line x1="210" y1="305" x2="270" y2="305" stroke="#000" stroke-width="4" stroke-linecap="round"/>

    <!-- Cup -->
    <path d="M300,295
             L325,295
             Q320,310 312,318
             Q305,310 300,295 Z"
          fill="none" stroke="#000" stroke-width="3"/>
    <line x1="312" y1="318" x2="312" y2="328" stroke="#000" stroke-width="3"/>
    <line x1="302" y1="328" x2="322" y2="328" stroke="#000" stroke-width="3"/>

    <!-- Sword -->
    <line x1="350" y1="292" x2="370" y2="310" stroke="#000" stroke-width="3"/>
    <rect x="345" y="287" width="8" height="8" fill="none" stroke="#000" stroke-width="2"/>
    <line x1="347" y1="291" x2="341" y2="285" stroke="#000" stroke-width="2"/>
    <line x1="351" y1="295" x2="345" y2="289" stroke="#000" stroke-width="2"/>

    <!-- Pentacle -->
    <circle cx="420" cy="302" r="14" fill="none" stroke="#000" stroke-width="3"/>
    <path d="M420,290
             L425,313
             L410,296
             L430,296
             L415,313 Z"
          fill="none" stroke="#000" stroke-width="2"/>

    <!-- Simple childlike flowers along top border -->
    <g stroke="#000" stroke-width="2" fill="none">
      <!-- Left vine -->
      <path d="M80,120
               Q120,90 160,120
               Q200,150 240,120" />
      <circle cx="100" cy="110" r="8"/>
      <path d="M100,102 L100,94"/>
      <path d="M92,110 L84,110"/>
      <path d="M108,110 L116,110"/>
      <path d="M100,118 L100,126"/>

      <circle cx="140" cy="130" r="8"/>
      <path d="M140,122 L140,114"/>
      <path d="M132,130 L124,130"/>
      <path d="M148,130 L156,130"/>
      <path d="M140,138 L140,146"/>

      <!-- Right vine -->
      <path d="M560,120
               Q600,90 640,120
               Q680,150 720,120" />
      <circle cx="580" cy="110" r="8"/>
      <path d="M580,102 L580,94"/>
      <path d="M572,110 L564,110"/>
      <path d="M588,110 L596,110"/>
      <path d="M580,118 L580,126"/>

      <circle cx="620" cy="130" r="8"/>
      <path d="M620,122 L620,114"/>
      <path d="M612,130 L604,130"/>
      <path d="M628,130 L636,130"/>
      <path d="M620,138 L620,146"/>
    </g>

    <!-- Childlike stars around figure -->
    <g stroke="#000" stroke-width="2" fill="none">
      <path d="M270,190
               L274,200 L285,200
               L276,207 L280,218
               L270,212 L260,218
               L264,207 L255,200
               L266,200 Z"/>
      <path d="M530,190
               L534,200 L545,200
               L536,207 L540,218
               L530,212 L520,218
               L524,207 L515,200
               L526,200 Z"/>
      <path d="M330,140
               L334,150 L345,150
               L336,157 L340,168
               L330,162 L320,168
               L324,157 L315,150
               L326,150 Z"/>
      <path d="M470,140
               L474,150 L485,150
               L476,157 L480,168
               L470,162 L460,168
               L464,157 L455,150
               L466,150 Z"/>
    </g>
  </g>
</svg>