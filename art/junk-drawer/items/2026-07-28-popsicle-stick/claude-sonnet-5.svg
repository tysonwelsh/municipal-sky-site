<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 158">
  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e0b3"/>
      <stop offset="0.45" stop-color="#e4bf84"/>
      <stop offset="1" stop-color="#c9975c"/>
    </linearGradient>
    <clipPath id="clipLeft">
      <path d="M -300,-35 L -25,-35 L -38,-22 L -15,-14 L -32,-2 L -10,10 L -28,22 L -12,35 L -300,35 A 35,35 0 1 1 -300,-35 Z"/>
    </clipPath>
    <clipPath id="clipRight">
      <path d="M 20,-35 L 245,-35 A 35,35 0 1 1 245,35 L 12,35 L 32,24 L 8,14 L 28,3 L 4,-8 L 24,-20 L 10,-28 Z"/>
    </clipPath>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- shadows -->
  <g transform="translate(343,41) rotate(-12)" filter="url(#softBlur)" opacity="0.25">
    <path d="M -300,-35 L -25,-35 L -38,-22 L -15,-14 L -32,-2 L -10,10 L -28,22 L -12,35 L -300,35 A 35,35 0 1 1 -300,-35 Z" fill="#000"/>
  </g>
  <g transform="translate(365,41) rotate(22)" filter="url(#softBlur)" opacity="0.25">
    <path d="M 20,-35 L 245,-35 A 35,35 0 1 1 245,35 L 12,35 L 32,24 L 8,14 L 28,3 L 4,-8 L 24,-20 L 10,-28 Z" fill="#000"/>
  </g>

  <!-- torn splinters / debris in the break gap -->
  <g fill="#f2dcae" stroke="#8a5a2b" stroke-width="1">
    <path d="M 328,14 L 337,7 L 334,23 Z"/>
    <path d="M 344,58 L 352,65 L 339,68 Z"/>
    <path d="M 351,30 L 359,26 L 357,39 Z"/>
    <path d="M 335,44 L 341,40 L 340,50 Z"/>
  </g>
  <g fill="#c9975c" opacity="0.6">
    <circle cx="331" cy="34" r="1.4"/>
    <circle cx="349" cy="20" r="1.1"/>
    <circle cx="355" cy="48" r="1.3"/>
  </g>

  <!-- left half -->
  <g transform="translate(338,32) rotate(-12)">
    <path d="M -300,-35 L -25,-35 L -38,-22 L -15,-14 L -32,-2 L -10,10 L -28,22 L -12,35 L -300,35 A 35,35 0 1 1 -300,-35 Z"
          fill="url(#woodGrad)" stroke="#8a5a2b" stroke-width="2.5" stroke-linejoin="round"/>
    <g clip-path="url(#clipLeft)" stroke="#a8703a" stroke-width="1.3" opacity="0.5" fill="none">
      <path d="M -296,-20 Q -160,-24 -30,-18"/>
      <path d="M -296,-5 Q -160,-8 -22,-4"/>
      <path d="M -296,10 Q -160,7 -26,12"/>
      <path d="M -296,24 Q -160,20 -26,27"/>
    </g>
  </g>

  <!-- right half -->
  <g transform="translate(360,32) rotate(22)">
    <path d="M 20,-35 L 245,-35 A 35,35 0 1 1 245,35 L 12,35 L 32,24 L 8,14 L 28,3 L 4,-8 L 24,-20 L 10,-28 Z"
          fill="url(#woodGrad)" stroke="#8a5a2b" stroke-width="2.5" stroke-linejoin="round"/>
    <g clip-path="url(#clipRight)" stroke="#a8703a" stroke-width="1.3" opacity="0.5" fill="none">
      <path d="M 26,-20 Q 160,-24 240,-18"/>
      <path d="M 24,-5 Q 160,-8 240,-4"/>
      <path d="M 20,10 Q 160,7 240,12"/>
      <path d="M 20,25 Q 160,20 240,27"/>
    </g>
  </g>
</svg>