<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 11 790 186">
  <defs>
    <linearGradient id="wood" x1="0" y1="-45" x2="0" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eed2a1"/>
      <stop offset="0.5" stop-color="#ddb173"/>
