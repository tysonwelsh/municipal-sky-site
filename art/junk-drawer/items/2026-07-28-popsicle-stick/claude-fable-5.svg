    <path d="M352 -45 L340 -34 L364 -26 L344 -16 L370 -8 L346 2 L372 12 L350 22 L366 30 L342 38 L358 45 L336 45 L330 30 L340 14 L328 -2 L338 -20 L326 -36 L338 -45 Z"
