    <path d="M50 -40 H336" fill="none" stroke="#f6e5bd" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- loose splinters and crumbs in the gap -->
  <g fill="#d9ae70" stroke="#a87f45" stroke-width="1" stroke-opacity="0.45">
    <polygon points="372,118 404,106 380,126"/>
    <polygon points="382,146 412,152 378,158"/>
    <polygon points="396,172 420,161 400,179"/>
    <circle cx="392" cy="134" r="3.5"/>
    <circle cx="408" cy="168" r="2.5"/>
  </g>
  <path d="M368 102 L400 90" fill="none" stroke="#cfa869" stroke-width="2.5" stroke-linecap="round"/>

  <!-- right half -->
