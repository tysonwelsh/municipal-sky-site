<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glass" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#f6eaff" stop-opacity="0.95"/>
      <stop offset="38%" stop-color="#c9a8e8" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#7b5fc0" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#2e2154" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#f0a5c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5a3f8e" stop-opacity="0.05"/>
    </radialGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6fd8cf" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6fd8cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f88ab0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f88ab0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#8f6dc4" stop-opacity="0"/>
      <stop offset="78%" stop-color="#8f6dc4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8f6dc4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ballClip">
      <circle cx="256" cy="262" r="222"/>
    </clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35 0 0 0 0 0.25 0 0 0 0 0.5 0 0 0 0.35 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <filter id="edgewobble" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- outer watercolor bloom / aura -->
  <g filter="url(#softer)">
    <circle cx="256" cy="262" r="238" fill="url(#halo)"/>
  </g>

  <!-- bohemian ray burst around orb -->
  <g stroke="#8a6bbd" stroke-opacity="0.5" stroke-linecap="round" fill="none">
    <g stroke-width="3">
      <path d="M256 26 L256 6"/>
      <path d="M256 498 L256 508"/>
      <path d="M22 262 L6 262"/>
      <path d="M490 262 L506 262"/>
      <path d="M91 97 L76 82"/>
      <path d="M421 97 L436 82"/>
      <path d="M91 427 L78 440"/>
      <path d="M421 427 L434 440"/>
    </g>
    <g stroke-width="2" stroke-opacity="0.35">
      <path d="M170 45 L163 27"/>
      <path d="M342 45 L349 27"/>
      <path d="M40 176 L22 169"/>
      <path d="M472 176 L490 169"/>
      <path d="M40 348 L22 355"/>
      <path d="M472 348 L490 355"/>
      <path d="M170 479 L163 496"/>
      <path d="M342 479 L349 496"/>
    </g>
  </g>

  <!-- dotted mandala ring -->
  <g fill="#a37fd0" fill-opacity="0.5">
    <circle cx="256" cy="20" r="4"/><circle cx="256" cy="504" r="4"/>
    <circle cx="14" cy="262" r="4"/><circle cx="498" cy="262" r="4"/>
    <circle cx="85" cy="91" r="3"/><circle cx="427" cy="91" r="3"/>
    <circle cx="85" cy="433" r="3"/><circle cx="427" cy="433" r="3"/>
  </g>
  <circle cx="256" cy="262" r="236" fill="none" stroke="#9b79cd" stroke-opacity="0.35" stroke-width="1.6" stroke-dasharray="2 11" filter="url(#edgewobble)"/>

  <!-- the orb body -->
  <circle cx="256" cy="262" r="222" fill="url(#glass)"/>

  <g clip-path="url(#ballClip)">
    <!-- swirling misty interior -->
    <g filter="url(#soft)">
      <ellipse cx="212" cy="300" rx="130" ry="105" fill="url(#teal)"/>
      <ellipse cx="316" cy="222" rx="120" ry="98" fill="url(#rose)"/>
      <ellipse cx="256" cy="352" rx="140" ry="80" fill="url(#gold)"/>
      <ellipse cx="180" cy="180" rx="95" ry="70" fill="#b8e3ff" fill-opacity="0.4"/>
      <ellipse cx="350" cy="360" rx="105" ry="75" fill="#c58cf0" fill-opacity="0.4"/>
    </g>
    <circle cx="256" cy="272" r="150" fill="url(#core)" filter="url(#soft)"/>

    <!-- swirl linework -->
    <g fill="none" stroke="#f6efff" stroke-opacity="0.55" stroke-linecap="round">
      <path d="M150 300 C170 220 260 200 320 240 C370 273 350 340 290 350 C240 358 215 320 235 292 C250 271 285 274 292 296" stroke-width="4"/>
      <path d="M120 240 C160 150 300 140 370 200" stroke-width="2.5" stroke-opacity="0.4"/>
      <path d="M110 340 C170 400 320 410 390 330" stroke-width="2.5" stroke-opacity="0.35"/>
      <path d="M200 400 C250 370 320 380 360 420" stroke-width="2" stroke-opacity="0.3"/>
    </g>
    <g fill="none" stroke="#5c3f96" stroke-opacity="0.3" stroke-linecap="round">
      <path d="M165 320 C205 250 300 250 330 300" stroke-width="3"/>
      <path d="M240 195 C300 190 340 225 348 265" stroke-width="2"/>
    </g>

    <!-- little stars inside -->
    <g fill="#fff8e0" fill-opacity="0.85">
      <path d="M300 190 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
      <path d="M190 355 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
      <path d="M355 330 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/>
      <circle cx="230" cy="230" r="3"/>
      <circle cx="330" cy="380" r="2.5"/>
      <circle cx="150" cy="270" r="2.5"/>
    </g>

    <!-- grain texture -->
    <circle cx="256" cy="262" r="222" filter="url(#grain)" opacity="0.35"/>

    <!-- the crack -->
    <g stroke-linecap="round" fill="none">
      <g stroke="#3a2a63" stroke-opacity="0.75">
        <path d="M336 68 L318 132 L344 168 L312 214 L330 268 L296 316 L318 372 L286 428 L302 470" stroke-width="3.2"/>
        <path d="M318 132 L262 118" stroke-width="2.2"/>
        <path d="M344 168 L404 152" stroke-width="2.2"/>
        <path d="M312 214 L248 200 L214 232" stroke-width="2"/>
        <path d="M330 268 L396 258" stroke-width="2"/>
        <path d="M296 316 L236 330" stroke-width="1.8"/>
        <path d="M318 372 L378 392" stroke-width="1.8"/>
        <path d="M286 428 L232 424" stroke-width="1.6"/>
      </g>
      <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.2">
        <path d="M339 70 L321 132 L347 168 L315 214 L333 268 L299 316 L321 372 L289 428 L305 468"/>
        <path d="M347 168 L403 154"/>
        <path d="M315 214 L250 202"/>
      </g>
      <!-- mist escaping the crack -->
      <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" filter="url(#soft)">
        <path d="M330 130 C370 150 350 200 386 214"/>
        <path d="M310 300 C350 316 340 356 372 372"/>
      </g>
    </g>

    <!-- chipped shards near crack -->
    <g fill="#ffffff" fill-opacity="0.28" stroke="#3a2a63" stroke-opacity="0.35" stroke-width="1">
      <path d="M318 132 L344 168 L312 154 Z"/>
      <path d="M330 268 L296 316 L332 306 Z"/>
    </g>

    <!-- glass highlights -->
    <ellipse cx="168" cy="150" rx="52" ry="34" fill="#ffffff" fill-opacity="0.55" transform="rotate(-28 168 150)" filter="url(#soft)"/>
    <ellipse cx="139" cy="196" rx="17" ry="11" fill="#ffffff" fill-opacity="0.65" transform="rotate(-28 139 196)"/>
    <path d="M92 300 C96 372 148 428 214 448" stroke="#ffffff" stroke-opacity="0.35" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#soft)"/>
  </g>

  <!-- painterly rim -->
  <circle cx="256" cy="262" r="222" fill="none" stroke="#4a3480" stroke-opacity="0.55" stroke-width="4" filter="url(#edgewobble)"/>
  <circle cx="256" cy="262" r="222" fill="none" stroke="#e6d3ff" stroke-opacity="0.45" stroke-width="1.4"/>
  <circle cx="256" cy="262" r="211" fill="none" stroke="#8b6cc0" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 9"/>
</svg>