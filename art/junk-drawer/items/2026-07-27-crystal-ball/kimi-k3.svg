<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="ballGrad" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f3ecfa" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#d9c9ee" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#a98fd4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6e5a9e" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="mistGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8a2d8" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#9a7cc0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#9a7cc0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fb8c9" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#6e97ab" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6e97ab" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistGrad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c8d9" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#c79fb8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c79fb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="orbClip">
      <circle cx="200" cy="200" r="185"/>
    </clipPath>
  </defs>

  <!-- outer watercolor halo bleed -->
  <circle cx="200" cy="200" r="198" fill="#8a6dbb" opacity="0.18"/>
  <circle cx="196" cy="203" r="193" fill="#7a9fc9" opacity="0.12"/>

  <!-- main orb -->
  <circle cx="200" cy="200" r="185" fill="url(#ballGrad)"/>

  <g clip-path="url(#orbClip)">
    <!-- watercolor wash blotches -->
    <ellipse cx="150" cy="160" rx="120" ry="90" fill="#b795d6" opacity="0.28"/>
    <ellipse cx="265" cy="255" rx="130" ry="100" fill="#7f9fbe" opacity="0.25"/>
    <ellipse cx="230" cy="140" rx="90" ry="70" fill="#d9b7d4" opacity="0.22"/>

    <!-- swirling cloudy mist -->
    <ellipse cx="170" cy="230" rx="110" ry="75" fill="url(#mistGrad1)" transform="rotate(-20 170 230)"/>
    <ellipse cx="240" cy="180" rx="100" ry="70" fill="url(#mistGrad2)" transform="rotate(15 240 180)"/>
    <ellipse cx="200" cy="260" rx="120" ry="60" fill="url(#mistGrad3)" transform="rotate(8 200 260)"/>
    <ellipse cx="150" cy="150" rx="80" ry="55" fill="url(#mistGrad2)" transform="rotate(-35 150 150)"/>
    <ellipse cx="270" cy="240" rx="85" ry="60" fill="url(#mistGrad1)" transform="rotate(30 270 240)"/>

    <!-- swirl strokes -->
    <path d="M110 250 Q150 190 215 205 Q270 218 285 175" fill="none" stroke="#e5d7f2" stroke-width="7" opacity="0.55" stroke-linecap="round"/>
    <path d="M120 175 Q175 140 230 160 Q280 178 295 230" fill="none" stroke="#c9dce8" stroke-width="6" opacity="0.5" stroke-linecap="round"/>
    <path d="M140 290 Q200 265 260 285" fill="none" stroke="#f0dde8" stroke-width="8" opacity="0.45" stroke-linecap="round"/>
    <path d="M180 130 Q225 145 250 125" fill="none" stroke="#efe6f7" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
    <path d="M130 215 Q165 240 200 228" fill="none" stroke="#a98fd4" stroke-width="4" opacity="0.4" stroke-linecap="round"/>

    <!-- tiny sparkles in the mist -->
    <g fill="#ffffff" opacity="0.85">
      <path d="M160 190 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/>
      <path d="M250 210 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
      <path d="M205 265 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z"/>
      <path d="M230 150 l1.5 4 4 1.5 -4 1.5 -1.5 4 -1.5 -4 -4 -1.5 4 -1.5 z"/>
    </g>
    <g fill="#ffe9a8" opacity="0.7">
      <circle cx="185" cy="215" r="2.2"/>
      <circle cx="265" cy="180" r="1.8"/>
      <circle cx="145" cy="255" r="1.8"/>
    </g>

    <!-- glass highlight -->
    <ellipse cx="140" cy="120" rx="70" ry="45" fill="url(#shine)" transform="rotate(-30 140 120)"/>
    <path d="M85 150 Q105 95 160 75" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.55" stroke-linecap="round"/>
    <path d="M300 300 Q320 275 322 245" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.3" stroke-linecap="round"/>

    <!-- the crack -->
    <g stroke="#5d4a86" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M262 55 L248 95 L268 130 L245 165 L258 200 L236 235" stroke-width="3" opacity="0.85"/>
      <path d="M248 95 L222 112" stroke-width="2.2" opacity="0.8"/>
      <path d="M268 130 L296 122" stroke-width="2" opacity="0.75"/>
      <path d="M245 165 L218 180 L205 200" stroke-width="2" opacity="0.7"/>
      <path d="M258 200 L285 218" stroke-width="1.8" opacity="0.65"/>
      <path d="M236 235 L222 262" stroke-width="1.6" opacity="0.6"/>
    </g>
    <!-- crack glint -->
    <g stroke="#ffffff" fill="none" stroke-linecap="round" opacity="0.5">
      <path d="M265 58 L252 94" stroke-width="1.5"/>
      <path d="M271 132 L250 162" stroke-width="1.2"/>
    </g>
  </g>

  <!-- rim with watercolor unevenness -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#4a3a72" stroke-width="3.5" opacity="0.7"/>
  <path d="M45 260 A185 185 0 0 0 200 385" fill="none" stroke="#3c2f5e" stroke-width="6" opacity="0.4" stroke-linecap="round"/>
  <path d="M355 140 A185 185 0 0 0 280 350" fill="none" stroke="#5a4890" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
  <path d="M60 160 A185 185 0 0 1 160 25" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
</svg>