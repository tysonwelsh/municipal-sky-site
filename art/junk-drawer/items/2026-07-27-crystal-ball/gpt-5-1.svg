    <circle cx="182" cy="150" r="18" fill="#ffffff" opacity="0.85"/>

    <g opacity="0.3" filter="url(#watercolorEdge)">
      <circle cx="94" cy="180" r="10" fill="#ffccf2"/>
      <circle cx="420" cy="320" r="8" fill="#ffd6a5"/>
      <circle cx="132" cy="356" r="7" fill="#b7f5ff"/>
      <circle cx="374" cy="198" r="9" fill="#ffc6ff"/>
      <circle cx="310" cy="430" r="6" fill="#caffbf"/>
