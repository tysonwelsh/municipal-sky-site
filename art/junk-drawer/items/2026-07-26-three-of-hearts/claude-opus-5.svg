<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 504">
  <defs>
    <linearGradient id="age" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfbf4"/>
      <stop offset="45%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#efe7d6"/>
    </linearGradient>
    <radialGradient id="stain1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#d9c9a4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#d9c9a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stain2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#cbb98f" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#cbb98f" stop-opacity="0"/>
    </radialGradient>

    <symbol id="heart" viewBox="0 0 100 100">
      <path d="M50 92C50 92 6 62 6 34.5 6 18.5 17.8 8 31.2 8 40.4 8 46.6 12.9 50 19.6 53.4 12.9 59.6 8 68.8 8 82.2 8 94 18.5 94 34.5 94 62 50 92 50 92Z" fill="#c8102e"/>
    </symbol>
  </defs>

  <g>
    <!-- card stock -->
    <rect x="5" y="5" width="350" height="494" rx="26" ry="26" fill="url(#age)" stroke="#ded3bc" stroke-width="1.5"/>

    <!-- subtle aging blooms -->
    <ellipse cx="82" cy="120" rx="70" ry="58" fill="url(#stain1)"/>
    <ellipse cx="290" cy="400" rx="80" ry="66" fill="url(#stain2)"/>
    <ellipse cx="210" cy="60" rx="90" ry="42" fill="url(#stain2)"/>
    <ellipse cx="60" cy="440" rx="60" ry="52" fill="url(#stain1)"/>

    <!-- inner border line (faint) -->
    <rect x="16" y="16" width="328" height="472" rx="18" ry="18" fill="none" stroke="#e6dcc6" stroke-width="1"/>

    <!-- top-left index -->
    <g>
      <text x="40" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold" fill="#c8102e" text-anchor="middle">3</text>
      <use href="#heart" x="26" y="88" width="28" height="28"/>
    </g>

    <!-- bottom-right index (inverted) -->
    <g transform="rotate(180 180 252)">
      <text x="40" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="bold" fill="#c8102e" text-anchor="middle">3</text>
      <use href="#heart" x="26" y="88" width="28" height="28"/>
    </g>

    <!-- center pips -->
    <use href="#heart" x="140" y="82" width="80" height="80"/>
    <use href="#heart" x="140" y="212" width="80" height="80"/>
    <g transform="rotate(180 180 382)">
      <use href="#heart" x="140" y="342" width="80" height="80"/>
    </g>
  </g>
</svg>