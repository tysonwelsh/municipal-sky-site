<svg xmlns="http://www.w3.org/2000/svg" viewBox="35.0 21.0 329.8 460.5">
  <defs>
    <clipPath id="headClip">
      <path d="M200,38 C102,38 52,118 52,208 C52,318 138,388 176,452 C186,469 214,469 224,452 C262,388 348,318 348,208 C348,118 298,38 200,38 Z"/>
    </clipPath>

    <linearGradient id="foilBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e8b94"/>
      <stop offset="0.18" stop-color="#6fa89b"/>
      <stop offset="0.36" stop-color="#7286a8"/>
      <stop offset="0.52" stop-color="#98a4a6"/>
      <stop offset="0.66" stop-color="#5f9585"/>
      <stop offset="0.82" stop-color="#66799a"/>
      <stop offset="1" stop-color="#84918f"/>
    </linearGradient>

    <linearGradient id="foilStreak1" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe6ea" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#f2bcd8" stop-opacity="0.5"/>
      <stop offset="0.40" stop-color="#8fd2ee" stop-opacity="0.75"/>
      <stop offset="0.52" stop-color="#d4ecc4" stop-opacity="0.55"/>
      <stop offset="0.66" stop-color="#baa4ec" stop-opacity="0.5"/>
      <stop offset="0.80" stop-color="#ecd6ae" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#dfe6ea" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="foilStreak2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8eef0" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#a2ecd2" stop-opacity="0.55"/>
      <stop offset="0.40" stop-color="#f0c0de" stop-opacity="0.5"/>
      <stop offset="0.52" stop-color="#e9eff0" stop-opacity="0.65"/>
      <stop offset="0.64" stop-color="#8cbcec" stop-opacity="0.55"/>
      <stop offset="0.80" stop-color="#ecdca4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e8eef0" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rimFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfefd"/>
      <stop offset="0.2" stop-color="#eef8f4"/>
      <stop offset="0.4" stop-color="#fbeef5"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#eaf0f8"/>
      <stop offset="1" stop-color="#f8fbf9"/>
    </linearGradient>

    <radialGradient id="domeGlow" cx="0.38" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#f2f7f8" stop-opacity="0.65"/>
      <stop offset="0.35" stop-color="#e6eef0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="edgeShade" cx="0.5" cy="0.45" r="0.68">
      <stop offset="0" stop-color="#1d2c33" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#1d2c33" stop-opacity="0"/>
      <stop offset="1" stop-color="#17282f" stop-opacity="0.55"/>
    </radialGradient>

    <linearGradient id="eyeGrad" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#2b3b42"/>
      <stop offset="0.45" stop-color="#0c1418"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="eyeSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8d8" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#7fa8d8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- die-cut sticker rim: white border -->
  <path d="M200,38 C102,38 52,118 52,208 C52,318 138,388 176,452 C186,469 214,469 224,452 C262,388 348,318 348,208 C348,118 298,38 200,38 Z"
        fill="none" stroke="#ffffff" stroke-width="30" stroke-linejoin="round"/>
  <path d="M200,38 C102,38 52,118 52,208 C52,318 138,388 176,452 C186,469 214,469 224,452 C262,388 348,318 348,208 C348,118 298,38 200,38 Z"
        fill="none" stroke="url(#rimFoil)" stroke-width="22" stroke-linejoin="round"/>
  <path d="M200,38 C102,38 52,118 52,208 C52,318 138,388 176,452 C186,469 214,469 224,452 C262,388 348,318 348,208 C348,118 298,38 200,38 Z"
        fill="none" stroke="#93a4ab" stroke-width="2" stroke-opacity="0.55" stroke-linejoin="round"/>

  <!-- alien head foil -->
  <path d="M200,38 C102,38 52,118 52,208 C52,318 138,388 176,452 C186,469 214,469 224,452 C262,388 348,318 348,208 C348,118 298,38 200,38 Z"
        fill="url(#foilBase)"/>

  <g clip-path="url(#headClip)">
    <!-- diagonal holo bands -->
    <rect x="0" y="0" width="400" height="500" fill="url(#foilStreak1)"/>
    <g opacity="0.65">
      <polygon points="-60,500 40,500 300,0 200,0" fill="url(#foilStreak2)"/>
      <polygon points="120,500 175,500 430,0 375,0" fill="#c8ecdc" opacity="0.45"/>
      <polygon points="176,500 200,500 455,0 431,0" fill="#eeaed8" opacity="0.42"/>
      <polygon points="230,500 265,500 520,0 485,0" fill="#9cbcee" opacity="0.45"/>
      <polygon points="-140,500 -95,500 165,0 120,0" fill="#a8ecdc" opacity="0.42"/>
      <polygon points="-95,500 -75,500 185,0 165,0" fill="#ecd2a0" opacity="0.38"/>
    </g>
    <!-- prismatic burst lines -->
    <g stroke-linecap="round" opacity="0.55">
      <line x1="200" y1="235" x2="30" y2="60" stroke="#cfeee4" stroke-width="7"/>
      <line x1="200" y1="235" x2="120" y2="10" stroke="#94ccee" stroke-width="5"/>
      <line x1="200" y1="235" x2="250" y2="8" stroke="#eeaad4" stroke-width="4"/>
      <line x1="200" y1="235" x2="290" y2="15" stroke="#b6ecc8" stroke-width="6"/>
      <line x1="200" y1="235" x2="372" y2="90" stroke="#a8b6ee" stroke-width="5"/>
      <line x1="200" y1="235" x2="378" y2="190" stroke="#eecf98" stroke-width="4"/>
      <line x1="200" y1="235" x2="368" y2="290" stroke="#9ce4cc" stroke-width="6"/>
      <line x1="200" y1="235" x2="45" y2="310" stroke="#9cc2e2" stroke-width="6"/>
      <line x1="200" y1="235" x2="30" y2="200" stroke="#e2aade" stroke-width="4"/>
      <line x1="200" y1="235" x2="200" y2="470" stroke="#c4ecdc" stroke-width="5"/>
    </g>
    <!-- dome highlight & vignette -->
    <rect x="0" y="0" width="400" height="500" fill="url(#domeGlow)"/>
    <rect x="0" y="0" width="400" height="500" fill="url(#edgeShade)"/>
  </g>

  <!-- eyes: broad rounded outer end, sweeping inward and down to a sharp inner tip -->
  <g>
    <path d="M166,266 C124,254 84,234 71,204 C62,182 73,164 97,167 C134,172 160,218 166,266 Z" fill="url(#eyeGrad)"/>
    <path d="M234,266 C276,254 316,234 329,204 C338,182 327,164 303,167 C266,172 240,218 234,266 Z" fill="url(#eyeGrad)"/>
    <path d="M84,190 C94,176 116,176 132,190 C114,182 96,182 84,190 Z" fill="url(#eyeSheen)"/>
    <path d="M316,190 C306,176 284,176 268,190 C286,182 304,182 316,190 Z" fill="url(#eyeSheen)"/>
    <ellipse cx="103" cy="192" rx="13" ry="7" fill="#bff2ff" opacity="0.8" transform="rotate(20 103 192)"/>
    <ellipse cx="297" cy="192" rx="13" ry="7" fill="#bff2ff" opacity="0.8" transform="rotate(-20 297 192)"/>
    <circle cx="138" cy="226" r="4" fill="#8fe8d0" opacity="0.7"/>
    <circle cx="262" cy="226" r="4" fill="#8fe8d0" opacity="0.7"/>
  </g>

  <!-- nostrils & mouth -->
  <ellipse cx="190" cy="330" rx="4" ry="7" fill="#233c42" opacity="0.85" transform="rotate(-12 190 330)"/>
  <ellipse cx="210" cy="330" rx="4" ry="7" fill="#233c42" opacity="0.85" transform="rotate(12 210 330)"/>
  <path d="M172,372 Q200,388 228,372" fill="none" stroke="#1f363c" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M176,370 Q200,382 224,370" fill="none" stroke="#8fd6c6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M108,96 L112,112 L128,116 L112,120 L108,136 L104,120 L88,116 L104,112 Z" opacity="0.95"/>
    <path d="M296,140 L299,151 L310,154 L299,157 L296,168 L293,157 L282,154 L293,151 Z" opacity="0.85"/>
    <path d="M238,72 L240,80 L248,82 L240,84 L238,92 L236,84 L228,82 L236,80 Z" opacity="0.8"/>
    <path d="M150,398 L152,406 L160,408 L152,410 L150,418 L148,410 L140,408 L148,406 Z" opacity="0.8"/>
    <path d="M262,344 L264,351 L271,353 L264,355 L262,362 L260,355 L253,353 L260,351 Z" opacity="0.7"/>
    <circle cx="330" cy="230" r="3" opacity="0.75"/>
    <circle cx="72" cy="250" r="3" opacity="0.7"/>
    <circle cx="200" cy="440" r="2.5" opacity="0.7"/>
  </g>
</svg>