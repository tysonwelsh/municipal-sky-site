<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
  <defs>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d2c4"/>
      <stop offset="0.25" stop-color="#f5f0e6"/>
      <stop offset="0.55" stop-color="#e8e1d2"/>
      <stop offset="0.8" stop-color="#cfc7b6"/>
      <stop offset="1" stop-color="#b7ae9c"/>
    </linearGradient>
    <linearGradient id="marbleV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9dc"/>
      <stop offset="1" stop-color="#c8bfae"/>
    </linearGradient>
    <radialGradient id="volute" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7f2e8"/>
      <stop offset="0.6" stop-color="#ded6c6"/>
      <stop offset="1" stop-color="#b3aa97"/>
    </radialGradient>
  </defs>

  <!-- top slab (abacus) -->
  <rect x="18" y="6" width="164" height="14" rx="2" fill="url(#marbleV)" stroke="#a89f8d" stroke-width="1"/>
  <!-- capital body with egg-and-dart band -->
  <rect x="26" y="20" width="148" height="10" fill="url(#marbleV)" stroke="#a89f8d" stroke-width="1"/>
  <g fill="#c9c0af" stroke="#a89f8d" stroke-width="0.7">
    <ellipse cx="40" cy="25" rx="4" ry="4"/>
    <ellipse cx="60" cy="25" rx="4" ry="4"/>
    <ellipse cx="80" cy="25" rx="4" ry="4"/>
    <ellipse cx="100" cy="25" rx="4" ry="4"/>
    <ellipse cx="120" cy="25" rx="4" ry="4"/>
    <ellipse cx="140" cy="25" rx="4" ry="4"/>
    <ellipse cx="160" cy="25" rx="4" ry="4"/>
  </g>
  <!-- volute band -->
  <path d="M10 44 Q10 32 26 32 L174 32 Q190 32 190 44 Q190 56 174 56 L26 56 Q10 56 10 44 Z" fill="url(#marbleV)" stroke="#a89f8d" stroke-width="1"/>
  <!-- left volute -->
  <g transform="translate(34,44)">
    <circle r="13" fill="url(#volute)" stroke="#a89f8d" stroke-width="1"/>
    <path d="M0 -9 A9 9 0 1 1 -9 0 A7 7 0 1 0 5 -5 A4 4 0 1 1 1 -1" fill="none" stroke="#9a917f" stroke-width="1.6"/>
    <circle r="1.8" fill="#9a917f"/>
  </g>
  <!-- right volute -->
  <g transform="translate(166,44)">
    <circle r="13" fill="url(#volute)" stroke="#a89f8d" stroke-width="1"/>
    <path d="M0 -9 A9 9 0 1 0 9 0 A7 7 0 1 1 -5 -5 A4 4 0 1 0 -1 -1" fill="none" stroke="#9a917f" stroke-width="1.6"/>
    <circle r="1.8" fill="#9a917f"/>
  </g>
  <!-- necking -->
  <rect x="62" y="56" width="76" height="8" fill="url(#marbleV)" stroke="#a89f8d" stroke-width="1"/>

  <!-- fluted shaft -->
  <path d="M66 64 L134 64 L146 256 L54 256 Z" fill="url(#marble)" stroke="#a89f8d" stroke-width="1"/>
  <g stroke="#b3aa97" stroke-width="1.4" fill="none" opacity="0.85">
    <path d="M76 64 L66 256"/>
    <path d="M88 64 L81 256"/>
    <path d="M100 64 L97 256"/>
    <path d="M112 64 L113 256"/>
    <path d="M124 64 L129 256"/>
  </g>
  <g stroke="#f8f4ea" stroke-width="1" fill="none" opacity="0.7">
    <path d="M70 64 L60 256"/>
    <path d="M82 64 L73 256"/>
    <path d="M94 64 L89 256"/>
    <path d="M106 64 L105 256"/>
    <path d="M118 64 L121 256"/>
    <path d="M130 64 L137 256"/>
  </g>

  <!-- base: tori and scotia -->
  <rect x="50" y="256" width="100" height="8" fill="url(#marbleV)" stroke="#a89f8d" stroke-width="1"/>
  <path d="M44 276 Q44 264 56 264 L144 264 Q156 264 156 276 Z" fill="url(#marbleV)" stroke="#a89f8d" stroke-width="1"/>
  <path d="M38 290 Q38 276 52 276 L148 276 Q162 276 162 290 Z" fill="url(#marbleV)" stroke="#a89f8d" stroke-width="1"/>
  <rect x="30" y="290" width="140" height="8" rx="2" fill="url(#marbleV)" stroke="#a89f8d" stroke-width="1"/>
</svg>