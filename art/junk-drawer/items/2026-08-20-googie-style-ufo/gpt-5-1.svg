      <stop offset="100%" stop-color="#3b4352"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9fbff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#b7eafa" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#6ab8e1" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="trimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd27f"/>
      <stop offset="50%" stop-color="#ffb44c"/>
      <stop offset="100%" stop-color="#ffdf9f"/>
    </linearGradient>
    <linearGradient id="lightBeamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffcc" stop-opacity="0.0"/>
      <stop offset="45%" stop-color="#fff7a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="portholeGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#c8f3ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5bb4e8" stop-opacity="0.98"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#ffe8a6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffe8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="finGrad" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#fefefe"/>
      <stop offset="60%" stop-color="#e0e0e3"/>
      <stop offset="100%" stop-color="#c3c3c9"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="14" result="offset"/>
      <feComponentTransfer in="offset">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

