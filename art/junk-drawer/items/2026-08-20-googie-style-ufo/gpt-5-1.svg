<svg xmlns="http://www.w3.org/2000/svg" viewBox="110.5 65.0 578.8 415.5">
  <defs>
    <linearGradient id="hullTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f7f7"/>
      <stop offset="50%" stop-color="#dcdcdc"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="hullBottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
