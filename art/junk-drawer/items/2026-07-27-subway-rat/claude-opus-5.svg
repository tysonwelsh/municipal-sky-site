  <g stroke="#23262b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M164,470 L156,492"/><path d="M182,474 L182,490"/>
  </g>

  <!-- EAR -->
  <path d="M232,205 C210,150 245,120 290,132 C328,142 335,190 310,220 C285,245 250,240 232,205 Z"
        fill="url(#fur)" stroke="#23262b" stroke-width="7" stroke-linejoin="round"/>
  <path d="M250,200 C240,165 262,148 292,158 C315,166 318,196 302,214 C285,230 262,225 250,200 Z"
        fill="#e8a3b5"/>

  <!-- PIZZA SLICE (the loot) -->
  <path d="M112,428 L176,450 L74,500 Z" fill="#f2c14e" stroke="#a9762f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M106,420 Q142,430 178,444 L180,458 Q144,444 110,434 Z" fill="#d69a4a" stroke="#a9762f" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#c0392b" stroke="#8f2a20" stroke-width="2">
    <circle cx="122" cy="452" r="8"/><circle cx="142" cy="463" r="7"/><circle cx="104" cy="470" r="6"/>
  </g>

  <!-- LIFTED FRONT PAW grabbing crust -->
  <path d="M150,424 C138,428 132,440 140,448 C148,455 160,452 166,442 C172,432 168,424 158,422 C154,421 152,422 150,424 Z"
        fill="#e8a3b5" stroke="#23262b" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#23262b" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M144,438 L138,446"/><path d="M154,442 L150,450"/>
  </g>

  <!-- NOSE -->
  <path d="M40,312 C26,308 22,321 34,328 C46,335 60,330 60,318 C58,309 48,308 40,312 Z"
        fill="#d16a86" stroke="#23262b" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="35" cy="320" r="3.5" fill="#23262b"/>

  <!-- MOUTH / SLY GRIN -->
  <path d="M54,330 C92,354 132,358 166,347 C176,344 181,337 179,330"
        fill="none" stroke="#23262b" stroke-width="6" stroke-linecap="round"/>
  <!-- BUCK TEETH -->
  <rect x="55" y="336" width="12" height="20" rx="4" fill="#ffffff" stroke="#23262b" stroke-width="3"/>
  <rect x="68" y="338" width="12" height="20" rx="4" fill="#ffffff" stroke="#23262b" stroke-width="3"/>

  <!-- WHISKERS -->
  <g stroke="#3a3a3a" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M80,323 C55,316 32,310 12,312"/>
    <path d="M84,334 C58,334 34,339 14,347"/>
    <path d="M86,344 C62,349 42,359 26,371"/>
  </g>

  <!-- GOOGLY EYES -->
  <circle cx="250" cy="230" r="46" fill="#ffffff" stroke="#23262b" stroke-width="6"/>
  <circle cx="150" cy="222" r="52" fill="#ffffff" stroke="#23262b" stroke-width="6"/>
  <circle cx="232" cy="246" r="19" fill="#1a1a1a"/>
  <circle cx="225" cy="239" r="5" fill="#ffffff"/>
  <circle cx="132" cy="238" r="22" fill="#1a1a1a"/>
  <circle cx="124" cy="230" r="6" fill="#ffffff"/>
  <!-- heavy sneaky lids -->
  <path d="M206,220 Q250,204 294,226" fill="none" stroke="#23262b" stroke-width="8" stroke-linecap="round"/>
  <path d="M100,210 Q150,192 200,214" fill="none" stroke="#23262b" stroke-width="9" stroke-linecap="round"/>
  <!-- scheming brows -->
  <path d="M205,180 Q250,154 292,158" fill="none" stroke="#23262b" stroke-width="10" stroke-linecap="round"/>
  <path d="M96,188 Q140,160 182,158" fill="none" stroke="#23262b" stroke-width="11" stroke-linecap="round"/>
</svg>