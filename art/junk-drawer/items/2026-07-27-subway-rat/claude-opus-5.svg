<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 526" role="img" aria-label="A sneaky cartoon subway rat with big googly eyes scampering off in profile, dragging a slice of pizza">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ca4ad"/>
      <stop offset="1" stop-color="#7d848d"/>
    </linearGradient>
    <linearGradient id="tailg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a3b5"/>
      <stop offset="1" stop-color="#d885a0"/>
    </linearGradient>
  </defs>

  <!-- TAIL (behind) -->
  <path d="M700,296 C800,300 856,250 842,168 C833,108 796,54 762,20 C752,30 748,30 738,38 C770,80 810,124 818,174 C830,248 782,274 704,266 Z"
        fill="url(#tailg)" stroke="#23262b" stroke-width="6" stroke-linejoin="round"/>

  <!-- FAR HIND LEG + FOOT -->
  <path d="M690,332 C706,378 690,420 660,448 C636,470 618,486 606,504 C634,508 660,500 666,478 C704,446 726,394 716,344 Z"
        fill="#6f767e" stroke="#23262b" stroke-width="6" stroke-linejoin="round"/>
  <path d="M600,488 C588,498 586,510 598,514 C608,518 620,512 622,502 C634,497 648,496 656,500 C650,486 632,480 614,482 Z"
        fill="#d885a0" stroke="#23262b" stroke-width="5" stroke-linejoin="round"/>

  <!-- SCAMPER DUST PUFFS -->
  <g fill="#e2e6ea" stroke="#23262b" stroke-width="4">
    <circle cx="770" cy="474" r="17"/>
    <circle cx="800" cy="452" r="12"/>
    <circle cx="742" cy="492" r="11"/>
  </g>

  <!-- BODY -->
  <path d="M45,315 C70,283 92,268 132,256 C176,244 202,238 246,232 C300,224 332,172 472,162 C602,153 682,188 732,250 C772,296 766,352 714,378 C640,408 560,408 470,402 C360,395 250,398 168,370 C122,354 62,338 45,315 Z"
        fill="url(#fur)" stroke="#23262b" stroke-width="7" stroke-linejoin="round"/>

  <!-- BELLY HIGHLIGHT -->
  <path d="M118,342 C210,306 400,306 548,332 C528,392 360,404 206,386 C158,378 130,360 118,342 Z"
        fill="#bcc2ca" opacity="0.7"/>

  <!-- NEAR HIND LEG + FOOT -->
  <path d="M622,346 C662,352 704,372 712,414 C718,450 706,480 694,502 C726,506 754,496 752,466 C758,410 744,356 700,332 C672,324 640,330 622,346 Z"
        fill="url(#fur)" stroke="#23262b" stroke-width="7" stroke-linejoin="round"/>
  <path d="M652,482 C638,494 636,508 648,512 C659,516 671,510 674,499 C686,494 700,492 710,496 C704,482 686,474 666,476 Z"
        fill="#e8a3b5" stroke="#23262b" stroke-width="5" stroke-linejoin="round"/>
  <g stroke="#23262b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M666,486 L668,506"/><path d="M684,486 L690,502"/>
  </g>

  <!-- NEAR FRONT LEG + FOOT (tiptoe) -->
  <path d="M242,366 C214,392 190,414 172,440 C156,462 150,478 160,490 C172,496 186,484 194,466 C214,436 246,410 264,384 Z"
        fill="url(#fur)" stroke="#23262b" stroke-width="7" stroke-linejoin="round"/>
  <path d="M158,466 C142,478 134,494 144,502 C154,509 168,502 172,490 C182,483 194,480 204,484 C198,468 180,460 160,462 Z"
