<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="redBg" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ff4a38"/>
      <stop offset="45%" stop-color="#df2119"/>
      <stop offset="100%" stop-color="#8a0d09"/>
    </radialGradient>

    <linearGradient id="silverBorder" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#eceded"/>
      <stop offset="33%" stop-color="#aeb0b3"/>
      <stop offset="50%" stop-color="#727477"/>
      <stop offset="66%" stop-color="#c6c8ca"/>
      <stop offset="82%" stop-color="#f6f6f7"/>
      <stop offset="100%" stop-color="#939597"/>
    </linearGradient>

    <linearGradient id="silverHead" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#fcfcfd"/>
      <stop offset="28%" stop-color="#d9dadc"/>
      <stop offset="55%" stop-color="#98999b"/>
      <stop offset="76%" stop-color="#e4e5e6"/>
      <stop offset="100%" stop-color="#b3b4b6"/>
    </linearGradient>

    <linearGradient id="silverCap" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f3"/>
      <stop offset="50%" stop-color="#a3a4a6"/>
      <stop offset="100%" stop-color="#84868a"/>
    </linearGradient>

    <clipPath id="circClip">
      <circle cx="250" cy="250" r="221"/>
    </clipPath>
    <clipPath id="outerClip">
      <circle cx="250" cy="250" r="244"/>
    </clipPath>

    <filter id="emboss" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="4.2" specularConstant="0.9" specularExponent="14" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="55"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </defs>

  <!-- faux silver border -->
  <circle cx="250" cy="250" r="244" fill="url(#silverBorder)"/>
  <circle cx="250" cy="250" r="221" fill="url(#redBg)"/>

  <!-- bevel rings on the border -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.45"/>
  <circle cx="250" cy="250" r="229" fill="none" stroke="#5a5b5d" stroke-width="2.5" opacity="0.45"/>
  <circle cx="250" cy="250" r="232" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-dasharray="130 1400" transform="rotate(-135 250 250)" opacity="0.5"/>
  <circle cx="250" cy="250" r="232" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-dasharray="95 1400" transform="rotate(45 250 250)" opacity="0.22"/>

  <!-- sunburst -->
  <g clip-path="url(#circClip)">
    <polygon points="250,250 471,250 454.1,334.6" fill="#ffffff" opacity="0.16"/>
    <polygon points="250,250 454.1,334.6 406.3,406.3" fill="#000000" opacity="0.14"/>
    <polygon points="250,250 406.3,406.3 334.6,454.1" fill="#ffffff" opacity="0.16"/>
    <polygon points="250,250 334.6,454.1 250,471" fill="#000000" opacity="0.14"/>
    <polygon points="250,250 250,471 165.4,454.1" fill="#ffffff" opacity="0.16"/>
    <polygon points="250,250 165.4,454.1 93.7,406.3" fill="#000000" opacity="0.14"/>
    <polygon points="250,250 93.7,406.3 45.9,334.6" fill="#ffffff" opacity="0.16"/>
    <polygon points="250,250 45.9,334.6 29,250" fill="#000000" opacity="0.14"/>
    <polygon points="250,250 29,250 45.9,165.4" fill="#ffffff" opacity="0.16"/>
    <polygon points="250,250 45.9,165.4 93.7,93.7" fill="#000000" opacity="0.14"/>
    <polygon points="250,250 93.7,93.7 165.4,45.9" fill="#ffffff" opacity="0.16"/>
    <polygon points="250,250 165.4,45.9 250,29" fill="#000000" opacity="0.14"/>
    <polygon points="250,250 250,29 334.6,45.9" fill="#ffffff" opacity="0.16"/>
    <polygon points="250,250 334.6,45.9 406.3,93.7" fill="#000000" opacity="0.14"/>
    <polygon points="250,250 406.3,93.7 454.1,165.4" fill="#ffffff" opacity="0.16"/>
    <polygon points="250,250 454.1,165.4 471,250" fill="#000000" opacity="0.14"/>
  </g>

  <!-- inner groove -->
  <circle cx="250" cy="250" r="221" fill="none" stroke="#5b1109" stroke-width="2.5" opacity="0.5"/>

  <!-- Mao profile relief, faux silver -->
  <g clip-path="url(#circClip)">
    <g filter="url(#emboss)">
      <path d="M245,127
               Q270,122 292,140
               Q302,150 308,168
               Q320,180 334,196
               Q326,206 312,214
               Q318,224 322,233
               Q314,238 306,241
               Q310,249 309,256
               Q302,266 293,275
               L268,282
               Q285,292 300,300
               L340,330
               L380,380
               L400,470
               L90,470
               L110,380
               L140,330
               Q155,300 171.7,272
               Q160,250 171.7,231.7
               Q160,205 171.7,178.3
               Q180,155 206,137.5
               Q220,128 245,127 Z" fill="url(#silverHead)"/>

      <ellipse cx="315" cy="222" rx="9" ry="15" transform="rotate(-12 315 222)" fill="url(#silverHead)"/>

      <path d="M195,150
               Q200,110 245,105
               Q292,110 302,150
               Q296,158 285,155
               Q260,148 245,148
               Q220,150 205,158
               Q198,155 195,150 Z" fill="url(#silverCap)"/>

      <path d="M296,150 L322,162 L300,172 Z" fill="url(#silverCap)"/>

      <circle cx="306" cy="159" r="5.5" fill="url(#silverCap)"/>

      <circle cx="300" cy="345" r="5" fill="url(#silverHead)"/>
      <circle cx="322" cy="368" r="5" fill="url(#silverHead)"/>
    </g>
  </g>

  <!-- fine shading for definition -->
  <g clip-path="url(#circClip)" opacity="0.35">
    <ellipse cx="303" cy="179" rx="6" ry="2.6" transform="rotate(-18 303 179)" fill="#4a4a4a"/>
    <ellipse cx="317" cy="207" rx="4" ry="2" transform="rotate(-10 317 207)" fill="#4a4a4a"/>
    <ellipse cx="306" cy="242" rx="6" ry="1.8" fill="#3c3c3c"/>
    <circle cx="313" cy="223" r="2.4" fill="#3c3c3c"/>
    <circle cx="306" cy="159" r="2" fill="#6a6a6a"/>
    <path d="M268,282 L286,304" stroke="#4a4a4a" stroke-width="2" fill="none"/>
  </g>

  <!-- enamel gloss -->
  <g clip-path="url(#outerClip)">
    <ellipse cx="185" cy="150" rx="150" ry="86" transform="rotate(-25 185 150)" fill="#ffffff" opacity="0.12"/>
  </g>

  <circle cx="250" cy="250" r="244.5" fill="none" stroke="#4d4e50" stroke-width="2" opacity="0.55"/>
</svg>