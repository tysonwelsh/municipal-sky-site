               C294 249 298 252 300 255
               C302 259 302 262 300 265
               C297 269 291 272 283 273"
            stroke="url(#maoSilverShadow)" stroke-width="3"/>

      <!-- Chin contour accent -->
      <path d="M276 282
               C269 287 262 290 252 292
               C242 294 233 294 225 293"
            stroke="url(#maoSilverShadow)" stroke-width="3.2"/>

      <!-- Eye crease -->
      <path d="M272 205
               C279 203 286 203 292 205"
            stroke="url(#maoSilverShadow)" stroke-width="2.6"/>

      <!-- Brow / forehead accent -->
      <path d="M248 196
               C259 193 271 191 283 192
               C291 192 298 194 304 197"
            stroke="url(#maoSilverShadow)" stroke-width="2.8"/>

      <!-- Ear outline hint -->
      <path d="M311 226
               C314 230 316 237 317 245
               C317 251 316 256 314 260"
            stroke="url(#maoSilverShadow)" stroke-width="2.8"/>

      <!-- Neck fold -->
      <path d="M255 260
               C250 269 246 276 243 284
               C241 290 240 297 241 304"
            stroke="url(#maoSilverShadow)" stroke-width="3.1"/>
    </g>

    <!-- Jacket / collar block -->
    <path d="M190 285
             C201 288 210 291 216 296
             C221 300 226 307 229 314
             C234 325 237 337 239 353
             C240 360 241 368 242 375
             C231 372 221 368 213 364
             C206 360 200 356 196 352
             C191 347 188 341 186 334
             C184 326 184 317 186 309
             C187 301 189 292 190 285
             Z"
