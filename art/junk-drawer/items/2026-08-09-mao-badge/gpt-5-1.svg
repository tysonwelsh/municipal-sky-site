             C189 236 186 227 185 217
             C184 203 187 191 194 179
             C203 164 216 153 234 145
             C248 139 264 135 282 135
             C299 135 314 139 327 146
             C338 152 347 160 354 170
             C361 181 366 193 368 206
             C355 191 341 181 325 174
             C307 167 289 165 272 166
             C255 168 240 173 227 181
             C214 189 204 199 195 212
