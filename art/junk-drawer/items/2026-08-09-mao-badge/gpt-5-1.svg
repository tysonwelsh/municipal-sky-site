      <path d="M283 210
               C290 210 296 211 300 215
               C303 218 304 221 304 224
               C304 228 302 232 298 236
               C295 239 292 241 287 242"
            stroke="url(#maoSilverShadow)" stroke-width="3.1"/>

      <!-- Upper lip and mouth -->
