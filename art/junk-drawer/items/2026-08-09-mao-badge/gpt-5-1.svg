             C285 214 292 216 296 219
             C293 216 288 213 282 212
             C276 211 270 212 265 214
             C269 213 274 213 279 214
             Z"
          fill="url(#maoSilverHighlight)" opacity="0.75"/>

    <!-- Cheek / jaw highlight -->
    <path d="M260 232
             C270 231 278 232 286 235
             C292 237 296 240 299 244
             C295 243 290 242 285 242
             C273 242 261 245 251 250
             C244 254 237 259 231 265
             C232 259 235 254 239 249
             C244 243 251 237 260 232
             Z"
          fill="url(#maoSilverHighlight)" opacity="0.75"/>

    <!-- Chin highlight -->
