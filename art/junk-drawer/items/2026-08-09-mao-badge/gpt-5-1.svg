<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="redRadial" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="40%" stop-color="#ff2020"/>
      <stop offset="100%" stop-color="#b70000"/>
    </radialGradient>
    <linearGradient id="silverOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="20%" stop-color="#d9dde4"/>
      <stop offset="50%" stop-color="#a6adb8"/>
      <stop offset="80%" stop-color="#f4f6fb"/>
      <stop offset="100%" stop-color="#808693"/>
    </linearGradient>
    <linearGradient id="silverInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#e9ecf2"/>
      <stop offset="50%" stop-color="#b6bcc7"/>
      <stop offset="85%" stop-color="#f8f9fd"/>
      <stop offset="100%" stop-color="#8c939f"/>
    </linearGradient>
    <radialGradient id="redCore" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#ff7777"/>
      <stop offset="40%" stop-color="#ff2020"/>
      <stop offset="100%" stop-color="#a30000"/>
    </radialGradient>
    <linearGradient id="sunRayGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffd8aa"/>
      <stop offset="30%" stop-color="#ffb85c"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="maoSilverMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#f1f3f7"/>
      <stop offset="40%" stop-color="#cfd4df"/>
      <stop offset="70%" stop-color="#a0a8b5"/>
      <stop offset="100%" stop-color="#757c88"/>
    </linearGradient>
    <linearGradient id="maoSilverShadow" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f8fb" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#c3c8d3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5b616d"/>
    </linearGradient>
    <linearGradient id="maoSilverHighlight" x1="0%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#e3e6ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#9ea4b0" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="emboss" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="1.8" result="offsetBlur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="1.1" specularExponent="20" lighting-color="#ffffff" result="specOut">
        <fePointLight x="-120" y="-80" z="200"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="arithmetic" k2="1" k3="-0.7" result="litPaint"/>
      <feComposite in="litPaint" in2="specOut2" operator="arithmetic" k2="1" k3="1" result="embossOut"/>
    </filter>
  </defs>

  <!-- Outer badge shape with faux silver border -->
  <g>
    <circle cx="256" cy="256" r="252" fill="url(#silverOuter)"/>
    <circle cx="256" cy="256" r="236" fill="url(#silverInner)"/>
    <circle cx="256" cy="256" r="224" fill="url(#redRadial)"/>
  </g>

  <!-- Sunburst rays -->
  <g transform="translate(256 256)">
    <g fill="url(#sunRayGrad)" opacity="0.95">
      <!-- 24 rays -->
      <g>
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(15)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(30)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(45)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(60)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(75)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(90)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(105)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(120)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(135)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(150)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(165)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(180)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(195)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(210)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(225)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(240)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(255)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(270)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(285)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(300)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(315)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(330)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
      <g transform="rotate(345)">
        <polygon points="0,-216 11,-140 -11,-140"/>
      </g>
    </g>
  </g>

  <!-- Red core circle over rays for clean edge -->
  <circle cx="256" cy="256" r="188" fill="url(#redCore)"/>

  <!-- Mao head profile relief -->
  <g transform="translate(0,8)">
    <!-- Shadow base for depth -->
    <path d="M188 356
             C210 350 222 339 228 330
             C205 322 193 307 190 291
             C186 273 189 259 195 248
             C182 240 174 225 173 209
             C171 186 177 168 189 154
             C205 135 230 125 259 123
             C281 121 301 124 318 131
             C336 139 350 151 359 167
             C370 186 375 208 375 234
             C375 251 371 269 363 287
             C355 305 343 320 329 332
             C332 337 334 343 336 349
             C339 359 339 370 335 377
             C331 385 322 391 309 394
             C287 400 251 399 223 392
             C206 388 194 382 188 376
             Z"
          fill="url(#maoSilverShadow)" opacity="0.85"/>

    <!-- Main silver head silhouette -->
    <path d="M184 350
             C203 346 216 338 225 328
             C205 320 194 305 191 289
             C188 272 193 258 199 247
             C185 238 176 223 175 209
             C173 185 180 164 195 148
             C213 129 239 119 268 117
             C292 115 313 120 332 130
             C351 140 365 154 375 172
             C385 192 389 213 387 236
             C386 255 379 276 369 293
             C361 307 351 319 339 328
             C343 336 346 347 347 356
             C348 364 347 374 343 381
             C338 389 329 396 315 399
             C285 407 245 404 217 397
             C199 392 190 387 184 380
             Z"
          fill="url(#maoSilverMain)" filter="url(#emboss)"/>

    <!-- Facial features and internal relief lines -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
