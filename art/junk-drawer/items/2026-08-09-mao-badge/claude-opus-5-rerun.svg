      <stop offset="0%" stop-color="#f0343a"/>
      <stop offset="55%" stop-color="#d31a22"/>
      <stop offset="100%" stop-color="#8e0d14"/>
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#e6eaee"/>
      <stop offset="38%" stop-color="#9ba4ac"/>
      <stop offset="52%" stop-color="#f2f5f7"/>
      <stop offset="70%" stop-color="#8f979f"/>
      <stop offset="88%" stop-color="#d9dee2"/>
      <stop offset="100%" stop-color="#7d858c"/>
