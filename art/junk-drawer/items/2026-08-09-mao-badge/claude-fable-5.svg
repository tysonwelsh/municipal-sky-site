<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Chairman Mao enamel pin badge</title>
  <defs>
    <linearGradient id="silverRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#d5dae1"/>
      <stop offset="0.55" stop-color="#9aa1ac"/>
      <stop offset="0.8" stop-color="#676e7a"/>
      <stop offset="1" stop-color="#4c525d"/>
    </linearGradient>
    <linearGradient id="silverRimInv" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.4" stop-color="#c3c9d1"/>
      <stop offset="0.75" stop-color="#8d94a0"/>
      <stop offset="1" stop-color="#5c636f"/>
    </linearGradient>
    <linearGradient id="silverBust" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#e2e6ec"/>
      <stop offset="0.6" stop-color="#b4bac4"/>
      <stop offset="0.85" stop-color="#838a96"/>
      <stop offset="1" stop-color="#6a7280"/>
    </linearGradient>
    <linearGradient id="silverHair" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#d8dce2"/>
      <stop offset="0.45" stop-color="#a7adb8"/>
      <stop offset="0.75" stop-color="#767d89"/>
      <stop offset="1" stop-color="#5a616d"/>
    </linearGradient>
    <radialGradient id="redGrad" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#ff6a52"/>
      <stop offset="0.45" stop-color="#ee3322"/>
      <stop offset="0.78" stop-color="#c41a0c"/>
      <stop offset="1" stop-color="#93100a"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#ffb945" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb945" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="inner">
      <circle cx="256" cy="256" r="226"/>
    </clipPath>
    <path id="ray" d="M 0 0 L -36 -300 L 36 -300 Z"/>
    <path id="bust" d="M 262 116
      C 230 118 210 132 202 152
      C 197 168 196 184 197 202
      C 198 210 193 214 195 220
      C 197 230 190 240 178 250
      C 171 255 172 259 181 261
      C 185 263 183 266 181 269
      C 180 272 184 274 181 277
      C 179 281 185 283 184 288
      C 183 293 186 297 190 302
      C 197 311 206 317 214 323
      C 217 333 215 345 208 355
      C 199 362 191 374 187 396
      C 185 408 184 418 184 428
      L 358 428
      C 359 400 351 375 334 360
      C 324 348 318 336 318 322
      C 319 303 322 285 322 264
      C 340 240 344 200 332 168
      C 320 138 296 118 262 116 Z"/>
  </defs>

  <!-- faux silver rim -->
  <circle cx="256" cy="256" r="254" fill="url(#silverRim)"/>
  <circle cx="256" cy="256" r="238" fill="url(#silverRimInv)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#454b56" stroke-width="3" opacity="0.55"/>

  <!-- red enamel field -->
  <circle cx="256" cy="256" r="227" fill="url(#redGrad)"/>

  <!-- sunburst -->
  <g clip-path="url(#inner)">
    <circle cx="256" cy="300" r="170" fill="url(#glow)"/>
    <g transform="translate(256,306)" fill="#ffab3a" opacity="0.5">
      <use href="#ray"/>
      <use href="#ray" transform="rotate(30)"/>
      <use href="#ray" transform="rotate(60)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(120)"/>
      <use href="#ray" transform="rotate(150)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(210)"/>
      <use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(300)"/>
      <use href="#ray" transform="rotate(330)"/>
    </g>
  </g>

  <!-- relief shadow -->
  <g clip-path="url(#inner)">
    <use href="#bust" transform="translate(6,7)" fill="#8b0e04" opacity="0.55"/>

    <!-- silver bust -->
    <use href="#bust" fill="url(#silverBust)" stroke="#646b77" stroke-width="2.5"/>

    <!-- hair mass -->
    <path d="M 204 150
      C 211 133 231 118 262 116
      C 296 118 320 138 332 168
      C 344 200 340 240 322 264
      C 322 285 319 303 318 318
      C 309 300 302 283 298 266
      C 295 251 293 240 288 231
      C 268 219 238 186 220 165
      C 214 158 209 154 204 150 Z" fill="url(#silverHair)" stroke="#5a616d" stroke-width="1.5"/>
    <g fill="none" stroke="#4f5561" stroke-width="3" stroke-linecap="round" opacity="0.45">
      <path d="M 214 150 C 236 148 268 158 290 182"/>
      <path d="M 224 137 C 252 131 286 146 310 176"/>
      <path d="M 242 124 C 272 122 302 142 320 174"/>
      <path d="M 299 240 C 306 260 311 280 313 300"/>
    </g>

    <!-- ear -->
    <path d="M 285 240 C 296 234 303 243 299 256 C 296 267 288 273 282 268 C 277 262 278 249 285 240 Z" fill="#c6cbd3" stroke="#5d6470" stroke-width="2.5"/>
    <path d="M 291 246 C 294 250 293 257 289 261" fill="none" stroke="#5d6470" stroke-width="2" stroke-linecap="round"/>

    <!-- face details -->
    <g fill="none" stroke="#5d6470" stroke-linecap="round">
      <path d="M 201 210 C 209 205 219 205 227 209" stroke-width="4"/>
      <path d="M 205 224 C 211 221 219 221 225 224" stroke-width="3"/>
      <path d="M 196 262 C 204 268 208 276 208 284" stroke-width="3" opacity="0.6"/>
      <path d="M 181 276 C 189 274 197 275 203 278" stroke-width="3.5"/>
      <path d="M 214 322 C 224 313 231 301 235 288" stroke-width="3" opacity="0.4"/>
    </g>
    <ellipse cx="187" cy="257" rx="4" ry="3" fill="#5d6470" opacity="0.85"/>
    <circle cx="193" cy="292" r="3" fill="#5d6470" opacity="0.8"/>

    <!-- Mao suit collar -->
    <path d="M 206 358 C 240 348 290 346 318 356 L 326 374 C 292 362 240 364 200 376 Z" fill="#b9bec7" stroke="#5d6470" stroke-width="2"/>
    <path d="M 202 372 C 196 390 193 408 193 428" fill="none" stroke="#5d6470" stroke-width="2" opacity="0.6"/>
    <path d="M 322 366 C 332 382 338 402 340 428" fill="none" stroke="#5d6470" stroke-width="2" opacity="0.45"/>
    <circle cx="198" cy="396" r="4" fill="#d8dce2" stroke="#5d6470" stroke-width="1.5"/>
    <circle cx="195" cy="416" r="4" fill="#d8dce2" stroke="#5d6470" stroke-width="1.5"/>

    <!-- enamel gloss -->
    <ellipse cx="236" cy="122" rx="200" ry="88" fill="#ffffff" opacity="0.15"/>
    <path d="M 66 180 A 220 220 0 0 1 256 36" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- rim sparkle -->
  <path d="M 96 128 A 246 246 0 0 1 232 24" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
</svg>