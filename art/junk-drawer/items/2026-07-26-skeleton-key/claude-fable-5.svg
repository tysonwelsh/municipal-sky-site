<svg xmlns="http://www.w3.org/2000/svg" viewBox="34.5 32.0 157.8 405.3">
  <defs>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#4a3512" stroke-width="0.7"/>
    </pattern>
    <pattern id="crosshatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#7a5a22" stroke-width="0.6"/>
    </pattern>
    <mask id="bow-mask">
      <rect x="0" y="0" width="240" height="480" fill="black"/>
      <circle cx="120" cy="96" r="62" fill="white"/>
      <circle cx="120" cy="76" r="17" fill="black"/>
      <circle cx="102" cy="106" r="17" fill="black"/>
      <circle cx="138" cy="106" r="17" fill="black"/>
    </mask>
  </defs>
  <g transform="rotate(-8 120 240)">
    <!-- bow with clover-shaped cutout -->
    <circle cx="120" cy="96" r="62" fill="#b3873a" mask="url(#bow-mask)"/>
    <circle cx="120" cy="96" r="62" fill="url(#hatch)" opacity="0.35" mask="url(#bow-mask)"/>
    <circle cx="120" cy="96" r="62" fill="none" stroke="#4a3512" stroke-width="2.5"/>
    <circle cx="120" cy="76" r="17" fill="none" stroke="#4a3512" stroke-width="2"/>
    <circle cx="102" cy="106" r="17" fill="none" stroke="#4a3512" stroke-width="2"/>
    <circle cx="138" cy="106" r="17" fill="none" stroke="#4a3512" stroke-width="2"/>
    <path d="M66 62 A62 62 0 0 1 120 34" fill="none" stroke="#d9b25f" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- collar rings -->
    <rect x="101" y="156" width="38" height="9" rx="4.5" fill="#b3873a" stroke="#4a3512" stroke-width="2"/>
    <rect x="106" y="167" width="28" height="7" rx="3.5" fill="#b3873a" stroke="#4a3512" stroke-width="2"/>
    <!-- stem -->
    <rect x="112" y="174" width="16" height="196" rx="7" fill="#b3873a" stroke="#4a3512" stroke-width="2.5"/>
    <rect x="112" y="174" width="16" height="196" rx="7" fill="url(#crosshatch)" opacity="0.4"/>
    <line x1="116" y1="182" x2="116" y2="362" stroke="#d9b25f" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="125" y1="182" x2="125" y2="362" stroke="#7a5a22" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- tip ferrule -->
    <rect x="107" y="366" width="26" height="16" rx="5" fill="#b3873a" stroke="#4a3512" stroke-width="2.5"/>
    <!-- bit with notched teeth -->
    <path d="M120 388 h46 v22 h-14 v10 h-9 v16 h-23 z" fill="#b3873a" stroke="#4a3512" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M120 388 h46 v22 h-14 v10 h-9 v16 h-23 z" fill="url(#hatch)" opacity="0.35"/>
    <line x1="126" y1="394" x2="158" y2="394" stroke="#d9b25f" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- edge shading -->
    <line x1="127" y1="184" x2="127" y2="360" stroke="#4a3512" stroke-width="1" opacity="0.35"/>
    <path d="M158 66 A62 62 0 0 1 176 110" fill="none" stroke="#7a5a22" stroke-width="5" opacity="0.5"/>
  </g>
</svg>
