    <line x1="120" y1="80" x2="280" y2="80" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Texture/Details -->
  <path d="M 75 140 C 90 135 100 120 110 115" stroke="#cebca0" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 325 140 C 310 135 300 120 290 115" stroke="#cebca0" stroke-width="4" stroke-linecap="round" fill="none" />
