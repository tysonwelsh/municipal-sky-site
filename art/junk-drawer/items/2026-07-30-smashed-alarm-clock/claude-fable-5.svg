<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- outer pop burst -->
  <polygon points="790,400 603,454 703,575 556,556 598,742 453,598 400,788 344,608 210,729 259,541 101,573 183,458 10,400 197,346 93,223 244,244 208,67 347,202 400,12 456,192 598,58 541,259 712,220 617,342" fill="#FFD500" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>
  <!-- inner accent burst -->
  <polygon points="642,400 526,433 588,508 497,497 523,612 433,523 400,640 365,529 282,604 313,487 215,507 265,436 158,400 274,367 210,290 303,303 281,194 367,277 400,160 435,271 523,188 487,313 593,288 535,364" fill="#FF8A00" stroke="#111111" stroke-width="6" stroke-linejoin="round"/>

  <!-- impact speed lines -->
  <g stroke="#111111" stroke-linecap="round" fill="none">
    <path d="M 425 160 L 425 85" stroke-width="10"/>
    <path d="M 350 168 L 315 100" stroke-width="9"/>
    <path d="M 495 165 L 530 95" stroke-width="9"/>
    <path d="M 520 60 L 556 76" stroke-width="6"/>
    <path d="M 505 96 L 546 104" stroke-width="6"/>
  </g>

  <!-- legs (behind body) -->
  <g stroke="#111111" stroke-linecap="round" fill="none">
    <path d="M 305 635 L 250 745" stroke-width="18"/>
    <path d="M 495 635 L 545 705 L 610 690" stroke-width="18"/>
  </g>
  <ellipse cx="243" cy="752" rx="21" ry="14" fill="#FFD500" stroke="#111111" stroke-width="6"/>
  <ellipse cx="620" cy="690" rx="21" ry="14" fill="#FFD500" stroke="#111111" stroke-width="6" transform="rotate(12 620 690)"/>

  <!-- left bell, tilted but attached -->
  <g transform="rotate(-15 270 225)">
    <path d="M 212 225 A 58 58 0 0 1 328 225 Z" fill="#00A3E0" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>
    <rect x="204" y="221" width="132" height="12" fill="#111111"/>
    <circle cx="270" cy="158" r="10" fill="#FFD500" stroke="#111111" stroke-width="6"/>
  </g>

  <!-- bent hammer stalk -->
  <path d="M 430 245 L 452 200 L 486 190" fill="none" stroke="#111111" stroke-width="9" stroke-linecap="round"/>
  <circle cx="494" cy="187" r="11" fill="#111111"/>

  <!-- clock body with caved-in top -->
  <path d="M 175 430
           A 225 225 0 0 1 262 253
           L 300 233
           L 330 300 L 355 255 L 390 330 L 415 262 L 448 315 L 470 250 L 500 300 L 525 245
           L 552 262
           A 225 225 0 0 1 625 430
           A 225 225 0 0 1 175 430 Z"
        fill="#E4002B" stroke="#111111" stroke-width="10" stroke-linejoin="round"/>
  <!-- crush shading under dent -->
  <path d="M 300 240 L 330 305 L 355 262 L 390 335 L 415 270 L 448 320 L 470 258 L 500 305 L 525 252 L 545 268 L 520 300 L 470 330 L 420 342 L 370 336 L 325 320 Z" fill="#A50017"/>

  <!-- shattered face, rim crushed into it -->
  <path d="M 240 455
           A 160 160 0 0 0 560 455
           L 545 400 L 505 365 L 520 330 L 470 350 L 455 305 L 420 355 L 390 315 L 370 360 L 330 330 L 320 375 L 275 355 L 285 400 L 250 420 Z"
        fill="#FFFFFF" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>

  <!-- ticks -->
  <g stroke="#111111" stroke-width="6" stroke-linecap="round">
    <line x1="517" y1="388" x2="500" y2="398"/>
    <line x1="517" y1="522" x2="500" y2="512"/>
    <line x1="467" y1="572" x2="458" y2="555"/>
    <line x1="333" y1="572" x2="343" y2="555"/>
    <line x1="283" y1="522" x2="300" y2="512"/>
    <line x1="283" y1="388" x2="300" y2="398"/>
  </g>

  <!-- numerals -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="46" fill="#111111" text-anchor="middle">
    <text x="400" y="380" transform="rotate(-14 400 368)">12</text>
    <text x="512" y="471">3</text>
    <text x="400" y="583">6</text>
    <text x="288" y="471">9</text>
    <text x="450" y="560" font-size="40" transform="rotate(70 450 545)">4</text>
  </g>

  <!-- cracks radiating from impact -->
  <g stroke="#111111" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 428 335 L 414 392 L 442 432 L 424 492 L 449 540 L 436 588" stroke-width="6"/>
    <path d="M 432 337 L 482 378 L 532 398 L 557 445" stroke-width="5"/>
    <path d="M 425 338 L 372 380 L 334 424 L 305 482" stroke-width="5"/>
    <path d="M 430 340 L 456 418 L 452 468" stroke-width="4"/>
    <path d="M 414 392 L 372 380" stroke-width="3"/>
    <path d="M 442 432 L 456 418" stroke-width="3"/>
  </g>

  <!-- bent hands -->
  <path d="M 393 458 L 397 385 L 428 342 L 441 351 L 411 393 L 409 458 Z" fill="#111111"/>
  <path d="M 397 446 L 328 468 L 332 484 L 400 466 Z" fill="#111111"/>
  <path d="M 402 457 L 448 502" stroke="#E4002B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 468 522 L 500 552" stroke="#E4002B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="400" cy="457" r="14" fill="#111111"/>
  <circle cx="400" cy="457" r="6" fill="#FFD500"/>

  <!-- side crack and escaping mainspring -->
  <path d="M 192 372 L 212 352 L 202 332 L 220 316" fill="none" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  <path d="M 192 372 Q 150 378 135 338 Q 118 295 155 285 Q 190 277 185 315 Q 182 340 158 333" fill="none" stroke="#111111" stroke-width="13" stroke-linecap="round"/>
  <path d="M 192 372 Q 150 378 135 338 Q 118 295 155 285 Q 190 277 185 315 Q 182 340 158 333" fill="none" stroke="#00A3E0" stroke-width="5" stroke-linecap="round"/>

  <!-- flying bell, dented, knocked clean off -->
  <g transform="translate(608 108) rotate(38)">
    <path d="M -52 12 A 52 52 0 0 1 52 12 L 34 22 L 12 10 L -14 24 L -34 12 Z" fill="#00A3E0" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <circle cx="668" cy="52" r="9" fill="#FFD500" stroke="#111111" stroke-width="6"/>

  <!-- flying gears -->
  <g transform="translate(655 610)">
    <g fill="#FFD500" stroke="#111111" stroke-width="5">
      <rect x="-6" y="-40" width="12" height="16"/>
      <rect x="-6" y="-40" width="12" height="16" transform="rotate(45)"/>
      <rect x="-6" y="-40" width="12" height="16" transform="rotate(90)"/>
      <rect x="-6" y="-40" width="12" height="16" transform="rotate(135)"/>
      <rect x="-6" y="-40" width="12" height="16" transform="rotate(180)"/>
      <rect x="-6" y="-40" width="12" height="16" transform="rotate(225)"/>
      <rect x="-6" y="-40" width="12" height="16" transform="rotate(270)"/>
      <rect x="-6" y="-40" width="12" height="16" transform="rotate(315)"/>
    </g>
    <circle r="30" fill="#FFD500" stroke="#111111" stroke-width="6"/>
    <circle r="9" fill="none" stroke="#111111" stroke-width="6"/>
  </g>
  <g transform="translate(140 155)">
    <g fill="#FF8A00" stroke="#111111" stroke-width="5">
      <rect x="-5" y="-33" width="10" height="13"/>
      <rect x="-5" y="-33" width="10" height="13" transform="rotate(45)"/>
      <rect x="-5" y="-33" width="10" height="13" transform="rotate(90)"/>
      <rect x="-5" y="-33" width="10" height="13" transform="rotate(135)"/>
      <rect x="-5" y="-33" width="10" height="13" transform="rotate(180)"/>
      <rect x="-5" y="-33" width="10" height="13" transform="rotate(225)"/>
      <rect x="-5" y="-33" width="10" height="13" transform="rotate(270)"/>
      <rect x="-5" y="-33" width="10" height="13" transform="rotate(315)"/>
    </g>
    <circle r="24" fill="#FF8A00" stroke="#111111" stroke-width="6"/>
    <circle r="7" fill="none" stroke="#111111" stroke-width="5"/>
  </g>
  <g transform="translate(700 268) rotate(22)">
    <g fill="#00A3E0" stroke="#111111" stroke-width="4">
      <rect x="-4" y="-29" width="8" height="11"/>
      <rect x="-4" y="-29" width="8" height="11" transform="rotate(45)"/>
      <rect x="-4" y="-29" width="8" height="11" transform="rotate(90)"/>
      <rect x="-4" y="-29" width="8" height="11" transform="rotate(135)"/>
      <rect x="-4" y="-29" width="8" height="11" transform="rotate(180)"/>
      <rect x="-4" y="-29" width="8" height="11" transform="rotate(225)"/>
      <rect x="-4" y="-29" width="8" height="11" transform="rotate(270)"/>
      <rect x="-4" y="-29" width="8" height="11" transform="rotate(315)"/>
    </g>
    <circle r="21" fill="#00A3E0" stroke="#111111" stroke-width="5"/>
    <circle r="6" fill="none" stroke="#111111" stroke-width="4"/>
  </g>

  <!-- fallen winding key -->
  <g transform="translate(168 655) rotate(-32)">
    <rect x="-6" y="-8" width="12" height="52" fill="#FFD500" stroke="#111111" stroke-width="5"/>
    <rect x="-16" y="40" width="32" height="9" fill="#FFD500" stroke="#111111" stroke-width="5"/>
    <circle cx="-16" cy="-22" r="15" fill="#FFD500" stroke="#111111" stroke-width="5"/>
    <circle cx="16" cy="-22" r="15" fill="#FFD500" stroke="#111111" stroke-width="5"/>
    <circle cx="0" cy="-22" r="5" fill="#111111"/>
  </g>

  <!-- flying glass shards -->
  <g fill="#CFF3FF" stroke="#111111" stroke-width="5" stroke-linejoin="round">
    <polygon points="555,175 585,205 545,215"/>
    <polygon points="300,120 325,150 285,155"/>
    <polygon points="478,88 498,118 463,123"/>
  </g>

  <!-- impact sparks -->
  <polygon points="505,190 513,217 540,225 513,233 505,260 497,233 470,225 497,217" fill="#FFFFFF" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  <polygon points="322,172 328,190 346,196 328,202 322,220 316,202 298,196 316,190" fill="#FFFFFF" stroke="#111111" stroke-width="4" stroke-linejoin="round"/>

  <!-- loose screws -->
  <g fill="#FFD500" stroke="#111111" stroke-width="5">
    <circle cx="350" cy="732" r="10"/>
    <circle cx="470" cy="745" r="10"/>
  </g>
  <line x1="343" y1="728" x2="357" y2="736" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <line x1="464" y1="749" x2="476" y2="741" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
</svg>
