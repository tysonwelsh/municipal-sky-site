<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ariel Ambient Preview — Prospero's Jukebox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=Cinzel+Decorative:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #0a0a0a;
        color: #66bbdd;
        font-family: "VT323", monospace;
        margin: 0;
        padding: 32px 20px 60px;
        min-height: 100vh;
      }
      .container {
        max-width: 780px;
        margin: 0 auto;
        position: relative;
      }
      .container::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 2px,
          rgba(0, 0, 0, 0.08) 2px,
          rgba(0, 0, 0, 0.08) 4px
        );
        z-index: 10;
      }
      h1 {
        font-family: "Cinzel Decorative", serif;
        color: #96dcff;
        text-align: center;
        letter-spacing: 2px;
        margin: 0 0 4px;
        font-size: 28px;
        font-weight: 700;
        text-shadow:
          0 0 12px rgba(150, 220, 255, 0.5),
          0 0 30px rgba(150, 220, 255, 0.15);
      }
      .subtitle {
        text-align: center;
        color: #335577;
        letter-spacing: 3px;
        margin: 0 0 28px;
        font-size: 18px;
      }

      .transport {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: #0d0d14;
        border: 2px solid #1a1a2a;
        border-radius: 4px;
        margin-bottom: 22px;
      }
      .vol-label {
        font-size: 14px;
        letter-spacing: 1px;
        color: #335577;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        background: #1a1a2a;
        border-radius: 3px;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        background: #96dcff;
        box-shadow: 0 0 6px rgba(150, 220, 255, 0.3);
        cursor: pointer;
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        background: #96dcff;
        border: none;
        box-shadow: 0 0 6px rgba(150, 220, 255, 0.3);
        cursor: pointer;
      }

      .transport input[type="range"] {
        flex: 1;
      }

      .transport-btn {
        font-family: "VT323", monospace;
        font-size: 16px;
        padding: 6px 16px;
        background: #111118;
        color: #335577;
        border: 2px solid #2a2a3a;
        border-radius: 3px;
        cursor: pointer;
        letter-spacing: 1px;
      }
      .transport-btn:hover {
        border-color: #96dcff;
        color: #96dcff;
      }
      .transport-btn.random:hover {
        border-color: #ffaa66;
        color: #ffaa66;
      }

      .event-card {
        background: #0d0d14;
        border: 2px solid #1a1a2a;
        border-radius: 4px;
        padding: 16px 20px 18px;
        margin-bottom: 16px;
      }
      .event-card .card-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .event-card h2 {
        font-family: "VT323", monospace;
        color: #96dcff;
        font-size: 22px;
        letter-spacing: 2px;
        margin: 0;
      }
      .event-card .weight {
        color: #335577;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .event-card .desc {
        font-size: 15px;
        color: #5599bb;
        line-height: 1.5;
        margin: 0 0 12px;
      }
      .ctrl-row {
        display: grid;
        grid-template-columns: 95px 1fr 78px;
        align-items: center;
        gap: 12px;
        margin: 5px 0;
      }
      .ctrl-row .label {
        font-size: 14px;
        color: #5599bb;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .ctrl-row .val {
        text-align: right;
        font-size: 15px;
        color: #66bbdd;
        font-variant-numeric: tabular-nums;
      }
      .ctrl-row input[type="range"] {
        width: 100%;
      }

      .card-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }
      .btn {
        font-family: "VT323", monospace;
        font-size: 16px;
        padding: 6px 18px;
        background: #111118;
        color: #335577;
        border: 2px solid #2a2a3a;
        border-radius: 3px;
        cursor: pointer;
        letter-spacing: 1px;
        transition: all 0.15s;
      }
      .btn:hover {
        border-color: #96dcff;
        color: #96dcff;
      }
      .btn.reset:hover {
        border-color: #ffaa66;
        color: #ffaa66;
      }
      .btn.copy:hover {
        border-color: #ffcc66;
        color: #ffcc66;
      }
      .btn.copy.copied {
        border-color: #66dd66;
        color: #66dd66;
      }

      .footnote {
        color: #224455;
        font-size: 14px;
        text-align: center;
        margin-top: 28px;
        letter-spacing: 1px;
      }

      /* --- Brainstorm section: visually distinct from committed events --- */
      .section-divider {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 36px 0 18px;
      }
      .section-divider::before,
      .section-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: repeating-linear-gradient(
          to right,
          #2a2a3a 0,
          #2a2a3a 4px,
          transparent 4px,
          transparent 8px
        );
      }
      .section-divider h2 {
        font-family: "Cinzel Decorative", serif;
        color: #ffaa66;
        letter-spacing: 3px;
        font-size: 18px;
        margin: 0;
        font-weight: 700;
        text-shadow: 0 0 8px rgba(255, 170, 102, 0.3);
      }
      .section-note {
        text-align: center;
        color: #664433;
        font-size: 14px;
        letter-spacing: 1px;
        margin: 0 0 18px;
      }
      .event-card.brainstorm {
        border-color: #3a2a1d;
        border-style: dashed;
      }
      .event-card.brainstorm h2 {
        color: #ffaa66;
      }
      .event-card.brainstorm .weight {
        color: #664433;
      }
      .transport-btn.brainstorm:hover {
        border-color: #ffaa66;
        color: #ffaa66;
      }

      /* --- Dual-thumb range slider (for params declared with range: true) --- */
      .range-slider {
        position: relative;
        width: 100%;
        height: 18px;
      }
      .range-slider .track {
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 6px;
        margin-top: -3px;
        background: #1a1a2a;
        border-radius: 3px;
        pointer-events: none;
      }
      .range-slider .fill {
        position: absolute;
        top: 0;
        bottom: 0;
        background: rgba(150, 220, 255, 0.55);
        border-radius: 3px;
      }
      .range-slider input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 18px;
        background: transparent;
        margin: 0;
        pointer-events: none;
      }
      .range-slider input[type="range"]::-webkit-slider-runnable-track {
        background: transparent;
        height: 6px;
      }
      .range-slider input[type="range"]::-moz-range-track {
        background: transparent;
        height: 6px;
      }
      .range-slider input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        pointer-events: auto;
        width: 14px;
        height: 14px;
        margin-top: -4px;
        border-radius: 50%;
        background: #96dcff;
        cursor: pointer;
        box-shadow: 0 0 6px rgba(150, 220, 255, 0.5);
      }
      .range-slider input[type="range"]::-moz-range-thumb {
        pointer-events: auto;
        width: 14px;
        height: 14px;
        border: none;
        border-radius: 50%;
        background: #96dcff;
        cursor: pointer;
        box-shadow: 0 0 6px rgba(150, 220, 255, 0.5);
      }
      /* Brainstorm cards use the sage-green accent — match thumbs + fill */
      .event-card.brainstorm .range-slider .fill {
        background: rgba(255, 170, 102, 0.55);
      }
      .event-card.brainstorm .range-slider input[type="range"]::-webkit-slider-thumb {
        background: #ffaa66;
        box-shadow: 0 0 6px rgba(255, 170, 102, 0.5);
      }
      .event-card.brainstorm .range-slider input[type="range"]::-moz-range-thumb {
        background: #ffaa66;
        box-shadow: 0 0 6px rgba(255, 170, 102, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Ariel Ambient Preview</h1>
      <p class="subtitle">~ airy chance events for Ariel's day off ~</p>

      <div class="transport">
        <span class="vol-label">MASTER</span>
        <input type="range" id="vol" min="0" max="100" value="60" />
        <button
          class="transport-btn"
          id="test-btn"
          title="Plays a 440Hz sine to verify audio routing"
        >
          &#9835; TEST
        </button>
        <button class="transport-btn random" id="random-btn">
          &#9862; RANDOM EVENT
        </button>
        <button class="transport-btn brainstorm" id="random-brainstorm-btn">
          &#9862; RANDOM BRAINSTORM
        </button>
        <button class="transport-btn" id="copy-all-btn" title="Copy every event's current parameters to the clipboard">
          &#9112; COPY ALL PARAMS
        </button>
      </div>

      <div id="events"></div>

      <div class="section-divider"><h2>BRAINSTORM</h2></div>
      <p class="section-note">~ work-in-progress ideas for new dark ambient events ~</p>
      <div id="brainstorm"></div>

      <p class="footnote">
        F LYDIAN &middot; BRIGHT AIRY REVERB &middot; EACH PLAY USES
        A FRESH STEREO PAN
      </p>
    </div>

    <script>
      (function () {
        "use strict";

        // --- Audio graph ---
        var ctx, masterGain, compressor;
        var reverbSend, reverbDry, reverbWet, reverbConv, reverbPreDelay;
        var sharedNoiseBuf;
        var NOISE_BUF_DURATION = 30;
        // Preview master is louder than production (0.12) because single events are
        // quiet in isolation without the drone/whisper bed under them.
        var masterVol = 0.6;

        function buildReverbIR() {
          // Ariel: bright airy space — moderate decay, fast HF damping, short pre-delay
          var decay = 3.0,
            hfDamp = 6.0;
          var irLen = ctx.sampleRate * decay;
          var buf = ctx.createBuffer(2, irLen, ctx.sampleRate);
          for (var ch = 0; ch < 2; ch++) {
            var d = buf.getChannelData(ch);
            for (var i = 0; i < irLen; i++) {
              var t = i / ctx.sampleRate;
              var env = Math.exp((-3.0 * t) / decay);
              var hf = Math.exp((-hfDamp * t) / decay);
              d[i] = (Math.random() * 2 - 1) * env * hf;
            }
          }
          reverbConv.buffer = buf;
          reverbPreDelay.delayTime.setValueAtTime(0.015, ctx.currentTime);
          reverbWet.gain.setValueAtTime(0.35, ctx.currentTime);
        }

        function initAudio() {
          if (ctx) return;
          ctx = new (window.AudioContext || window.webkitAudioContext)();

          masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(masterVol, ctx.currentTime);

          compressor = ctx.createDynamicsCompressor();
          compressor.threshold.setValueAtTime(-24, ctx.currentTime);
          compressor.knee.setValueAtTime(12, ctx.currentTime);
          compressor.ratio.setValueAtTime(4, ctx.currentTime);
          compressor.attack.setValueAtTime(0.01, ctx.currentTime);
          compressor.release.setValueAtTime(0.15, ctx.currentTime);

          reverbSend = ctx.createGain();
          reverbDry = ctx.createGain();
          reverbWet = ctx.createGain();
          reverbConv = ctx.createConvolver();
          reverbPreDelay = ctx.createDelay(0.1);
          reverbSend.connect(reverbDry);
          reverbSend.connect(reverbPreDelay);
          reverbPreDelay.connect(reverbConv);
          reverbConv.connect(reverbWet);
          reverbDry.connect(masterGain);
          reverbWet.connect(masterGain);
          masterGain.connect(compressor);
          compressor.connect(ctx.destination);

          buildReverbIR();

          var noiseSamples = ctx.sampleRate * NOISE_BUF_DURATION;
          sharedNoiseBuf = ctx.createBuffer(1, noiseSamples, ctx.sampleRate);
          var d = sharedNoiseBuf.getChannelData(0);
          for (var i = 0; i < noiseSamples; i++) d[i] = Math.random() * 2 - 1;
        }

        function noiseSource(duration) {
          var n = ctx.createBufferSource();
          n.buffer = sharedNoiseBuf;
          n._offset =
            Math.random() * Math.max(0, NOISE_BUF_DURATION - duration);
          n._duration = duration;
          return n;
        }
        function startNoise(n, when) {
          n.start(when, n._offset, n._duration);
        }

        function panner() {
          var p = ctx.createStereoPanner();
          p.pan.setValueAtTime((Math.random() * 2 - 1) * 0.7, ctx.currentTime);
          p.connect(reverbSend);
          return p;
        }

        // ==========================================================================
        // F LYDIAN SNAP — used by tonal events that need to sit in the key.
        // Ariel's song is in F Lydian (F G A B C D E) with a breeze drone on
        // F·G·A·B fifths/tritone. Events with sustained sine/sawtooth content
        // (wind chime, bumble bee, bubble pop) snap their fundamental(s) to the
        // nearest scale tone so they don't clash with the drone.
        // ==========================================================================
        var F_LYDIAN_HZ = [
          // F2..B7 (six octaves; covers everything useful)
          87.31, 98, 110, 123.47, 130.81, 146.83, 164.81,
          174.61, 196, 220, 246.94, 261.63, 293.66, 329.63,
          349.23, 392, 440, 493.88, 523.25, 587.33, 659.26,
          698.46, 783.99, 880, 987.77, 1046.5, 1174.66, 1318.51,
          1396.91, 1567.98, 1760, 1975.53, 2093, 2349.32, 2637.02,
          2793.83, 3135.96, 3520, 3951.07,
        ];
        function snapToScale(hz) {
          var best = F_LYDIAN_HZ[0];
          var bestDiff = Math.abs(hz - best);
          for (var i = 1; i < F_LYDIAN_HZ.length; i++) {
            var d = Math.abs(hz - F_LYDIAN_HZ[i]);
            if (d < bestDiff) { bestDiff = d; best = F_LYDIAN_HZ[i]; }
          }
          return best;
        }

        // ==========================================================================
        // EVENT SYNTH FUNCTIONS (parameterized)
        // ==========================================================================

        function evGiggle(p) {
          var c = ctx, now = c.currentTime, out = panner();
          var formants = [[600, 2200], [800, 1200]]; // eh, ah
          var bursts = Math.max(1, p.bursts);
          for (var i = 0; i < bursts; i++) {
            var t = now + (i / bursts) * p.duration;
            var burstDur = 0.04 + Math.random() * 0.02;
            var fm = formants[i % 2];
            var qShift = 1 + i * 0.15;
            var n = noiseSource(burstDur);
            var g = c.createGain();
            var f1 = c.createBiquadFilter();
            var f2 = c.createBiquadFilter();
            f1.type = "bandpass";
            f1.frequency.setValueAtTime(fm[0] * qShift, t);
            f1.Q.setValueAtTime(10, t);
            f2.type = "bandpass";
            f2.frequency.setValueAtTime(fm[1] * qShift, t);
            f2.Q.setValueAtTime(8, t);
            n.connect(f1); n.connect(f2);
            var mix = c.createGain();
            f1.connect(mix); f2.connect(mix);
            mix.connect(g); g.connect(out);
            // Volume peaks in middle of sequence (matches engine envelope)
            var envScale = bursts > 1 ? Math.sin(Math.PI * i / (bursts - 1)) : 1;
            var envVol = p.volume * (0.7 + 0.6 * envScale);
            g.gain.setValueAtTime(envVol, t);
            g.gain.linearRampToValueAtTime(0, t + burstDur);
            startNoise(n, t);
          }
        }

        function evBirdsong(p) {
          var c = ctx, now = c.currentTime, out = panner();
          for (var i = 0; i < p.chirps; i++) {
            var t = now + i * (0.12 + Math.random() * 0.08);
            var dur = 0.06 + Math.random() * 0.04;
            var startFreq = p.startFreq + Math.random() * 500;
            var o = c.createOscillator();
            var g = c.createGain();
            o.type = "sine";
            o.frequency.setValueAtTime(startFreq, t);
            o.frequency.exponentialRampToValueAtTime(startFreq * p.glide, t + dur);
            o.connect(g);
            g.connect(out);
            g.gain.setValueAtTime(p.volume, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            o.start(t);
            o.stop(t + dur + 0.01);
          }
        }

        function evBreezeGust(p) {
          var c = ctx, now = c.currentTime, out = panner();
          var n = noiseSource(p.duration);
          var g = c.createGain();
          var f = c.createBiquadFilter();
          f.type = "bandpass";
          f.frequency.setValueAtTime(p.startFreq, now);
          f.frequency.linearRampToValueAtTime(p.peakFreq, now + p.duration * 0.4);
          f.frequency.linearRampToValueAtTime(p.startFreq * 1.5, now + p.duration);
          f.Q.setValueAtTime(2, now);
          n.connect(f); f.connect(g); g.connect(out);
          g.gain.setValueAtTime(0, now);
          g.gain.linearRampToValueAtTime(p.volume, now + p.duration * 0.3);
          g.gain.linearRampToValueAtTime(0, now + p.duration);
          startNoise(n, now);
        }

        function evSparkle(p) {
          var c = ctx, now = c.currentTime, out = panner();
          var pings = Math.max(1, p.pings);
          var spacing = 1 / p.rate;
          for (var i = 0; i < pings; i++) {
            var t = now + i * spacing;
            var freq = p.minFreq + Math.random() * (p.maxFreq - p.minFreq);
            var decay = 0.15 + Math.random() * 0.2;
            var o = c.createOscillator();
            var g = c.createGain();
            o.type = "sine";
            o.frequency.setValueAtTime(freq, t);
            o.connect(g); g.connect(out);
            g.gain.setValueAtTime(p.volume, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + decay);
            o.start(t);
            o.stop(t + decay + 0.01);
          }
        }

        function evLeafRustle(p) {
          var c = ctx, now = c.currentTime, out = panner();
          var n = noiseSource(p.duration);
          var g = c.createGain();
          var f = c.createBiquadFilter();
          f.type = "bandpass";
          f.frequency.setValueAtTime(p.centerFreq, now);
          f.Q.setValueAtTime(5, now);
          n.connect(f); f.connect(g); g.connect(out);
          g.gain.setValueAtTime(0, now);
          g.gain.linearRampToValueAtTime(p.volume, now + p.duration * 0.3);
          g.gain.linearRampToValueAtTime(0, now + p.duration);
          startNoise(n, now);
        }

        // Cricket — hierarchical: event = N chirps, chirp = M short pulses.
        // Each pulse is a brief percussive "tic" (~15ms) at a steady pitch;
        // all pulses in a single chirp share the same carrier so the chirp
        // reads as a uniform tit-tit-tit. Outer cadence: chirps grouped at
        // `rate` Hz. Inner cadence: pulses at `chirpRate` Hz (trill rate).
        function evCricket(p) {
          var c = ctx, now = c.currentTime, out = panner();
          var chirps = Math.max(1, p.chirps);
          var pulses = Math.max(1, p.pulses);
          var chirpSpacing = 1 / p.rate;
          var pulseSpacing = 1 / p.chirpRate;
          for (var k = 0; k < chirps; k++) {
            var chirpStart = now + k * chirpSpacing;
            // Slight per-chirp variation in carrier so successive chirps feel
            // like separate crickets in space; constant within a chirp.
            var carrierFreq = p.carrier * (0.97 + Math.random() * 0.06);
            // Pulse duration is per-chirp (not per-pulse) so the tics within
            // one chirp are tonally identical.
            var pulseDur = 0.014 + Math.random() * 0.008; // 14–22ms
            for (var i = 0; i < pulses; i++) {
              var t = chirpStart + i * pulseSpacing;
              var o = c.createOscillator();
              var g = c.createGain();
              o.type = "sine";
              o.frequency.setValueAtTime(carrierFreq, t);
              o.connect(g);
              g.connect(out);
              // Sharp attack, fast exponential decay = percussive "tic"
              g.gain.setValueAtTime(0, t);
              g.gain.linearRampToValueAtTime(p.volume, t + 0.002);
              g.gain.exponentialRampToValueAtTime(0.001, t + pulseDur);
              o.start(t);
              o.stop(t + pulseDur + 0.01);
            }
          }
        }

        // ==========================================================================
        // BRAINSTORM SYNTHESIS — work-in-progress event ideas.
        // Iterate freely; promote keepers into EVENTS (below) and the engine's
        // ARIEL_AMBIENT_POOL + arielAmbient() switch in prosperos-jukebox-audio.js.
        // ==========================================================================

        // Wind chime — slow random glassy pings with inharmonic overtones,
        // longer decay than the sparkle event. Fundamental snaps to F Lydian
        // so it sits in the song's key; the 2.4×/4.5× partials stay inharmonic
        // (intentional for the glass-bell character).
        function evWindChime(p) {
          var c = ctx, now = c.currentTime, out = panner();
          var pings = Math.max(1, p.pings);
          var spacing = 1 / p.rate;
          for (var i = 0; i < pings; i++) {
            var t = now + i * spacing * (0.85 + Math.random() * 0.3);
            var rawFund = p.minFreq + Math.random() * (p.maxFreq - p.minFreq);
            var fund = snapToScale(rawFund);
            // Chime partials (close to glass): 1, 2.4, 4.5
            var partials = [
              { ratio: 1.0,  amp: 1.00, decay: p.decay },
              { ratio: 2.4,  amp: 0.5,  decay: p.decay * 0.7 },
              { ratio: 4.5,  amp: 0.25, decay: p.decay * 0.45 },
            ];
            for (var j = 0; j < partials.length; j++) {
              var pt = partials[j];
              var o = c.createOscillator();
              var g = c.createGain();
              o.type = "sine";
              o.frequency.setValueAtTime(fund * pt.ratio, t);
              o.connect(g); g.connect(out);
              g.gain.setValueAtTime(0, t);
              g.gain.linearRampToValueAtTime(p.volume * pt.amp, t + 0.005);
              g.gain.exponentialRampToValueAtTime(0.001, t + pt.decay);

        // Bumble bee — buzzy fly-by with rapid AM and a slow doppler pitch glide.
        // Base pitch snaps to F Lydian so the sawtooth's rich harmonics align
        // with the drone; the doppler glide is left continuous (a bee's pitch
        // slide isn't perceived as discrete notes).
        function evBumbleBee(p) {
          var c = ctx, now = c.currentTime, out = panner();
          var basePitch = snapToScale(p.basePitch);
          var carrier = c.createOscillator();
          var modulator = c.createOscillator();
          var modG = c.createGain();
          var g = c.createGain();
          carrier.type = "sawtooth";
          // Pitch glide: low → peak (approach) → low (departure)
          carrier.frequency.setValueAtTime(basePitch * 0.7, now);
          carrier.frequency.linearRampToValueAtTime(basePitch, now + p.duration * 0.4);
          carrier.frequency.linearRampToValueAtTime(basePitch * 0.55, now + p.duration);
          modulator.type = "sine";
          modulator.frequency.setValueAtTime(p.buzzRate, now);
          modG.gain.setValueAtTime(p.volume * 0.5, now);
          modulator.connect(modG);
          modG.connect(g.gain);
          // Soft lowpass for warmth
          var lp = c.createBiquadFilter();
          lp.type = "lowpass";
          lp.frequency.setValueAtTime(900, now);
          lp.Q.setValueAtTime(0.7, now);
          carrier.connect(lp);
          lp.connect(g);
          g.connect(out);
          g.gain.setValueAtTime(0, now);
          g.gain.linearRampToValueAtTime(p.volume, now + p.duration * 0.25);
          g.gain.linearRampToValueAtTime(p.volume * 0.6, now + p.duration * 0.75);
          g.gain.linearRampToValueAtTime(0, now + p.duration);
          carrier.start(now); carrier.stop(now + p.duration + 0.1);
          modulator.start(now); modulator.stop(now + p.duration + 0.1);
        }

        // Bubble pop — wet sine "bloop(s)" with quick upward pitch arc.
        // Both start and end pitches snap to F Lydian so each bloop lands on
        // an in-key interval. Multiple pops per event create a bubbling cluster.
        function evBubblePop(p) {
          var c = ctx, now = c.currentTime, out = panner();
          var pops = Math.max(1, p.pops);
          var spacing = 1 / p.rate;
          for (var k = 0; k < pops; k++) {
            var startT = now + k * spacing;
            // Per-pop pitch jitter so the cluster doesn't sound xeroxed.
            var raw = p.startFreq * (0.92 + Math.random() * 0.16);
            var startFreq = snapToScale(raw);
            var endFreq = snapToScale(startFreq * p.glide);
            var o = c.createOscillator();
            var g = c.createGain();
            o.type = "sine";
            o.frequency.setValueAtTime(startFreq, startT);
            o.frequency.exponentialRampToValueAtTime(endFreq, startT + p.duration * 0.7);
            o.connect(g); g.connect(out);
            g.gain.setValueAtTime(0, startT);
            g.gain.linearRampToValueAtTime(p.volume, startT + 0.008);
            g.gain.exponentialRampToValueAtTime(0.001, startT + p.duration);
            o.start(startT);
            o.stop(startT + p.duration + 0.05);
          }
        }

        // --- Range param helpers ---
        // A "range" param's value is { min, max }; at fire time we sample a
        // scalar within [min, max]. Integer step (>= 1) samples integers.
        function isRangeVal(v) {
          return v && typeof v === "object" && "min" in v && "max" in v;
        }
        function cloneVal(v) {
          return isRangeVal(v) ? { min: v.min, max: v.max } : v;
        }
        function sampleRange(r, step) {
          var v = r.min + Math.random() * (r.max - r.min);
          if (step >= 1) v = Math.floor(v + 0.5);
          return v;
        }
        function resolveParams(ev) {
          var byParam = {};
          for (var i = 0; i < ev.controls.length; i++) {
            byParam[ev.controls[i].param] = ev.controls[i];
          }
          var out = {};
          Object.keys(ev.params).forEach(function (k) {
            var v = ev.params[k];
            if (isRangeVal(v)) {
              var ctrl = byParam[k] || { step: 0 };
              out[k] = sampleRange(v, ctrl.step);
            } else {
              out[k] = v;
            }
          });
          return out;
        }

          ev.params = {};

              var loV = parseFloat(lo.value);

              var span = ctrl.max - ctrl.min;

            initAudio();
            if (ctx.state === "suspended") ctx.resume();
            var total = 0;
            for (var i = 0; i < EVENTS.length; i++) total += EVENTS[i].weight;
            var r = Math.random() * total;
            for (var j = 0; j < EVENTS.length; j++) {
              r -= EVENTS[j].weight;
              if (r <= 0) {
                EVENTS[j].fn(resolveParams(EVENTS[j]));
                return;
              }
            }
          });

        // --- Random brainstorm button (uniform pick across drafts) ---
        document
          .getElementById("random-brainstorm-btn")
          .addEventListener("click", function () {
            if (!BRAINSTORM_EVENTS.length) return;
            initAudio();
            if (ctx.state === "suspended") ctx.resume();
            var pick =
              BRAINSTORM_EVENTS[
                Math.floor(Math.random() * BRAINSTORM_EVENTS.length)
              ];
            pick.fn(resolveParams(pick));
          });

        // --- Hide brainstorm UI when the array is empty ---
        if (BRAINSTORM_EVENTS.length === 0) {
          var divider = document.querySelector(".section-divider");
          var note = document.querySelector(".section-note");
          var bbtn = document.getElementById("random-brainstorm-btn");
          if (divider) divider.style.display = "none";
          if (note) note.style.display = "none";
          if (brainstormContainer) brainstormContainer.style.display = "none";
          if (bbtn) bbtn.style.display = "none";
        }

        // --- Copy all params button: serialize every event's current params ---
        document
          .getElementById("copy-all-btn")
          .addEventListener("click", function () {
            function fmtNum(v) {
              return Number.isInteger(v)
                ? String(v)
                : parseFloat(v.toFixed(4)).toString();
            }
            function fmtParam(k, v) {
              if (isRangeVal(v)) {
                return (
                  k +
                  ": { min: " +
                  fmtNum(v.min) +
                  ", max: " +
                  fmtNum(v.max) +
                  " }"
                );
              }
              return k + ": " + fmtNum(v);
            }
            var all = EVENTS.concat(BRAINSTORM_EVENTS);
            var lines = all.map(function (ev) {
              var pairs = Object.keys(ev.params).map(function (k) {
                return fmtParam(k, ev.params[k]);
              });
              return ev.id + ": { " + pairs.join(", ") + " }";
            });
            var text = lines.join("\n");
            var btn = document.getElementById("copy-all-btn");
            var orig = btn.innerHTML;
            var finish = function (ok) {
              btn.innerHTML = ok ? "&#10003; COPIED " + all.length : "&#10007; FAILED";
              setTimeout(function () { btn.innerHTML = orig; }, 1600);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(
                function () { finish(true); },
                function () { finish(false); },
              );
            } else {
              var ta = document.createElement("textarea");
              ta.value = text;
              ta.style.position = "fixed";
              ta.style.left = "-9999px";
              document.body.appendChild(ta);
              ta.select();
              try { document.execCommand("copy"); finish(true); }
              catch (e) { finish(false); }
              document.body.removeChild(ta);
            }
          });
      })();
    </script>
  </body>
</html>
